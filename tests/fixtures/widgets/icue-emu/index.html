<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>tr('iCUE Emulation Probe')</title>
	<!-- Declared the iCUE way so the shim treats this as an iCUE package (translation
	     probe included). The value is unused by the probe's own logic. -->
	<meta
		name="x-icue-property"
		content="textColor"
		data-label="tr('Color')"
		data-type="color"
		data-default="'#ffffff'"
	>
	<!-- The shared-common escapes exactly as Corsair's stock widgets write them: the
	     paths clamp at the origin root and are served by the compat stand-ins unless
	     the package vendors its own copies. -->
	<script src="../common/plugins/IcueWidgetApiWrapper.js"></script>
	<script src="../common/plugins/SimpleNotificationsApiWrapper.js"></script>
	<script src="../common/tools/ColorTools.js"></script>
	<script src="../common/tools/media_viewer/MediaViewer.js"></script>
	<link rel="stylesheet" href="../common/tools/media_viewer/MediaViewer.css">
	<!-- Faces that never arrive, in every shape that floods. Chromium logs a "Fallback
	     font will be used" intervention per element waiting on one — hundreds of lines
	     from a single widget. Qt resource-scheme (`qrc:`) faces are how iCUE packages
	     ship them and were the first shape found; the ones below the @media group are
	     the shapes the qrc:-only test missed. Two PLACEMENTS first, because the sweep
	     once handled only the first:
	       · top level, and
	       · inside an @media group, which is not itself a FONT_FACE_RULE, so a scan that
	         only tested the outermost rule's type never saw the face inside it.
	     A third arrives from a script AFTER load, below. -->
	<style>
	@font-face {
		font-family: 'ProbeTopLevel';
		src: url("qrc:/fonts/OpenSans-Regular.ttf") format("truetype");
	}
	@media (min-width: 1px) {
		@font-face {
			font-family: 'ProbeGrouped';
			src: url("qrc:/fonts/OpenSans-Bold.ttf") format("truetype");
		}
	}
	/* Not qrc:, and every bit as unloadable — the shapes a qrc:-only test walked past.
	   `file:` is cross-scheme from an https origin; `http:` is blockable mixed content.
	   Both flood exactly as qrc: did, and both were live in the field. */
	@font-face {
		font-family: 'ProbeFileScheme';
		src: url("file:///C:/Windows/Fonts/segoeui.ttf") format("truetype");
	}
	@font-face {
		font-family: 'ProbeHttpScheme';
		src: url("http://fonts.invalid/Probe.woff2") format("woff2");
	}
	/* …but `http:` is NOT unfetchable everywhere, and that is the trap. This shim reaches
	   every document in the WebView, not just widget packages — including whatever the
	   Embed widget frames, whose documented target is StreamDeckEmbeded's
	   http://localhost:28199. Loopback is potentially trustworthy, so it is exempt from
	   mixed content and loads even from this https document. Rejecting the scheme
	   outright would swap an embedded page's real typography for the substitute. */
	@font-face {
		font-family: 'ProbeLoopbackHttp';
		src: url("http://localhost:28199/fonts/Deck.woff2") format("woff2");
	}
	/* The shape that CANNOT be decided by reading the CSS, and the one the Corsair
	   packages actually hit: a same-origin RELATIVE path that 404s, pointing into the
	   common/ folder the package never vendored. Indistinguishable from a path that is
	   really there until the request answers, so it must NOT be stripped — it has to be
	   defused by font-display instead. A regression that "fixes" this by removing the
	   source would break every widget that ships its own fonts correctly. */
	@font-face {
		font-family: 'ProbeMissingRel';
		src: url("common/fonts/Missing.woff2") format("woff2");
	}
	/* src is an ORDERED list: dropping the unloadable entry must not take the good
	   sibling with it. */
	@font-face {
		font-family: 'ProbeMixed';
		src: url("qrc:/fonts/OpenSans-Semi.ttf") format("truetype"), local("Arial");
	}
	/* An author who chose a display mode keeps it. The shim fills in a missing
	   font-display; it does not overrule one that is there. */
	@font-face {
		font-family: 'ProbeOwnDisplay';
		src: url("qrc:/fonts/OpenSans-Mono.ttf") format("truetype");
		font-display: block;
	}
	</style>
</head>
<body>
	<div id="bg"></div>
	<pre id="log"></pre>
	<!-- type="module" ON PURPOSE: strict mode makes the bare `icueEvents = {…}`
	     assignment below a ReferenceError unless the runtime predeclared the global —
	     the exact failure that blanked Corsair's Calendar/Sensor/SensorList widgets. -->
	<script type="module">
	icueEvents = {
		onICUEInitialized: onInit,
		onDataUpdated: () => {},
	};
	pluginStreamdeckEvents = {
		onInitialized: onSdInit,
	};

	const log = (line) => {
		document.getElementById('log').append(line + '\n');
	};
	log('module-alive');

	// Whether a face was defused is only visible in the CSSOM — the page cannot observe
	// the interventions it no longer causes. Every marker below names the SURVIVORS, so
	// a regression says which face reopened rather than just "some".
	const eachFace = (fn) => {
		const walk = (rules) => {
			for (const rule of Array.from(rules || [])) {
				if (!rule) continue;
				if (rule.type === 5) { fn(rule); continue; }
				let nested = null;
				try { nested = rule.cssRules; } catch (e) { nested = null; }
				if (nested) walk(nested);
			}
		};
		for (const sheet of Array.from(document.styleSheets)) {
			try { walk(sheet.cssRules); } catch (e) { /* cross-origin */ }
		}
	};
	const prop = (rule, name) => {
		try { return rule.style.getPropertyValue(name) || ''; } catch (e) { return ''; }
	};
	const named = (rule) => prop(rule, 'font-family') || '?';
	const survivors = (test) => {
		const left = [];
		eachFace((rule) => { if (test(rule)) left.push(named(rule)); });
		return left.join(',') || 'none';
	};

	// qrc: on its own, kept as its own marker: the widened rule subsumes it, and a
	// regression in the widening must not be able to quietly reopen the hole that
	// started all of this while the broader marker still reads clean.
	const qrcLeft = () => survivors((r) => prop(r, 'src').indexOf('qrc:') !== -1);
	// Every scheme this origin cannot fetch. `http:` does not match `https:` — the colon
	// is part of the pattern — and loopback http is deliberately NOT counted here: it is
	// fetchable, and ProbeLoopbackHttp below asserts it survived.
	const UNFETCHABLE = /(qrc|file):|http:\/\/(?!localhost|127\.)/i;
	const unfetchLeft = () => survivors((r) => UNFETCHABLE.test(prop(r, 'src')));
	// The half no scheme test can reach: a face still able to block first paint. This is
	// what actually stops the flood for ProbeMissingRel, whose source stays put.
	const noDisplayLeft = () => survivors((r) => !prop(r, 'font-display'));
	// …and the two things the widening must NOT break.
	const mixedKept = () => {
		let v = 'gone';
		eachFace((r) => {
			if (named(r).indexOf('ProbeMixed') === -1) return;
			v = prop(r, 'src').indexOf('local(') !== -1 ? 'local' : 'lost';
		});
		return v;
	};
	// An EMBEDDED page — what the Embed/YouTube/Twitch widgets frame. The shim reaches
	// every document in the WebView, so it runs in here too, but rewriting this page's CSS
	// would be editing content Plinth is meant to display unchanged. Reports both halves,
	// because "untouched" alone would also be what a shim that never ran looks like: the
	// marker has to prove the shim WAS present and still kept its hands off.
	// A PAIR, and the pairing is the whole point. Both frames are grandchildren of the top
	// page loading the same document; they differ only in whether the src carries the
	// shell's #ww-slot= marker. Together they pin the gate to widget IDENTITY and away
	// from frame depth — which was the first attempt here and broke the settings live
	// preview, where settings.html frames index.html?preview=1 and that replica shell
	// frames the widgets, making every previewed widget a grandchild.
	const frameAt = (id, src) => {
		const f = document.createElement('iframe');
		f.id = id;
		f.style.display = 'none';
		f.src = src;
		document.documentElement.appendChild(f);
	};
	frameAt('embeddedframe', 'nested-slot.html');                  // what an Embed widget frames
	frameAt('slotframe', 'nested-slot.html#ww-slot=p9s9');         // a widget slot, nested

	// Reports the shim's PRESENCE alongside the outcome, because "untouched" on its own is
	// also what a shim that never ran looks like — the marker has to distinguish a gate
	// that held from a script that was never there.
	const nestedState = (id) => {
		const f = document.getElementById(id);
		if (!f || !f.contentWindow) return 'noframe';
		let ran;
		try { ran = f.contentWindow.__wwIcueCommon === true; } catch (e) { return 'blocked'; }
		let left = false;
		try {
			for (const sheet of Array.from(f.contentDocument.styleSheets)) {
				for (const rule of Array.from(sheet.cssRules || [])) {
					if (rule.type !== 5) continue;
					if ((rule.style.getPropertyValue('src') || '').indexOf('qrc:') !== -1) left = true;
				}
			}
		} catch (e) { return 'unreadable'; }
		return (ran ? 'shim' : 'noshim') + ':' + (left ? 'untouched' : 'swept');
	};
	const embedded = () => nestedState('embeddedframe');
	const nestedSlot = () => nestedState('slotframe');

	// The loopback embed case: fetchable http, and it must still be there.
	const loopbackKept = () => {
		let v = 'gone';
		eachFace((r) => {
			if (named(r).indexOf('ProbeLoopbackHttp') === -1) return;
			v = prop(r, 'src').indexOf('localhost:28199') !== -1 ? 'kept' : 'stripped';
		});
		return v;
	};
	const ownDisplay = () => {
		let v = 'gone';
		eachFace((r) => {
			if (named(r).indexOf('ProbeOwnDisplay') === -1) return;
			v = prop(r, 'font-display') || 'cleared';
		});
		return v;
	};

	// Sheets that arrive well after load, when every scheduled sweep has run. Two
	// placements, because the observer has to catch both:
	//   ProbeLate    — a <style> appended directly, so it IS the added node.
	//   ProbeNested  — a <style> inside a container built off-DOM and appended whole,
	//                  the shape a view or skin switch produces. The mutation record
	//                  names only the container, so an observer that checks the added
	//                  node alone never sees the sheet at all.
	// SEPARATED IN TIME, deliberately. Appended in the same turn, the direct <style>
	// schedules a sweep that walks document.styleSheets — which by then contains the
	// nested sheet too, so it gets defused incidentally and the nested case proves
	// nothing. The container has to be the only mutation in its turn for the probe to
	// distinguish an observer that inspects descendants from one that does not.
	window.addEventListener('load', () => {
		setTimeout(() => {
			const late = document.createElement('style');
			late.textContent = "@font-face { font-family: 'ProbeLate';" +
				" src: url(\"qrc:/fonts/OpenSans-Italic.ttf\") format(\"truetype\"); }";
			document.head.appendChild(late);
		}, 1400);
		setTimeout(() => {
			const container = document.createElement('div');
			const nested = document.createElement('style');
			nested.textContent = "@font-face { font-family: 'ProbeNested';" +
				" src: url(\"qrc:/fonts/OpenSans-Light.ttf\") format(\"truetype\"); }";
			container.appendChild(nested);
			document.body.appendChild(container);
		}, 1700);
		// After the observer's coalesced sweep has had a turn on both.
		setTimeout(() => {
			log('qrc-left:' + qrcLeft());
			log('unfetch-left:' + unfetchLeft());
			log('nodisplay-left:' + noDisplayLeft());
			log('mixed-kept:' + mixedKept());
			log('loopback-kept:' + loopbackKept());
			log('embedded:' + embedded());
			log('nested-slot:' + nestedSlot());
			log('own-display:' + ownDisplay());
		}, 2000);
	});

	const viewer = new MediaViewer({ container: document.getElementById('bg') });
	viewer.clear();
	log('mediaviewer-ok');
	log('hex:' + hexToRGB('#FF0039'));

	// A data: URI carries no filename, so an extension test calls this video an image and
	// builds an <img> that can never render it. The MIME is right there in the URI.
	const vprobe = document.createElement('div');
	document.body.appendChild(vprobe);
	new MediaViewer({ container: vprobe }).loadMedia({
		path: 'data:video/mp4;base64,AAAAIGZ0eXBpc29t',
	});
	log('datavideo:' + (vprobe.querySelector('video') ? 'video' : 
		(vprobe.querySelector('img') ? 'img' : 'none')));

	// Two wrappers over ONE plugin. Each connects its own asyncResponse listener, so a
	// per-instance id sequence gives both the same id 1 — and the first reply settles
	// both waiters, resolving B with A's value. The fake plugin records the ids issued
	// and replays each reply to every listener, exactly as a real Qt signal would.
	const listeners = [];
	const issued = [];
	const fakePlugin = {
		asyncResponse: { connect: (cb) => listeners.push(cb) },
		ask(requestId) { issued.push(requestId); },
	};
	const wrapA = new IcueWidgetApiWrapper(fakePlugin);
	const wrapB = new IcueWidgetApiWrapper(fakePlugin);
	const answers = Promise.all([
		wrapA.request(fakePlugin.ask),
		wrapB.request(fakePlugin.ask),
	]);
	for (let i = 0; i < issued.length; i++) {
		for (const cb of listeners) cb(issued[i], i === 0 ? 'A' : 'B');
	}
	answers.then((r) => log('wrapids:' + r.join(','))).catch(() => log('wrapids:threw'));

	// A formatter that has never rendered must produce a date even when the caller's
	// lastDay already equals today: the rendered value turns over with the CONFIGURED
	// zone's day, which the caller's local getDay cannot speak for.
	new DateFormatter('en-US', 'Asia/Tokyo', true)
		.getDateText('05/04/2020', new Date().getDay(), false)
		.then((t) => log('datefirst:' + (t ? 'rendered' : 'skipped')));

	function onInit() {
		// Thenable tr() + the i18next-nested translation.json shape iCUE ships.
		tr('greeting').then((t) => log('tr-then:' + t));
		// Wrapper round trip against the emulated Notifications provider: requestId
		// out, asyncResponse back, promise resolves (0 — the mirror is unwatched
		// until this very call arms it, and no push has arrived).
		const api = new SimpleNotificationsApiWrapper(window.plugins.Notificationsprovider);
		api.getNotificationCount().then((n) => log('notif:' + n));
	}

	let icons = 0;
	let created = false;
	let live = false;
	function onSdInit() {
		const sd = window.plugins.Streamdeck;
		sd.virtualDeviceCreated.connect(() => {
			if (created) return;
			created = true;
			log('device-created');
		});
		sd.buttonIconUpdated.connect((widgetId, index, icon) => {
			if (!icon) return;
			icons++;
			// The --sd fixture carries three titled keys; all three land inside the
			// 3x2 grid requested below, as generated title tiles.
			if (icons === 3) {
				log('icons:3');
				// All THREE arguments: the signature is (widgetId, buttonIndex, pressed).
				// Calling it with two silently made `pressed` undefined, so both messages
				// went out as phase 'up' — and the runner's "a deck is clicked" check
				// counted them and passed without a press ever being exercised.
				sd.sendKeyPress(uniqueId, 0, true);
				sd.sendKeyPress(uniqueId, 0, false);
				log('click-sent');
			}
			// Once the fixture's capture frame flows, the faces become PNG slices of
			// the live window — the dynamic-key-face path.
			if (!live && icon.startsWith('data:image/png')) {
				live = true;
				log('live-tiles');
			}
		});
		sd.connectStreamDeck(uniqueId, '', 3, 2);
	}
	</script>
</body>
</html>
