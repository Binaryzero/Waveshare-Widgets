<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>tr('iCUE Emulation Probe')</title>
	<!-- Declared the iCUE way so the shim treats this as an iCUE package (translation
	     probe included). The value is unused by the probe's own logic. -->
	<meta
		name="x-icue-property"
		content="textColor"
		data-label="tr('Color')"
		data-type="color"
		data-default="'#ffffff'"
	>
	<!-- The shared-common escapes exactly as Corsair's stock widgets write them: the
	     paths clamp at the origin root and are served by the compat stand-ins unless
	     the package vendors its own copies. -->
	<script src="../common/plugins/IcueWidgetApiWrapper.js"></script>
	<script src="../common/plugins/SimpleNotificationsApiWrapper.js"></script>
	<script src="../common/tools/ColorTools.js"></script>
	<script src="../common/tools/media_viewer/MediaViewer.js"></script>
	<link rel="stylesheet" href="../common/tools/media_viewer/MediaViewer.css">
	<!-- Qt resource-scheme faces, the way iCUE packages ship them. Chromium cannot load
	     `qrc:` at all, and every element waiting on one logs a "Fallback font will be
	     used" intervention — hundreds of lines from one widget. Two placements, because
	     the sweep once handled only the first:
	       · top level, and
	       · inside an @media group, which is not itself a FONT_FACE_RULE, so a scan that
	         only tested the outermost rule's type never saw the face inside it.
	     A third arrives from a script AFTER load, below. -->
	<style>
	@font-face {
		font-family: 'ProbeTopLevel';
		src: url("qrc:/fonts/OpenSans-Regular.ttf") format("truetype");
	}
	@media (min-width: 1px) {
		@font-face {
			font-family: 'ProbeGrouped';
			src: url("qrc:/fonts/OpenSans-Bold.ttf") format("truetype");
		}
	}
	</style>
</head>
<body>
	<div id="bg"></div>
	<pre id="log"></pre>
	<!-- type="module" ON PURPOSE: strict mode makes the bare `icueEvents = {…}`
	     assignment below a ReferenceError unless the runtime predeclared the global —
	     the exact failure that blanked Corsair's Calendar/Sensor/SensorList widgets. -->
	<script type="module">
	icueEvents = {
		onICUEInitialized: onInit,
		onDataUpdated: () => {},
	};
	pluginStreamdeckEvents = {
		onInitialized: onSdInit,
	};

	const log = (line) => {
		document.getElementById('log').append(line + '\n');
	};
	log('module-alive');

	// Whether a face was defused is only visible in the CSSOM — the page cannot observe
	// the interventions it no longer causes. Report the qrc: sources still present, per
	// placement, so the marker names WHICH hole is open rather than just "some".
	const qrcLeft = () => {
		const left = [];
		const walk = (rules) => {
			for (const rule of Array.from(rules || [])) {
				if (!rule) continue;
				if (rule.type === 5) {
					let src = '';
					try { src = rule.style.getPropertyValue('src') || ''; } catch (e) { src = ''; }
					if (src.indexOf('qrc:') !== -1) left.push(rule.style.getPropertyValue('font-family'));
					continue;
				}
				let nested = null;
				try { nested = rule.cssRules; } catch (e) { nested = null; }
				if (nested) walk(nested);
			}
		};
		for (const sheet of Array.from(document.styleSheets)) {
			try { walk(sheet.cssRules); } catch (e) { /* cross-origin */ }
		}
		return left;
	};

	// Sheets that arrive well after load, when every scheduled sweep has run. Two
	// placements, because the observer has to catch both:
	//   ProbeLate    — a <style> appended directly, so it IS the added node.
	//   ProbeNested  — a <style> inside a container built off-DOM and appended whole,
	//                  the shape a view or skin switch produces. The mutation record
	//                  names only the container, so an observer that checks the added
	//                  node alone never sees the sheet at all.
	// SEPARATED IN TIME, deliberately. Appended in the same turn, the direct <style>
	// schedules a sweep that walks document.styleSheets — which by then contains the
	// nested sheet too, so it gets defused incidentally and the nested case proves
	// nothing. The container has to be the only mutation in its turn for the probe to
	// distinguish an observer that inspects descendants from one that does not.
	window.addEventListener('load', () => {
		setTimeout(() => {
			const late = document.createElement('style');
			late.textContent = "@font-face { font-family: 'ProbeLate';" +
				" src: url(\"qrc:/fonts/OpenSans-Italic.ttf\") format(\"truetype\"); }";
			document.head.appendChild(late);
		}, 1400);
		setTimeout(() => {
			const container = document.createElement('div');
			const nested = document.createElement('style');
			nested.textContent = "@font-face { font-family: 'ProbeNested';" +
				" src: url(\"qrc:/fonts/OpenSans-Light.ttf\") format(\"truetype\"); }";
			container.appendChild(nested);
			document.body.appendChild(container);
		}, 1700);
		// After the observer's coalesced sweep has had a turn on both.
		setTimeout(() => log('qrc-left:' + (qrcLeft().join(',') || 'none')), 2000);
	});

	const viewer = new MediaViewer({ container: document.getElementById('bg') });
	viewer.clear();
	log('mediaviewer-ok');
	log('hex:' + hexToRGB('#FF0039'));

	function onInit() {
		// Thenable tr() + the i18next-nested translation.json shape iCUE ships.
		tr('greeting').then((t) => log('tr-then:' + t));
		// Wrapper round trip against the emulated Notifications provider: requestId
		// out, asyncResponse back, promise resolves (0 — the mirror is unwatched
		// until this very call arms it, and no push has arrived).
		const api = new SimpleNotificationsApiWrapper(window.plugins.Notificationsprovider);
		api.getNotificationCount().then((n) => log('notif:' + n));
	}

	let icons = 0;
	let created = false;
	let live = false;
	function onSdInit() {
		const sd = window.plugins.Streamdeck;
		sd.virtualDeviceCreated.connect(() => {
			if (created) return;
			created = true;
			log('device-created');
		});
		sd.buttonIconUpdated.connect((widgetId, index, icon) => {
			if (!icon) return;
			icons++;
			// The --sd fixture carries three titled keys; all three land inside the
			// 3x2 grid requested below, as generated title tiles.
			if (icons === 3) {
				log('icons:3');
				// All THREE arguments: the signature is (widgetId, buttonIndex, pressed).
				// Calling it with two silently made `pressed` undefined, so both messages
				// went out as phase 'up' — and the runner's "a deck is clicked" check
				// counted them and passed without a press ever being exercised.
				sd.sendKeyPress(uniqueId, 0, true);
				sd.sendKeyPress(uniqueId, 0, false);
				log('click-sent');
			}
			// Once the fixture's capture frame flows, the faces become PNG slices of
			// the live window — the dynamic-key-face path.
			if (!live && icon.startsWith('data:image/png')) {
				live = true;
				log('live-tiles');
			}
		});
		sd.connectStreamDeck(uniqueId, '', 3, 2);
	}
	</script>
</body>
</html>
