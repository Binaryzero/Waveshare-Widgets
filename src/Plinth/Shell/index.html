<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plinth</title>
  <link rel="icon" href="data:," /><!-- no favicon on a panel; silences the 404 (#36) -->
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <!-- Wallpaper: two stacked layers crossfade between pages; the dim overlay sits
       above the wallpaper but below the widgets, so it never dims the widgets.
       Beneath the layers sits the stock plate — the instrument chrome shown when no
       wallpaper is picked. It needs no JS: a null spec leaves the shown layer
       transparent, so the plate is simply what shows through. -->
  <div id="bgRoot" aria-hidden="true">
    <div id="plate">
      <i class="cb tl"></i><i class="cb tr"></i>
      <i class="cb bl"></i><i class="cb br"></i>
      <span class="etch">PLINTH &middot; MFD-1280 &middot; REV A</span>
    </div>
    <div class="bg-layer" id="bgLayer0"></div>
    <div class="bg-layer" id="bgLayer1"></div>
    <div id="bgDim"></div>
  </div>
  <main id="pages"></main>
  <div id="edgeLeft" class="edge left" aria-hidden="true">&#8249;</div>
  <div id="edgeRight" class="edge right" aria-hidden="true">&#8250;</div>
  <nav id="dots" aria-hidden="true"></nav>

  <div id="empty" hidden>
    <h1>Plinth</h1>
    <p>No widgets on screen yet. Add some in the settings window: Settings&hellip; in Plinth&rsquo;s tray menu.</p>
  </div>
  <script src="palette.js"></script>
  <script src="appearance.js"></script>
  <script src="shell.js"></script>
</body>
</html>
