<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Notifications</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and the typography base
   * come from widget-base.css. Designed for quarter (320px) first. Type and the
   * spacing between lines are the sizes they had at that smallest tile (a 320x200
   * band) times the tile scale, so a bigger tile reads bigger. */
  :root {
    /* Tile padding, shared with the eye that sits in its corner. */
    --pad-y: clamp(8px, 2.5vh, 14px);
    --pad-x: clamp(10px, 3%, 18px);
    /* A touch row: never under 40px, and it grows with the text beside it. */
    --hit: max(40px, calc(30px * var(--ts)));
  }
  body {
    display: flex;
    flex-direction: column;
    gap: calc(6px * var(--ts));
    padding: var(--pad-y) var(--pad-x);
  }
  /* No header: the privacy eye floats in the tile's top-right corner, beside the first
   * row (the mute bar, or the first app's name), which leaves it room. It stays put
   * while the list scrolls under it, so it is always one tap away. Opaque (.btn's
   * --control-bg, or .primary's surface) so rows passing beneath cannot show through.
   * no-pan in the markup: it sits outside the list, where a drift would page (#206). */
  #eyeBtn {
    position: fixed;
    top: var(--pad-y);
    right: var(--pad-x);
    z-index: 1;
    width: var(--hit);
    min-width: var(--hit);
    height: var(--hit);
    padding: 0;
    display: grid;
    place-items: center;
  }
  #eyeBtn svg { display: block; width: calc(15px * var(--ts)); height: calc(15px * var(--ts)); }

  /* Muted-app chips: tap to unmute. */
  #muteBar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: calc(6px * var(--ts));
    padding-right: calc(var(--hit) + var(--space-2)); }
  #muteBar .kicker { color: var(--text-dim); }
  .chip {
    font-size: calc(11px * var(--ts));
    font-weight: 700;
    min-height: var(--hit);   /* the eye's height, so the row beside it lines up */
    padding: 0 calc(10px * var(--ts));
    display: inline-flex;
    align-items: center;
    gap: calc(6px * var(--ts));
    max-width: 100%;
  }
  .chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: calc(140px * var(--ts)); }
  .chip .x { color: var(--text-muted); }

  #list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    /* pan-y, not auto: a HORIZONTAL drag starting on a control inside this list has
     * this element as its nearest scrolling ancestor, so a document-level rule never
     * sees it — and with the default the pan chains out to the shell's #pages and
     * changes page (measured: scrollLeft 0 -> 612). Vertical scrolling is unaffected. */
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    gap: calc(8px * var(--ts));
    scrollbar-width: none;
  }
  #list::-webkit-scrollbar { display: none; }
  #list > .state-card { flex: 1; }

  .cluster { display: flex; flex-direction: column; gap: calc(6px * var(--ts)); container-type: inline-size; }
  /* App header: the whole row is the mute toggle (≥40px touch target). */
  .app-head {
    display: flex;
    align-items: center;
    gap: calc(8px * var(--ts));
    min-height: var(--hit);
    margin: 0;
    padding: 0 calc(4px * var(--ts));
    background: none;
    border: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: opacity var(--dur-fast) var(--ease);
  }
  /* The first row shares its line with the eye in the corner. */
  #list > .cluster:first-child > .app-head { padding-right: calc(var(--hit) + var(--space-2)); }
  .app-head:active { opacity: 0.55; }
  .app-name {
    font-size: calc(11px * var(--ts));
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .app-count { font-size: calc(11px * var(--ts)); font-weight: 700; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .item {
    display: flex;
    align-items: center;
    gap: calc(8px * var(--ts));
    padding: calc(8px * var(--ts)) calc(12px * var(--ts));
  }
  .item.masked { cursor: pointer; transition: transform var(--dur-fast) var(--ease); }
  .item.masked:active { transform: scale(0.98); }
  .item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(2px * var(--ts)); }
  .t-row { display: flex; align-items: baseline; gap: calc(8px * var(--ts)); }
  .title {
    flex: 1;
    min-width: 0;
    font-size: calc(13px * var(--ts));
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .time { flex: none; font-size: calc(11px * var(--ts)); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .body {
    font-size: calc(12px * var(--ts));
    color: var(--text-muted);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dismiss { width: var(--hit); min-width: var(--hit); min-height: var(--hit); padding: 0; color: var(--text-muted); }
  /* A narrow card (a quarter tile, or a column of a wide one): title, time and the
   * dismiss button beside the body leave the text too little width at this size, so the
   * time drops under the title, the button stands beside the two, and the body takes
   * the card's whole width and one more line. em is the card's text size, so the break
   * moves with the tile's scale. */
  @container (max-width: 20em) {
    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "title x" "time x" "body body";
      column-gap: calc(8px * var(--ts));
      row-gap: calc(2px * var(--ts));
      align-items: center;
    }
    .item .txt, .t-row { display: contents; }
    .title { grid-area: title; }
    .time { grid-area: time; }
    .body { grid-area: body; -webkit-line-clamp: 3; }
    .dismiss { grid-area: x; }
  }

  /* Wide slots (three-quarter offered automatically with half): two columns,
   * clusters kept whole. */
  @media (min-width: 800px) {
    #list { display: block; column-count: 2; column-gap: calc(8px * var(--ts)); }
    /* With no mute bar the list starts at the top, and the right column's first header
     * would sit under the eye: the list keeps a gutter the eye's width down its right
     * side instead, so nothing in either column ever lies beneath it. */
    #muteBar[hidden] ~ #list { padding-right: calc(var(--hit) + var(--space-2)); }
    #muteBar[hidden] ~ #list > .cluster:first-child > .app-head { padding-right: calc(4px * var(--ts)); }
    .cluster { break-inside: avoid; margin-bottom: calc(8px * var(--ts)); }
    #list > .state-card { height: 100%; }
  }

  /* State overlay paints the surface at the tile's effective opacity so it
   * matches the bgStyle (stock countdown/weather pattern). */
  #state {
    position: fixed;
    inset: 0;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
  }
</style>
</head>
<body>
  <button class="btn no-pan" id="eyeBtn" aria-label="Hide notification text" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="2.6"/>
      <line id="eyeSlash" x1="4.5" y1="4.5" x2="19.5" y2="19.5" hidden/>
    </svg>
  </button>
  <div id="muteBar" hidden></div>
  <main id="list"></main>
  <div class="state-card" id="state">
    <div class="spinner" id="stateSpinner"></div>
    <div class="state-icon" id="stateIcon" hidden></div>
    <div class="state-title" id="stateTitle" hidden></div>
    <div class="state-body" id="stateBody" hidden></div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const $ = (id) => document.getElementById(id);

  // Per-instance persistence (mutes, privacy eye): localStorage is per-ORIGIN and
  // all notification instances share one virtual host, so keys carry the slot tag
  // (the stock countdown's INSTANCE pattern) — two tiles keep independent mutes.
  const INSTANCE = (location.hash.match(/ww-slot=([\w-]+)/) || [])[1] || 'solo';
  const MUTE_KEY = 'ww.notifications.mute:' + INSTANCE;
  const EYE_KEY = 'ww.notifications.eye:' + INSTANCE;
  const MASK = '●●●'; // "●●●" — privacy placeholder for hidden text

  let payload = null;          // last ww-notifications payload (null until first)
  let privacy = false;         // eye toggle: mask titles/bodies until tapped
  const muted = new Map();     // appKey -> display name
  let revealed = new Set();    // ids un-masked by tap — cleared on every update
  const dismissed = new Set(); // optimistic local removals, pruned per payload
  const timeEls = [];          // [{el, t}] for the 30 s relative-time refresh
  let started = false;         // repeated ww-init must not stack timers

  (function loadStored() {
    try {
      const raw = JSON.parse(localStorage.getItem(MUTE_KEY) || '[]');
      if (Array.isArray(raw))
        for (const e of raw) if (e && e.k) muted.set(String(e.k), String(e.n || e.k));
    } catch (e) { /* corrupt entry — start unmuted */ }
    try { privacy = localStorage.getItem(EYE_KEY) === 'on'; } catch (e) { privacy = false; }
  })();
  function saveMuted() {
    try { localStorage.setItem(MUTE_KEY, JSON.stringify([...muted].map(([k, n]) => ({ k, n })))); }
    catch (e) { /* best effort */ }
  }
  function saveEye() {
    try { localStorage.setItem(EYE_KEY, privacy ? 'on' : 'off'); }
    catch (e) { /* best effort */ }
  }

  WW.onInit((state) => {
    const s = state.settings;
    // App-name color comes from the theme's --accent (global theme or the
    // per-slot style override) — legacy appColor keys are ignored.

    // Demand-gated host polling: watch on init (idempotent), host stops when no
    // widget is watching. A re-init may already carry the latest payload.
    WW.watchNotifications(true);
    payload = WW.notifications;
    render();

    if (!started) {
      started = true;
      setInterval(tickTimes, 30000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tickTimes(); });
    }
  });

  // Registered once at top level — onInit re-fires per ww-init and would stack.
  WW.onNotifications((p) => {
    payload = p;
    revealed = new Set(); // tap-to-reveal lasts until the next update
    render();
  });

  // ---- data shaping ---------------------------------------------------------

  function parseTime(v) {
    if (v == null || v === '') return null;
    let t = typeof v === 'number' ? v : NaN;
    if (!Number.isFinite(t)) {
      const n = Number(v);
      t = Number.isFinite(n) ? n : Date.parse(String(v));
    }
    if (!Number.isFinite(t)) return null;
    if (t > 1e9 && t < 1e11) t *= 1000; // epoch seconds -> ms
    return t;
  }

  function relTime(t) {
    if (t == null) return '';
    const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  // 30 s cadence: only the relative-time text nodes are touched, write-if-changed.
  function tickTimes() {
    if (document.hidden) return;
    try {
      for (const e of timeEls) {
        const txt = relTime(e.t);
        if (e.el.textContent !== txt) e.el.textContent = txt;
      }
    } catch (e) { WW.log('notifications time tick failed: ' + e.message); }
  }

  // Normalized, newest-first, minus locally-dismissed items. All strings here are
  // untrusted external text — rendered with textContent only, never innerHTML.
  function currentItems() {
    const arr = payload && Array.isArray(payload.items) ? payload.items : [];
    const out = [];
    for (const raw of arr) {
      if (!raw || raw.id == null) continue;
      const app = String(raw.app == null ? '' : raw.app).trim();
      const appId = String(raw.appId == null ? '' : raw.appId).trim();
      out.push({
        id: raw.id,
        sid: String(raw.id),
        key: (appId || app || 'unknown').toLowerCase(),
        name: app || appId || 'App',
        title: String(raw.title == null ? '' : raw.title).trim(),
        body: String(raw.body == null ? '' : raw.body).trim(),
        t: parseTime(raw.time),
      });
    }
    // Newest first; undated items sink to the end in delivery order (stable sort).
    out.sort((a, b) => (b.t == null ? -1 : b.t) - (a.t == null ? -1 : a.t));
    const ids = new Set(out.map((i) => i.sid));
    for (const d of [...dismissed]) if (!ids.has(d)) dismissed.delete(d);
    return out.filter((i) => !dismissed.has(i.sid));
  }

  // ---- rendering ------------------------------------------------------------

  function showOverlay(kind) {
    const st = $('state');
    st.hidden = false;
    $('stateSpinner').hidden = kind !== 'loading';
    $('stateIcon').hidden = kind === 'loading';
    $('stateTitle').hidden = kind === 'loading';
    $('stateBody').hidden = kind === 'loading';
    if (kind === 'denied') {
      $('stateIcon').textContent = '!';
      $('stateTitle').textContent = 'Notification access is off';
      $('stateBody').textContent = 'Windows Settings → Privacy & security → Notifications — turn on "Let apps access notifications". If the app never appears there, this portable build lacks the package identity Windows requires for notification access.';
    } else if (kind === 'unavailable') {
      $('stateIcon').textContent = '◎';
      $('stateTitle').textContent = 'Notifications unavailable';
      $('stateBody').textContent = 'Windows refused the notification listener — it generally requires an app installed with package identity (MSIX), which this portable build does not have.';
    }
    $('list').hidden = true;
    $('muteBar').hidden = true;
    $('eyeBtn').hidden = true;
  }

  function inlineState(icon, title, body) {
    const card = document.createElement('div');
    card.className = 'state-card';
    const i = document.createElement('div');
    i.className = 'state-icon';
    i.textContent = icon;
    const t = document.createElement('div');
    t.className = 'state-title';
    t.textContent = title;
    const b = document.createElement('div');
    b.className = 'state-body';
    b.textContent = body;
    card.append(i, t, b);
    return card;
  }

  function renderMuteBar() {
    const bar = $('muteBar');
    bar.textContent = '';
    bar.hidden = muted.size === 0;
    if (!muted.size) return;
    const label = document.createElement('span');
    label.className = 'kicker';
    label.textContent = 'Muted';
    bar.appendChild(label);
    for (const [key, name] of muted) {
      const chip = document.createElement('button');
      // no-pan: #muteBar sits above the list, outside it, so a drag here has nothing
      // local to scroll and would page the panel instead of unmuting (#206).
      chip.className = 'btn chip no-pan';
      chip.setAttribute('aria-label', 'Unmute ' + name);
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = name;
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      chip.append(n, x);
      chip.addEventListener('click', () => {
        muted.delete(key);
        saveMuted();
        render();
      });
      bar.appendChild(chip);
    }
  }

  function updateEye() {
    const btn = $('eyeBtn');
    btn.classList.toggle('primary', privacy);
    btn.setAttribute('aria-pressed', privacy ? 'true' : 'false');
    btn.setAttribute('aria-label', privacy ? 'Show notification text' : 'Hide notification text');
    // SVGElement has no .hidden property — toggle the attribute for the [hidden] rule.
    if (privacy) $('eyeSlash').removeAttribute('hidden');
    else $('eyeSlash').setAttribute('hidden', '');
  }

  function appHead(it) {
    const head = document.createElement('button');
    head.className = 'app-head';
    head.setAttribute('aria-label', 'Mute ' + it.name);
    const name = document.createElement('span');
    name.className = 'app-name';
    name.textContent = it.name;
    const count = document.createElement('span');
    count.className = 'app-count';
    head.append(name, count);
    head.addEventListener('click', () => {
      muted.set(it.key, it.name);
      saveMuted();
      render();
    });
    return head;
  }

  function itemRow(it) {
    const masked = privacy && !revealed.has(it.sid);
    const row = document.createElement('div');
    row.className = 'item card' + (masked ? ' masked' : '');
    row.dataset.id = it.sid;
    row.dataset.app = it.key;

    // A title-less toast promotes its body to the title line (never repeated below).
    const rawTitle = it.title || it.body || 'Notification';
    const rawBody = it.title ? it.body : '';

    const txt = document.createElement('div');
    txt.className = 'txt';
    const trow = document.createElement('div');
    trow.className = 't-row';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = masked ? MASK : rawTitle;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = relTime(it.t);
    if (it.t != null) timeEls.push({ el: time, t: it.t });
    trow.append(title, time);
    txt.appendChild(trow);
    const bodyText = masked ? (rawBody ? MASK + ' ' + MASK : '') : rawBody;
    if (bodyText) {
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = bodyText;
      txt.appendChild(body);
    }

    const btn = document.createElement('button');
    btn.className = 'btn dismiss';
    btn.textContent = '✕';
    btn.setAttribute('aria-label', 'Dismiss notification');
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation(); // the row itself may be a reveal target
      WW.dismissNotification(it.id);
      dismissed.add(it.sid); // optimistic removal; host payload confirms later
      render();
    });

    row.append(txt, btn);
    if (masked) row.addEventListener('click', () => { revealed.add(it.sid); render(); });
    return row;
  }

  function render() {
    try { renderInner(); }
    catch (e) { WW.log('notifications render failed: ' + e.message); }
  }

  function renderInner() {
    if (!payload || typeof payload !== 'object') { showOverlay('loading'); return; }
    if (payload.state === 'denied') { showOverlay('denied'); return; }
    if (payload.state === 'unavailable') { showOverlay('unavailable'); return; }

    $('state').hidden = true;
    $('list').hidden = false;
    $('eyeBtn').hidden = false;
    updateEye();
    renderMuteBar();

    // No total count: the list is the count, and each app's row numbers its own run.
    const items = currentItems();
    const visible = items.filter((it) => !muted.has(it.key));

    // Batch: build the whole list off-DOM, then swap in one write.
    timeEls.length = 0;
    const frag = document.createDocumentFragment();
    if (!visible.length) {
      frag.appendChild(items.length
        ? inlineState('◎', 'All muted',
            items.length + (items.length === 1 ? ' notification is' : ' notifications are') +
            ' hidden by muted apps — tap a chip above to unmute.')
        : inlineState('✓', 'All caught up', 'New Windows notifications will show up here.'));
    } else {
      // Consecutive same-app items cluster under one tappable app header.
      let clusterBox = null;
      let countEl = null;
      let lastKey = null;
      let count = 0;
      for (const it of visible) {
        if (it.key !== lastKey) {
          clusterBox = document.createElement('section');
          clusterBox.className = 'cluster';
          const head = appHead(it);
          countEl = head.querySelector('.app-count');
          clusterBox.appendChild(head);
          frag.appendChild(clusterBox);
          lastKey = it.key;
          count = 0;
        }
        count++;
        if (count > 1) countEl.textContent = String(count);
        clusterBox.appendChild(itemRow(it));
      }
    }
    const list = $('list');
    list.textContent = '';
    list.appendChild(frag);
  }

  $('eyeBtn').addEventListener('click', () => {
    privacy = !privacy;
    saveEye();
    revealed = new Set();
    render();
  });
</script>
</body>
</html>
