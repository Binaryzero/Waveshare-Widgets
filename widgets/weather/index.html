<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weather</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and typography base come
   * from widget-base.css. */
  #wrap {
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 3%;
    gap: 3%;
  }
  #now { display: flex; align-items: center; gap: 5%; flex: none; }
  #icon { font-size: clamp(40px, 24vh, 100px); line-height: 1; }
  #main { display: flex; flex-direction: column; gap: 0.8vh; }
  #temp {
    font-size: calc(clamp(30px, 17vh, 70px) * var(--temp-scale, 1));
    color: var(--text);
    font-weight: 200;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #temp small { font-size: 45%; color: var(--accent); font-weight: 400; }
  #desc { font-size: calc(clamp(12px, 4.6vh, 20px) * var(--condition-scale, 1)); color: var(--text-muted); }
  #meta { font-size: calc(clamp(10px, 3.8vh, 15px) * var(--meta-scale, 1)); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  #place { font-size: calc(clamp(10px, 3.8vh, 15px) * var(--location-scale, 1)); color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }

  #forecast { display: flex; flex: 1; max-width: 58%; justify-content: space-evenly; gap: 4px; }
  .fc { display: flex; flex-direction: column; align-items: center; gap: 1vh; min-width: 0; }
  .fc .t { color: var(--text-muted); font-size: calc(clamp(9px, 3.4vh, 14px) * var(--forecast-scale, 1)); white-space: nowrap; }
  .fc .e { font-size: clamp(16px, 8vh, 34px); line-height: 1; }
  .fc .v { color: var(--text); font-size: calc(clamp(11px, 4.6vh, 19px) * var(--forecast-scale, 1)); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fc .s { color: var(--text-muted); font-size: calc(clamp(9px, 3.2vh, 13px) * var(--forecast-scale, 1)); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Quarter slots are too narrow for the strip; keep just current conditions */
  @media (max-width: 470px) { #forecast { display: none; } }

  /* Error state: standard state-card covering the layout. It paints the surface
   * at the effective panel opacity so it matches the tile's bgStyle. */
  #error {
    position: fixed; inset: 0;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="now">
      <div id="icon">…</div>
      <div id="main">
        <div id="place"></div>
        <div id="temp">--<small>°</small></div>
        <div id="desc"></div>
        <div id="meta"></div>
      </div>
    </div>
    <div id="forecast"></div>
  </div>
  <div id="error" class="state-card err" hidden>
    <div class="state-icon">!</div>
    <div class="state-title">Weather unavailable</div>
    <div class="state-body" id="errorBody"></div>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  // WMO weather interpretation codes -> label + emoji
  const WMO = {
    0: ['Clear sky', '☀️'], 1: ['Mainly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
    45: ['Fog', '🌫️'], 48: ['Rime fog', '🌫️'],
    51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy drizzle', '🌧️'],
    56: ['Freezing drizzle', '🌧️'], 57: ['Freezing drizzle', '🌧️'],
    61: ['Light rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
    66: ['Freezing rain', '🌧️'], 67: ['Freezing rain', '🌧️'],
    71: ['Light snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '❄️'],
    80: ['Light showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Violent showers', '⛈️'],
    85: ['Snow showers', '🌨️'], 86: ['Snow showers', '🌨️'],
    95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm + hail', '⛈️'], 99: ['Thunderstorm + hail', '⛈️'],
  };
  const wmo = (code) => WMO[code] || ['—', '🌡️'];

  // WIDGET-SPEC: JS work is yours to gate. Seeded from state.game at init AND flipped by
  // onGame, because onGame reports later flips only — a widget that just listens polls
  // straight through a game that was already running when it loaded.
  let gameOn = false;
  let missedWhilePaused = false;   // something was due while the game had the foreground
  let refreshTimer = null;


  WW.onInit((state) => {
    gameOn = !!(state.game && state.game.active);
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // pre-token behavior for unset AND out-of-spec values.
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');

    // Per-text-type size scales (bare numbers so the CSS calc() multiplication
    // stays valid). Appearance comes from the theme tokens (global theme or the
    // per-slot style override) — legacy color keys in old layouts are ignored.
    document.body.style.setProperty('--temp-scale', String((Number(s.tempSize) || 100) / 100));
    document.body.style.setProperty('--condition-scale', String((Number(s.conditionSize) || 100) / 100));
    document.body.style.setProperty('--meta-scale', String((Number(s.metaSize) || 100) / 100));
    document.body.style.setProperty('--location-scale', String((Number(s.locationSize) || 100) / 100));
    document.body.style.setProperty('--forecast-scale', String((Number(s.forecastSize) || 100) / 100));

    refresh();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refresh, 10 * 60 * 1000);
  });

  // Resolve a typed city name to coordinates via Open-Meteo's free geocoder,
  // caching per query so we geocode each location exactly once.
  async function geocode(query) {
    const cacheKey = 'ww.geo.' + query.trim().toLowerCase();
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey));
      if (cached && cached.lat != null) return cached;
    } catch (e) { /* bad cache entry; refetch */ }

    const url = 'https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' +
      encodeURIComponent(query.trim());
    const response = await fetch(url);
    if (!response.ok) throw new Error('geocoder HTTP ' + response.status);
    const data = await response.json();
    const hit = data.results && data.results[0];
    if (!hit) throw new Error('no match for "' + query + '"');

    const place = {
      lat: hit.latitude,
      lon: hit.longitude,
      label: hit.name + (hit.admin1 && hit.admin1 !== hit.name ? ', ' + hit.admin1 : ''),
    };
    localStorage.setItem(cacheKey, JSON.stringify(place));
    return place;
  }

  // The location setting is either a picked place object {label, latitude, longitude}
  // (chosen from the Settings search dropdown — unambiguous) or a plain string, in
  // which case the geocoder's best match (largest/most relevant) is used.
  async function resolvePlace(settings) {
    const loc = settings.location;
    if (loc && typeof loc === 'object' && loc.latitude != null && loc.longitude != null) {
      return { lat: loc.latitude, lon: loc.longitude, label: loc.label || '' };
    }
    const query = (typeof loc === 'string' ? loc : '').trim() || 'New York';
    return geocode(query);
  }

  async function refresh() {
    if (gameOn) { missedWhilePaused = true; return; }
    const s = WW.settings;
    try {
      const place = await resolvePlace(s);
      // Re-checked after the await: an uncached city name goes to the geocoder first, and
      // a game starting during that would otherwise be answered by the forecast request
      // below. The gate has to hold at every point where new work would START, not only
      // at the door.
      if (gameOn) { missedWhilePaused = true; return; }
      document.getElementById('place').textContent = place.label;

      const url = 'https://api.open-meteo.com/v1/forecast' +
        `?latitude=${place.lat}&longitude=${place.lon}` +
        '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m' +
        '&hourly=temperature_2m,weather_code,precipitation_probability' +
        '&daily=temperature_2m_max,temperature_2m_min,weather_code' +
        `&temperature_unit=${s.units === 'celsius' ? 'celsius' : 'fahrenheit'}` +
        '&wind_speed_unit=kmh&timezone=auto&forecast_days=7';
      const response = await fetch(url);
      if (!response.ok) throw new Error('forecast HTTP ' + response.status);
      const data = await response.json();
      // The render is the expensive half — current conditions plus the whole forecast
      // strip — and a game can start while the request is in flight.
      if (gameOn) { missedWhilePaused = true; return; }

      const [label, emoji] = wmo(data.current.weather_code);
      document.getElementById('icon').textContent = emoji;
      document.getElementById('temp').innerHTML =
        Math.round(data.current.temperature_2m) + '<small>°' + (s.units === 'celsius' ? 'C' : 'F') + '</small>';
      document.getElementById('desc').textContent = label;
      document.getElementById('meta').textContent =
        'H ' + Math.round(data.daily.temperature_2m_max[0]) + '°  L ' + Math.round(data.daily.temperature_2m_min[0]) + '°' +
        '  ·  ' + data.current.relative_humidity_2m + '% RH';

      renderForecast(data, s.forecast || 'hourly');
      document.getElementById('error').hidden = true;
    } catch (e) {
      // A failure observed DURING a game is owed work, not a verdict: the gates on the
      // success path sit after each await, and a rejection skips them, so nothing was
      // marked and the resume had nothing to retry. The user came back to a transient
      // error that would sit there for the rest of the retained interval.
      if (gameOn) { missedWhilePaused = true; return; }
      WW.log('weather failed: ' + e.message);
      document.getElementById('errorBody').textContent =
        e.message + '. Check the location name in Settings.';
      document.getElementById('error').hidden = false;
    }
  }

  function renderForecast(data, mode) {
    const items = mode === 'daily' ? dailyItems(data) : mode === 'hourly' ? hourlyItems(data) : [];
    const host = document.getElementById('forecast');
    host.textContent = '';
    for (const item of items) {
      const col = document.createElement('div');
      col.className = 'fc';
      for (const [cls, text] of [['t', item.label], ['e', item.emoji], ['v', item.value], ['s', item.sub]]) {
        const div = document.createElement('div');
        div.className = cls;
        div.textContent = text;
        col.appendChild(div);
      }
      host.appendChild(col);
    }
  }

  // Next ~12 hours in 2-hour steps (6 columns).
  function hourlyItems(data) {
    const times = data.hourly.time;
    const now = Date.now();
    let start = times.findIndex((t) => new Date(t).getTime() >= now);
    if (start < 0) start = 0;

    const items = [];
    for (let k = 0; k < 6; k++) {
      const i = start + k * 2;
      if (i >= times.length) break;
      const probability = data.hourly.precipitation_probability;
      items.push({
        label: new Date(times[i]).toLocaleTimeString([], { hour: 'numeric' }),
        emoji: wmo(data.hourly.weather_code[i])[1],
        value: Math.round(data.hourly.temperature_2m[i]) + '°',
        sub: probability && probability[i] != null ? '💧' + probability[i] + '%' : '',
      });
    }
    return items;
  }

  // Today + the next 5 days (6 columns).
  function dailyItems(data) {
    const items = [];
    for (let i = 0; i < Math.min(6, data.daily.time.length); i++) {
      const day = new Date(data.daily.time[i] + 'T12:00');
      items.push({
        label: i === 0 ? 'Today' : day.toLocaleDateString([], { weekday: 'short' }),
        emoji: wmo(data.daily.weather_code[i])[1],
        value: Math.round(data.daily.temperature_2m_max[i]) + '°',
        sub: Math.round(data.daily.temperature_2m_min[i]) + '°',
      });
    }
    return items;
  }

  // A game ending is the user coming back to the panel: catch up at once rather than
  // waiting out whatever remained of the interval.
  WW.onGame((g) => {
    gameOn = !!(g && g.active);
    if (gameOn || !missedWhilePaused) return;
    missedWhilePaused = false;
    // Restart the cadence FROM the catch-up: the ten-minute interval kept its deadline
    // through the game, so one ending just before it produced two forecast requests
    // seconds apart, and refresh() has no in-flight guard to absorb that.
    clearInterval(refreshTimer);
    refresh();
    refreshTimer = setInterval(refresh, 10 * 60 * 1000);
  });

</script>
</body>
</html>
