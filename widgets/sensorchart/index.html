<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sensor Chart</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and typography base come
   * from widget-base.css. */
  #card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: clamp(6px, 2.4vh, 14px) clamp(8px, 2.8vh, 16px) clamp(4px, 1.6vh, 10px);
    min-height: 0;
  }
  #head {
    display: flex; align-items: baseline; gap: 12px;
    flex: none; min-width: 0;
  }
  /* Per-role custom properties (set from settings only when they differ from the
   * manifest defaults) fall through to the theme tokens. */
  #title {
    color: var(--title-color, var(--text-muted));
    font-size: calc(clamp(10px, 3.4vh, 15px) * var(--title-scale, 1));
    letter-spacing: 0.06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  #value {
    color: var(--value-color, var(--text));
    font-size: calc(clamp(17px, 8.5vh, 42px) * var(--value-scale, 1));
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    white-space: nowrap;
  }
  #value small {
    font-size: 52%; font-weight: 400;
    color: var(--title-color, var(--text-muted));
    margin-left: 2px;
  }
  #value.hidden { display: none; }
  #plot { flex: 1; min-height: 0; position: relative; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #message {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    color: var(--text-muted); font-size: clamp(12px, 4.5vh, 17px);
  }
</style>
</head>
<body>
  <div id="card">
    <div id="head">
      <div id="title"></div>
      <div id="value"></div>
    </div>
    <div id="plot"><canvas id="chart"></canvas></div>
  </div>
  <div id="message"></div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const MAX_SAMPLES = 5400;   // ~3 h at the 2 s tick; range pruning keeps it far below this
  const cfg = {
    sensorId: '', rangeMinutes: 10, chartStyle: 'area',
    showValue: true, autoScale: true,
    accent: '',               // user-picked accent when moved off its default, else '' = theme
  };
  const samples = [];         // [{t, v}] for the tracked sensor, oldest first
  let trackedId = null;       // sensor id the samples belong to
  let units = '';

  const el = {
    title: document.getElementById('title'),
    value: document.getElementById('value'),
    message: document.getElementById('message'),
    canvas: document.getElementById('chart'),
  };
  const ctx = el.canvas.getContext('2d');

  // Manifest defaults — the host merges these into settings, so "user changed it"
  // means "differs from the default". Only then does the property override the
  // theme tokens; at default the token chain shows through.
  const DEF = { accentColor: '#00d4ff', titleColor: '#7d8697', valueColor: '#e8ecf2' };
  const norm = (v) => String(v == null ? '' : v).trim().toLowerCase();
  const changed = (v, def) => norm(v) !== '' && norm(v) !== norm(def);
  function setVar(name, value) {
    if (value) document.body.style.setProperty(name, value);
    else document.body.style.removeProperty(name);
  }

  // "r, g, b" parts of a token/setting color so the canvas can compose alphas.
  function toRgbParts(color) {
    const c = String(color || '').trim();
    let m = /^#([0-9a-f]{6})$/i.exec(c);
    if (m) {
      const n = parseInt(m[1], 16);
      return (n >> 16 & 255) + ', ' + (n >> 8 & 255) + ', ' + (n & 255);
    }
    m = /^#([0-9a-f]{3})$/i.exec(c);
    if (m) {
      const h = m[1];
      return parseInt(h[0] + h[0], 16) + ', ' + parseInt(h[1] + h[1], 16) + ', ' +
        parseInt(h[2] + h[2], 16);
    }
    m = /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/.exec(c);
    if (m) return Math.round(+m[1]) + ', ' + Math.round(+m[2]) + ', ' + Math.round(+m[3]);
    return null;
  }

  // Chart colors for the canvas — canvases can't resolve var(), so read the tokens
  // off :root. Re-read on every init: theme edits arrive as a fresh ww-init with
  // the new token values already applied to :root. A user accentColor moved off
  // its manifest default stays authoritative over the theme accent.
  const chart = {
    accent: '#4cc2ff', accentRgb: '76, 194, 255',
    textRgb: '232, 236, 242', mutedRgb: '151, 160, 174',
    font: '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif',
  };
  function readChartColors() {
    const cs = getComputedStyle(document.documentElement);
    const read = (name) => cs.getPropertyValue(name).trim();
    const themeAccent = read('--accent') || '#4cc2ff';
    chart.accent = cfg.accent || themeAccent;
    chart.accentRgb = (cfg.accent ? toRgbParts(cfg.accent)
      : (read('--accent-rgb') || toRgbParts(themeAccent))) || '76, 194, 255';
    chart.textRgb = toRgbParts(read('--text')) || '232, 236, 242';
    chart.mutedRgb = toRgbParts(read('--text-muted')) || '151, 160, 174';
    chart.font = getComputedStyle(document.body).fontFamily || chart.font;
  }

  WW.onInit((state) => {
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // pre-token behavior for unset AND out-of-spec values.
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    setVar('--title-color', changed(s.titleColor, DEF.titleColor) ? s.titleColor : '');
    setVar('--value-color', changed(s.valueColor, DEF.valueColor) ? s.valueColor : '');
    document.body.style.setProperty('--title-scale', (Number(s.titleSize) || 100) / 100);
    document.body.style.setProperty('--value-scale', (Number(s.valueSize) || 100) / 100);

    cfg.sensorId = String(s.sensorId || '');
    cfg.rangeMinutes = Math.min(60, Math.max(1, Number(s.rangeMinutes) || 10));
    cfg.chartStyle = s.chartStyle === 'line' ? 'line' : 'area';
    cfg.showValue = s.showValue !== 'off';
    cfg.autoScale = s.autoScale !== 'off';
    cfg.accent = changed(s.accentColor, DEF.accentColor) &&
      /^#[0-9a-fA-F]{6}$/.test(s.accentColor) ? s.accentColor : '';
    readChartColors();

    el.value.classList.toggle('hidden', !cfg.showValue);
    // Settings may have retargeted the chart; onSensors (emitted right after init)
    // resets the history when the resolved sensor id changes.
    update(WW.sensors);
  });

  WW.onSensors(update);

  function resolveSensor() {
    if (cfg.sensorId) return WW.sensorById(cfg.sensorId);
    return WW.findSensor({ type: 'Temperature' }) || WW.findSensor({});
  }

  function update(sensors) {
    if (!sensors || !sensors.length) {
      // Mid-run hiccups keep the last chart; but before we've ever resolved a
      // sensor, say so instead of sitting completely blank.
      if (!trackedId) {
        el.message.style.display = 'flex';
        el.message.textContent = 'Waiting for sensors…';
      }
      return;
    }
    const sensor = resolveSensor();
    if (!sensor) {
      el.message.style.display = 'flex';
      el.message.textContent = cfg.sensorId
        ? 'Sensor not found — pick another in the widget settings'
        : 'Waiting for sensors…';
      el.title.textContent = '';
      el.value.textContent = '';
      samples.length = 0;
      trackedId = null;
      draw();
      return;
    }
    el.message.style.display = 'none';

    if (sensor.id !== trackedId) {  // first run or retargeted — start history fresh
      trackedId = sensor.id;
      samples.length = 0;
    }
    units = sensor.units || '';
    const v = Number(sensor.value);
    if (sensor.value != null && isFinite(v)) samples.push({ t: Date.now(), v });

    // Prune outside the window, keeping ONE older point so the line still enters
    // from the left edge instead of starting mid-chart.
    const cutoff = Date.now() - cfg.rangeMinutes * 60000;
    while (samples.length > 2 && samples[1].t < cutoff) samples.shift();
    while (samples.length > MAX_SAMPLES) samples.shift();

    el.title.textContent = sensor.name;
    renderValue(samples.length ? samples[samples.length - 1].v : null);
    draw();
  }

  function fmt(v) {
    return Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1);
  }

  function renderValue(v) {
    el.value.textContent = '';
    if (v == null) { el.value.textContent = '--'; return; }
    el.value.append(fmt(v));
    if (units) {
      const u = document.createElement('small');
      u.textContent = units;
      el.value.append(u);
    }
  }

  function draw() {
    const cssW = el.canvas.clientWidth, cssH = el.canvas.clientHeight;
    if (!cssW || !cssH) return;
    const dpr = window.devicePixelRatio || 1;
    const pxW = Math.round(cssW * dpr), pxH = Math.round(cssH * dpr);
    if (el.canvas.width !== pxW || el.canvas.height !== pxH) {
      el.canvas.width = pxW; el.canvas.height = pxH;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    if (samples.length < 2) return;

    const label = Math.max(9, Math.min(11, cssH * 0.09)); // min/max/current label px
    const padT = label + 4, padB = 4, padL = 4, padR = 6;
    const plotW = cssW - padL - padR, plotH = cssH - padT - padB;
    if (plotW < 10 || plotH < 10) return;

    // Window: right edge rides the newest sample, so the chart scrolls per tick.
    const tEnd = samples[samples.length - 1].t;
    const tStart = tEnd - cfg.rangeMinutes * 60000;
    let vMin = Infinity, vMax = -Infinity;
    for (const p of samples) { if (p.v < vMin) vMin = p.v; if (p.v > vMax) vMax = p.v; }
    let yMin, yMax;
    if (cfg.autoScale) {
      const span = Math.max(vMax - vMin, Math.max(1, Math.abs(vMax) * 0.02));
      yMin = vMin - span * 0.18;
      yMax = vMax + span * 0.18;
    } else {
      yMin = Math.min(0, vMin);
      yMax = Math.max(vMax * 1.06, 1);
    }

    const x = (t) => padL + Math.max(0, Math.min(1, (t - tStart) / (tEnd - tStart || 1))) * plotW;
    const y = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * plotH;

    // Subtle horizontal grid
    ctx.strokeStyle = 'rgba(' + chart.mutedRgb + ', 0.14)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const gy = padT + (plotH * i) / 3;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL + plotW, gy); ctx.stroke();
    }

    // Smooth polyline through midpoints
    const pts = samples.map((p) => ({ x: x(p.t), y: y(p.v) }));
    const line = new Path2D();
    line.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      line.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
    }
    line.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);

    if (cfg.chartStyle === 'area') {
      const area = new Path2D(line);
      area.lineTo(pts[pts.length - 1].x, padT + plotH);
      area.lineTo(pts[0].x, padT + plotH);
      area.closePath();
      const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
      grad.addColorStop(0, 'rgba(' + chart.accentRgb + ', 0.38)');
      grad.addColorStop(1, 'rgba(' + chart.accentRgb + ', 0.02)');
      ctx.fillStyle = grad;
      ctx.fill(area);
    }

    ctx.strokeStyle = chart.accent;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(line);

    // Newest point
    const last = pts[pts.length - 1];
    ctx.fillStyle = chart.accent;
    ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(' + chart.textRgb + ', 0.9)';
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fill();

    // min / max / current labels
    ctx.font = label + 'px ' + chart.font;
    ctx.fillStyle = 'rgba(' + chart.mutedRgb + ', 0.9)';
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left';
    ctx.fillText('max ' + fmt(vMax), padL + 2, padT - 2);
    ctx.textBaseline = 'top';
    ctx.fillText('min ' + fmt(vMin), padL + 2, padT + plotH - label - 1);
    ctx.fillStyle = chart.accent;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(fmt(samples[samples.length - 1].v), padL + plotW, Math.max(padT - 2, last.y - 6));
  }

  new ResizeObserver(() => draw()).observe(el.canvas);
  window.addEventListener('resize', () => draw());
</script>
</body>
</html>
