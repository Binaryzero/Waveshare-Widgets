<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weather Radar</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — colors, background/bgStyle handling and the typography base come
   * from widget-base.css. The map/radar tile pipeline is untouched; the tokens
   * skin the chrome around it (marker, stamp, attribution, state card). */
  #map { position: absolute; inset: 0; overflow: hidden; }
  #map .tile { position: absolute; width: 256px; height: 256px; }
  /* "Darken map" scrim: fades the base tiles toward the theme background. */
  #mapDim { position: absolute; inset: 0; background: var(--bg); pointer-events: none; }
  .frame { position: absolute; inset: 0; opacity: 0; }
  .frame.show { opacity: 0.9; }
  #marker {
    position: absolute; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--text); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.9);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #stamp {
    position: absolute; top: 6px; right: 8px;
    color: var(--text);
    font-size: calc(clamp(10px, 3.6vh, 14px) * var(--text-scale, 1));
    background: rgba(var(--surface-rgb), 0.6);
    border-radius: 6px; padding: 2px 8px;
    font-variant-numeric: tabular-nums;
  }
  #attrib {
    position: absolute; bottom: 3px; right: 6px;
    color: var(--text-muted);
    font-size: 9px;
    text-shadow: 0 1px 2px rgba(var(--surface-rgb), 0.8);
  }
  /* Setup/error state: standard state-card covering the (absent) map. It paints
   * the surface at the effective panel opacity so it matches the tile's bgStyle. */
  #message {
    position: fixed; inset: 0;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="mapDim"></div>
  <div id="marker" hidden></div>
  <div id="stamp" hidden></div>
  <div id="attrib">&copy; OpenStreetMap &middot; RainViewer</div>
  <div id="message" class="state-card" hidden>
    <div class="state-icon">!</div>
    <div class="state-title" id="messageTitle"></div>
    <div class="state-body" id="messageBody"></div>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const TILE = 256;
  const cfg = { lat: null, lon: null, zoom: 7, animate: true };
  let frames = [];          // [{time, urlTemplate}] oldest -> newest
  let frameEls = [];
  let frameIndex = 0;
  // WIDGET-SPEC: JS work is yours to gate. Seeded from state.game at init AND flipped by
  // onGame, because onGame reports later flips only — a widget that just listens polls
  // straight through a game that was already running when it loaded.
  let gameOn = false;
  let pendingSettings = null;   // the settings a paused init was holding
  let pendingInit = false;      // ...and whether that init still owes a full setup
  let pendingResize = false;    // ...and whether a resize rebuild was deferred
  let missedRefresh = false;    // a radar refresh was refused while a game had the foreground
  let animTimer = null;
  let refreshTimer = null;

  WW.onInit(async (state) => {
    gameOn = !!(state.game && state.game.active);
    const s = state.settings;
    // bgStyle drives the widget-base panel-opacity classes; anything that isn't
    // explicitly glass/transparent renders solid, matching the pre-token look for
    // unset AND out-of-spec values (no class = glass in the base).
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');

    // RainViewer radar tiles top out at zoom 7 — a saved 8-10 from the old
    // slider range renders "Zoom Level Not Supported" tiles, so clamp hard.
    cfg.zoom = Math.min(7, Math.max(4, Number(s.zoom) || 7));
    cfg.animate = s.animate !== 'off';
    document.getElementById('mapDim').style.opacity = String(Math.min(80, Math.max(0, Number(s.mapDim) || 0)) / 100);
    // Overlay text color comes from the theme tokens (global theme or the
    // per-slot style override) — legacy textColor keys are ignored.
    document.body.style.setProperty('--text-scale', (Number(s.textSize) || 100) / 100);

    // The SETUP is network too, and gating only the refresh left it uncovered:
    // resolveLocation geocodes, which is a request like any other. Held here with the
    // settings that were current when it was held, so a game that ends re-enters with
    // what the user actually configured rather than with a stale closure.
    pendingSettings = s;
    if (gameOn) {
      pendingInit = true;
      missedRefresh = true;
      showMessage('Paused', 'A game is running.');
      return;
    }
    pendingInit = false;
    await start(s);
  });

  async function start(s) {
    try {
      await resolveLocation(s.location);
    } catch (e) {
      showMessage('Set a location in the widget settings', String(e.message || e));
      return;
    }
    // Re-checked AFTER the await: a game can start while the geocode is in flight, and
    // buildBaseMap below fetches a screenful of OpenStreetMap tiles. Only refreshRadar
    // was guarded, so the tiles went out anyway — a gate that returns before the slow
    // part but not after it is not a gate.
    if (gameOn) {
      missedRefresh = true;
      pendingInit = true;
      showMessage('Paused', 'A game is running.');
      return;
    }
    hideMessage();
    buildBaseMap();
    await refreshRadar();
    // A theme edit re-delivers ww-init without a reload — re-arm, never stack.
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refreshRadar, 5 * 60 * 1000);  // RainViewer updates every ~10 min
  }

  async function resolveLocation(loc) {
    if (loc && typeof loc === 'object' && isFinite(loc.latitude) && isFinite(loc.longitude)) {
      cfg.lat = Number(loc.latitude); cfg.lon = Number(loc.longitude);
      return;
    }
    const name = String(loc || 'Dallas').trim() || 'Dallas';
    const res = await WW.fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' + encodeURIComponent(name));
    if (!res.ok) throw new Error('geocoding failed (HTTP ' + res.status + ')');
    const data = await res.json();
    const hit = data.results && data.results[0];
    if (!hit) throw new Error('no match for "' + name + '"');
    cfg.lat = hit.latitude; cfg.lon = hit.longitude;
  }

  // --- slippy-map tile math -----------------------------------------------------

  function centerTile() {
    const n = Math.pow(2, cfg.zoom);
    const x = (cfg.lon + 180) / 360 * n;
    const latRad = cfg.lat * Math.PI / 180;
    const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    return { x, y, n };
  }

  // Tiles needed to cover the viewport, with the location at the exact center.
  function layoutTiles(container, urlFor) {
    const w = window.innerWidth, h = window.innerHeight;
    const { x, y, n } = centerTile();
    const cols = Math.ceil(w / TILE) + 2;
    const rows = Math.ceil(h / TILE) + 2;
    const firstX = Math.floor(x - cols / 2);
    const firstY = Math.floor(y - rows / 2);
    const offsetX = w / 2 - (x - firstX) * TILE;
    const offsetY = h / 2 - (y - firstY) * TILE;

    for (let ty = 0; ty < rows; ty++) {
      for (let tx = 0; tx < cols; tx++) {
        const tileX = ((firstX + tx) % n + n) % n;       // wrap around the antimeridian
        const tileY = firstY + ty;
        if (tileY < 0 || tileY >= n) continue;
        const img = document.createElement('img');
        img.className = 'tile';
        img.draggable = false;
        img.style.left = (offsetX + tx * TILE) + 'px';
        img.style.top = (offsetY + ty * TILE) + 'px';
        img.src = urlFor(cfg.zoom, tileX, tileY);
        img.onerror = () => { img.style.visibility = 'hidden'; };
        container.appendChild(img);
      }
    }
  }

  function buildBaseMap() {
    const map = document.getElementById('map');
    map.textContent = '';
    layoutTiles(map, (z, x, y) => 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png');
    const marker = document.getElementById('marker');
    marker.hidden = false;
    marker.style.left = (window.innerWidth / 2) + 'px';
    marker.style.top = (window.innerHeight / 2) + 'px';
  }

  // --- radar frames -------------------------------------------------------------

  async function refreshRadar() {
    if (gameOn) { missedRefresh = true; return; }
    let json;
    try {
      const res = await WW.fetch('https://api.rainviewer.com/public/weather-maps.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      json = await res.json();
    } catch (e) {
      WW.log('radar: frame list failed: ' + e.message);
      return;
    }
    // Re-checked after the frame-list request: rebuildFrameLayers below attaches a
    // screenful of tile images per frame and re-arms the animation chain, so a game that
    // started while this was in flight would get all of it anyway.
    if (gameOn) { missedRefresh = true; return; }
    const host = json.host || 'https://tilecache.rainviewer.com';
    const past = (json.radar && json.radar.past) || [];
    const wanted = cfg.animate ? past.slice(-7) : past.slice(-1);
    if (!wanted.length) return;

    // Rebuild frame layers (each = one absolutely-positioned tile set).
    clearTimeout(animTimer);
    frames = wanted.map((f) => ({
      time: f.time,
      urlFor: (z, x, y) => host + f.path + '/' + TILE + '/' + z + '/' + x + '/' + y + '/2/1_1.png',
    }));
    frameIndex = frames.length - 1;
    rebuildFrameLayers();
    restartAnimation();
  }

  // Lifted out of refreshRadar so a resume can re-arm the loop on the frames already
  // built, without refetching a frame list that is still current.
  function restartAnimation() {
    clearTimeout(animTimer);
    animTimer = null;
    if (!cfg.animate || frames.length <= 1) return;
    // Cycle oldest -> newest, lingering on the newest frame before looping.
    const tick = () => {
      frameIndex = (frameIndex + 1) % frames.length;
      showFrame(frameIndex);
      animTimer = setTimeout(tick, frameIndex === frames.length - 1 ? 1800 : 650);
    };
    animTimer = setTimeout(tick, 1800);
  }

  // (Re)creates the per-frame tile layers for the current viewport size.
  function rebuildFrameLayers() {
    for (const el of frameEls) el.remove();
    frameEls = [];
    const map = document.getElementById('map');
    for (const f of frames) {
      const layer = document.createElement('div');
      layer.className = 'frame';
      layoutTiles(layer, f.urlFor);
      map.appendChild(layer);
      frameEls.push(layer);
    }
    if (frames.length) showFrame(Math.min(frameIndex, frames.length - 1));
  }

  // Slot/display size changes (layout edits, different panels, DPI changes) need a
  // full tile re-layout — positions and tile counts are computed from the viewport.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (cfg.lat == null) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // The handle is cleared as the callback BEGINS. Left set, a long-finished debounce
      // still looked armed, so every later game entry recorded a historical resize as
      // pending and every exit rebuilt the map for it.
      resizeTimer = null;
      // buildBaseMap and rebuildFrameLayers assign a screenful of OpenStreetMap and
      // RainViewer tile URLs — network work, from a path that is neither the poll nor the
      // setup. A display, DPI or slot-size change during a game reaches here, so the gate
      // has to be consulted at the point the rebuild would start. Deferred, not dropped:
      // the resume rebuilds against whatever geometry is current then.
      if (gameOn) { pendingResize = true; return; }
      buildBaseMap();
      rebuildFrameLayers();
    }, 300);
  });

  function showFrame(i) {
    frameEls.forEach((el, idx) => el.classList.toggle('show', idx === i));
    const stamp = document.getElementById('stamp');
    stamp.hidden = false;
    const d = new Date(frames[i].time * 1000);
    stamp.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function showMessage(title, detail) {
    document.getElementById('messageTitle').textContent = title;
    document.getElementById('messageBody').textContent = detail || '';
    document.getElementById('message').hidden = false;
  }

  // Every other caller of showMessage is terminal — a missing location, a failed
  // geocode — so nothing ever needed to take the card back down. "Paused" is the first
  // RECOVERABLE one, and without this the map and frames loaded behind a card still
  // saying the widget was paused, which is worse than not saying it at all.
  function hideMessage() {
    document.getElementById('message').hidden = true;
  }

  // A game ending is the user coming back to the panel: catch up at once rather than
  // waiting out whatever remained of the interval.
  WW.onGame((g) => {
    gameOn = !!(g && g.active);
    if (gameOn) {
      // The frame animation is a setTimeout chain toggling classes, so the panel-wide
      // CSS pause in widget-base does not reach it: it would keep cycling frames for the
      // whole game. Stopped here and rebuilt by whichever path resumes.
      clearTimeout(animTimer);
      animTimer = null;
      // A debounce armed moments before the game started would fire inside it — but
      // cancelling it is only half the job. The callback is what sets pendingResize, so
      // cancelling it without recording the intent lost the rebuild entirely: the resume
      // took the no-work path and left both the base map and the radar tiles laid out for
      // the old viewport until something else happened to rebuild them.
      if (resizeTimer) pendingResize = true;
      clearTimeout(resizeTimer);
      resizeTimer = null;
    }
    if (gameOn) return;
    // Each owed job is resumed by whatever actually owes it, and none of them implies
    // another. Folding them into one flag meant a resize-only pause also fell through to
    // refreshRadar — a second frame-list fetch and a second full tile rebuild on a game
    // exit where nothing had expired.
    //
    // An init refused while paused owes a full SETUP, not a refresh: its settings may name
    // a different location, and resolveLocation is the only thing that reads them. The
    // interval is stopped BEFORE that setup begins, because start() clears it only after
    // two awaits, and a retained five-minute deadline landing inside either one fetched
    // and rebuilt against the previous coordinates.
    if (pendingInit && pendingSettings) {
      pendingInit = false;
      pendingResize = false;   // start() rebuilds both
      missedRefresh = false;
      clearInterval(refreshTimer);
      refreshTimer = null;
      start(pendingSettings);
      return;
    }
    // A deferred resize is not a refresh: refreshRadar rebuilds the RainViewer layers but
    // never buildBaseMap, so the OpenStreetMap tiles would keep the viewport they were
    // built for.
    if (pendingResize) {
      pendingResize = false;
      buildBaseMap();
      rebuildFrameLayers();
    }
    // Restart the cadence FROM the catch-up: the interval kept its deadline through the
    // game, and refreshRadar has no in-flight guard, so a game ending just before it
    // produced two overlapping frame-list fetches.
    if (missedRefresh) {
      missedRefresh = false;
      clearInterval(refreshTimer);
      refreshRadar();   // re-arms the animation itself as it rebuilds the layers
      refreshTimer = setInterval(refreshRadar, 5 * 60 * 1000);
      return;
    }
    // The animation was stopped on entry whatever else happened, so it comes back
    // whatever else happens — a game that started and ended inside one refresh window
    // owes nothing else, and used to leave the radar frozen on a single frame.
    restartAnimation();
  });

</script>
</body>
</html>
