    const settled = !browse.loading && !browse.error;
    // Under Random every request is a fresh shuffle, so a page counter would promise
    // a stable enumeration the server is not providing: no counter, no ‹, and › deals
    // another hand (flipPage refetches instead of paging).
    const rnd = !queueTab && lv === 'top' && SORTS[browse.sort].by === 'Random';
    const paged = settled && !rnd && pages > 1;
    const reroll = settled && rnd && browse.total > browse.pageSize;
    el('pprev').hidden = !paged;
    el('pnext').hidden = !(paged || reroll);
    el('pprev').disabled = browse.page <= 0;
    el('pnext').disabled = paged && browse.page >= pages - 1;
    el('counts').textContent = paged ? 'Page ' + (browse.page + 1) + ' of ' + pages : '';
    // While a drill-down is loading, browse.total still counts the PREVIOUS level —
    // '342 seasons' while a series opens. Say nothing until the answer is this level's.
    el('meta').textContent = !settled ? '' : browse.total
      ? browse.total + (contTab ? ' to finish' : nextTab ? ' up next'
        : lv === 'season' ? ' episodes' : lv === 'series' ? ' seasons'
        : activeTab() && activeTab().tv ? ' series' : ' movies')
      : '';

    if (browse.loading) { stripNote('Loading…'); return; }
    if (browse.error) { stripNote(browse.error + ' Tap to retry.', () => loadBrowse()); return; }
    if (!items.length) {
      stripNote(contTab ? 'Nothing part-watched — stop a title midway and it waits here.'
        : nextTab ? 'Nothing up next — start a series and its next episode queues here.'
        : browse.genre ? 'Nothing here under ' + browse.genre + '.' : 'Nothing here yet.');
      return;
    }

    const built = buildStrip(items, {
      wide,
      mixed: nextTab,
      onTap: (item, i) => openItem(item, browse.all ? browse.page * browse.pageSize + i : null),
    });
    ensureImages(built.wanted);
  }

  // The "New" tab: the recently-added shelf, fed by the poll loop rather than taps.
  function renderNewShelf(stale, pill) {
    if (!latest.length) {
      // An unfetched shelf is not an empty library: only a shelf that has actually
      // answered gets to claim there is nothing in it. Either way the note lives IN
      // THE STRIP — a state card would hide the whole Player, tabs included, and an
      // empty New shelf must never wall off a full Movies library one tap away.
      stripNote(!latestAt
        ? "The recently-added list hasn't answered yet — retrying."
        : 'Nothing new lately — this shelf fills in as titles land in '
          + ((server && server.name) || 'Jellyfin') + "'s library.");
      el('counts').textContent = '';
      el('meta').textContent = '';
      el('player').classList.remove('stale-sec');
      if (stale) { pill.hidden = false; pill.textContent = 'Stale'; pill.className = 'pill muted'; }
      else pill.hidden = true;
      return;
    }

    const budget = playerBudget(false, false);
    const built = buildStrip(latest.slice(0, budget.count), {
      onTap: (item) => openItem(item, null),
    });

    const shelfStale = latestAt > 0 && Date.now() - latestAt > SLOW_MS * 2 + 60000;
    el('player').classList.toggle('stale-sec', shelfStale);

    el('counts').textContent = '';
    const notes = [];
    if (shelfStale) notes.push('shelf from ' + new Date(latestAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }));
    if (lastOk) notes.push('updated ' + new Date(lastOk).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }));
    el('meta').textContent = notes.join(' · ');

    pill.hidden = !stale;
    if (stale) { pill.textContent = 'Stale'; pill.className = 'pill muted'; }

    ensureImages(built.wanted);
  }

  function art(d, wanted) {
    const box = document.createElement('div');
    box.className = 'art';
    const ph = document.createElement('span');
    ph.className = 'ph';
    ph.textContent = (d.title || '?').slice(0, 1).toUpperCase();
    box.appendChild(ph);
    if (d.img) {
      const key = d.img.id + '|' + d.img.tag + '|330';
      box.dataset.imgkey = key;
      wanted.add(key);
      const hit = imgCache.get(key);
      if (hit) {
        box.style.backgroundImage = 'url("' + hit + '")';
        ph.hidden = true;
      }
    }
    return box;
  }

  // Advance the clocks between polls: position text, row meters and the axis. Cheap
  // (a handful of text/width writes at 1 Hz), skipped while the panel is hidden.
  function applyTimes() {
    const now = Date.now();
    for (const r of rowRefs) {
      let pos = r.pos0;
      if (pos != null && !r.paused) pos = pos + (now - r.at) / 1000;
      if (pos != null && r.dur != null) pos = Math.min(pos, r.dur);
      if (r.elapsed) r.elapsed.textContent = pos != null ? fmt(pos) : '--';
      if (r.fill) {
        const pct = pos != null && r.dur ? Math.min(100, pos / r.dur * 100) : 0;
        r.fill.style.width = pct.toFixed(1) + '%';
      }
    }
    if (axisRef) {
      let pos = axisRef.pos0 != null && !axisRef.paused
        ? axisRef.pos0 + (now - axisRef.at) / 1000 : axisRef.pos0;
      if (pos == null) return;
      pos = Math.min(pos, axisRef.dur);
      const pct = Math.min(100, pos / axisRef.dur * 100).toFixed(2) + '%';
      el('axisFill').style.width = pct;
      el('axisCur').style.left = pct;
    }
  }

  // ---- poster art ------------------------------------------------------------------

  function ensureImages(wanted) {
    imgWanted = wanted;
    for (const key of wanted) {
      if (imgCache.has(key) || imgPending.has(key)) continue;
      const failedAt = imgFailed.get(key);
      if (failedAt && Date.now() - failedAt < IMG_RETRY_MS) continue;
      imgPending.add(key);
      fetchImage(key, generation);
    }
  }

  async function fetchImage(key, gen) {
    const [id, tag, height] = key.split('|');
    try {
      // The body is read inside the timed region too — a poster that stalls mid-stream
      // must time out, not hang the pending set forever.
      const blob = await jf('/Items/' + encodeURIComponent(id) + '/Images/Primary?fillHeight=' + (Number(height) || 330)
        + '&quality=90&tag=' + encodeURIComponent(tag), { maxBytes: IMG_MAX_BYTES }, 15000, (res) => res.blob());
      if (gen !== generation) return;
      if (!/^image\//.test(blob.type)) throw new Error('not an image (' + (blob.type || 'no type') + ')');
      const url = URL.createObjectURL(blob);
      imgCache.set(key, url);
      imgFailed.delete(key);
      evictImages();
      for (const node of document.querySelectorAll('[data-imgkey]')) {
        if (node.dataset.imgkey !== key) continue;
        node.style.backgroundImage = 'url("' + url + '")';
        const ph = node.querySelector('.ph');
        if (ph) ph.hidden = true;
      }
    } catch (e) {
      // A missing poster is cosmetic: the letter placeholder stays, no state changes.
      if (gen === generation) {
        if (imgFailed.size > 200) imgFailed.clear();   // bounded, like everything else
        imgFailed.set(key, Date.now());
        WW.log('jellyfin: image ' + id + ': ' + e.message);
      }
    } finally {
      imgPending.delete(key);
    }
  }

  function evictImages() {
    if (imgCache.size <= IMG_CACHE_MAX) return;
    for (const [key, url] of imgCache) {
      if (imgCache.size <= IMG_CACHE_MAX) break;
      if (imgWanted.has(key)) continue;   // never evict what's on screen
      imgCache.delete(key);
      URL.revokeObjectURL(url);
    }
  }

  function flushImages() {
    for (const url of imgCache.values()) URL.revokeObjectURL(url);
    imgCache.clear();
    imgPending.clear();
    imgFailed.clear();
    imgWanted = new Set();
  }

  // ---- the theater -----------------------------------------------------------------
  // On-panel playback: an HTML5 <video> pointed straight at Jellyfin's stream
  // endpoints. Media elements cannot send headers, so the api_key rides the query
  // string — Jellyfin's own clients authenticate stream URLs exactly this way.

  function mediaUrl(path) {
    return cfg.base + path + (path.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(cfg.key);
  }

  // Codecs the panel's browser actually decodes. The point is the SILENT failure
  // class: an unsupported audio track (DTS, AC3) does not fire an error event — the
  // video simply plays without sound — so codec safety is decided BEFORE direct play,
  // from the item's MediaStreams, and an unsafe title goes straight to the transcode.
  // Containers fail loudly, but only AFTER a doomed attempt: field log of an MKV was
  // `code 4 — Format error` on direct play before the transcode picked it up, and
  // MKV is most of a typical Jellyfin library. So the container is pre-flighted too,
  // and Matroska skips straight to the transcode instead of failing into it.
  const SAFE_VIDEO = new Set(['h264', 'vp8', 'vp9', 'av1']);
  const SAFE_AUDIO = new Set(['aac', 'mp3', 'opus', 'vorbis', 'flac']);
  // What the demuxer opens from a bare src=: the ISO-BMFF family, WebM and Ogg —
  // plus the bare-stream audio formats for Audio items, whose containers ARE their
  // codecs (an "mp3" or "flac" container is exactly as playable as its codec row).
  // Jellyfin reports ffmpeg-style names, sometimes several at once ("mov,mp4,m4a").
  const SAFE_CONTAINERS = new Set(['mp4', 'm4v', 'm4a', 'mov', '3gp', 'webm', 'ogg', 'ogv', 'oga']);
  const SAFE_AUDIO_CONTAINERS = new Set(['mp3', 'flac', 'wav', 'ogg', 'oga', 'opus', 'aac', 'm4a', 'm4b', 'mp4', 'webm']);

  async function directPlaySafe(item) {
    const body = await jfJson('/Items?Ids=' + encodeURIComponent(String(item.Id)) + '&Fields=MediaStreams,MediaSources',
      8000, 256 * 1024);
    const it = (body && Array.isArray(body.Items) && body.Items[0]) || null;
    const streams = (it && it.MediaStreams) || null;
    if (!Array.isArray(streams)) throw fault('format', 'no media streams');
    // A missing container is not condemned — absence of evidence leaves the codec
    // verdict standing; a KNOWN foreign one (mkv above all) is, before the demuxer
    // has to find out the slow way.
    const source = (Array.isArray(it.MediaSources) && it.MediaSources[0]) || null;
    const container = String((source && source.Container) || it.Container || '').toLowerCase();
    const safeSet = item.Type === 'Audio' ? SAFE_AUDIO_CONTAINERS : SAFE_CONTAINERS;
    if (container && !container.split(',').some((c) => safeSet.has(c.trim()))) return false;
    const audio = streams.filter((s) => s && s.Type === 'Audio');
    const picked = audio.find((s) => s.IsDefault) || audio[0];
    if (picked && !SAFE_AUDIO.has(String(picked.Codec || '').toLowerCase())) return false;
    const video = streams.find((s) => s && s.Type === 'Video');
    if (video && !SAFE_VIDEO.has(String(video.Codec || '').toLowerCase())) return false;
    return true;
  }

  function directUrl(item) {
    const id = encodeURIComponent(String(item.Id));
    return mediaUrl((item.Type === 'Audio' ? '/Audio/' : '/Videos/') + id + '/stream?static=true');
  }

  function transcodeUrl(item) {
    const id = encodeURIComponent(String(item.Id));
    if (item.Type === 'Audio') return mediaUrl('/Audio/' + id + '/stream.mp3');
    return mediaUrl('/Videos/' + id + '/stream.mp4?VideoCodec=h264&AudioCodec=aac'
      + '&MaxWidth=1280&MaxHeight=720&VideoBitrate=6000000&AudioBitrate=192000');
  }

  const pv = el('pv');
  const START_DEADLINE = 20000;   // a source that stalls without erroring is still a failure
  const STALL_DEADLINE = 30000;   // ...and so is one that rebuffers forever mid-title
  let theaterOn = false;
  let theaterAttempts = [];
  let theaterItem = null;
  let theaterSource = null;       // the library item behind theaterItem, Id included
  let overlayTimer = null;
  let attemptTimer = null;
  let stallTimer = null;
  let resumeAt = 0;               // where playback was when an attempt died mid-title
  let timeBase = 0;               // offset of a StartTimeTicks transcode: clock = base + currentTime
  let pendingSeek = 0;            // direct-play resume: seek once metadata arrives
  // Each startPlayback claims a token; a pre-flight that resolves after Back (or after
  // a different title was tapped) finds a foreign token and mutates nothing.
  let playToken = 0;
  // What each attempt died of — codes only, for the terminal card and the log.
  // MediaError codes: 1 aborted · 2 network · 3 decode · 4 source-not-supported —
  // a foreign container ("Format error"), a mixed-content block, a certificate
  // block and the local-network-access gate all read as 4 — which is why the
  // failure probe exists: rs=0 ns=3 with a 2xx probe means a renderer gate, not
  // the server, and the field proved it (beta.3, 2026-08-16).
  let attemptErrors = [];
  // Whether this widget's dashboard page is on screen, kept current by the observer
  // below — the pre-flight's async gap needs the answer at continuation time.
  let pageOff = false;

  function setTransportDisabled(disabled) {
    for (const id of ['tRew', 'tToggle', 'tFwd']) el(id).disabled = disabled;
  }

  function armStartDeadline() {
    clearTimeout(attemptTimer);
    attemptTimer = setTimeout(() => {
      if (theaterOn && el('tError').hidden) theaterError();
    }, START_DEADLINE);
  }

  // The whole surface can be out of sight two ways: this page scrolled off (pageOff)
  // or the dashboard window hidden entirely. Neither may start or continue a stream.
  const outOfSight = () => pageOff || document.hidden;

  // The URL of the attempt currently in the element, kept for the failure probe —
  // never logged (the api_key rides its query).
  let lastSrcUrl = '';

  // Media at a LAN address rides the HOST's stream relay instead of the renderer's
  // own network stack: four field rounds proved the renderer's gates (mixed content,
  // Local Network Access) kill direct requests to private IPs before a byte leaves,
  // flag or no flag. WW.mediaUrl builds the relay URL — including the per-run token
  // that proves a verified widget document is asking — and THIS widget's own
  // certificate setting travels with each request, so another instance's choice for
  // the same server never applies here. Named addresses stay direct: they face no
  // LAN gates and public https plays natively.
  function relayUrl(url) {
    return WW.mediaUrl(url, { insecure: /^https:/i.test(cfg.base) && cfg.selfSigned });
  }

  // A transcode is a stream the server produces as you watch: no byte ranges, so
  // every position change has to be asked for at the server rather than taken here.
  // Both flavours transcodeUrl() builds — stream.mp4 for video, stream.mp3 for audio.
  // Direct play is /stream?static=true, which carries no extension and so cannot
  // collide; mediaUrl always appends its api_key, so the '?' is always there.
  const isTranscode = (url) => /\/stream\.(mp4|mp3)\?/.test(String(url || ''));

  // One door onto pv.src: every attempt gets the startup deadline, and a mid-title
  // fallback carries the position along instead of starting the movie over.
  function setSource(url, keepPaused) {
    // A source now exists, so pause and seek mean something again.
    setTransportDisabled(false);
    clearTimeout(attemptTimer);
    clearTimeout(stallTimer);
    timeBase = 0;
    pendingSeek = 0;
    // Any position at all, not just one past the resume threshold: every caller has
    // already decided whether its position is worth honouring (startPlayback and the
    // fallback both drop a saved point under five seconds), and a SEEK to 0:03 is an
    // explicit instruction — dropping it here restarted the title, which is exactly
    // the complaint this whole change answers.
    if (resumeAt > 0) {
      if (isTranscode(url)) {
        // The server starts the transcode at the offset; the element's own clock
        // restarts at zero, so the displayed times carry the base.
        timeBase = resumeAt;
        url += '&StartTimeTicks=' + Math.floor(resumeAt * 10000000);
      } else {
        pendingSeek = resumeAt;   // direct play seeks natively once metadata is in
      }
    }
    // The startup deadline is answered by `playing`, so a load that will SIT paused
    // must not carry one: nothing would ever call it off and 20 seconds later the
    // watchdog would condemn a perfectly healthy stream. Same reasoning the `pause`
    // handler already applies when it clears both watchdogs — and a source that is
    // genuinely broken still fails through the `error` event either way.
    const willPlay = !outOfSight() && !keepPaused;
    if (willPlay) armStartDeadline(); else clearTimeout(attemptTimer);
    lastSrcUrl = url;
    pv.src = privateLiteralHost(cfg.base) ? relayUrl(url) : url;
    // play() descends from a tap, so autoplay policy is normally satisfied (Chromium's
    // audible gate is sticky per frame once the user has tapped it). If a policy still
    // refuses — activation expired across a slow pre-flight — that is not a broken
    // source: land in a designed paused state with the play button ready, where one
    // explicit tap carries fresh activation. Decoder refusals surface as error events
    // and keep walking the fallback. Off-screen (callers already refuse; belt and
    // braces for future ones), the source loads but stays paused.
    // keepPaused: a seek committed while the viewer had deliberately paused must
    // land at the new position still paused, not start playing 600 ms after a tap
    // that never asked for playback.
    if (willPlay) {
      pv.play().catch((e) => {
        if (e && e.name === 'NotAllowedError' && theaterOn) {
          clearTimeout(attemptTimer);
          clearTimeout(stallTimer);
          el('tSpin').hidden = true;
          setTheaterIcons(true);
          showOverlay();
        }
        /* anything else: the error handler owns fallback */
      });
    } else setTheaterIcons(true);
  }

  async function startPlayback(item, d) {
    theaterOn = true;
    const token = ++playToken;
    theaterItem = { title: d.title, isAudio: item.Type === 'Audio', imgKey: d.img ? d.img.id + '|' + d.img.tag + '|330' : null };
    // The raw item too: theaterItem is display-shaped, and 'ended' needs the Id to
    // mark the finished title played for the configured user.
    theaterSource = item;
    reportedDone = false;
    everPlayed = false;
    cancelSeek();
    // A part-watched title starts where it stopped. The position rides the item
    // itself (UserData, which the Continue query asks for), and setSource already
    // knows how to honour it — StartTimeTicks for a transcode, a native seek for
    // direct play. The server's own resume rules decide what reaches that shelf;
    // this only declines a position too small for setSource to act on.
    const saved = ticksToSec(item.UserData && item.UserData.PlaybackPositionTicks);
    resumeAt = saved && saved > 5 ? saved : 0;
    attemptErrors = [];
    el('ovTitle').textContent = d.title;
    el('tError').hidden = true;
    el('tSpin').hidden = false;
    // No source yet: pause and seek have nothing to act on, and a live pause button
    // here would be answered by the pre-flight starting the stream anyway.
    setTransportDisabled(true);
    // Audio has no frames — the poster (already in the browse cache) stands behind
    // the overlay instead of a black void.
    const tArt = el('tArt');
    const hit = theaterItem.imgKey && imgCache.get(theaterItem.imgKey);
    tArt.hidden = !(theaterItem.isAudio && hit);
    tArt.style.backgroundImage = theaterItem.isAudio && hit ? 'url("' + hit + '")' : 'none';
    el('ovElapsed').textContent = '0:00';
    el('ovTotal').textContent = '--';
    el('ovFill').style.width = '0%';
    el('ovCur').style.left = '0%';
    setTheaterIcons(false);
    showOverlay();
    el('theater').hidden = false;
    // The codec pre-flight decides the order. Three verdicts: safe leads direct;
    // UNSAFE never offers the direct stream at all — falling back to it would recreate
    // the silent video the pre-flight exists to prevent; unknown leads transcode with
    // direct as a last resort, because a transcode always has SOUND.
    let verdict = 'unknown';
    try { verdict = (await directPlaySafe(item)) ? 'safe' : 'unsafe'; }
    catch (e) { WW.log('jellyfin: preflight: ' + e.message); }
    // The answer may belong to a theater that no longer exists: Back was pressed, a
    // different poster was tapped, or the screen went away during the await — the
    // page swiped off, or the whole dashboard hidden.
    if (!theaterOn || token !== playToken) return;
    if (outOfSight()) { stopPlayback(); return; }
    theaterAttempts = verdict === 'safe' ? [directUrl(item), transcodeUrl(item)]
      : verdict === 'unsafe' ? [transcodeUrl(item)]
      : [transcodeUrl(item), directUrl(item)];
    setSource(theaterAttempts.shift());
  }

  function stopPlayback() {
    if (!theaterOn) return;
    // Before anything is torn down: pv.currentTime is about to be zero, and this
    // position is the whole point of Continue. A natural finish already reported
    // itself as played — a stop on top of it would re-create a resume point at
    // the credits.
    stopProgressReports();
    cancelSeek();
    // Only a title that actually played reports where it stopped. A failed
    // attempt sits at position zero, and posting THAT would delete the server's
    // real resume point for a title the panel never managed to show.
    const ticks = positionTicks();
    if (!reportedDone && everPlayed && ticks > 0) reportPlayState('stop', theaterSource, ticks, true);
    theaterOn = false;
    playQueue = null;   // leaving the theater ends the run — Back means back
    nextUpRun = null;
    playToken++;   // orphan any pre-flight still in the air
    clearTimeout(overlayTimer);
    clearTimeout(attemptTimer);
    clearTimeout(stallTimer);
    resumeAt = 0;
    timeBase = 0;
    pendingSeek = 0;
    pv.pause();
    pv.removeAttribute('src');
    pv.load();   // actually stops the network stream, not just the picture
    el('theater').hidden = true;
    theaterItem = null;
    theaterSource = null;
    // Polls were held while the theater had the screen; catch up if one is overdue.
    if (started && Date.now() - lastOk >= pollDelay()) { clearTimeout(timer); tick(generation); }
    render();
    // A run that marked episodes watched walks out onto a Next up shelf still
    // listing them — refetch so the shelf tells the truth it just changed.
    refreshQueuesIfStale();
  }

  function setTheaterIcons(paused) {
    el('tIconPlay').style.display = paused ? 'block' : 'none';
    el('tIconPause').style.display = paused ? 'none' : 'block';
  }

  // The overlay auto-hides while playing (a theater, not a dashboard); any tap brings
  // it back, and while paused it stays. Once the error card owns the screen, the
  // media element's tail of pause/playing events must not resurrect the transport.
  function showOverlay() {
    if (!el('tError').hidden) return;
    el('overlay').classList.remove('faded');
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => {
      if (theaterOn && !pv.paused) el('overlay').classList.add('faded');
    }, 3500);
  }

  // A transcode is a stream the server is producing as you watch: it carries no byte
  // ranges to seek within, so asking the ELEMENT to jump makes Chromium refetch the
  // resource, and the server obligingly starts the same transcode over from the same
  // offset — the title restarts instead of seeking. The jump has to happen at the
  // server, by asking for a transcode that BEGINS at the target.
  // Where a debounced transcode seek is heading, and the timer that will ask for it.
  let seekTarget = null;
  let seekTimer = null;

  function commitSeek() {
    seekTimer = null;
    const t = seekTarget;
    const wasPaused = pv.paused;
    seekTarget = null;
    // Off-screen is a hard refusal, not merely a reason to stay paused: setSource
    // would still assign pv.src and start a fresh server transcode for a page the
    // viewer has swiped away from, and then report a position they never reached.
    if (!theaterOn || t == null || !lastSrcUrl || outOfSight()) return;
    // A SEEK, not a failure: the fallback chain and the attempt history are left
    // exactly as they are, so a later genuine failure still has its remaining
    // sources and its diagnosis.
    resumeAt = t;
    setSource(String(lastSrcUrl).replace(/&StartTimeTicks=\d+/g, ''), wasPaused);
    // A server-side seek swaps the whole resource, so the element never fires the
    // `seeked` that reports a native jump — and the periodic report stands down
    // while paused. Without this the server keeps the PRE-seek position: close the
    // panel in that window and Continue resumes at the wrong place on every client.
    // The target, not positionTicks(): direct play has not applied pendingSeek yet.
    if (!reportedDone) {
      reportPlayState('progress', theaterSource, Math.max(0, Math.floor(t * 10000000)), wasPaused);
    }
  }

  function cancelSeek() {
    clearTimeout(seekTimer);
    seekTimer = null;
    seekTarget = null;
  }

  function seekBy(delta) {
    if (!theaterOn) return;
    // The absolute position, which for a transcode is the element's clock plus the
    // offset its stream started at — pv.currentTime alone is a lie there.
    const at = seekTarget != null ? seekTarget : timeBase + (pv.currentTime || 0);
    // A live transcode reports no duration of its own; the item's runtime is the
    // bound that still holds. Leave a few seconds so a forward jump near the end
    // does not land past the last frame.
    const runtime = ticksToSec(theaterSource && theaterSource.RunTimeTicks);
    const total = isFinite(pv.duration) && pv.duration > 0 ? timeBase + pv.duration : runtime;
    let t = Math.max(0, at + delta);
    if (total > 0) t = Math.min(t, Math.max(0, total - 5));
    // The clamp bounds a seek; it must never REVERSE one. Inside the end margin —
    // 1:39 of a 1:40 title — a forward tap would otherwise land on 1:35 and jump
    // backwards, and on a transcode spawn a whole new stream to do it. A bound that
    // is not ahead of where we are means there is simply no room left to move.
    if (delta > 0 ? t <= at : t >= at) { showOverlay(); return; }

    if (isTranscode(lastSrcUrl)) {
      // Sub-second movement is not worth a new transcode either: the clamp can shave
      // a jump down to a fraction of a second, and paying for a fresh ffmpeg process
      // to travel that far is the restart this change exists to stop.
      if (Math.abs(t - at) < 1) { showOverlay(); return; }
      // Each of these re-asks the server for a NEW transcode, so five taps must not
      // become five ffmpeg processes: the taps accumulate against the pending target
      // and only the settled one is sent. The clock shows where you are heading
      // meanwhile, because nothing else moves until the new stream arrives.
      seekTarget = t;
      el('ovElapsed').textContent = fmt(t);
      clearTimeout(seekTimer);
      seekTimer = setTimeout(commitSeek, 600);
      showOverlay();
      return;
    }
    // Direct play seeks natively, inside whatever the element actually holds.
    if (pv.seekable && pv.seekable.length) {
      t = Math.max(pv.seekable.start(0), Math.min(t, pv.seekable.end(pv.seekable.length - 1)));
    } else if (isFinite(pv.duration)) {
      t = Math.min(t, pv.duration);
    }
    pv.currentTime = t;
    showOverlay();
  }

  function theaterError() {
    if (!theaterOn) return;
    clearTimeout(attemptTimer);
    clearTimeout(stallTimer);
    // Whatever seek was waiting out its debounce belonged to the source that just
    // died. Firing it now would reload a failed transcode — or the fallback that
    // replaced it — behind the error card.
    cancelSeek();
    // Record what THIS attempt died of before anything advances — the codes are the
    // whole diagnosis when both attempts fail in the field. The CARD carries the code
    // alone: short enough for a 200px band's error card, and a code cannot leak the
    // api_key. The implementation-defined message goes to the log only, redacted —
    // such messages may quote the failing URL, the key rides that URL's query, and
    // truncation is not redaction: the key is replaced wherever it appears and query
    // strings are dropped wholesale.
    const me = pv.error;
    attemptErrors.push(me ? 'code ' + me.code : 'watchdog');
    let msg = me && me.message ? String(me.message) : '';
    if (msg) {
      if (cfg.key) msg = msg.split(cfg.key).join('[key]');
      msg = msg.replace(/\?\S*/g, '?…').slice(0, 160);
    }
    // The element's state is the evidence a silent death leaves behind: a watchdog
    // kill has no MediaError, but readyState/networkState and the decoded frame
    // dimensions still separate "no bytes ever arrived" from "bytes arrived, no
    // frames decoded" (a decoder the browser lacks) from "decoded, then stalled".
    const state = 'rs=' + pv.readyState + ' ns=' + pv.networkState + ' '
      + pv.videoWidth + 'x' + pv.videoHeight + ' t=' + (Math.round((pv.currentTime || 0) * 10) / 10);
    WW.log('jellyfin: playback attempt ' + attemptErrors.length + ' failed: '
      + attemptErrors[attemptErrors.length - 1] + ' [' + state + ']' + (msg ? ' — ' + msg : ''));
    // One question the element cannot answer: did the request even reach the server?
    // A renderer-side kill (mixed-content or certificate gate) and an HTTP error
    // (rejected api_key, transcoder down) both read as code 4 with nothing decoded.
    // The host proxy sits outside the renderer's gates, so probing the SAME URL
    // through it splits the two: a 2xx probe means the server is fine and the block
    // is local. Status and content-type only — the URL carries the api_key.
    if (lastSrcUrl) {
      const n = attemptErrors.length;
      WW.fetch(lastSrcUrl, { method: 'HEAD', proxy: 'always',
        insecure: /^https:/i.test(cfg.base) && cfg.selfSigned })
        .then((r) => WW.log('jellyfin: attempt ' + n + ' probe: HTTP ' + r.status
          + ' ' + (r.headers.get('content-type') || '')))
        .catch((e) => WW.log('jellyfin: attempt ' + n + ' probe failed: ' + ((e && e.name) || 'error')));
      // The probe quartet, each isolating ONE layer from inside this frame. Reading
      // the answers: an HTTP status (0 counts — no-cors responses are opaque) means
      // that layer works; TypeError means that layer refused. relay-fetch → host
      // interception; vhost-fetch → virtual hosts at all; direct-fetch → the LAN
      // target with no relay; pna-fetch → the same but with Chromium's per-request
      // Local Network Access opt-in, so if IT succeeds where direct-fetch fails,
      // the gate finally has a name.
      if (privateLiteralHost(cfg.base)) {
        const probe = (tag, url, init) => WW.fetch(url, Object.assign({ method: 'HEAD', proxy: 'never' }, init || {}))
          .then((r) => WW.log('jellyfin: attempt ' + n + ' ' + tag + ': HTTP ' + r.status))
          .catch((e) => WW.log('jellyfin: attempt ' + n + ' ' + tag + ' failed: ' + ((e && e.name) || 'error')));
        probe('relay-fetch', relayUrl(lastSrcUrl));
        probe('vhost-fetch', 'https://media.plinth/', { mode: 'no-cors' });
        probe('direct-fetch', lastSrcUrl, { mode: 'no-cors' });
        probe('pna-fetch', lastSrcUrl, { mode: 'no-cors', targetAddressSpace: 'private' });
        // Every probe above is a HEAD, and HEAD is the one relay path that never builds
        // a body at all — so the quartet can come back clean while the thing that
        // actually failed, the BYTES, was never exercised. This one asks the relay for
        // a real 64 KiB window and counts what arrives: a full 65536 means ranged
        // delivery works end to end and the fault is the element's (codec, container,
        // an unparseable head); a short count or a throw names the transport.
        WW.fetch(relayUrl(lastSrcUrl), { proxy: 'never', headers: { Range: 'bytes=0-65535' } })
          .then(async (r) => {
            // Bounded HERE, not by trusting the server to honour Range: the transcode
            // endpoint answers 200 and streams for as long as ffmpeg runs, and reading
            // that to the end would trip the fetch cap and report a WORKING relay as a
            // failure — the exact false negative this probe exists to prevent. Cancelling
            // at the window also spares the server a transcode nobody watches.
            const reader = r.body && r.body.getReader ? r.body.getReader() : null;
            if (!reader) {
              WW.log('jellyfin: attempt ' + n + ' body-fetch: HTTP ' + r.status + ' (no readable body)');
              return;
            }
            let got = 0;
            try {
              while (got < 65536) {
                const step = await reader.read();
                if (step.done) break;
                got += (step.value && step.value.length) || 0;
              }
            } finally {
              try { reader.cancel(); } catch (e) { /* already closed */ }
            }
            WW.log('jellyfin: attempt ' + n + ' body-fetch: HTTP ' + r.status + ' ' + got + ' bytes');
          })
          .catch((e) => WW.log('jellyfin: attempt ' + n + ' body-fetch failed: ' + ((e && e.name) || 'error')));
      }
    }
    // A failure on a screen nobody is looking at does not get to restart audio there —
    // back to the browse shelf; the viewer re-taps when they return.
    if (outOfSight()) { stopPlayback(); return; }
    // A mid-title death carries its position into the next attempt; only meaningful
    // progress overwrites, so the second attempt's instant failure at 0:00 does not
    // erase where the first one actually was.
    const at = timeBase + (pv.currentTime || 0);
    if (at > 5) resumeAt = at;
    if (theaterAttempts.length) {
      setSource(theaterAttempts.shift());
      return;
    }
    el('tSpin').hidden = true;
    // The last source is UNLOADED, not merely abandoned: a watchdog-declared failure
    // leaves the request live, and a server that recovers after the deadline would
    // resume audio behind this card with the transport faded out of reach.
    pv.pause();
    pv.removeAttribute('src');
    pv.load();
    // The transport is for a stream that no longer exists — the card owns the screen.
    clearTimeout(overlayTimer);
    el('overlay').classList.add('faded');
    // Certificate hints mirror what the host actually enforces: it accepts
    // certificate errors only for LAN hosts the widget has opted in via the
    // self-signed setting — so at a LAN https address WITHOUT the opt-in the
    // setting is the fix, and at a named https address only a trusted
    // certificate is.
    el('tErrorBody').textContent = 'Neither the original file nor a server transcode would play. '
      + 'The codec may be unsupported'
      + (/^https:/i.test(cfg.base) && !privateLiteralHost(cfg.base)
        ? ", or the certificate was refused — at a named https address it must be one this PC trusts (a LAN IP address can use 'Allow self-signed')."
        : /^https:/i.test(cfg.base) && !cfg.selfSigned
          ? ", or the server's certificate was refused — if it is self-signed, set 'Certificate check' to allow it in the widget settings."
          : '.')
      + '  [' + attemptErrors.join(' · ') + ']';
    el('tError').hidden = false;
  }

  pv.addEventListener('error', theaterError);
  pv.addEventListener('playing', () => { clearTimeout(attemptTimer); clearTimeout(stallTimer); el('tSpin').hidden = true; setTheaterIcons(false); showOverlay(); });
  pv.addEventListener('loadedmetadata', () => {
    if (pendingSeek > 0 && isFinite(pv.duration)) {
      pv.currentTime = Math.min(pendingSeek, Math.max(0, pv.duration - 5));
      pendingSeek = 0;
    }
  });
  // A rebuffer is a stall with a spinner: media elements can sit in `waiting` forever
  // without an error event, and the startup deadline is long spent by then. The
  // watchdog walks the fallback chain (carrying the position) if playback does not
  // resume; anything that resumes or deliberately pauses calls it off.
  pv.addEventListener('waiting', () => {
    if (!theaterOn) return;
    el('tSpin').hidden = false;
    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => { if (theaterOn && el('tError').hidden) theaterError(); }, STALL_DEADLINE);
  });
  // A pause — the user's, or ours for a hidden screen — calls off BOTH watchdogs: a
  // deliberately paused stream is not a failed one, and the startup deadline firing
  // through a pause would walk the fallback over the user's own choice.
  pv.addEventListener('pause', () => {
    if (!theaterOn) return;
    clearTimeout(stallTimer);
    clearTimeout(attemptTimer);
    setTheaterIcons(true);
    showOverlay();
    // A pause is a position worth keeping: report it now rather than waiting on
    // the interval (which stands down while paused).
    if (!reportedDone) reportPlayState('progress', theaterSource, positionTicks(), true);
  });
  // Playing for real — not merely requested — is when the server is told, and when
  // the periodic position reports begin.
  pv.addEventListener('playing', () => {
    if (!theaterOn) return;
    everPlayed = true;
    if (!progressTimer) reportPlayState('start', theaterSource, positionTicks(), false);
    startProgressReports();
  });
  // A seek lands a position the interval would not report for another 20 s.
  pv.addEventListener('seeked', () => {
    if (theaterOn && !reportedDone) reportPlayState('progress', theaterSource, positionTicks(), pv.paused);
  });
  // Sequencing: an episode that finishes rolls straight into the next one in its
  // season — that is what "watching a season" means on a lean-back surface. The
  // queue was captured at tap time from the episode list already on screen; a Next
  // up episode instead asks the SERVER for its successor (marking the finished one
  // played first, since that is what next-up is computed from). A finished MOVIE
  // (no queue) closes the theater as before, and a run that ends off-screen must
  // not restart audio on a page nobody is looking at. Every natural finish is
  // marked played when a username is configured — that is the tracking the API
  // key alone cannot do.
  pv.addEventListener('ended', () => {
    const finished = theaterSource;
    // 'ended' alone does not prove the title finished: the relay survives a
    // mid-stream fault by turning it into EOF, and on a chunked transcode no
    // declared length contradicts the truncation — Chromium plays out its buffer
    // and fires 'ended' at minute 12 of 42. The item's own runtime is the check:
    // an end meaningfully short of it is a died stream and takes the ERROR path
    // (diagnostics, resume position, the fallback chain) — never a watched mark,
    // never an advance. No runtime recorded (live TV) → the event is trusted.
    if (theaterOn) {
      const expected = ticksToSec(finished && finished.RunTimeTicks);
      const played = timeBase + (pv.currentTime || 0);
      // The grace scales down for short titles: a flat two minutes would swallow
      // a three-minute episode whole and pass an instant fault-EOF as watched.
      const grace = expected ? Math.min(120, expected * 0.1) : 0;
      if (expected && expected > 0 && played < expected - grace) {
        WW.log('jellyfin: stream ended ' + Math.round(expected - played)
          + 's short of the title’s runtime — treating as a fault');
        theaterError();
        return;
      }
    }
    // Past the runtime check this IS a finish: the watched write speaks for it,
    // and a stop report on top would hand back a resume point at the credits.
    reportedDone = true;
    stopProgressReports();
    if (theaterOn && playQueue && playQueue.index + 1 < playQueue.items.length && !outOfSight()) {
      markPlayed(finished);   // fire-and-forget: the on-screen list is the queue here
      playQueue.index++;
      const item = playQueue.items[playQueue.index];
      startPlayback(item, describe(item));
      return;
    }
    if (theaterOn && nextUpRun && !outOfSight()) {
      advanceNextUp(finished, nextUpRun);
      return;
    }
    markPlayed(finished);
    stopPlayback();
  });
  // timeupdate fires at the browser's own ~4 Hz — data cadence, no timer of ours.
  // The clock carries timeBase: a StartTimeTicks transcode restarts the element's own
  // clock at zero while the title is minutes in.
  pv.addEventListener('timeupdate', () => {
    if (!theaterOn) return;
    // A pending seek owns the clock: the element is still playing the old position
    // and would otherwise erase the target the viewer is tapping towards.
    if (seekTarget != null) return;
    el('ovElapsed').textContent = fmt(timeBase + pv.currentTime);
    if (isFinite(pv.duration) && pv.duration > 0) {
      const total = timeBase + pv.duration;
      el('ovTotal').textContent = fmt(total);
      const pct = Math.min(100, (timeBase + pv.currentTime) / total * 100).toFixed(2) + '%';
      el('ovFill').style.width = pct;
      el('ovCur').style.left = pct;
    }
  });

  // The shell changes pages by SCROLLING #pages — this document never becomes hidden,
  // so a page swipe would leave the stream decoding and playing audio into an
  // off-screen page. An IntersectionObserver with no root measures against the
  // top-level viewport even from inside a cross-origin iframe (the ad-viewability
  // contract), which is exactly the signal a swipe produces.
  if (typeof IntersectionObserver === 'function') {
    new IntersectionObserver((entries) => {
      const last = entries[entries.length - 1];
      if (!last) return;
      pageOff = last.intersectionRatio === 0;
      // A seek still waiting out its debounce dies with the view: committing it
      // would start a transcode for a page that is no longer on screen.
      if (pageOff && theaterOn) { cancelSeek(); if (!pv.paused) pv.pause(); }
    }).observe(document.documentElement);
  }

  el('theater').addEventListener('click', (e) => {
    if (e.target.closest('.btn')) return;   // buttons speak for themselves
    if (el('overlay').classList.contains('faded')) showOverlay();
    else el('overlay').classList.add('faded');
  });
  el('tBack').addEventListener('click', stopPlayback);
  el('tErrBack').addEventListener('click', stopPlayback);
  el('tRew').addEventListener('click', () => seekBy(-10));
  el('tFwd').addEventListener('click', () => seekBy(30));
  el('tToggle').addEventListener('click', () => {
    if (pv.paused) {
      pv.play().catch(() => {});
      setTheaterIcons(false);
      // Resuming a source that never reached 'playing' re-enters the startup race —
      // the deadline comes back so a dead source still ends at the fallback, not a
      // spinner without a referee.
      if (!el('tSpin').hidden) armStartDeadline();
    } else { pv.pause(); }
    showOverlay();
  });

  // ---- states ----------------------------------------------------------------------

  function stateCard(cls, icon, title, body, onRetry) {
    const pill = el('pill');
    pill.hidden = false;
    pill.textContent = cls === 'err' ? 'Error' : 'Setup';
    pill.className = 'pill ' + (cls === 'err' ? 'err' : 'muted');
    const s = el('state');
    s.className = 'state-card' + (cls ? ' ' + cls : '');
    s.textContent = '';
    const i = document.createElement('div');
    i.className = 'state-icon';
    i.textContent = icon;
    const t = document.createElement('div');
    t.className = 'state-title';
    t.textContent = title;
    const b = document.createElement('div');
    b.className = 'state-body';
    b.textContent = body;
    s.append(i, t, b);
    if (onRetry) {
      const btn = document.createElement('button');
      btn.className = 'btn no-pan';
      btn.textContent = 'Retry';
      btn.addEventListener('click', onRetry);
      s.append(btn);
    }
    s.hidden = false;
    el('main').hidden = true;
    el('player').hidden = true;
    el('axis').hidden = true;
    document.querySelector('footer').hidden = true;
  }

  function showLoading() {
    const s = el('state');
    s.className = 'state-card';
    s.textContent = '';
    const sp = document.createElement('div');
    sp.className = 'spinner';
    s.append(sp);
    s.hidden = false;
    el('main').hidden = true;
    el('player').hidden = true;
    el('axis').hidden = true;
    document.querySelector('footer').hidden = true;
    const pill = el('pill');
    pill.hidden = false;
    pill.textContent = 'Loading';
    pill.className = 'pill muted';
    const st = el('st');
    st.className = 'st';
    st.textContent = '';
  }

  function showSetup() {
    stateCard('', '◎', 'Not configured yet',
      !cfg.base ? 'Add your Jellyfin address in the widget settings.'
      : 'Add an API key in the widget settings — Jellyfin Dashboard → API Keys.');
  }

  function showError(message) {
    stateCard('err', '!', 'Jellyfin unavailable', message, () => {
      stateCard('', '', 'Retrying', '');
      fails = 0;
      pollAnchor = 0;
      clearTimeout(timer);
      tick(generation);
    });
  }

  // ---- wiring ----------------------------------------------------------------------

  let uiTimer = null;
  function startUiClock() {
    if (uiTimer) return;
    uiTimer = setInterval(() => {
      if (document.hidden || !rowRefs.length) return;
      applyTimes();
    }, 1000);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    // The on-panel editor resizes the frame in place without another init.
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (started && lastOk) render(); }, 150);
  });

  document.addEventListener('visibilitychange', () => {
    // A hidden panel must not keep decoding video into the void.
    if (document.hidden) {
      if (theaterOn) { cancelSeek(); if (!pv.paused) pv.pause(); }
      return;
    }
    if (!started || theaterOn) return;
    if (Date.now() - lastOk >= pollDelay()) { clearTimeout(timer); tick(generation); }
  });

  WW.onInit((s0) => {
    const s = s0.settings;
    // The trust choice is part of the identity: flipping it is how a user fixes a
    // connection, and the retry should start clean with the new transport rules.
    const prevIdentity = cfg.base + '\n' + cfg.key + '\n' + cfg.selfSigned;
    const prevView = cfg.view;
    const prevTypes = cfg.types;
    const prevHide = Array.from(cfg.hide).sort().join('\n');
    const prevUser = cfg.user;
    cfg.base = normalizeBase(s.baseUrl);
    cfg.key = String(s.apiKey == null ? '' : s.apiKey);
    cfg.selfSigned = s.certValidation === 'Allow self-signed';
    cfg.view = s.view === 'Player' ? 'player' : 'overview';
    // "Hidden" now applies to the Player too: when the Player was ONLY the shelf,
    // hiding it would have meant an unbrowsable view and the setting was quietly
    // overridden — but the Player has libraries and Next up now, so Hidden removes
    // the New tab and the landing moves to the queue or the first library.
    cfg.types = LATEST_TYPES[s.latestTypes] !== undefined ? LATEST_TYPES[s.latestTypes] : 'Movie,Episode';
    cfg.refreshMs = Math.min(300, Math.max(5, Number(s.refreshSeconds) || 15)) * 1000;
    // Names compare case-insensitively: the setting is typed by hand against
    // libraries whose exact casing nobody remembers. A list property arrives as
    // rows; bare strings are tolerated the way ping's host list tolerates them.
    cfg.hide = new Set((Array.isArray(s.hideLibraries) ? s.hideLibraries : [])
      .map((r) => (typeof r === 'string' ? r : String((r && r.name) || '')))
      .map((n) => n.trim().toLowerCase()).filter(Boolean));
    cfg.user = String(s.userName || '').trim();
    // Switching views or the shelf's filter changes which slow-lane facts matter —
    // refetch them next tick rather than showing the old filter's items for five minutes.
    if (prevView !== cfg.view || prevTypes !== cfg.types) {
      slowAt = 0;
      if (prevTypes !== cfg.types) { latest = []; latestAt = 0; }
      // Hiding or unhiding the shelf changes the Player's TAB SET, not just the
      // shelf's content — the landing tab must recompute from scratch.
      if ((prevTypes === '') !== (cfg.types === '')) browseReset();
      // A view change pulls the screen out from under a playing title — and out
      // from under an open chooser sheet, which would otherwise sit fixed over
      // the overview with the Player's pills still live inside it.
      if (prevView !== cfg.view) { stopPlayback(); closeChooser(); }
    }
    // A different hide list is a different shelf and a different tab row; a
    // different username is a different Next up. Both restart their surfaces —
    // neither touches the server identity, so polling continues undisturbed.
    if (prevHide !== Array.from(cfg.hide).sort().join('\n')) {
      latest = [];
      latestAt = 0;
      slowAt = 0;
      browseReset();
    }
    if (prevUser !== cfg.user) {
      nextUser = { id: '' };
      browseReset();
      // The tracked user is part of the playing run's identity: a title started
      // under user A must not be marked watched for user B when it ends, and an
      // auto-advance must not continue onto the new account's queue.
      stopPlayback();
    }

    // A different server (or a different key onto the same one) is a different set of
    // facts — and a response already in flight belongs to the old identity.
    if (prevIdentity !== cfg.base + '\n' + cfg.key + '\n' + cfg.selfSigned) {
      sessions = [];
      latest = [];
      latestAt = 0;
      counts = null;
      server = null;
      rowRefs = [];
      axisRef = null;
      browseReset();   // the tabs, the drill-down and the queue all belong to the old server
      nextUser = { id: '' };   // and so does the resolved user id
      generation++;
      inFlight = false;
      fails = 0;
      lastOk = 0;
      slowAt = 0;
      document.body.classList.remove('stale');
      // A stream from the OLD server must not keep playing under the new identity.
      stopPlayback();
      flushImages();
      // The old server's streams are still painted, and nothing marks them as the old
      // server's — back to the spinner until the new identity answers (the setup card
      // below overrides this when the new identity is incomplete).
      showLoading();
    }
    const gen = generation;

    if (!cfg.base || !cfg.key) {
      clearTimeout(timer);
      generation++;
      inFlight = false;
      started = false;
      stopPlayback();
      showSetup();
      return;
    }
    // Same identity (a theme push re-sends init): keep the data on screen rather than
    // blanking to a spinner for a repaint.
    if (lastOk) render();
    clearTimeout(timer);
    started = true;
    startUiClock();
    // A poll already in flight would swallow this tick (the gated-recheck branch) and
    // its finally would re-arm the ordinary interval — with the slow lane just marked
    // due, that parks an emptied shelf for up to the whole refresh interval. Queue the
    // follow-up so the running poll hands off immediately.
    if (inFlight) refreshQueued = true;
    tick(gen);
  });
</script>
</body>
</html>
