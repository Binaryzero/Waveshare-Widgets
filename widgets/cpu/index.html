<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CPU Monitor</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, typography basics come from widget-base.css. */
  body {
    display: flex;
    flex-direction: column;
    padding: 12px 16px 10px;
  }
  #main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6%;
    margin-top: 2%;
  }
  #bigs { display: flex; flex-direction: column; gap: 7%; justify-content: center; }
  .stat .val {
    font-size: calc(clamp(18px, 9vh, 44px) * var(--value-scale, 1));
    color: var(--text);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat .val .unit { font-size: 45%; font-weight: 500; }
  .stat .label {
    margin-top: 4px;
    font-size: calc(clamp(8px, 2.6vh, 10px) * var(--label-scale, 1));
  }
  /* Per-core bars: the demo's chart — a hairline frame, one bar per core, the
   * hottest core carried in the alert amber. */
  #coresWrap { flex: 1 1 auto; min-width: 0; height: 88%; display: flex; gap: 8px; }
  #axis {
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 8px; font-weight: 500; letter-spacing: 0.12em;
    color: var(--text-dim); text-align: right;
    font-variant-numeric: tabular-nums;
    padding-bottom: 11px;
  }
  #chart { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #bars {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: flex-end; justify-content: space-around; gap: 4px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  #bars::before { /* the 50% gridline */
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    border-top: 1px dashed var(--line); opacity: 0.5;
  }
  #bars b {
    width: 13px; max-width: 9%;
    background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.85), rgba(var(--accent-rgb), 0.38));
    box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.22);
    transition: height 0.35s var(--ease);
  }
  #bars b.hot {
    background: linear-gradient(180deg, var(--warn), color-mix(in srgb, var(--warn) 45%, transparent));
    box-shadow: 0 0 8px color-mix(in srgb, var(--warn) 40%, transparent);
  }
  #coreVals {
    display: flex; justify-content: space-around; gap: 4px;
    font-size: 8px; font-weight: 500; letter-spacing: 0.08em;
    color: var(--text-dim); font-variant-numeric: tabular-nums;
    padding-top: 3px; flex: none;
  }
  #coreVals span { width: 13px; max-width: 9%; text-align: center; }
  #loadScale { margin-top: auto; }
</style>
</head>
<body>
  <header class="hd">
    <span class="kicker">CPU</span>
    <span class="st" id="coreCount" hidden></span>
  </header>
  <div id="main">
    <div id="bigs">
      <div class="stat">
        <div class="val value" id="load">--</div>
        <div class="label kicker">Load</div>
      </div>
      <div class="stat" id="stat2" hidden>
        <div class="val value" id="stat2Val">--</div>
        <div class="label kicker" id="stat2Label"></div>
      </div>
    </div>
    <div id="coresWrap" hidden>
      <div id="axis"><span>100</span><span>50</span><span>0</span></div>
      <div id="chart">
        <div id="bars"></div>
        <div id="coreVals"></div>
      </div>
    </div>
  </div>
  <!-- Load is the tile's natural axis: 0-100, fill and cursor at now. -->
  <div class="scale" id="loadScale" style="--pitch: 4%">
    <div class="rail"></div><div class="mns"></div>
    <div class="mj e-l" style="left:0"><b>0</b></div>
    <div class="mj" style="left:25%"><b>25</b></div>
    <div class="mj" style="left:50%"><b>50</b></div>
    <div class="mj" style="left:75%"><b>75</b></div>
    <div class="mj e-r" style="left:100%"><b>100</b></div>
    <div class="fill" id="loadFill" style="width:0%"></div>
    <div class="cur" id="loadCur" style="left:0%"></div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const MAX_BARS = 16;

  WW.onInit((state) => {
    const s = state.settings;
    // Per-text-type size scales. Appearance comes from the theme tokens (global
    // theme or the per-slot style override) — legacy color keys in old layouts
    // are deliberately ignored.
    document.body.style.setProperty('--value-scale', String((Number(s.valueSize) || 100) / 100));
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
  });

  function pick(settingId, opts) {
    return (settingId && WW.sensorById(settingId)) || WW.findSensor(opts);
  }

  WW.onSensors(() => {
    const s = WW.settings;
    const load = pick(s.loadSensorId, {
      type: 'Load', deviceTypeIncludes: ['cpu'], preferredNames: ['CPU Total'],
    }) || WW.sensorById('sys:cpu:load');

    // Preference order for temperature: a real CPU sensor (needs elevation + PawnIO),
    // then any ACPI thermal zone (driver-free but firmware-dependent).
    const temp = pick(s.tempSensorId, {
      type: 'Temperature', deviceTypeIncludes: ['cpu'],
      preferredNames: ['Core (Tctl/Tdie)', 'CPU Package', 'Core Average', 'Core Max'],
    })
      || WW.findSensor({ type: 'Temperature', deviceTypeIncludes: ['system'], nameIncludes: ['cpu'] })
      || WW.findSensor({ type: 'Temperature', deviceTypeIncludes: ['system'], nameIncludes: ['thermal', 'acpi'] });

    const loadValue = load && load.value != null ? Math.min(100, load.value) : null;
    document.getElementById('load').textContent = loadValue == null ? '--' : '';
    if (loadValue != null) {
      const el = document.getElementById('load');
      el.textContent = String(Math.round(loadValue));
      const unit = document.createElement('small');
      unit.className = 'unit';
      unit.textContent = '%';
      el.appendChild(unit);
    }
    const pct = (loadValue || 0).toFixed(1) + '%';
    document.getElementById('loadFill').style.width = pct;
    document.getElementById('loadCur').style.left = pct;

    // Second big stat: the best-available companion so the tile never shows a dead
    // placeholder on machines without the kernel-driver sensors.
    // Preference: CPU-specific data before the generic fallback. sys:mem:load is
    // emitted on every frame GlobalMemoryStatusEx succeeds, so listing it ahead of
    // the clock made the clock unreachable on machines without a temp sensor.
    const second = [
      { label: 'Temp', unit: '°C', decimals: 0, sensor: temp },
      { label: 'Clock', unit: 'MHz', decimals: 0,
        sensor: WW.findSensor({ type: 'Clock', deviceTypeIncludes: ['cpu'], nameIncludes: ['core #1', 'core'] }) },
      { label: 'Memory', unit: '%', decimals: 0, sensor: WW.sensorById('sys:mem:load') },
    ].find((c) => c.sensor && c.sensor.value != null);
    const stat2 = document.getElementById('stat2');
    stat2.hidden = !second;
    if (second) {
      const val = document.getElementById('stat2Val');
      val.textContent = String(Math.round(second.sensor.value * (second.decimals ? 10 : 1)) / (second.decimals ? 10 : 1));
      const unit = document.createElement('small');
      unit.className = 'unit';
      unit.textContent = second.unit;
      val.appendChild(unit);
      document.getElementById('stat2Label').textContent = second.label;
    }

    // Per-core bars, hottest core in amber. Enumerated from the sensor list — on a
    // machine that exposes no per-core loads the whole chart stays hidden.
    // The count and the hottest core come from the FULL list; only the bars are
    // capped — a 24-core machine reports 24 cores and its true hottest even when
    // just 16 bars fit.
    const allCores = WW.sensors
      .filter((x) => x.type === 'Load' && /core #?\d+/i.test(x.name || '') && x.value != null)
      .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
    const cores = allCores.slice(0, MAX_BARS);
    const wrap = document.getElementById('coresWrap');
    wrap.hidden = cores.length < 2;
    const count = document.getElementById('coreCount');
    count.hidden = cores.length < 2;
    if (cores.length >= 2) {
      count.textContent = allCores.length + ' cores';
      const bars = document.getElementById('bars');
      const vals = document.getElementById('coreVals');
      bars.textContent = '';
      vals.textContent = '';
      // The amber marks the hottest VISIBLE bar — marking a bar for an off-chart
      // core would point at the wrong column, and no mark at all reads as "none
      // hot". The count above still tells the whole truth.
      const hottest = cores.reduce((m, c) => (c.value > m.value ? c : m), cores[0]);
      const showVals = cores.length <= 8;
      for (const core of cores) {
        const bar = document.createElement('b');
        bar.style.height = Math.max(2, Math.min(100, core.value)).toFixed(0) + '%';
        if (core === hottest) bar.className = 'hot';
        bars.appendChild(bar);
        if (showVals) {
          const v = document.createElement('span');
          v.textContent = String(Math.round(core.value));
          vals.appendChild(v);
        }
      }
      vals.hidden = !showVals;
    }
  });
</script>
</body>
</html>
