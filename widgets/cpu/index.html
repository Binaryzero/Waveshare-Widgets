<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CPU Monitor</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, typography basics come from widget-base.css. */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6%;
  }
  .ring { position: relative; height: 72%; aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--control-bg); stroke-width: 9; }
  .ring .progress { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease); }
  .ring .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring .center .big { font-size: calc(clamp(20px, 9vh, 44px) * var(--value-scale, 1)); color: var(--text); font-weight: 600; line-height: 1; }
  .ring .center .cap { font-size: calc(clamp(9px, 3vh, 13px) * var(--title-scale, 1)); color: var(--text-muted); letter-spacing: 0.14em; margin-top: 4px; }
  #stats { display: flex; flex-direction: column; gap: 8%; }
  .stat .label { font-size: calc(clamp(9px, 3vh, 13px) * var(--label-scale, 1)); color: var(--text-muted); letter-spacing: 0.1em; }
  .stat .val { font-size: calc(clamp(16px, 7vh, 34px) * var(--value-scale, 1)); color: var(--text); font-weight: 600; }
  .stat .val .unit { font-size: 55%; font-weight: 400; }
  #hint { position: fixed; left: 12px; bottom: 8px; font-size: calc(clamp(8px, 2.4vh, 11px) * var(--hint-scale, 1)); color: var(--text-dim); max-width: 92%; }
</style>
</head>
<body>
  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="44"></circle>
      <circle class="progress" id="ringValue" cx="50" cy="50" r="44"></circle>
    </svg>
    <div class="center">
      <div class="big value" id="load">--</div>
      <div class="cap kicker">CPU LOAD</div>
    </div>
  </div>
  <div id="stats"></div>
  <div id="hint" hidden></div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const CIRCUMFERENCE = 2 * Math.PI * 44;
  const ring = document.getElementById('ringValue');
  ring.style.strokeDasharray = String(CIRCUMFERENCE);
  ring.style.strokeDashoffset = String(CIRCUMFERENCE);

  WW.onInit((state) => {
    const s = state.settings;
    // bgStyle drives the widget-base panel-opacity classes (default = solid).
    document.body.classList.toggle('bg-solid', s.bgStyle !== 'transparent' && s.bgStyle !== 'glass');
    document.body.classList.toggle('bg-glass', s.bgStyle === 'glass');
    document.body.classList.toggle('bg-transparent', s.bgStyle === 'transparent');

    // Per-text-type size scales. Appearance comes from the theme tokens (global
    // theme or the per-slot style override) — legacy color keys in old layouts
    // are deliberately ignored.
    document.body.style.setProperty('--title-scale', String((Number(s.titleSize) || 100) / 100));
    document.body.style.setProperty('--value-scale', String((Number(s.valueSize) || 100) / 100));
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
    document.body.style.setProperty('--hint-scale', String((Number(s.hintSize) || 100) / 100));
  });

  function pick(settingId, opts) {
    return (settingId && WW.sensorById(settingId)) || WW.findSensor(opts);
  }

  WW.onSensors(() => {
    const s = WW.settings;
    const load = pick(s.loadSensorId, {
      type: 'Load', deviceTypeIncludes: ['cpu'], preferredNames: ['CPU Total'],
    }) || WW.sensorById('sys:cpu:load');

    // Preference order for temperature: a real CPU sensor (needs elevation + PawnIO),
    // then any ACPI thermal zone (driver-free but firmware-dependent).
    const temp = pick(s.tempSensorId, {
      type: 'Temperature', deviceTypeIncludes: ['cpu'],
      preferredNames: ['Core (Tctl/Tdie)', 'CPU Package', 'Core Average', 'Core Max'],
    })
      || WW.findSensor({ type: 'Temperature', deviceTypeIncludes: ['system'], nameIncludes: ['cpu'] })
      || WW.findSensor({ type: 'Temperature', deviceTypeIncludes: ['system'], nameIncludes: ['thermal', 'acpi'] });

    const loadValue = load && load.value != null ? Math.min(100, load.value) : null;
    document.getElementById('load').textContent = loadValue == null ? '--' : Math.round(loadValue) + '%';
    ring.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - (loadValue || 0) / 100));

    // Fill the three stat rows with whatever this machine can actually provide, so the
    // widget never shows dead "--" rows on systems without the kernel-driver sensors.
    const candidates = [
      { label: 'Temp', unit: ' °C', decimals: 0, sensor: temp },
      { label: 'Clock', unit: ' MHz', decimals: 0,
        sensor: WW.findSensor({ type: 'Clock', deviceTypeIncludes: ['cpu'], nameIncludes: ['core #1', 'core'] }) },
      { label: 'Power', unit: ' W', decimals: 1,
        sensor: WW.findSensor({ type: 'Power', deviceTypeIncludes: ['cpu'], preferredNames: ['CPU Package', 'Package'] }) },
      { label: 'Memory', unit: ' %', decimals: 0, sensor: WW.sensorById('sys:mem:load') },
      { label: 'Mem Used', unit: ' GB', decimals: 1, sensor: WW.sensorById('sys:mem:used') },
      { label: 'Net Down', unit: ' MB/s', decimals: 1, scale: 1 / 1048576, sensor: WW.sensorById('sys:net:down') },
    ];
    const rows = candidates.filter((c) => c.sensor && c.sensor.value != null).slice(0, 3);

    const stats = document.getElementById('stats');
    stats.textContent = '';
    for (const row of rows) {
      const stat = document.createElement('div');
      stat.className = 'stat';
      const label = document.createElement('div');
      label.className = 'label kicker';
      label.textContent = row.label;
      const val = document.createElement('div');
      val.className = 'val value';
      const value = (row.sensor.value * (row.scale || 1)).toFixed(row.decimals);
      const small = document.createElement('small');
      small.className = 'unit';
      small.textContent = row.unit;
      val.append(value, small);
      stat.append(label, val);
      stats.appendChild(stat);
    }

    document.getElementById('hint').hidden = true; // never suggests elevation (removed)
  });
</script>
</body>
</html>
