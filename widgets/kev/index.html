<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CISA KEV</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, bgStyle and the typography base come from
   * widget-base.css. */
  body { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  #hdr { display: flex; align-items: center; gap: 10px; }
  /* The header annotation is the wide-layout count — the demo's "2 ADDED THIS WEEK",
   * numeral in the data hue. In a quarter the hero count carries it instead. */
  #ann { display: none; }
  #ann b { color: var(--accent); font-weight: 600; }
  main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #count { display: flex; align-items: baseline; gap: 8px; flex: none; }
  #n { line-height: 1; font-size: clamp(30px, 9vh, 46px); }
  #window { color: var(--text-muted); font-size: 12px; letter-spacing: 0.04em; }
  /* The list is the half/full story. In a quarter there is no room for rows that stay
   * legible, so the count becomes the tile: it takes the space the rows would have had
   * rather than leaving a mostly-empty card with a small number in the corner. */
  #list { display: none; flex: 1 1 auto; flex-direction: column; min-height: 0; overflow: hidden; }
  @media (min-width: 470px) and (min-height: 241px) {
    #list { display: flex; }
    #ann { display: inline; }
    #count { display: none; }
    #dueScale.has-dues { display: block; }
  }
  /* At three-quarter and full a row is roughly a thousand pixels wide, which parks a
   * vendor at one edge of the panel and its CVE at the other with nothing between them —
   * the pair a reader is trying to associate ends up as far apart as the tile allows.
   * Two columns keep them together and fit the same list in half the height. The height
   * guard matches the rule above: in a 200px band the list is not shown at all. */
  @media (min-width: 900px) and (min-height: 241px) {
    /* Tracks sized to the row rather than to the leftover height, then spread: a 1fr
     * track is far taller than the 46px a row may grow to, so the rows would hang at the
     * top of their tracks with the slack showing as a ragged gap under each one. */
    #list { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(24px, 46px);
      column-gap: 8px; align-content: space-between; }
  }
  /* The same two columns, asked for by MEASUREMENT rather than by width (#163). A half
   * slot is 640×400, which leaves the list about 293px — ten rows at their 24px minimum
   * plus the 4px gaps. maxItems goes to 12, so eleven sliced a row through the middle
   * and twelve dropped one off the tile entirely, while the count above still said 12.
   * Splitting the list halves the height it needs and shows every row the reader asked
   * for; `.who` leans harder on the ellipsis it already has, which is the better trade.
   * The 470px floor is the same one that decides the list is shown at all — narrower
   * than that a second column would be too tight to read, and the quarter layout makes
   * the count the tile instead. */
  @media (min-width: 470px) and (min-height: 241px) {
    #list.two-col { display: grid; grid-template-columns: 1fr 1fr;
      grid-auto-rows: minmax(24px, 46px); column-gap: 8px; align-content: space-between; }
  }
  @media (max-width: 469px), (max-height: 240px) {
    main { justify-content: center; }
    #count { flex-direction: column; align-items: flex-start; gap: 0; }
    #n { font-size: min(34vw, 26vh); }
    #window { font-size: 13px; }
  }
  /* Advisory rows in the demo's grammar: open rows over hairline separators — no
   * cards. Diamond, CVE id bright, product muted, due date dim; a row whose due date
   * is close carries the alert amber on its diamond and dates. */
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 2px;
    border-top: 1px solid var(--line);
    min-width: 0;
    /* Share the tile: rows grow into the height a 400px slot has and a 200px band
     * does not, capped so a short list never turns into fat bars. */
    flex: 1 1 0; min-height: 24px; max-height: 46px;
  }
  .row:first-child { border-top: none; }
  .row .dm {
    width: 5px; height: 5px; flex: none;
    border: 1px solid var(--text-muted); transform: rotate(45deg);
  }
  .row .cve {
    color: var(--text); font-weight: 600; font-size: 12px;
    font-variant-numeric: tabular-nums; white-space: nowrap; flex: none;
  }
  .row .who {
    color: var(--text-muted); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1 1 auto; min-width: 0;
  }
  .row .due {
    color: var(--text-dim); font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    font-variant-numeric: tabular-nums; white-space: nowrap; flex: none;
  }
  .row.urgent .dm { border-color: var(--warn); background: var(--warn);
    box-shadow: 0 0 6px color-mix(in srgb, var(--warn) 50%, transparent); }
  .row.urgent .due { color: var(--warn); }
  /* The due-date timeline: today to the furthest deadline, a hollow diamond per due
   * date, urgent ones amber. Hidden until rows carry dates, and in narrow layouts. */
  #dueScale { display: none; }
  footer { color: var(--text-dim); font-size: 11px; flex: none; font-variant-numeric: tabular-nums; }
  #state { position: fixed; inset: 0; }
  /* Stale keeps the last answer visible but dimmed — old KEV data still beats none.
   * #state is in the list because an empty catalog IS an answer, and it lives in the
   * state card rather than in #count/#list: without this the one stale answer that has
   * no rows was the one that did not look stale, while its own pill said so. A visible
   * error card never carries this class — the stale mark is only set on the branch that
   * has an answer to keep, and the error branch is the one that does not. */
  body.stale #count, body.stale #list, body.stale #state { opacity: 0.55; }
</style>
</head>
<body>
  <header class="hd">
    <span class="kicker">CISA KEV</span>
    <span id="hdr">
      <span class="st" id="ann" hidden><b id="annN">0</b> <span id="annWindow">added in 7 days</span></span>
      <span class="pill muted" id="pill">Loading</span>
    </span>
  </header>

  <main id="data" hidden>
    <div id="count">
      <span class="value hero" id="n">--</span>
      <span id="window">added in 7 days</span>
    </div>
    <div id="list"></div>
    <div class="scale" id="dueScale">
      <div class="rail"></div>
      <div class="mj e-l" style="left:0"><b id="dueL"></b></div>
      <div class="mj e-r" style="left:100%"><b id="dueR"></b></div>
      <span id="dueMarks"></span>
    </div>
  </main>

  <footer id="meta"></footer>

  <div class="state-card" id="state">
    <div class="spinner"></div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  // The catalog is public and unauthenticated; it changes a few times a day at most.
  const FEED = 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json';
  // The raw feed is well over a megabyte — descriptions, notes, required actions, due
  // dates. The four fields this tile reads are a fraction of that, and the projection
  // below is what makes keeping the WHOLE catalog affordable: on the order of a hundred
  // bytes an entry against a localStorage quota measured in megabytes, on a virtual host
  // this widget has to itself.
  //
  // Nothing is dropped before filtering, and that is the point. The cap here used to be
  // the display length, so the newest-40 slice was taken BEFORE the watch terms and the
  // date window were applied: a watched vendor sitting at position 60 read as absent, and
  // any month with more than 40 additions under-reported its own count. Raising that cap
  // to 600 moved the same defect out of common sight rather than removing it — a vendor
  // whose most recent KEV entry falls outside the newest 600 still reported "0 watched"
  // while the catalog held its records. Filtering happens on everything the feed returned.
  //
  // CACHE_MAX bounds the WRITE only, and only if the quota refuses the whole list: a
  // shorter cache still beats an empty one on the next cold start, and either way the
  // in-memory catalog is untouched.
  const CACHE_MAX = 2000;
  // One poll's whole budget: connect, transfer, and parse. Well under the 15-minute
  // minimum refresh, so a run that hits it is a stall rather than a slow link.
  const FETCH_DEADLINE = 60000;
  // How often a hidden document re-checks, without disturbing the poll deadline.
  const HIDDEN_RECHECK = 60000;
  // v2: entries carry the feed's dueDate for the due column and the timeline; a v1
  // cache lacks it, so the version rolls and the first poll rebuilds the projection.
  const CACHE_KEY = 'kev.cache.v2';

  const cfg = { watch: [], maxItems: 6, windowDays: 7, refreshMs: 3600000 };
  let entries = [];        // [{vendor, product, cve, added}] newest first
  let fetchedAt = 0;
  let timer = null;
  let boundaryTimer = null;
  let pollAnchor = 0;      // when the current wait began: the last poll attempt's end
  let failures = 0;        // consecutive failed polls; stretches the interval
  let polled = false;      // has a request ever actually been ATTEMPTED?
  let started = false;
  let inFlight = false;
  let answered = false;   // has a cache read or a response actually happened yet?

  const el = (id) => document.getElementById(id);

  function parseTerms(value) {
    const raw = Array.isArray(value) ? value : [];
    return raw
      .map((item) => {
        if (!item) return '';
        if (typeof item === 'string') return item.trim();
        return String(item.term == null ? '' : item.term).trim();
      })
      .filter(Boolean)
      .map((t) => t.toLowerCase());
  }

  WW.onInit((state) => {
    const s = state.settings;

    cfg.watch = parseTerms(s.watch);
    cfg.maxItems = Math.min(12, Math.max(3, Number(s.maxItems) || 6));
    cfg.windowDays = Math.min(30, Math.max(1, Number(s.windowDays) || 7));
    cfg.refreshMs = Math.min(1440, Math.max(15, Number(s.refreshMinutes) || 60)) * 60000;

    // A re-init is a settings change, not a reason to refetch a catalog that moves a
    // few times a day: re-render what we hold and let the running chain do the rest.
    render();
    if (!started) { started = true; loadCache(); tick(); }
    // ...but the chain has to be re-armed, because the interval it is waiting on may be
    // the one that just changed. Doing nothing here left a poll pending on the OLD
    // setting: going from a day to fifteen minutes still left the next refresh almost a
    // day away. arm() measures against the time already served rather than restarting
    // the wait, so a shortened interval brings the next poll forward — to immediately,
    // if the new interval has already elapsed, which is a poll that is overdue rather
    // than a refetch forced by the settings change.
    else if (!inFlight) arm();
  });

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return;
      const cached = JSON.parse(raw);
      if (!cached || !Array.isArray(cached.entries)) return;
      // Validated BEFORE it becomes live state. A cache that parses but holds a damaged
      // element used to be assigned first and rendered second — and render() throws on
      // it, from inside this try, so the catch logged and left the bad array installed.
      // The next failed fetch renders the same array from ITS catch, that throw escapes,
      // and the tile sits on the spinner with no error and no way back.
      const clean = [];
      for (const v of cached.entries) {
        if (!v || typeof v !== 'object') continue;
        const cve = typeof v.cve === 'string' ? v.cve : '';
        const added = typeof v.added === 'string' ? v.added : '';
        if (!cve || !added) continue;
        clean.push({ vendor: String(v.vendor || ''), product: String(v.product || ''), cve, added,
          due: typeof v.due === 'string' ? v.due : '' });
      }
      // An EMPTY cached array is a real answer that was written by a successful poll —
      // saveCache runs nowhere else — so restoring it keeps the authoritative "no
      // entries" on screen instead of falling back to a spinner and then, if the next
      // request fails, to "Feed unavailable". A NON-empty array that validates to
      // nothing is the corrupt case, and only that one is dropped.
      if (cached.entries.length && !clean.length) return;
      entries = clean;
      fetchedAt = Number(cached.at) || 0;
      answered = true;
      // Known-overdue the moment it is read: the app may have been closed overnight, and
      // the refresh that will correct this has up to FETCH_DEADLINE to finish. Presenting
      // it as current for that window is the one claim the tile can already know is
      // wrong. A successful poll clears the mark.
      if (fetchedAt && Date.now() - fetchedAt >= cfg.refreshMs) document.body.classList.add('stale');
      render();
    } catch (e) {
      // A corrupt or evicted cache is not an error state — we are about to fetch. Drop
      // anything a partial read installed, so the fetch decides the tile's state alone.
      entries = [];
      fetchedAt = 0;
      answered = false;
      WW.log('kev: cache read failed: ' + e.message);
    }
  }

  function saveCache() {
    const write = (list) => localStorage.setItem(CACHE_KEY, JSON.stringify({ at: fetchedAt, entries: list }));
    try {
      write(entries);
    } catch (e) {
      // Almost certainly the quota. Fall back to the newest slice rather than leaving
      // the cache holding whatever it held before this poll.
      try {
        write(entries.slice(0, CACHE_MAX));
      } catch (e2) {
        WW.log('kev: cache write failed: ' + e2.message);
      }
    }
  }

  async function tick() {
    // Re-armed, NOT rescheduled. schedule() moves the anchor to now, so every wake while
    // the document was hidden pushed the deadline out by another whole interval — and the
    // visibility handler then saw a future deadline and declined to catch up, so a tile
    // could come back stale and stay that way for another full interval. arm() leaves the
    // anchor where it was, which keeps an overdue poll overdue; its hidden floor is what
    // stops an already-overdue deadline from spinning this function on a zero timer.
    if (document.hidden) { arm(); return; }
    if (inFlight) { schedule(); return; }
    inFlight = true;
    polled = true;   // an ATTEMPT, not a success: the hidden branch above returns first
    // Neither the connection nor the body read is bounded on its own. The shim puts a
    // deadline on the HOST proxy tier, but the direct browser fetch it tries first has
    // none, and reading the body has none either — so a connection that opens and then
    // stalls left inFlight true forever. The finally never ran, nothing was rescheduled,
    // and every later entry (a poll, a visibility change, a settings change) saw a
    // request still in flight and returned. The tile froze on whatever it was showing.
    const abort = new AbortController();
    const deadline = setTimeout(() => abort.abort(), FETCH_DEADLINE);
    try {
      // maxBytes lowers the ceiling for this call. The catalog is the one stock feed
      // big enough to approach it, and "too large" is a different sentence from
      // "unreachable" — only this widget knows which to paint.
      const res = await WW.fetch(FEED, { maxBytes: 5 * 1024 * 1024, signal: abort.signal });
      if (!res.ok) {
        // Cancelled before the throw. On the direct tier this is a live response whose
        // body the server may still be sending, and an error status is exactly when that
        // body is of no use — left unread it holds the transfer open, and every backed-off
        // retry would stack another one behind it.
        try { if (res.body && !res.bodyUsed) await res.body.cancel(); } catch (e) { /* already gone */ }
        throw new Error('HTTP ' + res.status);
      }
      let json;
      try {
        json = await res.json();
      } catch (e) {
        // A 200 that is not JSON at all — a captive portal, a maintenance page — is the
        // server answering, not the network failing. SyntaxError arrives before any of
        // the schema checks below could tag it, so it fell through to "couldn't reach
        // the feed" and sent the reader off to look at their connection.
        //
        // ONLY a parse failure, though. Reading the body is also where the 5 MiB ceiling
        // raises RangeError and where the deadline's abort surfaces, and tagging those as
        // schema problems stole the oversized-catalog message and blamed the catalog's
        // SHAPE for a body that never finished arriving. Anything that is not a syntax
        // error travels on untouched, so the outer handler can still tell them apart.
        if (!(e instanceof SyntaxError)) throw e;
        const bad = new Error('response was not JSON: ' + e.message);
        bad.schema = true;
        throw bad;
      }
      // A 2xx that is not the catalog is not an empty catalog. Coercing a missing or
      // non-array `vulnerabilities` to [] let a JSON error object — or a schema change at
      // the far end — overwrite the cache, clear the stale mark, and tell the reader that
      // CISA had listed nothing. An empty ARRAY is a legitimate answer and still reads as
      // one; anything else is a failure, and the last catalog stays up as stale.
      if (!json || !Array.isArray(json.vulnerabilities)) {
        const bad = new Error('response has no vulnerabilities array');
        bad.schema = true;
        throw bad;
      }
      const mapped = json.vulnerabilities
        .map((v) => ({
          vendor: String((v && v.vendorProject) || '').trim(),
          product: String((v && v.product) || '').trim(),
          cve: String((v && v.cveID) || '').trim(),
          added: String((v && v.dateAdded) || '').trim(),
          due: String((v && v.dueDate) || '').trim(),
        }))
        .filter((v) => v.cve && v.added)
        .sort((a, b) => (a.added < b.added ? 1 : a.added > b.added ? -1 : 0));
      // Checking the array's TYPE was not enough. A catalog that still arrives as an
      // array of objects, with cveID or dateAdded renamed, maps and filters down to
      // nothing — and that discarded the last good cache, cleared the backoff, and told
      // the reader CISA had listed no vulnerabilities. Entries that went in and no
      // entries that came out is a schema failure; only a genuinely empty array is an
      // empty catalog.
      if (json.vulnerabilities.length && !mapped.length) {
        const bad = new Error('no entry in the response had a cveID and a dateAdded');
        bad.schema = true;
        throw bad;
      }
      entries = mapped;
      fetchedAt = Date.now();
      answered = true;
      failures = 0;
      saveCache();
      document.body.classList.remove('stale');
      render();
    } catch (e) {
      // Keep whatever we have on screen and mark it stale; only a cold start with no
      // answer at all is a hard error worth taking the tile over.
      //
      // ANSWERED, not entries.length. A catalog that legitimately came back empty is an
      // answer — the tile should go on saying so, dimmed — but testing for rows treated
      // it as nothing to lose and replaced it with "Feed unavailable", which is a
      // different and less true claim. Restoring that empty answer from the cache was
      // only half the fix; this is the other half.
      failures++;
      if (answered) {
        document.body.classList.add('stale');
        render();
      } else {
        showError(e instanceof RangeError ? 'The catalog is larger than the panel will load.'
          // "Couldn't reach it" would be a lie about a server that answered promptly with
          // something else, and it sends the reader to check their network.
          : e && e.schema ? "The feed answered, but it wasn't the KEV catalog."
          : "Couldn't reach the CISA feed.");
      }
      WW.log('kev: ' + e.message);
    } finally {
      clearTimeout(deadline);
      inFlight = false;
      schedule();
    }
  }

  // The interval the user chose, stretched while the feed keeps failing. A dead endpoint
  // at the 15-minute minimum is 96 requests a day from every instance that has this tile
  // on a page, and the expensive failure is the one where the catalog outgrows the 5 MiB
  // ceiling: those bytes cross the wire before the fetch is refused, every time. Doubling
  // per consecutive failure to a ceiling of eight intervals lets a blip recover on the
  // next poll while a lasting outage goes quiet. A success or the Retry button clears it.
  function pollDelay() {
    return cfg.refreshMs * Math.pow(2, Math.min(failures, 3));
  }

  // schedule() begins a new waiting period; arm() re-points the timeout at the same
  // period, so a settings change is measured against the time already served.
  function schedule() {
    pollAnchor = Date.now();
    arm();
  }

  function arm() {
    clearTimeout(timer);
    // The floor applies only while hidden, where tick() returns without polling: without
    // it an overdue deadline would re-enter on a zero timer forever. Browsers throttle
    // hidden-document timers to about once a minute anyway, so it costs nothing.
    const floor = document.hidden ? HIDDEN_RECHECK : 0;
    timer = setTimeout(tick, Math.max(floor, pollAnchor + pollDelay() - Date.now()));
  }

  // The count is "added in the last N days", measured against the clock rather than
  // against the feed, so it goes stale on its own with nothing arriving to correct it.
  // At the 1440-minute maximum an entry can cross the cutoff a minute after a poll and
  // stay counted for nearly another day. Every entry leaves the window at exactly
  // dateAdded + N days, so this re-renders at the earliest of those — clamped, because
  // setTimeout truncates its delay to 32 bits and a 30-day window overflows that, which
  // fires immediately and spins.
  function scheduleBoundary() {
    clearTimeout(boundaryTimer);
    if (!entries.length) return;
    const span = cfg.windowDays * 86400000;
    const now = Date.now();
    let soonest = Infinity;
    for (const v of entries) {
      const leaves = Date.parse(v.added) + span;
      if (Number.isFinite(leaves) && leaves > now && leaves < soonest) soonest = leaves;
    }
    const CLAMP = 6 * 3600000;
    const delay = soonest === Infinity ? CLAMP : Math.min(soonest - now, CLAMP);
    boundaryTimer = setTimeout(render, Math.max(1000, delay));
  }

  function matches(entry) {
    if (!cfg.watch.length) return true;
    const hay = (entry.vendor + ' ' + entry.product + ' ' + entry.cve).toLowerCase();
    return cfg.watch.some((term) => hay.includes(term));
  }

  /// Split the list into two columns when one cannot hold the rows (#163).
  ///
  /// Asked as a MEASUREMENT rather than as a row count. The tile's own arithmetic says
  /// ten rows fit a half slot — twelve at their 24px minimum plus the 4px gaps come to
  /// 332px against about 293px of list — but that arithmetic is a product of the row's
  /// min-height, the gap, the header, the count block and the footer, and any of those
  /// moving would leave a hardcoded threshold quietly wrong in whichever direction it
  /// was not updated. The browser already knows whether the rows fit; ask it.
  ///
  /// The class comes OFF before measuring, so a widget that no longer needs two columns
  /// goes back to one — otherwise the first crowded render would pin the layout there
  /// for the life of the document, including after maxItems is lowered.
  function fitRows(list) {
    list.classList.remove('two-col');
    // scrollHeight past clientHeight is exactly "overflow: hidden is cutting something
    // off". The 1px slack keeps sub-pixel row heights from asking for a second column
    // the reader does not need.
    if (list.scrollHeight > list.clientHeight + 1) list.classList.add('two-col');
  }

  function render() {
    // First, because it depends on the catalog and the window rather than on anything
    // painted below, and because two of render()'s exits are early returns.
    scheduleBoundary();
    // Nothing has been asked yet — onInit calls render() before loadCache() and tick().
    // Painting "the feed listed no vulnerabilities" here claimed an answer that had not
    // been requested, and on a slow feed it stayed on screen until the request finished.
    if (!entries.length && !answered) return;
    if (!entries.length) {
      // A successful response with an empty (or renamed) vulnerabilities array is not
      // "still loading" — returning here left the initial spinner up forever, which is
      // the one state that can never resolve on its own.
      el('state').hidden = false;
      el('data').hidden = true;
      const st = el('state');
      st.className = 'state-card';
      st.textContent = '';
      const icon = document.createElement('div');
      icon.className = 'state-icon';
      icon.textContent = '○';
      const title = document.createElement('div');
      title.className = 'state-title';
      title.textContent = 'No entries';
      const body = document.createElement('div');
      body.className = 'state-body';
      body.textContent = 'The CISA feed answered but listed no vulnerabilities.';
      st.append(icon, title, body);
      const pill = el('pill');
      // Still the last real answer, but say when it stopped being refreshed.
      // Explicitly shown: a healthy render may have hidden it (#205).
      pill.hidden = false;
      pill.textContent = document.body.classList.contains('stale') ? 'Stale' : 'Empty';
      pill.className = 'pill muted';
      // The annotation counts rows the state card just replaced — hide it with them.
      el('ann').hidden = true;
      // The footer describes THIS answer. Returning before the metadata line left the
      // previous catalog's update time — and its watched count — under an empty-state
      // card that had replaced the very data those numbers were counting.
      el('meta').textContent = fetchedAt
        ? 'updated ' + new Date(fetchedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })
        : '';
      return;
    }
    const shown = entries.filter(matches);
    const cutoff = Date.now() - cfg.windowDays * 86400000;
    // dateAdded is a plain YYYY-MM-DD; Date.parse reads it as UTC midnight, which is
    // what we want for a day-granularity window.
    const recent = shown.filter((v) => {
      const t = Date.parse(v.added);
      return Number.isFinite(t) && t >= cutoff;
    });

    el('n').textContent = String(recent.length);
    const windowText = 'added in ' + cfg.windowDays + (cfg.windowDays === 1 ? ' day' : ' days');
    el('window').textContent = windowText;
    el('annN').textContent = String(recent.length);
    el('annWindow').textContent = windowText;
    el('ann').hidden = false;

    const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const fmtDue = (iso) => {
      const t = Date.parse(iso);
      if (!Number.isFinite(t)) return '';
      const d = new Date(t);
      return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
    };
    // "Close" in remediation terms: due within four days (or overdue) carries the amber.
    const URGENT_MS = 4 * 86400000;
    const now = Date.now();

    const list = el('list');
    list.textContent = '';
    const visible = shown.slice(0, cfg.maxItems);
    for (const v of visible) {
      const row = document.createElement('div');
      const dueT = Date.parse(v.due);
      const urgent = Number.isFinite(dueT) && dueT - now <= URGENT_MS;
      row.className = 'row' + (urgent ? ' urgent' : '');
      const dm = document.createElement('i');
      dm.className = 'dm';
      const cve = document.createElement('span');
      cve.className = 'cve';
      cve.textContent = v.cve;
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = v.product ? v.vendor + ' · ' + v.product : v.vendor || '';
      const due = document.createElement('span');
      due.className = 'due';
      due.textContent = v.due ? 'due ' + fmtDue(v.due) : v.added.slice(5);
      row.append(dm, cve, who, due);
      list.appendChild(row);
    }

    // The due-date timeline: today out to the furthest visible deadline, one hollow
    // diamond per due date, the urgent ones amber. Without parseable dates the ruler
    // stays hidden and the tile is what it always was.
    const scale = el('dueScale');
    const dues = visible.map((v) => Date.parse(v.due)).filter((t) => Number.isFinite(t) && t > now);
    if (dues.length) {
      const max = Math.max(...dues);
      const span = Math.max(max - now, 86400000);
      el('dueL').textContent = fmtDue(new Date(now).toISOString().slice(0, 10));
      el('dueR').textContent = fmtDue(new Date(max).toISOString().slice(0, 10));
      const marks = el('dueMarks');
      marks.textContent = '';
      for (const t of dues) {
        const mk = document.createElement('div');
        const urgent = t - now <= URGENT_MS;
        mk.className = 'mk' + (urgent ? ' alert' : '');
        mk.style.left = Math.min(100, Math.max(0, (t - now) / span * 100)).toFixed(1) + '%';
        const i = document.createElement('i');
        mk.appendChild(i);
        if (urgent) {
          const b = document.createElement('b');
          b.textContent = String(new Date(t).getUTCDate()).padStart(2, '0');
          mk.appendChild(b);
        }
        marks.appendChild(mk);
      }
      scale.classList.add('has-dues');
    } else {
      scale.classList.remove('has-dues');
    }

    const stale = document.body.classList.contains('stale');
    const pill = el('pill');
    // 'Quiet' was the state this tile is in almost all of the time, so it was a permanent
    // badge saying nothing. Hidden while quiet; the pill's appearance now IS the news.
    pill.hidden = !stale && !recent.length;
    pill.textContent = stale ? 'Stale' : 'New';
    pill.className = 'pill ' + (stale ? 'muted' : 'warn');

    el('meta').textContent = (cfg.watch.length ? shown.length + ' of ' + entries.length + ' watched · ' : '') +
      (fetchedAt ? 'updated ' + new Date(fetchedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '');

    el('state').hidden = true;
    el('data').hidden = false;
    // AFTER the data pane is shown, not with the rows that produced it: a hidden
    // ancestor has no layout, so measuring there reports 0 against 0 and the list never
    // asks for the second column it needs.
    fitRows(list);
  }

  function showError(message) {
    // The pill is the header's one-word summary, and it starts at Loading. Leaving it
    // there meant a tile could show "Feed unavailable" and a Retry button while still
    // claiming to be loading — indefinitely, since nothing else writes the pill on a
    // cold start that never succeeds.
    const pill = el('pill');
    // Explicitly shown: a healthy render may have hidden it (#205).
    pill.hidden = false;
    pill.textContent = 'Error';
    pill.className = 'pill err';
    // No data pane, no count to annotate.
    el('ann').hidden = true;
    const state = el('state');
    state.className = 'state-card err';
    state.textContent = '';
    const icon = document.createElement('div');
    icon.className = 'state-icon';
    icon.textContent = '!';
    const title = document.createElement('div');
    title.className = 'state-title';
    title.textContent = 'Feed unavailable';
    const body = document.createElement('div');
    body.className = 'state-body';
    body.textContent = message;
    const retry = document.createElement('button');
    retry.className = 'btn';
    retry.textContent = 'Retry';
    retry.addEventListener('click', () => {
      clearTimeout(timer);
      // An explicit Retry is a person saying the outage is over, so it clears the
      // backoff as a success would: the next automatic poll goes back to the chosen
      // interval instead of inheriting a stretch this attempt was meant to end.
      failures = 0;
      // The poll is now DUE, and saying so is what makes the retry survive a hidden
      // document (#164). tick() returns early while the page is hidden, having only
      // re-armed the EXISTING deadline — still an untouched interval from the last
      // attempt, and at refreshMinutes 1440 that is a day. An anchor of 0 is overdue by
      // definition, and arm() and the visibility handler read the same expression, so
      // both find this retry waiting instead of only the path that happened to set it.
      pollAnchor = 0;
      state.className = 'state-card';
      state.textContent = '';
      const sp = document.createElement('div');
      sp.className = 'spinner';
      state.appendChild(sp);
      // ...and back to Loading, because that is what pressing Retry starts.
      const p = el('pill');
      p.textContent = 'Loading';
      p.className = 'pill muted';
      tick();
    });
    state.append(icon, title, body, retry);
    state.hidden = false;
    el('data').hidden = true;
  }

  // Geometry can change with no render behind it. The on-panel editor resizes a slot's
  // iframe in place without sending another init, and moving the panel to a display of a
  // different resolution resizes every frame at once — in both cases the choice between
  // one column and two was made against a box that no longer exists. Nothing else would
  // correct it until the next poll, which at the 1440-minute maximum is a day away: a
  // tile grown out of a crowded slot would keep two columns it no longer needs, and one
  // shrunk into a smaller slot would go back to clipping the rows this exists to save.
  // Debounced because resize fires continuously through an editor drag; re-fitting is a
  // class toggle and a layout read, so once per settle costs nothing.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // Only while the data pane is up. Measuring behind the spinner or the error card
      // reads zero against zero — the same mistake that made the first version of this
      // render identically to the bug — and render() re-fits anyway when data returns.
      if (!el('data').hidden) fitRows(el('list'));
    }, 150);
  });

  // Browsers throttle timers in hidden documents; cooperate rather than fight it, and
  // catch up the moment the page comes back.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !started || inFlight) return;
    // Measured against the deadline the chain is actually waiting on. The old test used
    // the last SUCCESSFUL fetch and the unstretched interval, so once a feed had been
    // failing for one interval, every return to this page fired another request — paging
    // away and back walked straight past the backoff, which is exactly the situation the
    // backoff exists for.
    // A widget that has never polled is overdue by definition. tick() returns early
    // while the document is hidden, having armed the timer without asking for anything —
    // so a tile that initialised on a hidden page has an anchor but no data, and the
    // deadline test alone leaves it on the spinner for the whole interval, up to a day.
    // (The previous test read fetchedAt, which is 0 on a cold start and so happened to
    // cover this; measuring against the anchor is what dropped it.)
    if (!polled || Date.now() >= pollAnchor + pollDelay()) { clearTimeout(timer); tick(); }
  });
</script>
</body>
</html>
