<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Countdown</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and the typography base
   * come from widget-base.css. Designed for quarter (320px) first.
   * No header: the event's title is the first line of the body, at a size you can read
   * across the room, and the value under it. Type is its size on a 320x200 band times
   * the tile scale (--ts), so a bigger tile reads bigger. */
  body {
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 4vh, 18px) clamp(12px, 5%, 28px) clamp(10px, 4.5vh, 20px);
    gap: calc(1px * var(--ts));
  }
  main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(3px * var(--ts));
  }
  /* The user's own name for the moment: data, so it reads as text rather than as an
   * uppercase label. Two lines before it gives up with an ellipsis. */
  #title {
    color: var(--text);
    font-size: calc(14px * var(--ts));
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow-wrap: anywhere;
  }
  /* The one exception to "the size at the smallest tile": a 200px band held this at 16vh
   * (32px) and a 400px tile at 64px, so 32px times the scale would SHRINK the tall tiles
   * the countdown is mostly shown on. 44px is the size that keeps them where they were
   * and gives the bands the room they always had. 21vw is a guard for a count with a
   * four-digit day number in a quarter-width tile. */
  #value {
    color: var(--text);
    font-size: min(calc(44px * var(--ts)), 21vw);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #value.reached { font-size: calc(30px * var(--ts)); font-weight: 500; white-space: normal; text-align: center; }
  #value .u { font-size: 48%; font-weight: 500; color: var(--text-muted); }
  #value .gap { display: inline-block; width: 0.28em; }
  #sub {
    color: var(--text-muted);
    font-size: calc(12px * var(--ts));
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  /* Subtle progress from when the countdown was configured to the target. */
  .meter { width: min(100%, 420px); margin: 0 auto; }
  /* State layer covers the whole tile; it paints the surface at the effective
   * panel opacity so it matches the tile's bgStyle (like the stock weather). */
  #state {
    position: fixed; inset: 0;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
  }
</style>
</head>
<body>
  <main id="main" hidden>
    <div id="title" hidden></div>
    <div class="value" id="value">--</div>
    <div id="sub"></div>
  </main>
  <footer id="footer" hidden>
    <div class="meter" id="meter"><i id="meterFill" style="width: 0%"></i></div>
  </footer>
  <div class="state-card" id="state">
    <div class="spinner" id="stateSpinner"></div>
    <div class="state-icon" id="stateIcon" hidden></div>
    <div class="state-title" id="stateTitle" hidden></div>
    <div class="state-body" id="stateBody" hidden></div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const $ = (id) => document.getElementById(id);

  // Rebuilt on every ww-init (settings edits arrive as re-inits).
  const cfg = { title: '', raw: '', targetMs: null, startMs: null, state: 'empty' };
  let started = false;   // the 1 Hz loop starts once; later inits just reconfigure
  const last = {};       // last written DOM strings — skip no-op writes

  // Lenient "ISO-ish" parser (local time). Accepts, with -, / or . separators:
  //   2026-12-24 18:00[:ss]   2026-12-24T18:00   2026/12/24   (year first)
  //   24.12.2026 18:00        24/12/2026                      (day first)
  // and falls back to Date.parse for the rest ("Dec 24 2026 18:00").
  // Returns ms since epoch, or null when the string isn't a date.
  function parseTarget(raw) {
    const t = String(raw == null ? '' : raw).trim()
      .replace(/(\d)T(\d)/, '$1 $2').replace(/,/g, ' ').replace(/\s+/g, ' ');
    if (!t) return null;
    let y, mo, d;
    let m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})( (\d{1,2}):(\d{2})(:(\d{2}))?)?$/);
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else {
      m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})( (\d{1,2}):(\d{2})(:(\d{2}))?)?$/);
      if (m) { d = +m[1]; mo = +m[2]; y = +m[3]; }
    }
    if (m) {
      const h = m[5] ? +m[5] : 0, mi = m[6] ? +m[6] : 0, s = m[8] ? +m[8] : 0;
      const date = new Date(y, mo - 1, d, h, mi, s);
      // Round-trip guard: Date() silently rolls out-of-range fields over.
      if (date.getFullYear() === y && date.getMonth() === mo - 1 && date.getDate() === d &&
          h < 24 && mi < 60 && s < 60) return date.getTime();
      return null;
    }
    const parsed = Date.parse(t);
    return Number.isNaN(parsed) ? null : parsed;
  }

  // The meter runs from "when this countdown was configured": the first time this
  // instance sees a given target string it records now as the origin. localStorage
  // is per-ORIGIN and all countdown instances share one virtual host, so the key
  // carries the per-instance slot tag — two tiles counting to the same moment keep
  // independent origins, and a recreated tile starts fresh.
  const INSTANCE = (location.hash.match(/ww-slot=([\w-]+)/) || [])[1] || 'solo';
  function origin(raw) {
    const key = 'ww.countdown.origin:' + INSTANCE + ':' + raw;
    try {
      const stored = Number(localStorage.getItem(key));
      if (Number.isFinite(stored) && stored > 0 && stored <= Date.now()) return stored;
    } catch (e) { /* storage unavailable or bad entry — rewrite below */ }
    const now = Date.now();
    try { localStorage.setItem(key, String(now)); } catch (e) { /* best effort */ }
    return now;
  }

  function showState(kind, title, body) {
    const st = $('state');
    st.hidden = false;
    st.classList.toggle('err', kind === 'error');
    $('stateSpinner').hidden = kind !== 'loading';
    $('stateIcon').hidden = kind === 'loading';
    $('stateTitle').hidden = kind === 'loading';
    $('stateBody').hidden = kind === 'loading' || !body;
    $('stateIcon').textContent = kind === 'error' ? '!' : '⏳';
    $('stateTitle').textContent = title || '';
    $('stateBody').textContent = body || '';
    $('main').hidden = true;
    $('footer').hidden = true;
  }

  function showMain() {
    $('state').hidden = true;
    $('main').hidden = false;
    $('footer').hidden = false;
  }

  WW.onInit((state) => {
    const s = state.settings;

    // No title, no title line: the tile does not name itself, and the value gets the room.
    cfg.title = String(s.title == null ? '' : s.title).trim();
    cfg.raw = String(s.target == null ? '' : s.target).trim();
    cfg.targetMs = parseTarget(cfg.raw);
    cfg.state = !cfg.raw ? 'empty' : cfg.targetMs == null ? 'error' : 'run';
    cfg.startMs = cfg.state === 'run' ? origin(cfg.raw) : null;
    $('title').textContent = cfg.title;
    $('title').hidden = !cfg.title;
    for (const k of Object.keys(last)) delete last[k];  // repaint with new config

    if (cfg.state === 'empty') {
      showState('empty', 'Set a countdown',
        'Pick a target date and time in the widget settings — for example 2026-12-24 18:00.');
    } else if (cfg.state === 'error') {
      showState('error', 'Can’t read the target date',
        '“' + cfg.raw.slice(0, 60) + '” is not a date. Try a format like 2026-12-24 18:00.');
    } else {
      showMain();
      render();
    }

    if (!started) {  // repeated ww-init must not stack timers
      started = true;
      setInterval(tick, 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    }
  });

  // 24/7 rules: skip work while hidden (visibilitychange refreshes on return),
  // and never let one bad render kill the interval.
  function tick() {
    if (document.hidden || cfg.state !== 'run') return;
    try { render(); } catch (e) { WW.log('countdown render failed: ' + e.message); }
  }

  const pad2 = (n) => String(n).padStart(2, '0');

  // Biggest readable unit pair: "12d 4h", then "3h 05m", then "4m 09s".
  function pairFor(totalSeconds) {
    const d = Math.floor(totalSeconds / 86400);
    const h = Math.floor((totalSeconds % 86400) / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if (d > 0) return [[String(d), 'd'], [String(h), 'h']];
    if (h > 0) return [[String(h), 'h'], [pad2(m), 'm']];
    return [[String(m), 'm'], [pad2(s), 's']];
  }

  // Count-up after the moment: single biggest unit.
  function agoFor(totalSeconds) {
    if (totalSeconds < 60) return 'just now';
    if (totalSeconds < 3600) return Math.floor(totalSeconds / 60) + 'm ago';
    if (totalSeconds < 86400) return Math.floor(totalSeconds / 3600) + 'h ago';
    return Math.floor(totalSeconds / 86400) + 'd ago';
  }

  function put(id, text) {  // write-if-changed guard: unchanged nodes aren't rebuilt
    if (last[id] === text) return false;
    last[id] = text;
    return true;
  }

  function setPair(pair) {
    if (!put('value', pair.map((p) => p.join('')).join(' '))) return;
    const v = $('value');
    v.classList.remove('reached');
    v.textContent = '';
    pair.forEach(([num, unit], i) => {
      if (i) {
        const g = document.createElement('span');
        g.className = 'gap';
        v.appendChild(g);
      }
      v.appendChild(document.createTextNode(num));
      const u = document.createElement('span');
      u.className = 'u';
      u.textContent = unit;
      v.appendChild(u);
    });
  }

  function setSub(text) {
    if (put('sub', text)) $('sub').textContent = text;
  }

  function fmtTarget(ms) {
    const dt = new Date(ms);
    const opts = { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
    if (dt.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return dt.toLocaleString([], opts);
  }

  function render() {
    const now = Date.now();
    const diff = cfg.targetMs - now;

    if (diff <= 0) {
      // Reached: celebrate, then count up from the moment.
      if (put('value', 'reached')) {
        const v = $('value');
        v.classList.add('reached');
        v.textContent = '🎉 It’s time!';
      }
      setSub(agoFor(Math.floor(-diff / 1000)));
      $('meter').classList.add('ok');
      if (put('meter', '100')) $('meterFill').style.width = '100%';
      return;
    }

    setPair(pairFor(Math.ceil(diff / 1000)));
    // The corner pill that repeated the target's date (or "Today", or "Done") is gone:
    // this line already says when, and the value how long.
    setSub('until ' + fmtTarget(cfg.targetMs));

    // Progress from when this target was configured; 0.1% steps keep DOM writes rare.
    const span = cfg.targetMs - cfg.startMs;
    const pct = span <= 0 ? 100 : Math.min(100, Math.max(0, ((now - cfg.startMs) / span) * 100));
    $('meter').classList.remove('ok');
    const pctText = pct.toFixed(1);
    if (put('meter', pctText)) $('meterFill').style.width = pctText + '%';
  }
</script>
</body>
</html>
