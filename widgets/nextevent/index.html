<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Next Event</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, bgStyle and the typography base come from
   * widget-base.css. */
  body { display: flex; flex-direction: column; gap: 6px; padding: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  main { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 0; }
  #countdown {
    line-height: 1;
    font-size: min(20vw, 15vh);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #countdown.soon { color: var(--warn); }
  #countdown.now { color: var(--ok); }
  #title {
    color: var(--text); font-weight: 600;
    font-size: clamp(13px, 4.5vh, 20px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #when {
    color: var(--text-muted); font-size: clamp(11px, 3vh, 14px);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #where {
    color: var(--text-dim); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  footer { color: var(--text-dim); font-size: 11px; flex: none; }
  #state { position: fixed; inset: 0; }
  body.stale main { opacity: 0.6; }
</style>
</head>
<body>
  <header class="hd">
    <span class="kicker">Next</span>
    <span class="pill muted" id="pill">Loading</span>
  </header>

  <main id="data" hidden>
    <div class="value hero" id="countdown">--</div>
    <div id="title"></div>
    <div id="when"></div>
    <div id="where"></div>
  </main>

  <footer id="meta"></footer>

  <div class="state-card" id="state">
    <div class="spinner"></div>
  </div>

<script src="ics.js"></script>
<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { url: '', lookaheadDays: 30, ignoreAllDay: false, refreshMs: 1800000 };
  let current = null;      // {event, start}
  let dropped = 0;
  // How many of `dropped` were refused because a TIME could not be read rather than
  // because a RECURRENCE could not be expanded. One sentence cannot describe both, and
  // the recurrence wording is actively wrong about a one-off with an unreadable zone.
  let unreadable = 0;
  let started = false;
  let fetchTimer = null;
  let tickTimer = null;
  let inFlight = false;
  let lastOk = 0;
  let lastTry = 0;         // when the last fetch was ATTEMPTED (success or not) — the anchor
                           // the backoff is measured from, so a cadence edit during a backoff
                           // re-arms from the failed attempt rather than the last success (#180)
  let failures = 0;        // consecutive failures — drives the retry backoff
  let generation = 0;      // bumped when the source changes; older answers are discarded
  let activeController = null;
  let dueAt = 0;           // when the next fetch is due, tracked even while paused
  let errorShowing = false; // an error card is on screen; the 1 Hz paint() must not replace it
                            // with "Nothing scheduled" when the calendar is empty-but-down (#180)

  // A calendar can be several megabytes and the direct fetch tier has no deadline of its
  // own, so a server that accepts the connection and then stalls would pin `inFlight`
  // forever: no error, no retry, a countdown frozen at whatever it last read. 20s is well
  // clear of a large ICS over a slow link and well short of the 5-minute minimum refresh.
  const REQUEST_DEADLINE = 20000;
  const MAX_EXTRA_WAIT = 3600000;   // the backoff ceiling bounds the EXTRA wait, never the total

  const el = (id) => document.getElementById(id);

  // One predicate, used by every gate. Two copies of this rule drift, and the shape of
  // the drift is always a tile that keeps polling in a state it was supposed to stop in.
  const paused = () => document.hidden;

  /** Runs `job` under an abort deadline that covers the BODY too. A resolved WW.fetch
   *  only means the headers arrived; a calendar that then dribbles its body would hang
   *  on res.text() with no timer left running — the same permanent freeze, moved one
   *  await later. */
  function withDeadline(ms, controller, job) {
    let t;
    return Promise.race([
      job().finally(() => clearTimeout(t)),
      new Promise((_, reject) => {
        t = setTimeout(() => {
          try { controller.abort(); } catch (e) { /* already gone */ }
          reject(new Error('timed out'));
        }, ms);
      }),
    ]);
  }

  WW.onInit((s0) => {
    const s = s0.settings;

    const prevSource = cfg.url + '\n' + cfg.lookaheadDays + '\n' + cfg.ignoreAllDay;
    const prevRefreshMs = cfg.refreshMs;
    // An unset or unreadable secret arrives as "" — setup state, never a spinner.
    cfg.url = String(s.icsUrl == null ? '' : s.icsUrl).trim();
    cfg.lookaheadDays = Math.min(90, Math.max(1, Number(s.lookaheadDays) || 30));
    cfg.ignoreAllDay = s.ignoreAllDay === 'ignore';
    cfg.refreshMs = Math.min(720, Math.max(5, Number(s.refreshMinutes) || 30)) * 60000;
    const sourceChanged = prevSource !== cfg.url + '\n' + cfg.lookaheadDays + '\n' + cfg.ignoreAllDay;
    // The refresh interval is NOT part of the source — changing it must not refetch or
    // throw the reading away — but it does have to re-arm, because the timer already
    // ticking was armed under the old one. Cutting 12 hours to 5 minutes otherwise took
    // effect only after the 12 hours it was meant to replace had elapsed.
    const cadenceChanged = prevRefreshMs !== cfg.refreshMs;

    if (!cfg.url) {
      // Stop everything. Without this the chain keeps running against an empty URL,
      // which resolves to the widget's OWN document, parses as a calendar with no
      // events, and replaces the setup card with "Nothing scheduled".
      generation++;
      if (activeController) { try { activeController.abort(); } catch (e) { /* already gone */ } }
      activeController = null;
      inFlight = false;
      clearTimeout(fetchTimer);
      clearInterval(tickTimer);
      tickTimer = null;
      current = null;
      lastOk = 0;
      lastTry = 0;
      failures = 0;
      started = false;
      showSetup();
      return;
    }
    if (!started) {
      started = true;
      load();
      // The countdown is its own 1 Hz loop; refetching the calendar every second to
      // move a clock would be absurd, and a minute-granularity countdown that jumps
      // 60 seconds at a time reads as broken.
      startTick();
    } else if (sourceChanged) {
      // A DIFFERENT calendar. Retire anything still in flight against the old one —
      // otherwise its answer lands afterwards and is rendered as this calendar's next
      // event — and drop the reading, which describes a calendar this tile no longer
      // points at.
      generation++;
      if (activeController) { try { activeController.abort(); } catch (e) { /* already gone */ } }
      activeController = null;
      inFlight = false;
      current = null;
      lastOk = 0;
      failures = 0;
      // A source change means the next fetch is due NOW, paused or not. Without this,
      // `dueAt` keeps the deadline computed for the PREVIOUS calendar: while hidden or
      // gated, load() returns at the pause gate, and the resume path — "is it due?" —
      // is told no and re-arms that stale deadline, so the newly configured calendar is
      // not fetched for up to the old interval (12 hours at the cap). (#180)
      dueAt = 0;
      // ...and drop the attempt anchor with the rest of the source-specific state. It points
      // at the OLD calendar, and a cadence-only edit arriving while STILL paused would re-derive
      // `dueAt` from it — undoing the reset above and stranding the new calendar on its spinner
      // past resume. `lastTry === 0` now means "this source has not been fetched", which the
      // cadence recompute reads as due-now. (#180 review)
      lastTry = 0;
      errorShowing = false;
      document.body.classList.remove('stale');
      // Clear what is on SCREEN, not just the model behind it. Nulling `current` alone
      // left the old calendar's event rendered — under the new configuration, and for as
      // long as the new request takes, which is up to the full deadline. A tile showing
      // one calendar's meeting while labelled with another's settings is worse than a
      // spinner, because nothing about it looks wrong.
      showSpinner();
      clearTimeout(fetchTimer);
      load();
    } else {
      // Same calendar — a theme push, a rename, a background change. Re-fetching here
      // meant every settings keystroke and every theme broadcast hit the calendar
      // server, and reset the refresh anchor so the real refresh never arrived. Repaint
      // from what is already held instead; the countdown is time-relative, so this is
      // a recompute rather than a replay of formatted text.
      paint();
      // Recompute from the NEW cadence, not from what is left of the old one.
      // `remainingWait()` reads `dueAt`, which still holds the deadline the previous
      // interval produced — so re-arming with it just restored the same deadline and
      // cutting 12 hours to 5 minutes still took 12 hours. The due time belongs to the
      // last ATTEMPT plus the interval now configured; if that is already past, it is due.
      // Anchoring on `lastOk` (the last SUCCESS) discarded the backoff on a calendar that
      // is down: while failing, `lastOk` predates the failed attempt, so the sum lands in
      // the past and the edit fired an immediate retry — the one situation the backoff
      // exists for. `lastTry` is the attempt the current `nextDelayMs()` backoff is
      // measured from, so the two agree. (#180)
      // A source not yet attempted (lastTry 0 — e.g. changed while paused) is due NOW, not a
      // fresh interval out: recomputing from `Date.now()` there would push a pending fetch up
      // to a full interval away and strand the calendar past resume.
      if (cadenceChanged) {
        schedule(lastTry ? Math.max(0, lastTry + nextDelayMs() - Date.now()) : 0);
      }
    }
  });

  function startTick() {
    clearInterval(tickTimer);
    tickTimer = setInterval(paint, 1000);
  }

  async function load() {
    // A load that comes due while paused stays due. Calling schedule() here would push
    // `dueAt` a whole fresh interval into the future, and the resume path — which asks
    // exactly that question — would then decline to fetch: at the 12-hour cadence a tile
    // could sit on stale data for another 12 hours after the panel came back. Leaving
    // `dueAt` in the past is what makes the resume path pick it up immediately.
    if (paused()) return;
    // Already fetching is different: something IS in progress, so re-arming normally is
    // right rather than leaving the chain unarmed.
    if (inFlight) { schedule(); return; }
    inFlight = true;
    // The last ATTEMPT, stamped past the pause/in-flight gates so it counts only real
    // fetches — the anchor the backoff and a mid-backoff cadence edit both measure from.
    lastTry = Date.now();
    // Everything below belongs to the calendar as it was when the request left.
    const gen = generation;
    const superseded = () => gen !== generation;
    const controller = new AbortController();
    activeController = controller;
    try {
      const text = await withDeadline(REQUEST_DEADLINE, controller, async () => {
        const res = await WW.fetch(cfg.url, { maxBytes: 4 * 1024 * 1024, signal: controller.signal });
        if (!res.ok) {
          // An unread body leaves the response open, and a server that answers with
          // error headers and then dribbles accumulates one live stream per refresh.
          try { if (res.body && !res.body.locked) await res.body.cancel(); } catch (e) { /* already gone */ }
          const err = new Error('HTTP ' + res.status);
          err.status = res.status;
          throw err;
        }
        return res.text();
      });
      if (superseded()) return;
      // Is this a CALENDAR? The reader is tolerant by design — it looks for VEVENTs and
      // ignores everything else — so an expired share link answering with a sign-in page,
      // or a captive portal, parses as a calendar containing no events. Without this the
      // tile would state "Nothing scheduled" about a calendar it never actually read,
      // which is the one wrong answer worse than an error card.
      if (!/BEGIN:VCALENDAR/i.test(text)) {
        const err = new Error('not a calendar');
        err.notCalendar = true;
        throw err;
      }
      // From an hour AGO, not from now: paint() deliberately keeps an event on screen
      // for an hour after it starts, but asking only for future starts meant the next
      // refresh replaced it — so a meeting vanished one refresh after beginning rather
      // than at the end of the hour it was promised.
      // Two different windows, because two kinds of event stop being "next" at different
      // moments. A timed one is still the one you are in for an hour after it starts; an
      // all-day one is on for the whole of its day. `startOfDay` is what keeps today's
      // all-day event on the tile after 01:00 instead of skipping to tomorrow's.
      const found = ICS.next(text, Date.now() - 3600000, cfg.lookaheadDays * 86400000 + 3600000,
        { ignoreAllDay: cfg.ignoreAllDay, allDayFrom: startOfDay(Date.now()) });
      current = found.best;
      dropped = found.dropped;
      unreadable = found.unreadable || 0;
      lastOk = Date.now();
      failures = 0;
      errorShowing = false;   // authoritative data now — the error card, if any, is gone
      document.body.classList.remove('stale');
      paint();
    } catch (e) {
      // An abort we caused by retargeting is not a failure of anything, and the state it
      // would paint describes a calendar the user has already moved off.
      if (superseded()) return;
      failures++;
      WW.log('nextevent: ' + (e && e.message ? e.message : e));
      if (current) { document.body.classList.add('stale'); paint(); return; }
      // Three different problems with three different fixes. Collapsing them into
      // "check the link is still valid" sends someone to re-copy a link that is fine.
      if (e instanceof RangeError) {
        showError('That calendar is larger than the panel will load.');
      } else if (e && e.notCalendar) {
        showError('That link answered, but not with a calendar — it may have expired, '
          + 'or be asking for a sign-in. Re-copy the private ICS address from your calendar.');
      } else if (e && e.status) {
        showError(e.status === 401 || e.status === 403
          ? 'The calendar refused the link (HTTP ' + e.status + '). Private ICS addresses '
            + 'are revoked when you reset them — re-copy it from your calendar.'
          : 'The calendar answered with HTTP ' + e.status + '.');
      } else {
        showError("Couldn't reach the calendar. Check the link, and that this PC can reach it.");
      }
    } finally {
      // A superseded request must not clear the flag or re-arm: the re-init already did
      // both, and a late unwind would unlock a load that is legitimately in flight.
      if (!superseded()) {
        inFlight = false;
        if (activeController === controller) activeController = null;
        schedule();
      }
    }
  }

  /** Retry cadence. A calendar that is down should not be re-fetched on the dot for
   *  hours: each consecutive failure doubles the wait, and any success (or Retry) puts
   *  it straight back to the configured interval. */
  function nextDelayMs() {
    if (!failures) return cfg.refreshMs;
    // The ceiling bounds the EXTRA wait, never the total. Capping the total inverts the
    // whole point above the cap: a calendar set to refresh every 12 hours would answer
    // its first failure by switching to hourly — twelve times the traffic, from the code
    // meant to reduce it. Backoff can only ever slow this tile down.
    const grown = cfg.refreshMs * Math.pow(2, Math.min(failures, 5));
    return Math.min(grown, cfg.refreshMs + MAX_EXTRA_WAIT);
  }

  /** Arms the next fetch. `delayMs` is for resuming: a pause does not restart the
   *  refresh interval, it interrupts it, so an unhidden panel owes only the REMAINDER.
   *  Arming a fresh full interval there meant a 30-second hide could add a whole refresh
   *  period to how stale the tile is allowed to be. */
  function schedule(delayMs) {
    clearTimeout(fetchTimer);
    fetchTimer = null;
    const wait = delayMs === undefined ? nextDelayMs() : Math.max(0, delayMs);
    // WHEN the next fetch is due, recorded even while paused. The resume path used to
    // ask "how long since the last SUCCESS", which is a different question with a wrong
    // answer during backoff: after a failure `lastOk` is already older than the interval,
    // so every unhide fired an immediate retry and threw the backoff away — the one
    // situation the backoff exists for. A due time is the same quantity the arming side
    // records, so the two cannot disagree about it.
    dueAt = Date.now() + wait;
    // A paused tile arms nothing. The visibilitychange handler re-arms on the way back,
    // so this cannot strand the chain.
    if (paused() || !cfg.url) return;
    fetchTimer = setTimeout(load, wait);
  }

  /** What is still owed before the next fetch is due. */
  const remainingWait = () => Math.max(0, dueAt - Date.now());

  /** Local midnight of the day `ms` falls in. All-day events are anchored to it, so it
   *  is what "today" means for eligibility on this panel. */
  function startOfDay(ms) {
    const d = new Date(ms);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  /** The next local midnight after `ms`. Deliberately calendar arithmetic, not
   *  `startOfDay(ms) + 86400000`: a local day is only 86400000 ms long on days without a
   *  DST transition. On a fall-back day that sum lands at 23:00, an hour SHORT of the
   *  next midnight — and since the query window still offers the event, paint() would
   *  discard it and the next answer would offer it again, once a second, each time with
   *  a fetch. Advancing the date lets Date normalise the transition. */
  function nextMidnight(ms) {
    const d = new Date(ms);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 1);
    return d.getTime();
  }

  /** What to say about the events this reader would not show. Never nothing: a calendar
   *  that looks emptier than it is, with no way to tell, is the failure the counter
   *  exists to prevent. But "only daily and weekly repeats are read" is untrue of a
   *  ONE-OFF whose time zone could not be resolved — it sends someone to inspect a
   *  recurrence rule that does not exist — so the reason is worded from what was
   *  actually refused. */
  function droppedText() {
    if (!dropped) return '';
    const one = dropped === 1;
    const n = dropped + ' event' + (one ? '' : 's') + ' not shown';
    if (unreadable >= dropped) {
      return n + (one ? ' (its time zone could not be read)' : ' (their time zones could not be read)');
    }
    if (unreadable > 0) return n + ' (unsupported repeats, or time zones that could not be read)';
    return n + ' (only daily and weekly repeats are read)';
  }

  function countdownText(ms) {
    if (ms <= 0) return 'now';
    const mins = Math.floor(ms / 60000);
    // Under a minute, count SECONDS. Flooring to whole minutes meant an event 45 seconds
    // away read "0m" and a tile repainting every second changed once a minute — the 1 Hz
    // loop paying for a clock that could not show it. Seconds are also the only part of
    // this anyone watches: the last minute before a meeting is when the tile is being
    // looked at.
    if (mins < 1) return Math.floor(ms / 1000) + 's';
    if (mins < 60) return mins + 'm';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ' + String(mins % 60).padStart(2, '0') + 'm';
    const days = Math.floor(hours / 24);
    return days + 'd ' + (hours % 24) + 'h';
  }

  function whenText(start, allDay, allDayEnd) {
    const d = new Date(start);
    const today = new Date();
    // A multi-day all-day event that is ALREADY RUNNING is on today, whatever day it
    // began. Labelling it by its start date put a date in the past on a tile whose
    // countdown said "now" — which reads as a bug rather than as a conference that
    // started yesterday.
    const inProgress = !!(allDay && allDayEnd && Date.now() >= start && Date.now() < allDayEnd);
    const sameDay = inProgress || d.toDateString() === today.toDateString();
    const tomorrow = new Date(today.getTime() + 86400000).toDateString() === d.toDateString();
    const day = sameDay ? 'Today' : tomorrow ? 'Tomorrow'
      : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    if (allDay) return day + ' · all day';
    return day + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  // Repaints from cached data only — no network, no parsing. Safe at 1 Hz forever.
  function paint() {
    if (!current) {
      // An outage on an empty-but-valid calendar leaves `current` null while `lastOk`
      // stays set, so this branch would repaint "Nothing scheduled" over the error card
      // (and its Retry) at 1 Hz — the tile claiming Clear while the calendar is
      // unreachable. showError holds `errorShowing` until the next good load. `showStale`
      // is unaffected: it keeps `current`, so it never reaches this branch. (#180)
      if (errorShowing) return;
      if (lastOk) {
        el('state').hidden = false;
        el('data').hidden = true;
        stateCard('', '○', 'Nothing scheduled',
          'No events in the next ' + cfg.lookaheadDays + ' day' + (cfg.lookaheadDays === 1 ? '' : 's') + '.' +
          (dropped ? ' ' + droppedText() + '.' : ''),
          null, 'Clear');
        // The footer normally carries this, and the footer is hidden behind the state
        // card. A calendar containing ONLY unsupported repeats would otherwise claim
        // outright that nothing is scheduled, which is what the counter exists to stop.
        el('meta').textContent = '';
      }
      return;
    }
    const left = current.start - Date.now();
    // When this event stops being the next one, and it MUST agree with the window the
    // query used — a tile that discards an event the next query would pick again spins
    // between the two forever. A timed event is the one you are in for an hour after it
    // starts; an all-day event is on until its day ends.
    // A MULTI-DAY all-day event runs to its DTEND, not to the end of the day it started
    // on, and the reader hands that instant back as `allDayEnd` precisely so the two
    // cannot disagree. `nextMidnight` remains the answer for the single-day form and for
    // a reader that did not supply one.
    const expiry = current.event.start.allDay
      ? (current.allDayEnd || nextMidnight(current.start))
      : current.start + 3600000;
    if (Date.now() > expiry) { current = null; clearTimeout(fetchTimer); load(); return; }

    const cd = el('countdown');
    cd.textContent = countdownText(left);
    cd.className = 'value hero' + (left <= 0 ? ' now' : left < 900000 ? ' soon' : '');

    el('title').textContent = current.event.summary || '(no title)';
    el('when').textContent = whenText(current.start, current.event.start.allDay, current.allDayEnd);
    el('where').textContent = current.event.location || '';

    const stale = document.body.classList.contains('stale');
    const pill = el('pill');
    // 'Scheduled' said only what the event row below already says. Now and Soon are worth
    // a badge because they change how the reader treats the tile; sitting there with an
    // event some hours away is not.
    const imminent = left <= 0 ? 'Now' : left < 900000 ? 'Soon' : '';
    pill.hidden = !stale && !imminent;
    pill.textContent = stale ? 'Stale' : imminent;
    pill.className = 'pill ' + (stale ? 'muted' : left <= 0 ? 'ok' : 'warn');

    // Never silently drop events: a monthly repeat this reader refuses to expand is
    // said out loud, because the alternative is a calendar that looks emptier than it
    // is and no way to tell.
    el('meta').textContent = dropped
      ? droppedText()
      : '';

    el('state').hidden = true;
    el('data').hidden = false;
  }

  function stateCard(cls, icon, title, body, onRetry, pillText) {
    const pill = el('pill');
    // "Setup" is a claim that something still needs configuring, so it belongs only to
    // cards that mean it. A successfully refreshed calendar that simply has nothing in
    // it was labelled Setup beside "Nothing scheduled", telling the user to go and fix a
    // configuration that is already correct.
    // Explicitly shown: a healthy render may have hidden it (#205).
    pill.hidden = false;
    pill.textContent = pillText || (cls === 'err' ? 'Error' : 'Setup');
    pill.className = 'pill ' + (cls === 'err' ? 'err' : 'muted');
    const s = el('state');
    s.className = 'state-card' + (cls ? ' ' + cls : '');
    s.textContent = '';
    const i = document.createElement('div');
    i.className = 'state-icon';
    i.textContent = icon;
    const t = document.createElement('div');
    t.className = 'state-title';
    t.textContent = title;
    const b = document.createElement('div');
    b.className = 'state-body';
    b.textContent = body;
    s.append(i, t, b);
    if (onRetry) {
      const btn = document.createElement('button');
      btn.className = 'btn no-pan';
      btn.textContent = 'Retry';
      btn.addEventListener('click', onRetry);
      s.append(btn);
    }
    s.hidden = false;
    el('data').hidden = true;
  }

  /** Back to the opening state: the spinner, and nothing claiming to be data. */
  function showSpinner() {
    const s = el('state');
    s.className = 'state-card';
    s.textContent = '';
    const spin = document.createElement('div');
    spin.className = 'spinner';
    s.append(spin);
    s.hidden = false;
    el('data').hidden = true;
    el('meta').textContent = '';
    const pill = el('pill');
    // Explicitly shown: a healthy render may have hidden it (#205).
    pill.hidden = false;
    pill.textContent = 'Loading';
    pill.className = 'pill muted';
  }

  function showSetup() {
    stateCard('', '◎', 'No calendar linked',
      "Paste your calendar's private ICS address in the widget settings. It is stored encrypted, like a password.");
  }

  function showError(message) {
    errorShowing = true;   // paint() must not paint over this with "Nothing scheduled"
    stateCard('err', '!', 'Calendar unavailable', message, () => {
      // An explicit tap means "try properly now", not "keep backing off".
      failures = 0;
      stateCard('', '', 'Retrying', '');
      clearTimeout(fetchTimer);
      load();
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // Nothing to repaint for, so stop the 1 Hz loop too — a minimised panel ticking a
      // countdown forever is the same waste as polling one.
      clearInterval(tickTimer);
      tickTimer = null;
      return;
    }
    if (paused() || !started) return;
    startTick();
    paint();
    if (Date.now() >= dueAt) { clearTimeout(fetchTimer); load(); }
    else schedule(remainingWait());
  });
</script>
</body>
</html>
