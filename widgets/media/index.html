<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Now Playing</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and typography base come
   * from widget-base.css. Type is the size each role had at the smallest tile (a
   * 640x200 band) times the tile scale (--ts, widget-base.css), so a bigger tile
   * reads bigger. The album art is the tile's picture and sizes to the tile. */
  body { display: flex; flex-direction: column; padding: 12px 16px 10px; }
  #layout { position: relative; z-index: 1; display: flex; align-items: center; flex: 1 1 auto; min-height: 0; gap: 4%; }
  /* Never more than 42% of the tile's width: on a half tile a full-height square left
   * the title, artist and transport a third of the width once their text grew. */
  #art {
    height: min(90%, 42vw); aspect-ratio: 1;
    border: 1px solid var(--line);
    background: var(--control-bg) center/cover no-repeat;
    flex: none;
  }
  #info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(3px * var(--ts)); }
  /* The user's sizes multiply the tile's. The vh caps never bind at 100%; they keep a
   * 200% setting inside a 200px band, where title, artist, time and transport stack. */
  #title { font-size: min(calc(20px * var(--ts) * var(--title-scale, 1)), 17.5vh); color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #meta {
    font-size: min(calc(10px * var(--ts) * var(--artist-scale, 1)), 9vh);
    color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #timeline { display: flex; align-items: center; gap: calc(7px * var(--ts)); margin-top: calc(1px * var(--ts)); }
  #timeline time { font-size: min(calc(10px * var(--ts) * var(--time-scale, 1)), 9vh); color: var(--text-dim); font-variant-numeric: tabular-nums; flex: none; }
  #timeline #elapsed { color: var(--accent-fg); }
  /* The track is the tile's axis: a ruler with the accent fill and now-cursor,
   * interpolated between polls exactly as the meter fill was. */
  #trackScale { flex: 1; height: 12px; }
  #trackScale .fill, #trackScale .cur { transition: none; }
  #timeline.no-duration { visibility: hidden; }

  /* Wraps only for the status: on a half tile's narrow info column it goes under the
   * buttons rather than past the tile's edge. */
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: calc(6px * var(--ts)) calc(10px * var(--ts)); margin-top: calc(2px * var(--ts)); }
  /* Touch targets grow with the text: 45px on the smallest tile, over 60px on a big one. */
  #controls .btn {
    padding: 0;
    width: calc(30px * var(--ts)); height: calc(30px * var(--ts));
    display: flex; align-items: center; justify-content: center;
    /* none, not manipulation: nothing here scrolls, and manipulation still PERMITS a
     * pan — so horizontal finger drift on a control chained out to the shell pager and
     * changed page instead of pressing it (#206). */
    touch-action: none;
  }
  #controls .btn svg { width: 40%; height: 40%; fill: currentColor; }
  /* Paused, Stopped and the rest — anything but Playing, which the pause icon and the
   * moving track already say. Beside the transport, which is what it qualifies. */
  #status { white-space: nowrap; }
  #idle {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; gap: calc(3px * var(--ts)); align-items: center; justify-content: center;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
    color: var(--text-dim); font-size: calc(14px * var(--ts));
  }
  #idle svg { width: calc(30px * var(--ts)); height: calc(30px * var(--ts)); fill: var(--line); }
</style>
</head>
<body>
  <div id="layout">
    <div id="art"></div>
    <div id="info">
      <div id="title"></div>
      <div id="meta"></div>
      <div id="timeline">
        <time id="elapsed">0:00</time>
        <div class="scale" id="trackScale">
          <div class="rail"></div>
          <div class="fill" id="trackFill" style="width:0%"></div>
          <div class="cur" id="trackCur" style="left:0%"></div>
        </div>
        <time id="total">0:00</time>
      </div>
      <div id="controls">
        <button id="prev" class="btn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
        </button>
        <button id="toggle" class="btn primary" aria-label="Play/Pause">
          <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="next" class="btn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <span class="pill muted" id="status" hidden></span>
      </div>
    </div>
  </div>
  <div id="idle">
    <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21s4.5-2.01 4.5-4.5V7h4V3z"/></svg>
    <span>Nothing playing</span>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const el = (id) => document.getElementById(id);

  el('prev').addEventListener('click', () => WW.mediaControl('prev'));
  el('toggle').addEventListener('click', () => WW.mediaControl('toggle'));
  el('next').addEventListener('click', () => WW.mediaControl('next'));

  // Position arrives every ~2 s poll; interpolate between updates while playing.
  let base = { position: null, duration: null, at: 0, playing: false };


  WW.onInit((state) => {
    const s = state.settings;
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy color keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--title-scale', (Number(s.titleSize) || 100) / 100);
    document.body.style.setProperty('--artist-scale', (Number(s.artistSize) || 100) / 100);
    document.body.style.setProperty('--time-scale', (Number(s.timeSize) || 100) / 100);
    render(state.media);
  });
  WW.onMedia(render);

  function render(media) {
    const idle = !media || !media.available || !media.title;
    el('idle').hidden = !idle;
    if (idle) {
      // The idle overlay follows the panel opacity (glass/transparent tiles stay
      // glass/transparent while idle), so stale art must not linger underneath it —
      // and neither may the playback status, which shows straight through a
      // zero-alpha overlay on transparent tiles.
      el('art').style.backgroundImage = 'none';
      el('status').textContent = '';
      el('status').hidden = true;
      return;
    }

    el('title').textContent = media.title || '';
    el('meta').textContent = [media.artist, media.album].filter(Boolean).join(' · ');

    const playing = media.status === 'Playing';
    el('iconPlay').style.display = playing ? 'none' : 'block';
    el('iconPause').style.display = playing ? 'block' : 'none';
    // Playing needs no word: the pause icon and the moving track say it. Anything
    // else is the session's actual status — Windows also reports Stopped, Changing,
    // Opened and Closed, and labeling those all Paused would lie.
    const status = el('status');
    status.hidden = playing;
    status.textContent = playing ? '' : (media.status || 'Paused');

    base = { position: media.positionSeconds, duration: media.durationSeconds, at: Date.now(), playing };
    renderTimeline();

    el('art').style.backgroundImage = media.thumbnail ? `url("${media.thumbnail}")` : 'none';
  }

  function renderTimeline() {
    const hasDuration = base.duration != null && base.duration > 0 && base.position != null;
    el('timeline').classList.toggle('no-duration', !hasDuration);
    if (!hasDuration) return;

    let position = base.position + (base.playing ? (Date.now() - base.at) / 1000 : 0);
    position = Math.min(position, base.duration);
    el('elapsed').textContent = fmt(position);
    el('total').textContent = fmt(base.duration);
    const pct = (position / base.duration * 100).toFixed(2) + '%';
    el('trackFill').style.width = pct;
    el('trackCur').style.left = pct;
  }

  function fmt(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }

  setInterval(renderTimeline, 500);
</script>
</body>
</html>
