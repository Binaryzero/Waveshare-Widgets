<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Now Playing</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and typography base come
   * from widget-base.css. */
  body { display: flex; align-items: center; }
  #backdrop {
    position: fixed; inset: -30px;
    background-size: cover; background-position: center;
    filter: blur(24px) brightness(0.3);
    z-index: 0;
  }
  /* On light themes wash the album-art backdrop out instead of darkening it, so
   * the theme's dark text stays legible over it. */
  html[data-appearance="light"] #backdrop { filter: blur(24px) saturate(0.7); opacity: 0.35; }
  #layout { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; height: 100%; padding: 3.5%; gap: 4%; }
  #art {
    height: 84%; aspect-ratio: 1;
    border-radius: var(--radius-control);
    background: var(--control-bg) center/cover no-repeat;
    box-shadow: 0 8px 30px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.5));
    flex: none;
  }
  #info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1vh; }
  #title  { font-size: calc(clamp(17px, 8.5vh, 38px) * var(--title-scale, 1)); color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: calc(clamp(13px, 5.5vh, 24px) * var(--artist-scale, 1)); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album  { font-size: calc(clamp(11px, 4vh, 17px) * var(--album-scale, 1)); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #timeline { display: flex; align-items: center; gap: 10px; margin-top: 1.2vh; }
  #timeline time { font-size: calc(clamp(10px, 3.6vh, 14px) * var(--time-scale, 1)); color: var(--text-dim); font-variant-numeric: tabular-nums; flex: none; }
  /* .meter carries the track/fill colors; the media bar keeps its 6px height and
   * the linear fill transition matched to the 500ms position interpolation. */
  #bar { flex: 1; height: 6px; border-radius: 3px; }
  #bar > i { width: 0%; border-radius: 3px; transition: width 0.4s linear; }
  #timeline.no-duration { visibility: hidden; }

  #controls { display: flex; align-items: center; gap: 16px; margin-top: 1vh; }
  #controls .btn {
    border: 0; padding: 0;
    width: clamp(46px, 15vh, 68px); height: clamp(46px, 15vh, 68px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    /* none, not manipulation: nothing here scrolls, and manipulation still PERMITS a
     * pan — so horizontal finger drift on a control chained out to the shell pager and
     * changed page instead of pressing it (#206). */
    touch-action: none;
  }
  #controls .btn svg { width: 44%; height: 44%; fill: currentColor; }
  #controls .btn:active, #controls #toggle { background: var(--accent); color: var(--on-accent); }
  #idle {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; gap: 1.6vh; align-items: center; justify-content: center;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
    color: var(--text-dim); font-size: clamp(14px, 5vh, 22px);
  }
  #idle svg { width: clamp(30px, 12vh, 54px); height: clamp(30px, 12vh, 54px); fill: var(--line); }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="layout">
    <div id="art"></div>
    <div id="info">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="album"></div>
      <div id="timeline">
        <time id="elapsed">0:00</time>
        <div id="bar" class="meter"><i id="barFill"></i></div>
        <time id="total">0:00</time>
      </div>
      <div id="controls">
        <button id="prev" class="btn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
        </button>
        <button id="toggle" class="btn" aria-label="Play/Pause">
          <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="next" class="btn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="idle">
    <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21s4.5-2.01 4.5-4.5V7h4V3z"/></svg>
    <span>Nothing playing</span>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const el = (id) => document.getElementById(id);

  el('prev').addEventListener('click', () => WW.mediaControl('prev'));
  el('toggle').addEventListener('click', () => WW.mediaControl('toggle'));
  el('next').addEventListener('click', () => WW.mediaControl('next'));

  // Position arrives every ~2 s poll; interpolate between updates while playing.
  let base = { position: null, duration: null, at: 0, playing: false };


  WW.onInit((state) => {
    const s = state.settings;
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy color keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--title-scale', (Number(s.titleSize) || 100) / 100);
    document.body.style.setProperty('--artist-scale', (Number(s.artistSize) || 100) / 100);
    document.body.style.setProperty('--album-scale', (Number(s.albumSize) || 100) / 100);
    document.body.style.setProperty('--time-scale', (Number(s.timeSize) || 100) / 100);
    render(state.media);
  });
  WW.onMedia(render);

  function render(media) {
    const idle = !media || !media.available || !media.title;
    el('idle').hidden = !idle;
    if (idle) {
      // The idle overlay follows the panel opacity now (glass/transparent tiles stay
      // glass/transparent while idle), so stale art must not linger underneath it.
      el('art').style.backgroundImage = 'none';
      el('backdrop').style.backgroundImage = 'none';
      return;
    }

    el('title').textContent = media.title || '';
    el('artist').textContent = media.artist || '';
    el('album').textContent = media.album || '';

    const playing = media.status === 'Playing';
    el('iconPlay').style.display = playing ? 'none' : 'block';
    el('iconPause').style.display = playing ? 'block' : 'none';

    base = { position: media.positionSeconds, duration: media.durationSeconds, at: Date.now(), playing };
    renderTimeline();

    const art = media.thumbnail ? `url("${media.thumbnail}")` : 'none';
    el('art').style.backgroundImage = art;
    el('backdrop').style.backgroundImage = art;
  }

  function renderTimeline() {
    const hasDuration = base.duration != null && base.duration > 0 && base.position != null;
    el('timeline').classList.toggle('no-duration', !hasDuration);
    if (!hasDuration) return;

    let position = base.position + (base.playing ? (Date.now() - base.at) / 1000 : 0);
    position = Math.min(position, base.duration);
    el('elapsed').textContent = fmt(position);
    el('total').textContent = fmt(base.duration);
    el('barFill').style.width = (position / base.duration * 100).toFixed(2) + '%';
  }

  function fmt(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }

  setInterval(renderTimeline, 500);
</script>
</body>
</html>
