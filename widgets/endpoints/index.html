<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Endpoint Health</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — colors, background, bgStyle and the typography base come from
   * widget-base.css. State hues map to the --ok/--warn/--err tokens. */
  body { display: flex; flex-direction: column; gap: 6px; padding: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  /* The row block is CENTRED rather than stretched, so a short list reads as a row of
   * status tiles instead of columns of mostly empty card — three targets in a full-width
   * slot were stretching to 340px tall to hold two lines of text. A full grid still fills
   * the tile, because more rows means more content to centre. */
  #grid { flex: 1 1 auto; display: grid; gap: 8px; min-height: 0; align-content: center; }
  .target {
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    padding: 6px 10px;
    border-radius: var(--radius-control);
    background: var(--card-surface);
    min-width: 0; min-height: 0; overflow: hidden;
    position: relative;
  }
  /* The state stripe is the glance: a wall of green with one red edge reads from
   * across the room, where the text does not. */
  .target::before {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 3px;
    border-radius: var(--radius-control) 0 0 var(--radius-control);
    background: var(--text-dim);
  }
  .target.up::before { background: var(--ok); }
  .target.slow::before { background: var(--warn); }
  .target.down::before { background: var(--err); }
  .target .top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .target .name {
    color: var(--text); font-weight: 650;
    font-size: clamp(11px, 3.2vh, 14px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1 1 auto; min-width: 0;
  }
  .target .code {
    font-size: clamp(11px, 3vh, 13px); font-weight: 700; flex: none;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
  }
  .target.up .code { color: var(--ok); }
  .target.slow .code { color: var(--warn); }
  .target.down .code { color: var(--err); }
  .target .rtt {
    color: var(--text-muted); font-size: 11px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  footer { color: var(--text-dim); font-size: 11px; flex: none; }
  #state { position: fixed; inset: 0; }
</style>
</head>
<body>
  <header>
    <span class="kicker">Endpoints</span>
    <span class="pill muted" id="pill">Checking</span>
  </header>

  <div id="grid"></div>

  <footer id="meta"></footer>

  <div class="state-card" id="state">
    <div class="state-icon">◎</div>
    <div class="state-title">No targets configured</div>
    <div class="state-body">Add targets in the widget settings — each one needs a name and a URL, e.g. NAS / http://192.168.1.10:8080/</div>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { targets: [], intervalMs: 60000, slowMs: 800 };
  const cards = new Map();     // key -> {root, code, rtt}
  const timers = new Map();    // key -> timeout id
  // Keyed by GENERATION + url, not url alone: a rebuild starts a fresh probe for a
  // retained target while the old generation's probe is still out, and its finally
  // then deleted the shared marker — reopening the duplicate-chain hole this set
  // exists to close.
  const running = new Set();   // "gen\nurl" for probes in flight — see visibilitychange
  const results = new Map();   // key -> {state, code, ms, at}
  const fails = new Map();     // key -> consecutive failures, for this target's backoff
  let generation = 0;          // invalidates the chains a previous settings load started
  let gameOn = false;          // a fullscreen game is foreground: WIDGET-SPEC gates JS work

  // One probe's whole budget, covering the HEAD and the GET retry together. Neither tier
  // of WW.fetch bounds a direct browser request — the shim's timer is on the host-proxy
  // tier — so without this a box that accepts a connection and then goes silent leaves its
  // probe pending forever: the finally never runs, and THAT TARGET's chain stops for good
  // while its tile sits on "checking…". The comment below used to say a hang delayed only
  // the target's own next check; it delayed that check indefinitely.
  const PROBE_DEADLINE = 10000;

  const el = (id) => document.getElementById(id);

  function parseTargets(value) {
    const raw = Array.isArray(value) ? value : [];
    return raw
      .map((item) => {
        if (!item) return null;
        if (typeof item === 'string') {
          const u = item.trim();
          return u ? { label: u, url: u } : null;
        }
        let url = String(item.url == null ? '' : item.url).trim();
        if (!url) return null;
        if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
        const label = String(item.label == null ? '' : item.label).trim() || url;
        return { label, url };
      })
      .filter(Boolean)
      .slice(0, 12);
  }

  WW.onInit((state) => {
    const s = state.settings;
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');

    // Seeded, not only listened for: onGame reports later flips, so a widget that only
    // listens probes straight through a game that was already running when it loaded.
    gameOn = !!(state.game && state.game.active);

    cfg.targets = parseTargets(s.targets);
    cfg.intervalMs = Math.min(900, Math.max(15, Number(s.intervalSeconds) || 60)) * 1000;
    cfg.slowMs = Math.min(5000, Math.max(100, Number(s.slowMs) || 800));

    build();
  });

  function build() {
    // Every re-init retires the previous generation's chains rather than adding to
    // them: without this, editing settings three times leaves three timers per target
    // hammering the same box forever.
    generation++;
    for (const t of timers.values()) clearTimeout(t);
    timers.clear();
    fails.clear();

    const grid = el('grid');
    grid.textContent = '';
    cards.clear();
    // Outcomes belong to the target list that produced them. renderSummary counts every
    // value in this map, so a removed target kept contributing its old down/slow status
    // to the pill for a grid it is no longer part of.
    results.clear();

    const n = cfg.targets.length;
    el('state').hidden = !!n;
    grid.hidden = !n;
    if (!n) { el('pill').textContent = 'Idle'; el('pill').className = 'pill muted'; el('meta').textContent = ''; return; }

    // Columns follow the WIDTH as well as the count. Going by count alone put three
    // targets in a full-width slot into a 2x2 — a card-sized hole in the corner and every
    // tile 185px tall — when the panel had room for a single row of three. 300px is about
    // where a name and its status code stop being comfortable together.
    const w = document.documentElement.clientWidth || 640;
    const cols = Math.max(1, Math.min(n, Math.floor(w / 300) || 1, 4));
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';

    for (const t of cfg.targets) {
      const root = document.createElement('div');
      root.className = 'target';
      const top = document.createElement('div');
      top.className = 'top';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = t.label;
      const code = document.createElement('span');
      code.className = 'code';
      code.textContent = '···';
      top.append(name, code);
      const rtt = document.createElement('div');
      rtt.className = 'rtt';
      rtt.textContent = 'checking…';
      root.append(top, rtt);
      grid.appendChild(root);
      cards.set(t.url, { root, code, rtt });
    }

    for (const t of cfg.targets) probe(t, generation);
    renderSummary();
  }

  // One chain per target, each rescheduling itself in a finally, so a box that hangs
  // delays only its own next check — the acceptance criterion this widget exists to
  // satisfy. The deadline below is what makes that true rather than merely intended.
  async function probe(target, gen) {
    if (gen !== generation) return;
    const mark = gen + '\n' + target.url;
    running.add(mark);
    // Hidden, or a game is running. WIDGET-SPEC: the shell pauses CSS animation for every
    // widget, but JS work is the widget's own to hold — and this one makes up to twelve
    // network calls per interval, on a machine whose frame budget is spoken for.
    // document.hidden does not cover it: the panel is a second screen and stays visible
    // while the game has the first.
    if (document.hidden || gameOn) {
      running.delete(mark);
      timers.set(target.url, setTimeout(() => probe(target, gen), 5000));
      return;
    }
    const started = Date.now();
    const abort = new AbortController();
    const deadline = setTimeout(() => abort.abort(), PROBE_DEADLINE);
    let outcome;
    try {
      // HEAD first — cheapest possible answer. Plenty of servers (and most SPA dev
      // servers) answer 405 or hang up on it, so a non-2xx HEAD is retried as GET
      // before we call the target unhealthy.
      // no-store on both: a health probe answered from the browser cache reports a
      // service that has since gone down as green, which is the one answer this widget
      // must never give.
      // The signal covers BOTH calls, because the budget is the probe's, not the call's:
      // a HEAD that hangs for the whole deadline has already spent what the GET would
      // need, and a target is unreachable either way.
      let res = await WW.fetch(target.url, { method: 'HEAD', insecure: true, cache: 'no-store', signal: abort.signal });
      if (!res.ok) res = await WW.fetch(target.url, { method: 'GET', insecure: true, cache: 'no-store', maxBytes: 65536, signal: abort.signal });
      const ms = Date.now() - started;
      outcome = { state: res.ok ? (ms > cfg.slowMs ? 'slow' : 'up') : 'down', code: res.status, ms, at: Date.now() };
    } catch (e) {
      outcome = { state: 'down', code: 0, ms: Date.now() - started, at: Date.now() };
    } finally {
      clearTimeout(deadline);
      running.delete(mark);
      if (gen === generation) {
        if (outcome) { results.set(target.url, outcome); renderTarget(target, outcome); renderSummary(); }
        // Per TARGET, because that is the unit that is failing. A box that is switched off
        // is otherwise probed every fifteen seconds forever — nearly six thousand refused
        // connections a day, times up to twelve targets — and each one is a host round-trip
        // whenever the direct call is blocked. Doubling to a ceiling of eight intervals;
        // the target's own next success clears it, and so does coming back to the widget.
        const bad = !outcome || outcome.state === 'down';
        const n = bad ? Math.min((fails.get(target.url) || 0) + 1, 3) : 0;
        fails.set(target.url, n);
        timers.set(target.url, setTimeout(() => probe(target, gen), cfg.intervalMs * Math.pow(2, n)));
      }
    }
  }

  function renderTarget(target, r) {
    const ui = cards.get(target.url);
    if (!ui) return;
    ui.root.className = 'target ' + r.state;
    ui.code.textContent = r.code ? String(r.code) : '—';
    // "Unreachable" is reserved for a call that got no answer at all. A 503 IS
    // reachable — it replied, and it replied badly — so it keeps its timing and the
    // red status code carries the bad news.
    //
    // Deliberately "~": when a direct call is blocked, WW.fetch escalates through the
    // host proxy and the number includes that hop. The widget cannot see which tier
    // served it, so presenting this as the server's true latency would be a lie.
    ui.rtt.textContent = r.code ? '~' + r.ms + ' ms' : 'unreachable';
  }

  function renderSummary() {
    const seen = [...results.values()];
    const down = seen.filter((r) => r.state === 'down').length;
    const slow = seen.filter((r) => r.state === 'slow').length;
    const pill = el('pill');
    if (seen.length < cfg.targets.length) { pill.textContent = 'Checking'; pill.className = 'pill muted'; }
    else if (down) { pill.textContent = down + ' down'; pill.className = 'pill err'; }
    else if (slow) { pill.textContent = slow + ' slow'; pill.className = 'pill warn'; }
    else { pill.textContent = 'All up'; pill.className = 'pill ok'; }
    el('meta').textContent = 'times are relative — a blocked call is retried through the host and counts that hop';
  }

  // A flip in either direction re-checks the grid: while a game is on, probe() holds and
  // re-arms cheaply, and when it ends everything is asked again rather than waiting out
  // each target's remaining interval.
  WW.onGame((g) => {
    gameOn = !!(g && g.active);
    if (!gameOn) recheckAll();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    recheckAll();
  });

  // Coming back re-checks everything at once rather than waiting out each target's
  // remaining interval, and clears the backoff: a person looking at the grid is asking
  // for its current state, not for the stretched schedule a failing box had earned.
  function recheckAll() {
    for (const t of timers.values()) clearTimeout(t);
    timers.clear();
    fails.clear();
    // Only start targets that are NOT already mid-probe. Starting one unconditionally
    // gave that target two self-scheduling chains whose timeout ids overwrote each
    // other in the map, leaving one untracked and polling forever — and every
    // hide/show cycle added another.
    for (const t of cfg.targets) if (!running.has(generation + '\n' + t.url)) probe(t, generation);
  }
</script>
</body>
</html>
