<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clock</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and typography base come
   * from widget-base.css. */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
  }
  #time {
    color: var(--text);
    font-size: calc(clamp(40px, 34vh, 160px) * var(--time-scale, 1));
    font-weight: 200;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  #time small { font-size: 40%; color: var(--text-muted); font-weight: 200; }
  #date {
    color: var(--text-muted);
    font-size: calc(clamp(12px, 6vh, 26px) * var(--date-scale, 1));
    font-weight: 400;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="time">--:--</div>
  <div id="date"></div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  let hour12 = false;
  let showSeconds = true;

  WW.onInit((state) => {
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // pre-token behavior for unset AND out-of-spec values (no class = glass in base).
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy color keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--time-scale', (Number(s.timeSize) || 100) / 100);
    document.body.style.setProperty('--date-scale', (Number(s.dateSize) || 100) / 100);
    hour12 = s.hour12 === 'on';
    showSeconds = s.showSeconds !== 'off';
    render();
  });

  function render() {
    const now = new Date();
    let hours = now.getHours();
    let suffix = '';
    if (hour12) {
      suffix = hours >= 12 ? ' PM' : ' AM';
      hours = hours % 12 || 12;
    }
    const pad = (n) => String(n).padStart(2, '0');
    const time = (hour12 ? hours : pad(hours)) + ':' + pad(now.getMinutes()) +
      (showSeconds ? ':' + pad(now.getSeconds()) : '');
    const timeEl = document.getElementById('time');
    timeEl.textContent = time;
    if (suffix) {
      const small = document.createElement('small');
      small.textContent = suffix;
      timeEl.appendChild(small);
    }
    document.getElementById('date').textContent = now.toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    });
  }

  render();
  setInterval(render, 250);
</script>
</body>
</html>
