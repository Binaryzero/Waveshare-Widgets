<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fans</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Widget-specific layout; tokens, background/bgStyle and the typography base
   * come from widget-base.css. Designed for quarter (320px) first. */
  body {
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 3vh, 14px) clamp(10px, 3.5%, 18px) clamp(6px, 2vh, 12px);
    gap: clamp(4px, 1.4vh, 8px);
  }
  header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  #pill { flex: none; }
  /* Groups flow and wrap horizontally so a wide slot fills sideways instead of
   * scrolling; "safe center" keeps the first row reachable when it does overflow
   * (falls back to stretch on engines without the keyword). */
  #grid {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
    display: flex; flex-wrap: wrap;
    align-content: safe center; justify-content: center;
    gap: clamp(6px, 1.8vh, 12px) clamp(8px, 2.4vh, 16px);
  }
  #grid::-webkit-scrollbar { display: none; }
  .group { display: flex; flex-direction: column; gap: clamp(3px, 1vh, 6px); }
  .group > .kicker {
    font-size: 10px; color: var(--text-dim); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: clamp(88px, 24vh, 104px);
    align-self: center;
  }
  .cards {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(6px, 1.6vh, 10px);
  }
  .fan {
    position: relative;
    width: clamp(88px, 24vh, 104px);
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    padding: clamp(6px, 1.6vh, 10px) 4px;
  }
  .imp { width: clamp(34px, 13vh, 60px); aspect-ratio: 1; }
  .frame { fill: none; stroke: var(--control-bg); stroke-width: 4; }
  /* Impeller tint follows the theme accent (single-source appearance). The per-card
   * --fan-color is a DATA color: set from JS only for fans the user picked in the
   * "Fans shown" list, where the color identifies that fan. Spin period is the
   * per-card --spin variable, set from JS via the RPM -> period legibility remap. */
  .rotor {
    fill: var(--fan-color, var(--accent));
    transform-box: view-box;
    transform-origin: center;
    animation: fan-spin var(--spin, 1.2s) linear infinite;
  }
  @keyframes fan-spin { to { transform: rotate(360deg); } }
  /* A stopped rotor is a designed state, not a glitch: freeze and dim. */
  .fan.stopped .rotor { animation: none; }
  .fan.stopped .imp { opacity: 0.4; }
  .fan.stopped .rpm { opacity: 0.7; }
  .fan.stopped .rpm .value { color: var(--text-muted); font-weight: 650; }
  /* JS never re-enables motion under reduced motion — the base only covers its
   * own classes, so our animation carries its own guard. */
  @media (prefers-reduced-motion: reduce) { .rotor { animation: none; } }
  .rpm { line-height: 1; white-space: nowrap; }
  .rpm .value { font-size: clamp(13px, 4.6vh, 20px); }
  .rpm .unit { font-size: clamp(9px, 2.6vh, 11px); font-weight: 600; }
  /* Tap-to-rename: the name is a real button (focus/active for free). The 40px
   * touch floor is kept as hit area; negative margins keep the card compact. */
  .name {
    border: 0; background: none;
    color: var(--text-muted);
    font: inherit; font-size: 12px; font-weight: 600;
    min-height: 40px; margin: -9px 0 -11px; padding: 0 4px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease);
  }
  .name:active { transform: scale(0.95); }
  .name:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
  .rename {
    width: 100%; max-width: 130px;
    min-height: 40px; margin: -9px 0 -11px; padding: 2px 6px;
    border: 1px solid var(--line); border-radius: var(--radius-control);
    background: var(--control-bg); color: var(--text);
    font: inherit; font-size: 12px; text-align: center;
  }
  .chk { position: absolute; top: 2px; right: 2px; }
  /* State layer covers the whole tile; it paints the surface at the effective
   * panel opacity so it matches the tile's bgStyle (like the stock countdown). */
  #state {
    position: fixed; inset: 0;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
  }
</style>
</head>
<body>
  <header>
    <span class="kicker">Fans</span>
    <span class="pill" id="pill" hidden></span>
  </header>
  <main id="grid" hidden></main>
  <div class="state-card" id="state">
    <div class="spinner" id="stateSpinner"></div>
    <div class="state-icon" id="stateIcon" hidden></div>
    <div class="state-title" id="stateTitle" hidden></div>
    <div class="state-body" id="stateBody" hidden></div>
  </div>

  <!-- Shared impeller geometry: hub + 6 swept blades, referenced by every card's
       <use>. fill inherits from the referencing .rotor so it stays token-driven. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <g id="ww-rotor">
        <path d="M52 37 C61 28 76 26 87 36 C89 39 88 43 84 44 C73 47 60 47 52 44 Z"></path>
        <path d="M52 37 C61 28 76 26 87 36 C89 39 88 43 84 44 C73 47 60 47 52 44 Z" transform="rotate(60 50 50)"></path>
        <path d="M52 37 C61 28 76 26 87 36 C89 39 88 43 84 44 C73 47 60 47 52 44 Z" transform="rotate(120 50 50)"></path>
        <path d="M52 37 C61 28 76 26 87 36 C89 39 88 43 84 44 C73 47 60 47 52 44 Z" transform="rotate(180 50 50)"></path>
        <path d="M52 37 C61 28 76 26 87 36 C89 39 88 43 84 44 C73 47 60 47 52 44 Z" transform="rotate(240 50 50)"></path>
        <path d="M52 37 C61 28 76 26 87 36 C89 39 88 43 84 44 C73 47 60 47 52 44 Z" transform="rotate(300 50 50)"></path>
        <circle cx="50" cy="50" r="13"></circle>
        <circle cx="50" cy="50" r="4" fill="var(--surface)"></circle>
      </g>
    </defs>
  </svg>
  <template id="cardT">
    <div class="card fan">
      <span class="pill err chk" hidden>Check</span>
      <svg class="imp" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="frame" cx="50" cy="50" r="46"></circle>
        <g class="rotor"><use href="#ww-rotor"></use></g>
      </svg>
      <div class="rpm"><span class="value">--</span> <span class="unit">RPM</span></div>
      <button class="name" type="button"></button>
    </div>
  </template>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const $ = (id) => document.getElementById(id);

  // "Fans shown" (sensors-factory): [{sensorId, color}] in the user's order. Empty
  // means auto — every Fan-type sensor, sorted by device/name. The per-item color
  // is a DATA color (identifies that fan); it never restyles the widget chrome.
  let selection = [];
  function readSelection(settings) {
    const raw = Array.isArray(settings.fans) ? settings.fans : [];
    return raw
      .filter((x) => x && typeof x === 'object' && typeof x.sensorId === 'string' && x.sensorId)
      .map((x) => ({ sensorId: x.sensorId, color: /^#[0-9a-f]{6}$/i.test(x.color || '') ? x.color : '' }));
  }

  // Legibility remap: real per-rev speed would strobe on screen, so the observed
  // RPM range maps onto a watchable rotation period instead. RPM is bucketed to
  // 25 RPM steps before touching the style, so the ~2s sensor cadence doesn't
  // churn animation-duration every tick.
  const P_SLOW = 2.6, P_FAST = 0.32;      // seconds per revolution at 0..max RPM
  const NOMINAL_FAN = 2200, NOMINAL_PUMP = 4000;
  const RPM_BUCKET = 25;

  // Pumps are Fan-type sensors too — the hardware fact comes from the original
  // sensor name/device, not from any user rename.
  const PUMP_RE = /pump|aio/i;
  const isPumpSensor = (s) => PUMP_RE.test((s.name || '') + ' ' + (s.device || ''));

  // Location heading from the sensor name (CPU / GPU / Case heuristics, pumps
  // grouped together), falling back to the device name.
  function groupFor(s) {
    if (isPumpSensor(s)) return 'Pumps';
    const hay = ((s.name || '') + ' ' + (s.deviceType || '')).toLowerCase();
    if (hay.includes('cpu')) return 'CPU';
    if (hay.includes('gpu') || hay.includes('vga') || hay.includes('graphics')) return 'GPU';
    if (/case|chassis|system|front|rear|top|bottom|exhaust|intake/.test(hay)) return 'Case';
    const dt = (s.deviceType || '').toLowerCase();
    if (dt.includes('superio') || dt.includes('motherboard') || dt.includes('lpc') || dt.includes('embedded')) return 'Case';
    return String(s.device || 'Case');
  }
  const GROUP_ORDER = ['CPU', 'GPU', 'Pumps', 'Case'];

  // Renames persist per widget instance + sensor id: localStorage is per-origin
  // and all fans instances share one virtual host, so the key carries the
  // per-instance slot tag (same pattern as the stock countdown's origin store).
  const INSTANCE = (location.hash.match(/ww-slot=([\w-]+)/) || [])[1] || 'solo';
  const nameKey = (id) => 'ww.fans.name:' + INSTANCE + ':' + id;
  function displayName(sensor) {
    try {
      const v = localStorage.getItem(nameKey(sensor.id));
      if (v && v.trim()) return v.trim();
    } catch (e) { /* storage unavailable — fall through to the sensor name */ }
    return sensor.name || 'Fan';
  }

  const grid = $('grid');
  const cards = new Map();   // sensor id -> card record
  let curSig = null;         // ordered fan-id signature the grid was built for
  let started = false;       // listeners register once; later inits reconfigure
  let lastPill = null;

  function showState(kind, title, body) {
    const st = $('state');
    st.hidden = false;
    st.classList.remove('err');
    $('stateSpinner').hidden = kind !== 'loading';
    $('stateIcon').hidden = kind === 'loading';
    $('stateTitle').hidden = kind === 'loading';
    $('stateBody').hidden = kind === 'loading' || !body;
    $('stateIcon').textContent = kind === 'setup' ? '🛡' : '🌀';
    $('stateTitle').textContent = title || '';
    $('stateBody').textContent = body || '';
    grid.hidden = true;
    $('pill').hidden = true;
    lastPill = null;
  }

  function showMain() {
    $('state').hidden = true;
    grid.hidden = false;
  }

  function setPill(text, cls) {
    const sig = text + '|' + cls;
    if (lastPill === sig) return;
    lastPill = sig;
    const p = $('pill');
    p.className = 'pill' + (cls ? ' ' + cls : '');
    p.textContent = text;
    p.hidden = false;
  }

  // ---- rename (tap the name, type, Enter — no prompt) ---------------------------
  function beginRename(c) {
    if (c.editing) return;
    c.editing = true;
    const input = document.createElement('input');
    input.className = 'rename';
    input.maxLength = 40;
    input.value = displayName(c.sensor);
    c.nameBtn.hidden = true;
    c.el.appendChild(input);
    input.focus();
    input.select();
    const commit = (save) => {
      if (!c.editing) return;
      c.editing = false;
      if (save) {
        const v = input.value.trim();
        try {
          if (v && v !== c.sensor.name) localStorage.setItem(nameKey(c.sensor.id), v);
          else localStorage.removeItem(nameKey(c.sensor.id));
        } catch (e) { /* best effort — rename just won't survive a reload */ }
      }
      input.remove();
      c.nameBtn.textContent = displayName(c.sensor);
      c.nameBtn.hidden = false;
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit(true);
      else if (e.key === 'Escape') commit(false);
    });
    input.addEventListener('blur', () => commit(true));
  }

  // ---- cards --------------------------------------------------------------------
  function buildCard(sensor, color) {
    const el = document.getElementById('cardT').content.firstElementChild.cloneNode(true);
    const c = {
      el,
      sensor,
      valueEl: el.querySelector('.value'),
      nameBtn: el.querySelector('.name'),
      chkEl: el.querySelector('.chk'),
      isPump: isPumpSensor(sensor),
      obsMax: 0,
      bucket: null,
      stopped: null,
      chkShown: null,
      lastText: null,
      editing: false,
    };
    // Data color from the "Fans shown" list — identifies the picked fan. Absent
    // (auto mode, or no color chosen) the rotor falls through to the theme accent.
    if (color) el.style.setProperty('--fan-color', color);
    c.nameBtn.textContent = displayName(sensor);
    c.nameBtn.addEventListener('click', () => beginRename(c));
    cards.set(sensor.id, c);
    return el;
  }

  function buildGrid(fans, colorOf) {
    cards.clear();
    const groups = new Map();
    for (const f of fans) {
      const g = groupFor(f);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(f);
    }
    const keys = [...groups.keys()].sort((a, b) => {
      const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    const frag = document.createDocumentFragment();
    for (const key of keys) {
      const sec = document.createElement('section');
      sec.className = 'group';
      const h = document.createElement('span');
      h.className = 'kicker';
      h.textContent = key;
      sec.appendChild(h);
      const wrap = document.createElement('div');
      wrap.className = 'cards';
      for (const f of groups.get(key)) wrap.appendChild(buildCard(f, colorOf(f.id)));
      sec.appendChild(wrap);
      frag.appendChild(sec);
    }
    grid.textContent = '';       // one batched swap, not interleaved edits
    grid.appendChild(frag);
  }

  function refreshCard(c, sensor) {
    c.sensor = sensor;
    const raw = sensor.value;
    const rpm = raw == null || !isFinite(Number(raw)) ? null : Math.max(0, Math.round(Number(raw)));
    const stopped = rpm == null || rpm === 0;   // null renders "--", never NaN
    const text = rpm == null ? '--' : String(rpm);
    if (c.lastText !== text) { c.lastText = text; c.valueEl.textContent = text; }
    if (c.stopped !== stopped) { c.stopped = stopped; c.el.classList.toggle('stopped', stopped); }
    // A stopped case fan is normal (semi-passive is a feature); a stopped PUMP is
    // a problem — cooling is failing while temps still read fine.
    const showChk = c.isPump && rpm === 0;
    if (c.chkShown !== showChk) { c.chkShown = showChk; c.chkEl.hidden = !showChk; }
    if (!stopped) {
      if (rpm > c.obsMax) c.obsMax = rpm;
      const bucket = Math.round(rpm / RPM_BUCKET);
      if (bucket !== c.bucket) {   // style write only when the bucketed RPM moves
        c.bucket = bucket;
        const max = Math.max(c.isPump ? NOMINAL_PUMP : NOMINAL_FAN, c.obsMax);
        const frac = Math.min(1, Math.max(0, (bucket * RPM_BUCKET) / max));
        const period = P_SLOW - frac * (P_SLOW - P_FAST);
        c.el.style.setProperty('--spin', period.toFixed(2) + 's');
      }
    }
  }

  // ---- render loop (driven by the host's ~2s sensor push, never a timer) --------
  function update() {
    const all = (WW.sensors || []).filter((s) => s && s.type === 'Fan');
    if (!all.length) {
      // Diagnose, don't shrug: the two real-world reasons for zero Fan sensors are
      // distinguishable and each has a different remedy the user can act on.
      if (WW.status && WW.status.elevated) {
        showState('none', 'No fan readings from this system',
          'Motherboard fan headers are read from the SuperIO chip via the PawnIO ' +
          'driver — install PawnIO (pawnio.eu) if it isn’t, or this board’s chip may ' +
          'be unsupported. USB fan/AIO controllers appear when the hub supports them.');
      } else {
        // Hard Windows constraint, stated once and only when there is nothing to
        // show: an unelevated process cannot read motherboard fan headers at all.
        showState('none', 'No fan readings available to this app',
          'Windows only exposes motherboard fan headers to an elevated process ' +
          '(with the PawnIO driver). GPU and USB fan/AIO hub fans appear without it.');
      }
      return;
    }
    let fans;
    if (selection.length) {
      // User-picked fans, in the order they arranged them in Settings. The editor
      // permits picking the same fan twice; duplicate ids would fight over one
      // card (the map is keyed by id) and inflate the spinning tally — the first
      // pick wins, keeping its color.
      const seen = new Set();
      fans = selection.map((it) => all.find((s) => s.id === it.sensorId)).filter(Boolean)
        .filter((f) => (seen.has(f.id) ? false : (seen.add(f.id), true)));
      if (!fans.length) {
        showState('none', 'Selected fans not found',
          'None of the fans picked in this widget’s settings are reporting — ' +
          'open Settings and pick from the fans this system exposes.');
        return;
      }
    } else {
      // Auto mode: every fan, in a stable device/name order (snapshot order can
      // shuffle between providers; sorting keeps cards from jumping around).
      fans = all.slice().sort((a, b) =>
        String(a.device || '').localeCompare(String(b.device || '')) ||
        String(a.name || '').localeCompare(String(b.name || '')) ||
        String(a.id).localeCompare(String(b.id)));
    }
    showMain();
    const colorOf = (id) => {
      const it = selection.find((x) => x.sensorId === id);
      return (it && it.color) || '';
    };
    // Signature includes the data colors so a color change in Settings rebuilds.
    const sig = fans.map((f) => f.id + '@' + colorOf(f.id)).join('|');
    if (sig !== curSig) { curSig = sig; buildGrid(fans, colorOf); }
    let pumpsDown = 0, spinning = 0;
    for (const f of fans) {
      const c = cards.get(f.id);
      if (!c) continue;
      refreshCard(c, f);
      if (c.chkShown) pumpsDown++;
      if (!c.stopped) spinning++;
    }
    if (pumpsDown) setPill('Check pump', 'err');
    else setPill(spinning + '/' + fans.length + ' spinning', 'muted');
  }

  // 24/7 rules: skip work while hidden or while a fullscreen game is foreground
  // (the framework already pauses the CSS animations; this stops the JS churn),
  // and never let one bad render kill the loop.
  function tick() {
    if (document.hidden) return;
    if (WW.game && WW.game.active) return;
    try { update(); } catch (e) { WW.log('fans render failed: ' + e.message); }
  }

  WW.onInit((state) => {
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching
    // the stock widgets for unset AND out-of-spec values.
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    // Settings re-delivery (ww-init) is where a changed "Fans shown" list lands;
    // the grid signature includes ids + colors, so tick() rebuilds as needed.
    selection = readSelection(s);
    if (!started) {   // repeated ww-init must not stack listeners
      started = true;
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    }
    tick();
  });

  WW.onSensors(tick);
  WW.onGame((g) => { if (!g.active) tick(); });   // catch up as soon as the game ends
</script>
</body>
</html>
