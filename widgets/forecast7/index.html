<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>7-Day Forecast</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Widget-specific layout only; tokens, background/bgStyle handling and the
   * typography base come from widget-base.css. */
  body {
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 1.6vh, 12px);
    padding: clamp(8px, 3vh, 16px) clamp(12px, 1.4vw, 20px);
  }
  header { display: flex; align-items: center; gap: var(--space-2); flex: none; min-width: 0; }
  #place {
    color: var(--text-muted);
    font-size: clamp(10px, 3.8vh, 13px);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  #pill { margin-left: auto; flex: none; }

  #days {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: clamp(4px, 0.8vw, 10px);
    transition: opacity var(--dur-mid) var(--ease);
  }
  .day {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2px, 1.4vh, 8px);
    padding: clamp(4px, 1.6vh, 10px) 2px;
    min-width: 0;
    overflow: hidden;
  }
  .day.today { border-color: rgba(var(--accent-rgb), 0.45); }
  .day.today .d { color: var(--accent); }
  .d { font-size: clamp(10px, 3.6vh, 13px); white-space: nowrap; }
  .g { font-size: clamp(16px, 10vh, 40px); line-height: 1; }
  .c {
    display: none;
    color: var(--text-muted);
    font-size: clamp(12px, 4vh, 13px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .hi { font-size: clamp(14px, 6.5vh, 26px); white-space: nowrap; }
  .lo {
    color: var(--text-muted);
    font-size: clamp(12px, 4.8vh, 18px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pp {
    color: var(--text-muted);
    font-size: clamp(12px, 4.2vh, 14px);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Full slot has room for the condition label under the glyph. */
  @media (min-width: 900px) { .c { display: block; } }

  footer {
    flex: none;
    color: var(--text-dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    transition: opacity var(--dur-mid) var(--ease);
  }
  /* Half-height bands: drop the footer, tighten the stack. */
  @media (max-height: 240px) {
    footer { display: none; }
    body { gap: clamp(3px, 1.2vh, 8px); }
  }

  /* Stale: keep the last data visible, dimmed (opacity only — compositor-cheap). */
  body.stale #days, body.stale footer { opacity: 0.55; }

  /* State overlays cover the layout, painting the surface at the effective panel
   * opacity so they match the tile's bgStyle. */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(var(--surface-rgb), var(--panel-alpha-eff));
  }
</style>
</head>
<body>
  <header>
    <span class="kicker">7-Day Forecast</span>
    <span id="place"></span>
    <span class="pill" id="pill" hidden></span>
  </header>

  <main id="days" hidden>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
    <div class="day card"><div class="d kicker">--</div><div class="g">·</div><div class="c"></div><div class="hi value">--</div><div class="lo">--</div><div class="pp">--</div></div>
  </main>

  <footer id="updated" hidden></footer>

  <div id="loading" class="overlay state-card">
    <div class="spinner"></div>
  </div>
  <div id="setup" class="overlay state-card" hidden>
    <div class="state-icon">7</div>
    <div class="state-title">Set a location</div>
    <div class="state-body">Pick a city in this widget's Settings to see the week ahead.</div>
  </div>
  <div id="error" class="overlay state-card err" hidden>
    <div class="state-icon">!</div>
    <div class="state-title">Forecast unavailable</div>
    <div class="state-body" id="errorBody"></div>
    <button class="btn" id="retry">Retry</button>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  // WMO weather interpretation codes -> label + glyph (house map, as in the
  // stock weather widget).
  const WMO = {
    0: ['Clear', '☀️'], 1: ['Mostly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
    45: ['Fog', '🌫️'], 48: ['Rime fog', '🌫️'],
    51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy drizzle', '🌧️'],
    56: ['Freezing drizzle', '🌧️'], 57: ['Freezing drizzle', '🌧️'],
    61: ['Light rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
    66: ['Freezing rain', '🌧️'], 67: ['Freezing rain', '🌧️'],
    71: ['Light snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '❄️'],
    80: ['Light showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Violent showers', '⛈️'],
    85: ['Snow showers', '🌨️'], 86: ['Snow showers', '🌨️'],
    95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm + hail', '⛈️'], 99: ['Thunderstorm + hail', '⛈️'],
  };
  const wmo = (code) => WMO[code] || ['—', '🌡️'];

  const els = {
    place: document.getElementById('place'),
    pill: document.getElementById('pill'),
    grid: document.getElementById('days'),
    days: [...document.querySelectorAll('.day')],
    updated: document.getElementById('updated'),
    loading: document.getElementById('loading'),
    setup: document.getElementById('setup'),
    error: document.getElementById('error'),
    errorBody: document.getElementById('errorBody'),
  };

  let started = false;
  let timer = null;
  let refreshing = false;
  let queuedRefresh = false; // a refresh requested mid-flight (settings change) runs next
  let hasData = false;
  let failStreak = 0;
  let pendingRefresh = false;
  // WIDGET-SPEC: JS work is yours to gate. Seeded from state.game at init AND flipped by
  // onGame, because onGame reports later flips only — a widget that just listens polls
  // straight through a game that was already running when it loaded.
  let gameOn = false;

  function applySettings(s) {
    // Anything that isn't explicitly glass/transparent renders solid, covering
    // unset AND out-of-spec values.
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    // Accent comes from the theme tokens (global theme or the per-slot style
    // override) — legacy accentColor keys in old layouts are deliberately ignored.
  }

  // Exactly one overlay (or none) is visible at a time; the data layer hides
  // while an overlay is up so nothing bleeds through on a transparent tile.
  function showState(which) {
    els.loading.hidden = which !== 'loading';
    els.setup.hidden = which !== 'setup';
    els.error.hidden = which !== 'error';
    els.grid.hidden = which != null;
    els.updated.hidden = which != null || !els.updated.textContent;
  }

  function setPill(cls, text) {
    els.pill.hidden = false;
    els.pill.className = 'pill ' + cls;
    els.pill.textContent = text;
  }

  // The location setting is either a picked place object {label, latitude,
  // longitude} (unambiguous) or a plain string the geocoder best-matches.
  async function resolvePlace(loc) {
    if (loc && typeof loc === 'object' && loc.latitude != null && loc.longitude != null) {
      return { lat: loc.latitude, lon: loc.longitude, label: loc.label || '' };
    }
    const query = String(loc).trim();
    const cacheKey = 'f7.geo.' + query.toLowerCase();
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey));
      if (cached && cached.lat != null) return cached;
    } catch (e) { /* bad cache entry; refetch */ }
    const response = await fetch(
      'https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' +
      encodeURIComponent(query));
    if (!response.ok) throw new Error('geocoder HTTP ' + response.status);
    const data = await response.json();
    const hit = data.results && data.results[0];
    if (!hit) throw new Error('no match for "' + query + '"');
    const place = { lat: hit.latitude, lon: hit.longitude, label: hit.name };
    localStorage.setItem(cacheKey, JSON.stringify(place));
    return place;
  }

  async function fetchForecast(place, units) {
    const url = 'https://api.open-meteo.com/v1/forecast' +
      '?latitude=' + place.lat + '&longitude=' + place.lon +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&temperature_unit=' + (units === 'fahrenheit' ? 'fahrenheit' : 'celsius') +
      '&timezone=auto&forecast_days=7';
    const response = await fetch(url);
    if (!response.ok) throw new Error('forecast HTTP ' + response.status);
    return response.json();
  }

  // Round if finite, else null — every value is null-guarded before display.
  const num = (v) => (v == null || !isFinite(Number(v))) ? null : Math.round(Number(v));

  function renderDays(data) {
    const daily = data && data.daily;
    if (!daily || !Array.isArray(daily.time) || !daily.time.length) {
      throw new Error('no daily data in response');
    }
    for (let i = 0; i < els.days.length; i++) {
      const col = els.days[i];
      const cell = (cls) => col.querySelector(cls);
      const t = daily.time[i];
      col.classList.toggle('today', i === 0);
      if (!t) {
        for (const cls of ['.d', '.hi', '.lo', '.pp']) cell(cls).textContent = '--';
        cell('.g').textContent = '·';
        cell('.c').textContent = '';
        continue;
      }
      const [label, glyph] = wmo(num(daily.weather_code && daily.weather_code[i]));
      const hi = num(daily.temperature_2m_max && daily.temperature_2m_max[i]);
      const lo = num(daily.temperature_2m_min && daily.temperature_2m_min[i]);
      const pp = num(daily.precipitation_probability_max && daily.precipitation_probability_max[i]);
      cell('.d').textContent = i === 0 ? 'Today'
        : new Date(t + 'T12:00').toLocaleDateString([], { weekday: 'short' });
      cell('.g').textContent = glyph;
      cell('.c').textContent = label;
      cell('.hi').textContent = hi == null ? '--' : hi + '°';
      cell('.lo').textContent = lo == null ? '--' : lo + '°';
      cell('.pp').textContent = '💧' + (pp == null ? '--' : pp) + '%';
    }
  }

  async function refresh() {
    if (refreshing) { queuedRefresh = true; return; }
    if (document.hidden || gameOn) { pendingRefresh = true; return; }
    const s = WW.settings;
    // A missing key mirrors the manifest default (the host merges defaults; the
    // harness delivers raw settings) — but an explicitly cleared location means
    // the user removed it, so ask for one instead of guessing.
    const loc = s.location != null ? s.location : 'Madrid';
    const hasLoc = (loc && typeof loc === 'object' && loc.latitude != null) ||
      (typeof loc === 'string' && loc.trim() !== '');
    if (!hasLoc) { showState('setup'); els.pill.hidden = true; return; }

    refreshing = true;
    if (!hasData) showState('loading');
    try {
      const place = await resolvePlace(loc);
      // Re-checked after the await, as in weather: the geocoder runs first for an
      // uncached name, and a game starting during it must not be followed by the
      // forecast request.
      if (gameOn) { pendingRefresh = true; return; }
      const data = await fetchForecast(place, s.units);
      // ...and again on the far side of the network await, or seven day cells and the
      // state card get rendered during the game anyway.
      if (gameOn) { pendingRefresh = true; return; }
      renderDays(data);
      els.place.textContent = place.label;
      els.updated.textContent = 'Updated ' +
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · Open-Meteo';
      hasData = true;
      failStreak = 0;
      document.body.classList.remove('stale');
      // Healthy: no pill. It reports exceptions, and a seven-day forecast that is simply
      // working has none — LIVE on a forecast tile said nothing the forecast did not.
      els.pill.hidden = true;
      showState(null);
    } catch (e) {
      // Same rule as weather: a rejection skips the post-await gates, so a failure seen
      // during a game has to be recorded as pending rather than counted as a real
      // failure — failStreak also drives the backoff, and a paused widget has not earned
      // a stretched interval.
      if (gameOn) { pendingRefresh = true; return; }
      WW.log('forecast7 refresh failed: ' + e.message);
      failStreak++;
      if (hasData) {
        // Stale: old data beats no data — keep it visible, dimmed.
        document.body.classList.add('stale');
        setPill('muted', 'Stale');
        showState(null);
      } else {
        els.errorBody.textContent = e.message +
          '. Check the location in Settings and the network connection.';
        els.pill.hidden = true;
        showState('error');
      }
    } finally {
      refreshing = false;
      if (queuedRefresh) {
        // A settings change arrived while this request was in flight — the data just
        // rendered may be for the old location/units, so go again immediately.
        queuedRefresh = false;
        refresh();
      }
    }
  }

  // Self-scheduling loop: one bad response never kills it. 30 min cadence when
  // healthy; failures retry with exponential backoff (2, 4, 8, 16 min, cap 30).
  async function tick() {
    try { await refresh(); }
    finally {
      clearTimeout(timer);
      const mins = failStreak ? Math.min(30, 2 * Math.pow(2, failStreak - 1)) : 30;
      timer = setTimeout(tick, mins * 60 * 1000);
    }
  }

  WW.onInit((state) => {
    gameOn = !!(state.game && state.game.active);
    applySettings(WW.settings);
    // Repeat inits (live setting edits) re-apply settings and refresh once —
    // clearTimeout keeps a single self-scheduling chain, never a stack.
    if (started) clearTimeout(timer);
    started = true;
    tick();
  });

  // No network work while hidden; refresh once on return if anything was missed.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !started) return;
    if (pendingRefresh || !hasData) {
      pendingRefresh = false;
      clearTimeout(timer);
      tick();
    }
  });

  document.getElementById('retry').addEventListener('click', () => {
    if (refreshing || !started) return;
    clearTimeout(timer);
    tick();
  });

  // A game ending is the user coming back to the panel — the same reasoning as the
  // visibilitychange handler above, and it reuses the same catch-up path.
  WW.onGame((g) => {
    gameOn = !!(g && g.active);
    if (gameOn || !started) return;
    if (pendingRefresh || !hasData) {
      pendingRefresh = false;
      // clearTimeout + tick(), exactly as the visibilitychange handler above does, and
      // for the same reason. A tick refused during the game still armed the NEXT timeout
      // before returning, so calling refresh() directly here left that deadline standing:
      // the widget could fetch on the flip and again seconds later, and if the first was
      // still in flight the second only set queuedRefresh and forced a third. Restarting
      // the chain from the catch-up is what keeps one cadence.
      clearTimeout(timer);
      tick();
    }
  });
</script>
</body>
</html>
