<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hue Lights</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Widget-specific layout only — tokens, background/bgStyle handling and the
   * .card/.state-card/.btn/.meter anatomy come from widget-base.css. */
  #rooms {
    display: grid;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .room {
    padding: 8px 10px;   /* denser than the .card default — the panel is 400px tall */
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0; min-height: 0;
    transition: border-color var(--dur-mid) var(--ease), background var(--dur-mid) var(--ease);
  }
  .room.on {
    border-color: rgba(var(--accent-rgb), 0.55);
    background: rgba(var(--accent-rgb), 0.12);
  }
  .room .head { display: flex; align-items: center; gap: 8px; cursor: pointer; touch-action: manipulation; }
  .room .bulb { font-size: clamp(14px, 5.5vh, 24px); filter: grayscale(1) brightness(0.6); transition: filter var(--dur-mid) var(--ease); }
  .room.on .bulb { filter: none; }
  .room .name {
    flex: 1;
    color: var(--text);
    font-size: calc(clamp(12px, 4.6vh, 18px) * var(--name-scale, 1));
    font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .room .state {
    color: var(--text-muted);
    font-size: calc(clamp(9px, 3vh, 12px) * var(--detail-scale, 1));
    font-variant-numeric: tabular-nums;
  }
  .room .bri { display: flex; align-items: center; gap: 8px; }
  .room .bri button {
    font: inherit; font-size: clamp(13px, 5vh, 20px);
    color: var(--text); background: var(--control-bg); border: 1px solid var(--line);
    border-radius: var(--radius-control); width: 15%; min-width: 34px; padding: 2px 0;
    cursor: pointer; touch-action: manipulation; flex: none;
  }
  .room .bri button:active { border-color: var(--accent); }
  .room .bri .meter { flex: 1; height: 10px; border-radius: 5px; }
  .room .bri .meter > i { border-radius: 5px; }
  .scenes { display: flex; flex-wrap: wrap; gap: 5px; }
  /* Scene chips ride on .btn for token colors/behavior; sized down to keep the
   * original chip layout. */
  .scenes .btn {
    min-width: 0; min-height: 0;
    font-size: calc(clamp(9px, 3vh, 12px) * var(--detail-scale, 1));
    color: var(--text-muted);
    border-radius: var(--radius-pill); padding: 2px 10px;
    touch-action: manipulation;
    max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .scenes .btn:active { border-color: var(--accent); color: var(--accent); }
  /* Pairing / message overlays: .state-card anatomy, shown via inline display. */
  #pair, #message, #legacy { position: fixed; inset: 0; display: none; }
  #pair .state-title, #message .state-title { font-size: clamp(13px, 5vh, 19px); }
  #pairBtn { font-size: clamp(14px, 5.5vh, 22px); padding: 10px 30px; touch-action: manipulation; }
</style>
</head>
<body>
  <div id="rooms"></div>
  <div id="pair" class="state-card">
    <div class="state-title">Press the round <b>link button</b> on your Hue Bridge…</div>
    <button id="pairBtn" class="btn primary">…then tap here to pair</button>
    <small id="pairHint" class="state-body"></small>
  </div>
  <div id="message" class="state-card"></div>
  <div id="legacy" class="state-card">
    <div class="state-title">This bridge did not answer over HTTPS</div>
    <button id="legacyBtn" class="btn">Use the legacy API anyway</button>
    <small id="legacyHint" class="state-body"></small>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { ip: '', showScenes: true };
  let username = null;
  let mode = null;   // 'v2' (CLIP v2) or 'v1' (legacy /api) — probed once per session
  // WIDGET-SPEC: JS work is yours to gate. Seeded from state.game at init AND flipped by
  // onGame, because onGame reports later flips only — a widget that just listens polls
  // straight through a game that was already running when it loaded.
  let gameOn = false;
  let pendingSettings = null;   // the settings a paused connect was holding
  let pendingInit = false;      // ...and whether that init still owes a full connect
  let missedWhilePaused = false;   // something was due while the game had the foreground
  let pollTimer = null;
  // Declared HERE, above the WW.onInit registration below, not beside probeV2 where they
  // are used. onInit replays synchronously at registration, so connect() — which clears
  // both — runs during script evaluation: left further down, they were still in the
  // temporal dead zone and every hue run threw
  // "Cannot access 'probeTimer' before initialization".
  let probeTimer = null;
  let probing = false;   // a probeV2 request is in the air right now
  // Bumped by every connect(). An in-flight probeV2 cannot be cancelled, and it reads the
  // CURRENT cfg.ip when it completes — so a probe started against the old bridge could
  // answer after a switch, call rememberV2() for the NEW address and start v2 polling
  // there, permanently misclassifying a v1-only replacement. The token lets a late answer
  // recognise that it belongs to a connection that is over.
  let connectGen = 0;
  let holdoff = 0;   // suppress poll rendering briefly after a local action
  const BRI_STEP = 15; // brightness step, percent

  const v1api = (path) => 'http://' + cfg.ip + '/api/' + username + path;
  // Bridge traffic can NEVER succeed browser-side from a widget origin — v2 is
  // https behind the bridge's self-signed cert (ERR_CERT_AUTHORITY_INVALID) and
  // v1 is plain http from an https origin (blocked as mixed content). Browser-
  // first fetches sprayed a console error on every poll (#44): go proxy-only.
  const v1fetch = (url, init) => WW.fetch(url, Object.assign({ proxy: 'always' }, init || {}));
  // CLIP v2: the v1 username doubles as the application key.
  const v2fetch = (path, init) => {
    init = init || {};
    init.headers = { 'hue-application-key': username };
    init.insecure = true;
    init.proxy = 'always';
    return WW.fetch('https://' + cfg.ip + '/clip/v2' + path, init);
  };

  WW.onInit(async (state) => {
    gameOn = !!(state.game && state.game.active);
    const s = state.settings;
    // bgStyle drives the widget-base panel-opacity classes (default = solid).
    document.body.classList.toggle('bg-solid', s.bgStyle !== 'transparent' && s.bgStyle !== 'glass');
    document.body.classList.toggle('bg-glass', s.bgStyle === 'glass');
    document.body.classList.toggle('bg-transparent', s.bgStyle === 'transparent');
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy color keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--name-scale', String((Number(s.nameSize) || 100) / 100));
    document.body.style.setProperty('--detail-scale', String((Number(s.detailSize) || 100) / 100));
    cfg.showScenes = s.showScenes !== 'off';

    cfg.ip = String(s.bridgeIp || '').trim();
    // Finding the bridge is network work too: cloud discovery, then the /api/config
    // probe. Gating only poll() left both running through a game, which is how this
    // widget kept reaching discovery.meethue.com while paused. Held with the settings
    // that were current, so a game ending re-enters with what the user configured.
    pendingSettings = s;
    if (gameOn) {
      pendingInit = true;
      missedWhilePaused = true;
      showMessage('Paused', 'A game is running.');
      return;
    }
    pendingInit = false;
    await connect(s);
  });

  async function connect(s) {
    const gen = ++connectGen;
    hideMessage();   // a resumed connect must take the Paused card down before it draws
    // ...and the SETUP overlays too. Pair and the legacy-http choice are full-screen
    // cards belonging to the bridge that was current when they went up; switching
    // bridges left one covering the new bridge's rooms permanently, because the paths
    // that hide them only run when that same flow completes.
    document.getElementById('pair').style.display = 'none';
    document.getElementById('legacy').style.display = 'none';
    // STOP the previous bridge's poll loop before doing anything else, and forget its
    // credential. cfg.ip is already the NEW address by the time this runs, so a retained
    // four-second tick — armed for the old bridge, and no longer refused once gameOn has
    // flipped false — would send the old bridge's application key to an address that has
    // not been validated yet. connect() re-reads the key for the new IP from localStorage
    // further down, so nothing is lost by clearing it here.
    clearInterval(pollTimer);
    pollTimer = null;
    clearTimeout(probeTimer);
    probeTimer = null;
    username = null;
    mode = null;
    let discovered = false;
    // The address stays LOCAL until the generation check below commits it. connect() runs
    // concurrently with itself — a settings change starts a new one while this one is still
    // in the cloud round trip — and v1api/v2fetch interpolate cfg.ip at REQUEST time, not at
    // connect time. So a late discovery writing straight to cfg.ip would redirect the newer
    // connection: it validated the address the user configured, read that bridge's
    // application key, and would then send the key to whatever the cloud handed this one.
    let ip = cfg.ip;
    if (!ip) {
      // Cloud discovery is rate-limited by Philips and CORS-noisy (the browser-first
      // attempt logs an error before the proxy fallback) — at most one attempt per
      // 10 minutes, cached in localStorage so every instance and re-init shares it (#36).
      const DISCO_KEY = 'hue-discovery';
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(DISCO_KEY) || 'null'); } catch (e) { /* ignore */ }
      // A FOUND bridge is trusted for 10 minutes; a MISS only for one — a failure
      // while the network/bridge is still coming up must not pin "No Hue Bridge
      // found" on every instance for ten minutes after connectivity recovers.
      const fresh = cached && typeof cached.at === 'number' &&
        Date.now() - cached.at < (cached.ip ? 600000 : 60000);
      if (fresh) {
        if (cached.ip) { ip = String(cached.ip); discovered = true; }
      } else {
        let found = null;
        try {
          const res = await v1fetch('https://discovery.meethue.com/');  // no CORS for widget origins: proxy-only
          const list = await res.json();
          if (list && list[0] && list[0].internalipaddress) found = String(list[0].internalipaddress);
        } catch (e) { /* fall through to message */ }
        if (found) { ip = found; discovered = true; }
        // Cached even when this connection turns out to be superseded: the entry is the
        // shared rate limiter for an endpoint Philips throttles, so the attempt counts
        // however it ends. It records what discovery ACTUALLY returned — writing cfg.ip
        // here stamped a concurrent connection's manually configured address into the
        // cache as though the cloud had returned it.
        try { localStorage.setItem(DISCO_KEY, JSON.stringify({ at: Date.now(), ip: found })); } catch (e) { /* ignore */ }
      }
    }

    // Ordered deliberately: superseded first (say nothing, touch nothing), then paused
    // (owed work), and only then the terminal card.
    //
    // Checked BETWEEN the two awaits, not only after both: discovery is a cloud round trip,
    // and a game starting during it would otherwise be followed by the /api/config
    // validation request below. Discovery FAILING during one used to reach 'No Hue Bridge
    // found' above this gate — a verdict, recorded in neither flag, so the resume found no
    // work and the card stayed up for good.
    if (gen !== connectGen) return;   // a newer connect() owns the widget now
    if (gameOn) {
      missedWhilePaused = true;
      pendingInit = true;
      showMessage('Paused', 'A game is running.');
      return;
    }
    if (!ip) {
      showMessage('No Hue Bridge found', 'Set the bridge IP in the widget settings (it\'s shown in the Hue app under Settings → My Hue system).');
      return;
    }
    cfg.ip = ip;   // this connection owns the widget: commit the address it resolved

    // Never trust an address blindly: cloud discovery hands out stale or wrong
    // IPs (the bridge moved on DHCP, or the ISP shares one public IP between
    // households), which can point at a router instead of a bridge. Every real
    // bridge answers the unauthenticated /api/config with JSON carrying its
    // bridgeid; anything else is not a Hue Bridge.
    const validated = await isHueBridge(cfg.ip);
    // A late continuation from a connection that is over must not speak for the current
    // one: it validated the OLD bridge, and everything below writes global state and UI
    // for whatever address is current now.
    if (gen !== connectGen) return;
    if (!validated) {
      // A validation that failed DURING a game is owed work, not a verdict — this is the
      // terminal card, and without recording anything the resume had nothing to retry.
      if (gameOn) {
        pendingInit = true;
        missedWhilePaused = true;
        showMessage('Paused', 'A game is running.');
        return;
      }
      showMessage(cfg.ip + ' is not a Hue Bridge', discovered
        ? 'Auto-discovery returned a wrong address (stale cloud cache or a shared ISP IP). Enter the bridge IP in the widget settings — the Hue app shows it under Settings → My Hue system → ⓘ.'
        : 'Nothing at that address answers like a Hue Bridge. Check the IP in the Hue app under Settings → My Hue system → ⓘ.');
      return;
    }

    // Re-checked after the awaits above, for the reason radar's start() is: cloud
    // discovery and the /api/config validation are both slow, and a game starting during
    // either would otherwise be answered by begin() opening the polling stream.
    if (gameOn) {
      missedWhilePaused = true;
      pendingInit = true;
      showMessage('Paused', 'A game is running.');
      return;
    }
    try { username = localStorage.getItem('hue-user-' + cfg.ip); } catch (e) { /* private mode */ }
    if (username) begin();
    else showPairing();
  }

  async function isHueBridge(ip) {
    try {
      const res = await v1fetch('http://' + ip + '/api/config');
      if (!res.ok) return false;
      const c = await res.json();   // routers serve HTML here — json() throws
      return !!(c && c.bridgeid);
    } catch (e) {
      return false;
    }
  }

  // --- pairing -----------------------------------------------------------------

  function showPairing() {
    document.getElementById('pair').style.display = 'flex';
    document.getElementById('pairHint').textContent = 'Bridge: ' + cfg.ip;
  }

  document.getElementById('pairBtn').addEventListener('click', async () => {
    try {
      const res = await v1fetch('http://' + cfg.ip + '/api', {
        method: 'POST',
        body: JSON.stringify({ devicetype: 'waveshare_widgets#panel' }),
      });
      const json = await res.json();
      const entry = Array.isArray(json) ? json[0] : null;
      if (entry && entry.success && entry.success.username) {
        username = entry.success.username;
        try { localStorage.setItem('hue-user-' + cfg.ip, username); } catch (e) { /* private mode */ }
        // Fresh pairing restarts the relationship, so the remembered v2 capability goes
        // with it — otherwise a bridge factory-reset down to v1 would be stuck asking for
        // an API generation it no longer serves, with no way to re-probe.
        try { localStorage.removeItem('hue-v2-' + cfg.ip); } catch (e) { /* private mode */ }
        try { localStorage.removeItem('hue-v1ok-' + cfg.ip); } catch (e) { /* private mode */ }
        document.getElementById('pair').style.display = 'none';
        begin();
      } else if (entry && entry.error && entry.error.type === 101) {
        document.getElementById('pairHint').textContent = 'Link button not pressed — press it on the bridge, then tap again. (' + cfg.ip + ')';
      } else {
        document.getElementById('pairHint').textContent = 'Unexpected reply from ' + cfg.ip + ' — is this a Hue Bridge?';
      }
    } catch (e) {
      document.getElementById('pairHint').textContent = 'Could not reach ' + cfg.ip + ' — ' + e.message;
    }
  });

  // --- API mode probe ----------------------------------------------------------

  // A bridge that has ever answered CLIP v2 is remembered, per address. That memory is
  // what stops the NETWORK deciding the transport.
  //
  // v1 is plain http and carries `username` in the path — and on this bridge `username`
  // IS the CLIP v2 application key. So every route from v2 to v1 hands the key, and every
  // later light command, to anyone watching the LAN. Both routes here used to be openable
  // by a transport failure: two TypeErrors while polling, or one at probe time. A TypeError
  // is precisely what an adjacent attacker interfering with TLS produces, so the widget
  // was taking instruction on its own security properties from the party it was meant to
  // be protected from.
  //
  // Cleared on pairing, which is the one legitimate way this relationship restarts (a
  // factory-reset bridge invalidates the stored username anyway).
  const v2Key = () => 'hue-v2-' + cfg.ip;
  const knownV2 = () => { try { return localStorage.getItem(v2Key()) === '1'; } catch (e) { return false; } };
  const rememberV2 = () => { try { localStorage.setItem(v2Key(), '1'); } catch (e) { /* private mode */ } };
  // Separately: this address may use the legacy API even though we could not confirm HTTPS.
  // Only ever set by the user tapping the button below — never by a failure.
  const v1okKey = () => 'hue-v1ok-' + cfg.ip;
  const legacyAllowed = () => { try { return localStorage.getItem(v1okKey()) === '1'; } catch (e) { return false; } };
  const allowLegacy = () => { try { localStorage.setItem(v1okKey(), '1'); } catch (e) { /* private mode */ } };

  // Probe CLIP v2. Only a 200 puts this session on v2; every other outcome — any other
  // status, or no answer at all — requires the user to say so before the key touches http.
  //
  // That asymmetry is the whole rule, and it is narrower than "the bridge decides". The v2
  // probe rides `insecure: true`, and the host accepts any certificate for a LAN address
  // (RemoteCertificateValidationCallback => true), so the channel is unauthenticated: an
  // on-LAN attacker impersonating the bridge can return 404 as easily as it can drop the
  // connection. An ANSWER is therefore no evidence of who answered, and "the bridge told us
  // it is v1" was never something this code could actually observe.
  //
  // But only one direction needs authorization. A 200 keeps the key on TLS, so a forged 200
  // buys an attacker nothing it does not already have. A non-200 moves the key to cleartext,
  // and that is the move no unauthenticated party gets to make on the user's behalf.
  const PROBE_RETRY_MS = 15000;

  async function begin() {
    if (mode !== null) { startPolling(); return; }
    if (knownV2()) { mode = 'v2'; startPolling(); return; }        // settled by a real v2 answer
    if (legacyAllowed()) { mode = 'v1'; startPolling(); return; }  // settled by the user
    await probeV2();
  }

  async function probeV2(gen = connectGen) {
    // A game that starts while this request is in the air leaves probeTimer null, so the
    // onGame handler sees nothing to clear — and the failure path below would arm a fresh
    // retry that then runs for the whole game. The probe itself records that it was
    // running, so a game entered mid-probe is caught by the flag rather than by the timer.
    probing = true;
    let confirmed = false;
    try {
      const res = await v2fetch('/resource/room');
      confirmed = res.status === 200;
    } catch (e) {
      confirmed = false;
    }
    // The mode may have been settled WHILE this request was in flight — the button below
    // can only cancel a pending timer, never a fetch already on the wire. A late answer
    // arriving after that would either put the question back on screen seconds after the
    // user answered it, or quietly move the session to v2 while v1 polling is already
    // running. Whoever decided first decided.
    probing = false;
    // A connect() happened while this was on the wire: this answer describes a bridge the
    // widget is no longer talking to, and acting on it would settle the mode — and
    // rememberV2 — for whatever address is current now.
    if (gen !== connectGen) return;
    if (mode !== null) return;
    // A game that started while this was on the wire: stop here rather than arming the
    // 15-second retry below, which would then run for the whole session. The paused init
    // owes a full connect, and connect() owns the probe.
    if (gameOn) { missedWhilePaused = true; pendingInit = true; return; }
    if (confirmed) {
      clearTimeout(probeTimer);
      probeTimer = null;
      mode = 'v2';
      rememberV2();
      document.getElementById('legacy').style.display = 'none';
      WW.log('hue: bridge API mode v2');
      startPolling();
      return;
    }
    // Ask — and KEEP TRYING while the question is on screen. A transient TLS failure would
    // otherwise leave the tile with one way out: authorizing plaintext permanently, for a
    // bridge that is about to come back on https. The offer stays available for bridges
    // that really have no https, and resolves itself for the ones that do.
    showLegacyChoice();
    clearTimeout(probeTimer);
    probeTimer = setTimeout(() => probeV2(gen), PROBE_RETRY_MS);
  }

  function showLegacyChoice() {
    document.getElementById('rooms').innerHTML = '';
    document.getElementById('message').style.display = 'none';
    document.getElementById('legacy').style.display = 'flex';
    document.getElementById('legacyHint').textContent =
      cfg.ip + ' — still retrying HTTPS. The legacy API sends your Hue key unencrypted over '
      + 'your network; older bridges support nothing else. If this bridge worked before, '
      + 'something is interfering with HTTPS and you should not accept.';
  }

  document.getElementById('legacyBtn').addEventListener('click', () => {
    clearTimeout(probeTimer);
    probeTimer = null;
    allowLegacy();
    document.getElementById('legacy').style.display = 'none';
    mode = 'v1';
    WW.log('hue: legacy API allowed by the user for ' + cfg.ip);
    startPolling();
  });

  // --- polling → normalized room model ----------------------------------------
  // Both API generations are normalized into one room shape so render() and the
  // action handlers stay single-path:
  //   { key, name, on, pct (0-100), scenes: [{id, name}], v1Group? , v2Light? }

  function startPolling() {
    poll();
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 4000);
  }

  let polling = false; // slow polls must not overlap the 4 s interval

  async function poll() {
    if (gameOn) { missedWhilePaused = true; return; }
    if (polling || Date.now() < holdoff) return;
    polling = true;
    try {
      await pollOnce();
    } finally {
      polling = false;
    }
  }

  async function pollOnce() {
    let rooms;
    try {
      rooms = mode === 'v2' ? await pollV2() : await pollV1();
      // Both pollV1 and pollV2 issue their requests SEQUENTIALLY — scenes after rooms for
      // v1; zones, grouped lights and scenes after rooms for v2 — so a game starting
      // mid-sequence had every remaining request still to come. They re-check the gate
      // between awaits and return null, which lands here.
      if (rooms === null) { missedWhilePaused = true; return; }
      if (mode === 'v2') rememberV2();
    } catch (e) {
      // No demotion here, deliberately. This used to drop to v1 after two TypeErrors, and
      // a TypeError is the fetch TRANSPORT layer — exactly what someone interfering with
      // TLS on the LAN produces. The fallback then put the Hue application key and every
      // subsequent light command on plaintext http for the rest of the session, with no
      // way back short of a reload: a failure the attacker can cause, choosing the
      // security properties of everything after it.
      //
      // A bridge that speaks CLIP v2 keeps being asked over CLIP v2. When v2 is failing
      // the tile says the bridge is unreachable, which is the same thing it says for every
      // other failure and is true. v1-only bridges are untouched — they never reach this
      // branch, because they were never in v2 mode.
      //
      // Found by sweeping for siblings rather than reported: it is the last catch in the
      // gated widgets that painted a verdict without checking the gate. Unlike radar's it
      // heals itself — poll() runs every four seconds and sets the flag on each tick of the
      // game — so what this changes is that the failure is no longer PAINTED during the
      // pause, and a game ending inside that four-second window no longer resumes onto an
      // error card the next tick has already disproved.
      if (gameOn) { missedWhilePaused = true; return; }
      showMessage('Hue Bridge unreachable', cfg.ip + ' — ' + (e.message || e));
      return;
    }
    document.getElementById('message').style.display = 'none';
    render(rooms);
  }

  async function pollV1() {
    // clearInterval stops future ticks; a poll already awaiting the PREVIOUS bridge is
    // untouched by it. Its answer arriving after the resume would pass the gameOn checks,
    // send the rest of its sequence to the new cfg.ip, and paint the old bridge's rooms
    // over the new one — room ids a tap would then act on.
    const gen = connectGen;
    const res = await v1fetch(v1api('/groups'));
    if (gen !== connectGen) return null;
    const groups = await res.json();
    if (groups && groups[0] && groups[0].error) throw new Error(groups[0].error.description);
    // A game can start between these requests. The one already sent cannot be recalled,
    // but the scenes request has not left yet — null tells pollOnce the poll was
    // abandoned mid-sequence rather than that the bridge returned nothing.
    if (gameOn) return null;
    let scenes = {};
    if (cfg.showScenes) {
      const sr = await v1fetch(v1api('/scenes'));
      if (gameOn || gen !== connectGen) return null;   // same final-await gap on the v1 path
      scenes = await sr.json();
    }
    const scenesByGroup = new Map();
    for (const [id, sc] of Object.entries(scenes || {})) {
      if (!sc.group) continue;
      if (!scenesByGroup.has(sc.group)) scenesByGroup.set(sc.group, []);
      if (scenesByGroup.get(sc.group).length < 6) scenesByGroup.get(sc.group).push({ id, name: sc.name });
    }
    return Object.entries(groups)
      .filter(([, g]) => g.type === 'Room' || g.type === 'Zone')
      .map(([id, g]) => ({
        key: 'v1-' + id,
        name: g.name,
        on: !!(g.state && g.state.any_on),
        pct: Math.round((((g.action && g.action.bri) != null ? g.action.bri : 254) / 254) * 100),
        scenes: scenesByGroup.get(id) || [],
        v1Group: id,
      }));
  }

  async function pollV2() {
    // Sequential on purpose: the bridge's embedded TLS server mishandles
    // parallel handshakes, so concurrent requests fail intermittently.
    const gen = connectGen;   // see pollV1: a reconnect invalidates an in-flight sequence
    const rr = await v2fetch('/resource/room');
    if (gameOn || gen !== connectGen) return null;   // three more requests still to come
    const zr = await v2fetch('/resource/zone');
    if (gameOn || gen !== connectGen) return null;
    const gr = await v2fetch('/resource/grouped_light');
    if (gameOn || gen !== connectGen) return null;
    // Surface bridge errors (revoked app key, bridge restarting) instead of
    // rendering the misleading "No rooms" empty state from an error body.
    const bad = !rr.ok ? rr : !zr.ok ? zr : !gr.ok ? gr : null;
    if (bad) {
      let detail = '';
      try {
        const errs = (await bad.json()).errors;
        detail = (errs && errs[0] && errs[0].description) || '';
      } catch (e) { /* non-JSON error body */ }
      throw new Error(detail || ('CLIP v2 HTTP ' + bad.status));
    }
    const groups = ((await rr.json()).data || []).concat((await zr.json()).data || []);
    const states = new Map();
    for (const gl of (await gr.json()).data || []) states.set(gl.id, gl);

    const scenesByGroup = new Map();
    if (cfg.showScenes) {
      const sr = await v2fetch('/resource/scene');
      if (gameOn || gen !== connectGen) return null;   // the LAST await is a gap too
      for (const sc of (await sr.json()).data || []) {
        const gid = sc.group && sc.group.rid;   // matches the room/zone id
        if (!gid) continue;
        if (!scenesByGroup.has(gid)) scenesByGroup.set(gid, []);
        if (scenesByGroup.get(gid).length < 6) {
          scenesByGroup.get(gid).push({ id: sc.id, name: (sc.metadata && sc.metadata.name) || 'Scene' });
        }
      }
    }

    const rooms = [];
    for (const g of groups) {
      // The grouped_light service rid is the control handle for the room/zone.
      const svc = (g.services || []).find((s) => s.rtype === 'grouped_light');
      if (!svc) continue;
      const st = states.get(svc.rid) || {};
      rooms.push({
        key: 'v2-' + g.id,
        name: (g.metadata && g.metadata.name) || 'Room',
        on: !!(st.on && st.on.on),
        pct: (st.dimming && st.dimming.brightness != null) ? Math.round(st.dimming.brightness) : 100,
        scenes: scenesByGroup.get(g.id) || [],
        v2Light: svc.rid,
      });
    }
    return rooms;
  }

  // --- render (single path over the normalized model) --------------------------
  // Cards are BUILT only when the structure changes (room set, names, scenes,
  // column count) and updated in place otherwise — the reconcile poll right after
  // a tap must never replace the card under the user's finger.

  let roomSig = null;   // structural signature of the built cards
  let roomUI = [];      // [{ card, stateEl, fill, room }] in render order

  function render(rooms) {
    rooms = rooms.slice().sort((a, b) => a.name.localeCompare(b.name));
    if (!rooms.length) {
      document.getElementById('rooms').textContent = '';
      roomSig = null;
      roomUI = [];
      showMessage('No rooms on this bridge', 'Create rooms in the Hue app and they\'ll appear here.');
      return;
    }
    let cols = rooms.length <= 2 ? rooms.length : rooms.length <= 6 ? 3 : 4;
    // Cap columns by available width (quarter slots are ~320 px): below ~150 px
    // per card the name ellipsizes to one letter and the −/+ buttons squeeze the
    // brightness bar to zero width.
    cols = Math.max(1, Math.min(cols, Math.floor(document.body.clientWidth / 150) || 1));
    const sig = cols + '|' + rooms.map((r) =>
      r.key + ':' + r.name + ':' + r.scenes.map((sc) => sc.id + '=' + sc.name).join(',')).join(';');
    if (sig !== roomSig) {
      buildCards(rooms, cols);
      roomSig = sig;
    }
    // Reconcile in place: merge polled truth into the objects the tap handlers
    // hold, then repaint — this also rolls back any optimistic flip that failed.
    rooms.forEach((r, i) => {
      Object.assign(roomUI[i].room, r);
      updateCard(roomUI[i]);
    });
  }

  function updateCard(ui) {
    const r = ui.room;
    ui.card.classList.toggle('on', r.on);
    ui.stateEl.textContent = r.on ? r.pct + '%' : 'off';
    ui.fill.style.width = (r.on ? r.pct : 0) + '%';
  }

  function buildCards(rooms, cols) {
    const wrap = document.getElementById('rooms');
    wrap.textContent = '';
    roomUI = [];
    wrap.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    for (const r of rooms) {
      const card = document.createElement('div');
      card.className = 'room card';
      const ui = { card, stateEl: null, fill: null, room: r };

      const head = document.createElement('div');
      head.className = 'head pressable';
      const bulb = document.createElement('span');
      bulb.className = 'bulb';
      bulb.textContent = '💡';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;
      const stateEl = document.createElement('span');
      stateEl.className = 'state';
      ui.stateEl = stateEl;
      head.append(bulb, name, stateEl);
      head.addEventListener('click', () => toggleRoom(ui));
      card.appendChild(head);

      const briRow = document.createElement('div');
      briRow.className = 'bri';
      const minus = document.createElement('button');
      minus.className = 'pressable';
      minus.textContent = '−';
      minus.setAttribute('aria-label', 'Decrease brightness');
      minus.addEventListener('click', () => stepBrightness(ui, -1));
      const bar = document.createElement('div');
      bar.className = 'bar meter';
      const fill = document.createElement('i');
      fill.className = 'fill';
      ui.fill = fill;
      bar.appendChild(fill);
      const plus = document.createElement('button');
      plus.className = 'pressable';
      plus.textContent = '+';
      plus.setAttribute('aria-label', 'Increase brightness');
      plus.addEventListener('click', () => stepBrightness(ui, +1));
      briRow.append(minus, bar, plus);
      card.appendChild(briRow);

      if (cfg.showScenes && r.scenes.length) {
        const row = document.createElement('div');
        row.className = 'scenes';
        for (const sc of r.scenes) {
          const b = document.createElement('button');
          b.className = 'btn';
          b.textContent = sc.name;
          b.addEventListener('click', (ev) => { ev.stopPropagation(); recallScene(ui, sc.id, b); });
          row.appendChild(b);
        }
        card.appendChild(row);
      }
      roomUI.push(ui);
      wrap.appendChild(card);
    }
  }

  // --- actions (dispatch per API mode) -----------------------------------------
  // State theater: every tap flips the UI optimistically and reconciles from the
  // next poll; a failed/refused CLIP request fail-flashes the tapped card/chip.

  // Restartable flash (fail-flash / confirm-flash from widget-base): remove,
  // force reflow, re-add — otherwise a second flash on the same element is silent.
  function flash(elm, cls) {
    elm.classList.remove(cls);
    void elm.offsetWidth;
    elm.classList.add(cls);
  }

  function toggleRoom(ui) {
    const r = ui.room;
    r.on = !r.on;                  // optimistic — the next poll reconciles
    updateCard(ui);
    if (mode === 'v2') actV2('/resource/grouped_light/' + r.v2Light, { on: { on: r.on } }, ui.card);
    else actV1(r.v1Group, { on: r.on }, ui.card);
  }

  function stepBrightness(ui, dir) {
    const r = ui.room;
    r.pct = Math.max(1, Math.min(100, r.pct + dir * BRI_STEP));
    r.on = true;                   // stepping implies on (matches the PUT below)
    updateCard(ui);                // optimistic — the next poll reconciles
    if (mode === 'v2') actV2('/resource/grouped_light/' + r.v2Light, { on: { on: true }, dimming: { brightness: r.pct } }, ui.card);
    else actV1(r.v1Group, { on: true, bri: Math.max(1, Math.min(254, Math.round(r.pct / 100 * 254))) }, ui.card);
  }

  function recallScene(ui, sceneId, chip) {
    // A scene recall often changes nothing visible on the card, so the chip
    // confirm-flashes on success (and fail-flashes like every other action).
    if (mode === 'v2') actV2('/resource/scene/' + sceneId, { recall: { action: 'active' } }, chip, true);
    else actV1(ui.room.v1Group, { scene: sceneId }, chip, true);
  }

  async function actV1(groupId, body, el, confirm) {
    holdoff = Date.now() + 1200;   // let the bridge settle before the next poll repaints
    try {
      const res = await v1fetch(v1api('/groups/' + groupId + '/action'), {
        method: 'PUT',
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // v1 reports many refusals as a 200 whose body array carries error entries
      // (deleted scene, unreachable group) — status alone proves nothing.
      const answers = await res.json().catch(() => null);
      const refused = Array.isArray(answers) && answers.find((a) => a && a.error);
      if (refused) throw new Error(refused.error.description || 'bridge refused');
      if (confirm && el) flash(el, 'confirm-flash');
    } catch (e) {
      WW.log('hue: action failed: ' + e.message);
      if (el) flash(el, 'fail-flash');   // the reconcile poll below reverts the optimistic UI
    }
    holdoff = 0;
    poll();
  }

  async function actV2(path, body, el, confirm) {
    holdoff = Date.now() + 1200;
    try {
      const res = await v2fetch(path, { method: 'PUT', body: JSON.stringify(body) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // v2 is better behaved status-wise, but errors[] can still ride a 200.
      const v2body = await res.json().catch(() => null);
      if (v2body && Array.isArray(v2body.errors) && v2body.errors.length)
        throw new Error(v2body.errors[0].description || 'bridge refused');
      if (confirm && el) flash(el, 'confirm-flash');
    } catch (e) {
      WW.log('hue: action failed: ' + e.message);
      if (el) flash(el, 'fail-flash');   // the reconcile poll below reverts the optimistic UI
    }
    holdoff = 0;
    poll();
  }

  // Every other showMessage caller is terminal — no bridge, not a bridge. "Paused" is the
  // first RECOVERABLE one, and the message overlay follows the pairing overlay in the DOM:
  // left up, it covers the Pair button, so a first-time user could not pair after the game
  // ended without reloading the widget.
  function hideMessage() {
    document.getElementById('message').style.display = 'none';
  }

  function showMessage(title, detail) {
    const msg = document.getElementById('message');
    msg.style.display = 'flex';
    msg.innerHTML = '';
    const h = document.createElement('div');
    h.className = 'state-title';
    h.textContent = title;
    msg.appendChild(h);
    if (detail) {
      const sm = document.createElement('small');
      sm.className = 'state-body';
      sm.textContent = detail;
      msg.appendChild(sm);
    }
  }

  // A game ending is the user coming back to the panel: catch up at once rather than
  // waiting out whatever remained of the interval.
  WW.onGame((g) => {
    gameOn = !!(g && g.active);
    // The CLIP-v2 setup probe retries on its own timer every PROBE_RETRY_MS. Gating
    // poll() never touched it, so a game starting while setup was still settling left
    // this widget probing the bridge for the whole session — the exact work the gate
    // exists to stop.
    //
    // Only when that probe was actually IN FLIGHT does this force a reconnect: an
    // established widget owes a poll, not a rediscovery, and re-running the bridge hunt
    // after every game would be a heavier change than the one being made here.
    if (gameOn && (probeTimer || probing)) {
      clearTimeout(probeTimer);
      probeTimer = null;
      missedWhilePaused = true;
      pendingInit = true;   // setup never finished, so the resume owes the whole thing
    }
    if (gameOn || !missedWhilePaused) return;
    missedWhilePaused = false;
    // What was missed decides what to run. An init refused while paused owes a full
    // connect — NOT a poll — because its settings may name a different bridge IP, and
    // connect is the only thing that reads it. Testing "was a timer ever armed" instead
    // got this wrong in the case that matters: change the bridge IP during a game, and
    // the resume polled the old address and never looked at the new one.
    if (pendingInit && pendingSettings) { pendingInit = false; connect(pendingSettings); }
    else poll();
  });

</script>
</body>
</html>
