<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hue Lights</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b0e14;
    color: #e8ecf2;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body.bg-transparent { background: transparent; }
  body.bg-glass { background: rgba(11, 14, 20, 0.55); }
  #rooms {
    display: grid;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .room {
    border-radius: 12px;
    background: rgba(23, 28, 40, 0.65);
    border: 1px solid #232a3a;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0; min-height: 0;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .room.on { border-color: #ffc24b; background: rgba(60, 48, 22, 0.5); }
  .room .head { display: flex; align-items: center; gap: 8px; cursor: pointer; touch-action: manipulation; }
  .room .bulb { font-size: clamp(14px, 5.5vh, 24px); filter: grayscale(1) brightness(0.6); transition: filter 0.2s ease; }
  .room.on .bulb { filter: none; }
  .room .name {
    flex: 1;
    color: var(--name-color, #e8ecf2);
    font-size: calc(clamp(12px, 4.6vh, 18px) * var(--name-scale, 1));
    font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .room .state {
    color: var(--detail-color, #7d8697);
    font-size: calc(clamp(9px, 3vh, 12px) * var(--detail-scale, 1));
  }
  .room .bri { display: flex; align-items: center; gap: 8px; }
  .room .bri button {
    font: inherit; font-size: clamp(13px, 5vh, 20px);
    color: #e8ecf2; background: #171c28; border: 1px solid #232a3a;
    border-radius: 8px; width: 15%; min-width: 34px; padding: 2px 0;
    cursor: pointer; touch-action: manipulation; flex: none;
  }
  .room .bri button:active { border-color: #ffc24b; }
  .room .bri .bar { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .room .bri .fill { height: 100%; background: linear-gradient(90deg, #a86e00, #ffc24b); width: 0%; transition: width 0.25s ease; border-radius: 5px; }
  .scenes { display: flex; flex-wrap: wrap; gap: 5px; }
  .scenes button {
    font: inherit; font-size: calc(clamp(9px, 3vh, 12px) * var(--detail-scale, 1));
    color: var(--detail-color, #aeb7c4); background: rgba(23,28,40,0.9);
    border: 1px solid #232a3a; border-radius: 999px; padding: 2px 10px;
    cursor: pointer; touch-action: manipulation;
    max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .scenes button:active { border-color: #ffc24b; color: #ffc24b; }
  #pair, #message {
    position: fixed; inset: 0;
    display: none; flex-direction: column; gap: 2vh;
    align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    color: #aeb7c4; font-size: clamp(13px, 5vh, 19px);
  }
  #pair small, #message small { color: #545d6e; font-size: 72%; max-width: 88%; }
  #pairBtn {
    font: inherit; font-size: clamp(14px, 5.5vh, 22px);
    color: #062028; background: #ffc24b; border: 0; border-radius: 10px;
    padding: 10px 30px; cursor: pointer; touch-action: manipulation; font-weight: 600;
  }
</style>
</head>
<body>
  <div id="rooms"></div>
  <div id="pair">
    <div>Press the round <b>link button</b> on your Hue Bridge…</div>
    <button id="pairBtn">…then tap here to pair</button>
    <small id="pairHint"></small>
  </div>
  <div id="message"></div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { ip: '', showScenes: true };
  let username = null;
  let mode = null;   // 'v2' (CLIP v2) or 'v1' (legacy /api) — probed once per session
  let pollTimer = null;
  let holdoff = 0;   // suppress poll rendering briefly after a local action
  const BRI_STEP = 15; // brightness step, percent

  const v1api = (path) => 'http://' + cfg.ip + '/api/' + username + path;
  // CLIP v2: https with the bridge's self-signed cert; the v1 username doubles
  // as the application key.
  const v2fetch = (path, init) => {
    init = init || {};
    init.headers = { 'hue-application-key': username };
    init.insecure = true;
    return WW.fetch('https://' + cfg.ip + '/clip/v2' + path, init);
  };

  WW.onInit(async (state) => {
    const s = state.settings;
    document.body.classList.toggle('bg-transparent', s.bgStyle === 'transparent');
    document.body.classList.toggle('bg-glass', s.bgStyle === 'glass');
    document.body.style.setProperty('--name-color', s.nameColor || '#e8ecf2');
    document.body.style.setProperty('--name-scale', (Number(s.nameSize) || 100) / 100);
    document.body.style.setProperty('--detail-color', s.detailColor || '#7d8697');
    document.body.style.setProperty('--detail-scale', (Number(s.detailSize) || 100) / 100);
    cfg.showScenes = s.showScenes !== 'off';

    cfg.ip = String(s.bridgeIp || '').trim();
    let discovered = false;
    if (!cfg.ip) {
      try {
        const res = await WW.fetch('https://discovery.meethue.com/');
        const list = await res.json();
        if (list && list[0] && list[0].internalipaddress) { cfg.ip = list[0].internalipaddress; discovered = true; }
      } catch (e) { /* fall through to message */ }
    }
    if (!cfg.ip) {
      showMessage('No Hue Bridge found', 'Set the bridge IP in the widget settings (it\'s shown in the Hue app under Settings → My Hue system).');
      return;
    }

    // Never trust an address blindly: cloud discovery hands out stale or wrong
    // IPs (the bridge moved on DHCP, or the ISP shares one public IP between
    // households), which can point at a router instead of a bridge. Every real
    // bridge answers the unauthenticated /api/config with JSON carrying its
    // bridgeid; anything else is not a Hue Bridge.
    if (!(await isHueBridge(cfg.ip))) {
      showMessage(cfg.ip + ' is not a Hue Bridge', discovered
        ? 'Auto-discovery returned a wrong address (stale cloud cache or a shared ISP IP). Enter the bridge IP in the widget settings — the Hue app shows it under Settings → My Hue system → ⓘ.'
        : 'Nothing at that address answers like a Hue Bridge. Check the IP in the Hue app under Settings → My Hue system → ⓘ.');
      return;
    }

    try { username = localStorage.getItem('hue-user-' + cfg.ip); } catch (e) { /* private mode */ }
    if (username) begin();
    else showPairing();
  });

  async function isHueBridge(ip) {
    try {
      const res = await WW.fetch('http://' + ip + '/api/config');
      if (!res.ok) return false;
      const c = await res.json();   // routers serve HTML here — json() throws
      return !!(c && c.bridgeid);
    } catch (e) {
      return false;
    }
  }

  // --- pairing -----------------------------------------------------------------

  function showPairing() {
    document.getElementById('pair').style.display = 'flex';
    document.getElementById('pairHint').textContent = 'Bridge: ' + cfg.ip;
  }

  document.getElementById('pairBtn').addEventListener('click', async () => {
    try {
      const res = await WW.fetch('http://' + cfg.ip + '/api', {
        method: 'POST',
        body: JSON.stringify({ devicetype: 'waveshare_widgets#panel' }),
      });
      const json = await res.json();
      const entry = Array.isArray(json) ? json[0] : null;
      if (entry && entry.success && entry.success.username) {
        username = entry.success.username;
        try { localStorage.setItem('hue-user-' + cfg.ip, username); } catch (e) { /* private mode */ }
        document.getElementById('pair').style.display = 'none';
        begin();
      } else if (entry && entry.error && entry.error.type === 101) {
        document.getElementById('pairHint').textContent = 'Link button not pressed — press it on the bridge, then tap again. (' + cfg.ip + ')';
      } else {
        document.getElementById('pairHint').textContent = 'Unexpected reply from ' + cfg.ip + ' — is this a Hue Bridge?';
      }
    } catch (e) {
      document.getElementById('pairHint').textContent = 'Could not reach ' + cfg.ip + ' — ' + e.message;
    }
  });

  // --- API mode probe ----------------------------------------------------------

  // Probe CLIP v2 once per session: newer bridges answer 200 on /resource/room;
  // anything else (404 on v1-only bridges, TLS/connection failure) locks in v1.
  async function begin() {
    if (mode === null) {
      try {
        const res = await v2fetch('/resource/room');
        mode = res.status === 200 ? 'v2' : 'v1';
      } catch (e) {
        mode = 'v1';
      }
      WW.log('hue: bridge API mode ' + mode);
    }
    startPolling();
  }

  // --- polling → normalized room model ----------------------------------------
  // Both API generations are normalized into one room shape so render() and the
  // action handlers stay single-path:
  //   { key, name, on, pct (0-100), scenes: [{id, name}], v1Group? , v2Light? }

  function startPolling() {
    poll();
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 4000);
  }

  let v2Failures = 0; // consecutive CLIP v2 transport failures → demote to v1
  let polling = false; // slow polls must not overlap the 4 s interval

  async function poll() {
    if (polling || Date.now() < holdoff) return;
    polling = true;
    try {
      await pollOnce();
    } finally {
      polling = false;
    }
  }

  async function pollOnce() {
    let rooms;
    try {
      rooms = mode === 'v2' ? await pollV2() : await pollV1();
      v2Failures = 0;
    } catch (e) {
      // A TypeError is the fetch transport layer (TLS/connection), not a bridge
      // reply. If v2 transport keeps failing, drop to v1 (plain http) for this
      // session rather than erroring every cycle — bridge API errors (revoked
      // key etc.) are Error, not TypeError, and still surface below.
      if (mode === 'v2' && e instanceof TypeError && ++v2Failures >= 2) {
        mode = 'v1';
        WW.log('hue: CLIP v2 transport failing (' + (e.message || e) + '); falling back to v1');
        try {
          rooms = await pollV1();
        } catch (e2) {
          showMessage('Hue Bridge unreachable', cfg.ip + ' — ' + (e2.message || e2));
          return;
        }
      } else {
        showMessage('Hue Bridge unreachable', cfg.ip + ' — ' + (e.message || e));
        return;
      }
    }
    document.getElementById('message').style.display = 'none';
    render(rooms);
  }

  async function pollV1() {
    const res = await WW.fetch(v1api('/groups'));
    const groups = await res.json();
    if (groups && groups[0] && groups[0].error) throw new Error(groups[0].error.description);
    let scenes = {};
    if (cfg.showScenes) {
      const sr = await WW.fetch(v1api('/scenes'));
      scenes = await sr.json();
    }
    const scenesByGroup = new Map();
    for (const [id, sc] of Object.entries(scenes || {})) {
      if (!sc.group) continue;
      if (!scenesByGroup.has(sc.group)) scenesByGroup.set(sc.group, []);
      if (scenesByGroup.get(sc.group).length < 6) scenesByGroup.get(sc.group).push({ id, name: sc.name });
    }
    return Object.entries(groups)
      .filter(([, g]) => g.type === 'Room' || g.type === 'Zone')
      .map(([id, g]) => ({
        key: 'v1-' + id,
        name: g.name,
        on: !!(g.state && g.state.any_on),
        pct: Math.round((((g.action && g.action.bri) != null ? g.action.bri : 254) / 254) * 100),
        scenes: scenesByGroup.get(id) || [],
        v1Group: id,
      }));
  }

  async function pollV2() {
    // Sequential on purpose: the bridge's embedded TLS server mishandles
    // parallel handshakes, so concurrent requests fail intermittently.
    const rr = await v2fetch('/resource/room');
    const zr = await v2fetch('/resource/zone');
    const gr = await v2fetch('/resource/grouped_light');
    // Surface bridge errors (revoked app key, bridge restarting) instead of
    // rendering the misleading "No rooms" empty state from an error body.
    const bad = !rr.ok ? rr : !zr.ok ? zr : !gr.ok ? gr : null;
    if (bad) {
      let detail = '';
      try {
        const errs = (await bad.json()).errors;
        detail = (errs && errs[0] && errs[0].description) || '';
      } catch (e) { /* non-JSON error body */ }
      throw new Error(detail || ('CLIP v2 HTTP ' + bad.status));
    }
    const groups = ((await rr.json()).data || []).concat((await zr.json()).data || []);
    const states = new Map();
    for (const gl of (await gr.json()).data || []) states.set(gl.id, gl);

    const scenesByGroup = new Map();
    if (cfg.showScenes) {
      const sr = await v2fetch('/resource/scene');
      for (const sc of (await sr.json()).data || []) {
        const gid = sc.group && sc.group.rid;   // matches the room/zone id
        if (!gid) continue;
        if (!scenesByGroup.has(gid)) scenesByGroup.set(gid, []);
        if (scenesByGroup.get(gid).length < 6) {
          scenesByGroup.get(gid).push({ id: sc.id, name: (sc.metadata && sc.metadata.name) || 'Scene' });
        }
      }
    }

    const rooms = [];
    for (const g of groups) {
      // The grouped_light service rid is the control handle for the room/zone.
      const svc = (g.services || []).find((s) => s.rtype === 'grouped_light');
      if (!svc) continue;
      const st = states.get(svc.rid) || {};
      rooms.push({
        key: 'v2-' + g.id,
        name: (g.metadata && g.metadata.name) || 'Room',
        on: !!(st.on && st.on.on),
        pct: (st.dimming && st.dimming.brightness != null) ? Math.round(st.dimming.brightness) : 100,
        scenes: scenesByGroup.get(g.id) || [],
        v2Light: svc.rid,
      });
    }
    return rooms;
  }

  // --- render (single path over the normalized model) --------------------------

  function render(rooms) {
    const wrap = document.getElementById('rooms');
    wrap.textContent = '';
    rooms = rooms.slice().sort((a, b) => a.name.localeCompare(b.name));
    if (!rooms.length) {
      showMessage('No rooms on this bridge', 'Create rooms in the Hue app and they\'ll appear here.');
      return;
    }
    let cols = rooms.length <= 2 ? rooms.length : rooms.length <= 6 ? 3 : 4;
    // Cap columns by available width (quarter slots are ~320 px): below ~150 px
    // per card the name ellipsizes to one letter and the −/+ buttons squeeze the
    // brightness bar to zero width.
    cols = Math.max(1, Math.min(cols, Math.floor(document.body.clientWidth / 150) || 1));
    wrap.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    for (const r of rooms) {
      const card = document.createElement('div');
      card.className = 'room' + (r.on ? ' on' : '');

      const head = document.createElement('div');
      head.className = 'head';
      const bulb = document.createElement('span');
      bulb.className = 'bulb';
      bulb.textContent = '💡';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;
      const stateEl = document.createElement('span');
      stateEl.className = 'state';
      stateEl.textContent = r.on ? r.pct + '%' : 'off';
      head.append(bulb, name, stateEl);
      head.addEventListener('click', () => toggleRoom(r));
      card.appendChild(head);

      const briRow = document.createElement('div');
      briRow.className = 'bri';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.addEventListener('click', () => stepBrightness(r, -1));
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.width = (r.on ? r.pct : 0) + '%';
      bar.appendChild(fill);
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.addEventListener('click', () => stepBrightness(r, +1));
      briRow.append(minus, bar, plus);
      card.appendChild(briRow);

      if (cfg.showScenes && r.scenes.length) {
        const row = document.createElement('div');
        row.className = 'scenes';
        for (const sc of r.scenes) {
          const b = document.createElement('button');
          b.textContent = sc.name;
          b.addEventListener('click', (ev) => { ev.stopPropagation(); recallScene(r, sc.id); });
          row.appendChild(b);
        }
        card.appendChild(row);
      }
      wrap.appendChild(card);
    }
  }

  // --- actions (dispatch per API mode) -----------------------------------------

  function toggleRoom(r) {
    if (mode === 'v2') actV2('/resource/grouped_light/' + r.v2Light, { on: { on: !r.on } });
    else actV1(r.v1Group, { on: !r.on });
  }

  function stepBrightness(r, dir) {
    const pct = Math.max(1, Math.min(100, r.pct + dir * BRI_STEP));
    if (mode === 'v2') actV2('/resource/grouped_light/' + r.v2Light, { on: { on: true }, dimming: { brightness: pct } });
    else actV1(r.v1Group, { on: true, bri: Math.max(1, Math.min(254, Math.round(pct / 100 * 254))) });
  }

  function recallScene(r, sceneId) {
    if (mode === 'v2') actV2('/resource/scene/' + sceneId, { recall: { action: 'active' } });
    else actV1(r.v1Group, { scene: sceneId });
  }

  async function actV1(groupId, body) {
    holdoff = Date.now() + 1200;   // let the bridge settle before the next poll repaints
    try {
      await WW.fetch(v1api('/groups/' + groupId + '/action'), {
        method: 'PUT',
        body: JSON.stringify(body),
      });
    } catch (e) {
      WW.log('hue: action failed: ' + e.message);
    }
    holdoff = 0;
    poll();
  }

  async function actV2(path, body) {
    holdoff = Date.now() + 1200;
    try {
      await v2fetch(path, { method: 'PUT', body: JSON.stringify(body) });
    } catch (e) {
      WW.log('hue: action failed: ' + e.message);
    }
    holdoff = 0;
    poll();
  }

  function showMessage(title, detail) {
    const msg = document.getElementById('message');
    msg.style.display = 'flex';
    msg.innerHTML = '';
    const h = document.createElement('div');
    h.textContent = title;
    msg.appendChild(h);
    if (detail) {
      const sm = document.createElement('small');
      sm.textContent = detail;
      msg.appendChild(sm);
    }
  }
</script>
</body>
</html>
