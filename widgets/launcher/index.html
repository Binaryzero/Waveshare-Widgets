<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Launch App</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — tokens, background/bgStyle handling, typography base and the
   * .state-card anatomy come from widget-base.css. */
  #grid {
    display: grid;
    gap: var(--space-2);
    padding: var(--space-2);
    width: 100%;
    height: 100%;
  }
  /* Stream-deck-style key face: raised, rounded, soft top light, presses in.
   * The face is an interactive control (like .btn), so it uses the opaque
   * control/surface tokens; shadow + top-light strength derive from the panel
   * alpha formulas so the keys soften with glass/transparent backgrounds. */
  .tile {
    border-radius: 12px;
    background: linear-gradient(165deg, var(--control-bg) 0%, var(--surface-alt) 55%, var(--surface) 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 3px 10px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.4)),
      inset 0 1px 0 rgba(255, 255, 255, calc(var(--panel-border-alpha) * 0.5));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 44px;
    min-height: 44px;
    overflow: hidden;
    cursor: pointer;
    /* none, not manipulation: nothing here scrolls, and manipulation still PERMITS a
     * pan — so horizontal finger drift on a control chained out to the shell pager and
     * changed page instead of pressing it (#206). */
    touch-action: none;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  /* Press feedback: scale down + accent ring (like streamdeck keys). The .pressed
     class mirrors :active from pointer events so touch presses always flash too. */
  .tile:active, .tile.pressed {
    transform: scale(0.94);
    box-shadow:
      0 0 0 2px var(--accent) inset,
      0 1px 4px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.6));
  }
  .tile .icon {
    font-family: "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Variable", system-ui, sans-serif;
    font-size: var(--icon-size, clamp(18px, 14vh, 64px));
    line-height: 1.15;
  }
  .tile .label {
    color: var(--text);
    font-size: calc(clamp(9px, 3.2vh, 14px) * var(--label-scale, 1));
    max-width: 94%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #message { position: fixed; inset: 0; }
  #message .state-body { font-size: clamp(11px, 3.6vh, 13px); }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="message" class="state-card" hidden>
    <div class="state-icon">🚀</div>
    <div class="state-title">No shortcuts yet</div>
    <div class="state-body">Add shortcuts in the widget settings — each one is a name plus a
      program path (C:\...\app.exe) or a website (https://...). A leading emoji on the name
      becomes the tile icon; otherwise programs get 🚀 and links get 🌐.</div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { columns: 0 };
  let items = [];

  // Leading emoji: regional-indicator flags (🇺🇸), keycaps (1️⃣), and
  // pictographic sequences (incl. variation selectors, skin tones, ZWJ, tags).
  const EMOJI_RE = /^([\u{1F1E6}-\u{1F1FF}]{2}|[0-9#*]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?|\p{Emoji_Modifier}|[\u{E0020}-\u{E007F}])*)/u;

  const MAX_ITEMS = 24;

  function finishItem(icon, label, target) {
    const kind = /^https?:\/\//i.test(target) ? 'url' : 'launch';
    if (!label) label = deriveLabel(target, kind);
    if (!icon) icon = kind === 'url' ? '🌐' : '🚀';
    return { icon, label, target, kind };
  }

  // Settings shape A (current): an array of { label, target } objects from the
  // structured "Shortcuts" list. A leading emoji on the name becomes the icon.
  // Settings shape B (legacy saved layouts): one "Label=target" per line or comma
  // separated — kept working via parseItems below.
  function normalizeItems(raw) {
    if (!Array.isArray(raw)) return parseItems(raw);
    const out = [];
    for (const entry of raw) {
      if (out.length >= MAX_ITEMS) break;
      if (!entry) continue;
      if (typeof entry === 'string') {           // tolerate stray string rows
        for (const it of parseItems(entry)) {
          if (out.length >= MAX_ITEMS) break;
          out.push(it);
        }
        continue;
      }
      if (typeof entry !== 'object') continue;
      let label = String(entry.label == null ? '' : entry.label).trim();
      const target = String(entry.target == null ? '' : entry.target).trim();
      if (!target) continue;
      let icon = '';
      const em = label.match(EMOJI_RE);
      if (em) { icon = em[1]; label = label.slice(em[1].length).trim(); }
      out.push(finishItem(icon, label, target));
    }
    return out;
  }

  // "Label=target" per line (or comma separated); target is an .exe path or an
  // http(s) URL. Split on the FIRST '=' only, so "C:\a=b\x.exe" stays intact.
  function parseItems(text) {
    const out = [];
    for (const raw of String(text || '').split(/[\n,]/)) {
      let part = raw.trim();
      if (!part) continue;
      let icon = '';
      const em = part.match(EMOJI_RE);
      if (em) { icon = em[1]; part = part.slice(em[1].length).trim(); }
      let label = '', target = '';
      const eq = part.indexOf('=');
      if (/^https?:\/\//i.test(part) || eq < 0) {
        target = part;               // bare target, no label given
      } else {
        label = part.slice(0, eq).trim();
        target = part.slice(eq + 1).trim();
      }
      if (!target) continue;
      out.push(finishItem(icon, label, target));
      if (out.length >= MAX_ITEMS) break;
    }
    return out;
  }

  function deriveLabel(target, kind) {
    if (kind === 'url') {
      try { return new URL(target).hostname.replace(/^www\./i, '') || target; } catch (e) { return target; }
    }
    const seg = target.split(/[\\/]/).filter(Boolean).pop() || target;
    return seg.replace(/\.[^.]+$/, '') || target;
  }

  WW.onInit((state) => {
    const s = state.settings;
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy labelColor keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
    cfg.columns = Math.max(0, Math.min(8, Math.round(Number(s.columns) || 0)));
    items = normalizeItems(s.items);
    build();
  });

  // Restartable state-theater flash (confirm-flash from widget-base): remove,
  // force reflow, re-add — otherwise back-to-back taps on a tile show nothing.
  function flash(elm, cls) {
    elm.classList.remove(cls);
    void elm.offsetWidth;
    elm.classList.add(cls);
  }

  function build() {
    const grid = document.getElementById('grid');
    const msg = document.getElementById('message');
    grid.textContent = '';
    msg.hidden = items.length > 0;
    if (!items.length) return;

    for (const it of items) {
      const tile = document.createElement('div');
      tile.className = 'tile pressable';
      tile.title = it.target;
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = it.icon;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = it.label;
      tile.append(icon, label);
      tile.addEventListener('pointerdown', () => tile.classList.add('pressed'));
      const release = () => tile.classList.remove('pressed');
      tile.addEventListener('pointerup', release);
      tile.addEventListener('pointercancel', release);
      tile.addEventListener('pointerleave', release);
      tile.addEventListener('click', () => {
        WW.action(it.kind, it.target);
        WW.log('launch: ' + it.kind + ' ' + it.target);
        // ww-action is fire-and-forget (no result round-trip) and launching has
        // no other visible effect in the widget — confirm-flash the tile.
        flash(tile, 'confirm-flash');
      });
      grid.appendChild(tile);
    }
    layout();
  }

  // Auto columns: pick the column count (1..8) whose tiles come out closest to
  // square for the current slot aspect; a non-zero "columns" setting wins.
  function autoCols(n) {
    let best = 1, bestScore = -Infinity;
    for (let c = 1; c <= Math.min(n, 8); c++) {
      const r = Math.ceil(n / c);
      const tileAspect = (window.innerWidth / c) / (window.innerHeight / r);
      const score = -Math.abs(Math.log(tileAspect));
      if (score > bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  function layout() {
    const n = items.length;
    if (!n) return;
    const cols = Math.max(1, Math.min(cfg.columns > 0 ? cfg.columns : autoCols(n), n));
    const rows = Math.ceil(n / cols);
    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    // Emoji sized off the actual cell, so it stays big but never overflows.
    const pad = 8, gap = 8;
    const cellW = (window.innerWidth - pad * 2 - gap * (cols - 1)) / cols;
    const cellH = (window.innerHeight - pad * 2 - gap * (rows - 1)) / rows;
    const icon = Math.max(14, Math.min(cellH * 0.44, cellW * 0.6, 96));
    document.body.style.setProperty('--icon-size', Math.round(icon) + 'px');
  }

  window.addEventListener('resize', layout);
</script>
</body>
</html>
