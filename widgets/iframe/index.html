<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Embed URL</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — tokens, background/bgStyle handling, typography base and the
   * .state-card anatomy come from widget-base.css. */
  /* The shell uses the outer 8px for dashboard page navigation. Keep arbitrary nested
   * pages inside that interaction rail while preserving the widget's nominal viewport. */
  #frameViewport { position: fixed; inset: 0 8px; overflow: hidden; }
  #frame {
    border: 0;
    display: block;
    transform-origin: top left;
    background: transparent;
  }
  /* Empty/setup state: .state-card anatomy and its type, which scales with the tile
   * (widget-base.css), in subdued placeholder tones. */
  #empty { position: fixed; inset: 0; gap: calc(3px * var(--ts)); }
  #empty .head { color: var(--text-muted); }
  #empty .sub { color: var(--text-dim); }
</style>
</head>
<body>
  <div id="frameViewport" hidden>
    <iframe id="frame" allow="autoplay; fullscreen"></iframe>
  </div>
  <div id="empty" class="state-card">
    <span class="head state-title">No URL configured</span>
    <small class="sub state-body">Set one in Settings — e.g. http://localhost:28199 for StreamDeckEmbeded's Virtual Stream Deck.
    Sites that forbid framing (X-Frame-Options) will show blank.</small>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  WW.onInit((state) => {
    const s = state.settings;

    const url = String(s.url || '').trim();
    const zoom = Number(s.zoom) || 1;
    const viewport = document.getElementById('frameViewport');
    const frame = document.getElementById('frame');
    const empty = document.getElementById('empty');

    if (!/^https?:\/\//i.test(url)) {
      empty.hidden = false;
      viewport.hidden = true;
      frame.style.display = 'none';
      return;
    }

    empty.hidden = true;
    viewport.hidden = false;
    frame.style.display = 'block';
    // Zoom by inverse-scaling: render larger, scale down (or vice versa).
    frame.style.width = (100 / zoom) + '%';
    frame.style.height = (100 / zoom) + '%';
    frame.style.transform = 'scale(' + zoom + ')';
    if (frame.src !== url) frame.src = url;
  });
</script>
</body>
</html>
