<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Embed URL</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — tokens, background/bgStyle handling, typography base and the
   * .state-card anatomy come from widget-base.css. */
  #frame {
    border: 0;
    display: block;
    transform-origin: top left;
    background: transparent;
  }
  /* Empty/setup state: .state-card anatomy, kept at the widget's fluid sizes
   * and subdued placeholder tones. */
  #empty { position: fixed; inset: 0; gap: 1.5vh; }
  #empty .head { color: var(--text-muted); font-size: clamp(13px, 5vh, 20px); }
  #empty .sub { color: var(--text-dim); font-size: clamp(9px, 3.5vh, 14px); max-width: 640px; }
</style>
</head>
<body>
  <iframe id="frame" allow="autoplay; fullscreen"></iframe>
  <div id="empty" class="state-card">
    <span class="head state-title">No URL configured</span>
    <small class="sub state-body">Set one in Settings — e.g. http://localhost:28199 for StreamDeckEmbeded's Virtual Stream Deck.
    Sites that forbid framing (X-Frame-Options) will show blank.</small>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  WW.onInit((state) => {
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // pre-token behavior for unset AND out-of-spec values (no class = glass in base).
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');

    const url = String(s.url || '').trim();
    const zoom = Number(s.zoom) || 1;
    const frame = document.getElementById('frame');
    const empty = document.getElementById('empty');

    if (!/^https?:\/\//i.test(url)) {
      empty.hidden = false;
      frame.style.display = 'none';
      return;
    }

    empty.hidden = true;
    frame.style.display = 'block';
    // Zoom by inverse-scaling: render larger, scale down (or vice versa).
    frame.style.width = (100 / zoom) + 'vw';
    frame.style.height = (100 / zoom) + 'vh';
    frame.style.transform = 'scale(' + zoom + ')';
    if (frame.src !== url) frame.src = url;
  });
</script>
</body>
</html>
