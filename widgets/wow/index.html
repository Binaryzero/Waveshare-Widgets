<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WoW Panel</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, bgStyle and the typography base come from
   * widget-base.css. The card is three columns: who you are, what you're working
   * on (professions, reputations), and what you've gathered (collections, the
   * latest achievement, the almost-done list). */
  body { display: flex; flex-direction: column; gap: 6px; padding: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  #card { flex: 1 1 auto; display: flex; gap: 14px; min-height: 0; overflow: hidden; }
  #who { flex: 0 0 140px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; min-width: 0; text-align: center; }
  #portrait {
    width: 84px; height: 84px; border-radius: var(--radius-control);
    border: 1px solid var(--line); object-fit: cover; background: var(--card-surface);
  }
  #initial {
    width: 84px; height: 84px; border-radius: var(--radius-control);
    border: 1px solid var(--line); background: var(--card-surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-fg); font-size: 34px; font-weight: 700;
  }
  #cname {
    color: var(--text); font-weight: 700; font-size: clamp(13px, 4vh, 18px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  #cline, #guild {
    color: var(--text-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    overflow: hidden; max-width: 100%;
  }
  #guild { color: var(--text-dim); white-space: nowrap; text-overflow: ellipsis; }
  /* The sections SPREAD over the column: this card replaced one whose bottom half was
   * a chart nobody wanted, and stacking everything at the top would waste the same
   * half a different way. */
  .col { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    overflow: hidden; justify-content: space-evenly; }
  .sect { display: flex; flex-direction: column; gap: 5px; min-height: 0; }
  .sect .kicker { flex: none; }
  .trow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .trow .lbl {
    color: var(--text); font-size: clamp(11px, 3vh, 13px); font-weight: 600;
    flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trow .meter { flex: 0 0 34%; }
  .trow .val {
    color: var(--text-muted); font-size: clamp(10px, 2.8vh, 12px); font-weight: 600;
    flex: none; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .none { color: var(--text-dim); font-size: 11px; }
  #stats { display: flex; gap: 14px; flex: none; }
  .stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .stat .value { font-size: clamp(15px, 5vh, 22px); }
  footer { color: var(--text-dim); font-size: 11px; flex: none; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #state { position: fixed; inset: 0; }
  body.stale #card { opacity: 0.6; }
  /* A 200px band: the portrait and the almost-list are the first things to give, so
   * professions and reputations keep readable rows. */
  @media (max-height: 240px) {
    #portrait, #initial { width: 48px; height: 48px; font-size: 20px; }
    #guild, #almost { display: none; }
  }
</style>
</head>
<body>
  <header class="hd">
    <span class="kicker">WoW</span>
    <span class="pill muted" id="pill">Loading</span>
  </header>

  <div id="card" hidden>
    <div id="who">
      <img id="portrait" alt="" hidden />
      <div id="initial" hidden></div>
      <div id="cname"></div>
      <div id="cline"></div>
      <div id="guild"></div>
    </div>
    <div class="col">
      <div class="sect" id="profs">
        <span class="kicker">Professions</span>
      </div>
      <div class="sect" id="reps">
        <span class="kicker">Reputation</span>
      </div>
    </div>
    <div class="col">
      <div id="stats">
        <div class="stat"><span class="kicker">Mounts</span><span class="value" id="mounts">--</span></div>
        <div class="stat"><span class="kicker">Pets</span><span class="value" id="pets">--</span></div>
      </div>
      <div class="sect" id="latest">
        <span class="kicker">Latest</span>
      </div>
      <div class="sect" id="almost">
        <span class="kicker">Almost there</span>
      </div>
    </div>
  </div>

  <footer id="meta"></footer>

  <div class="state-card" id="state">
    <div class="spinner"></div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  // What this card is, per the corrected spec on issue #25: the character — portrait,
  // name, level, spec, guild — then professions with skill progress, the reputations
  // most recently pushed, mount and pet counts, the latest achievement, and the
  // almost-done achievements (one or two steps out, or nearly all criteria met).
  // Token price, sparklines, Mythic+ rating, raid progression and affixes were struck
  // by the owner and must not return.
  const cfg = { region: 'us', realm: '', character: '', clientId: '', clientSecret: '', refreshMs: 1800000 };
  let data = null;            // {who, portrait, profs, reps, mounts, pets, latest, almost}
  let bearer = null;
  let started = false;
  let timer = null;
  let inFlight = false;
  let lastOk = 0;
  let dueAt = 0;
  let generation = 0;
  let fails = 0;              // consecutive whole-tick failures — drives the retry backoff
  let lastProblems = [];      // why the last refresh was Partial, so a repaint can say so

  // PER REQUEST, not per tick: this card asks up to eight independent questions, and a
  // per-tick budget would let one slow endpoint eat the others' time. It is also the
  // only reason a hung source cannot pin `inFlight` forever — the direct fetch tier has
  // no deadline of its own.
  const REQUEST_DEADLINE = 15000;
  const GATED_RECHECK = 60000;
  const MAX_WAIT = 3600000;
  const IDLE_FLOOR = 5000;

  const el = (id) => document.getElementById(id);
  const paused = () => document.hidden;

  /** Runs `job` under an abort deadline covering the BODY read too — a resolved WW.fetch
   *  only means the headers arrived, so a source that then dribbles its body would hang
   *  on res.json() with no timer left running. */
  function withDeadline(ms, controller, job) {
    let t;
    return Promise.race([
      job().finally(() => clearTimeout(t)),
      new Promise((_, reject) => {
        t = setTimeout(() => {
          try { controller.abort(); } catch (e) { /* already gone */ }
          reject(new Error('timed out'));
        }, ms);
      }),
    ]);
  }

  /** Every network call goes through here: one deadline, one abort signal, one place
   *  where a non-2xx is turned into a message and its body released. An unread body on
   *  an error response leaves the stream open, and one per refresh accumulates. */
  async function ask(label, url, init) {
    const controller = new AbortController();
    return withDeadline(REQUEST_DEADLINE, controller, async () => {
      const res = await WW.fetch(url, Object.assign({ signal: controller.signal }, init || {}));
      if (!res.ok) {
        try { if (res.body && !res.body.locked) await res.body.cancel(); } catch (e) { /* gone */ }
        const err = new Error(label + ' ' + res.status);
        err.status = res.status;
        throw err;
      }
      return res.json();
    });
  }

  // Form-encode each half BEFORE the colon join (RFC 6749 §2.3.1), so a client id or
  // secret containing ':' cannot be misparsed, and round-trip through UTF-8 so btoa
  // cannot throw on a non-Latin-1 secret and kill the request before it is sent.
  const formEnc = (v) => encodeURIComponent(String(v == null ? '' : v)).replace(/%20/g, '+');
  const b64 = (str) => {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  };

  /** How long before expiry a token stops being offered: headroom so one expiring
   *  in flight is not a 401, but never more than half its own life, or a short-lived
   *  token is never fresh enough to use and every tick buys another. */
  const freshnessMargin = (b) => {
    const life = Number(b && b.lifetimeMs);
    return Number.isFinite(life) && life > 0 ? Math.min(60000, life / 2) : 60000;
  };

  const credKey = () => cfg.clientId + '\n' + cfg.clientSecret;
  const queryKey = () => [cfg.region, cfg.realm, cfg.character, credKey()].join('\n');

  // The bearer stays in MEMORY: it is a working credential bought with a secret held
  // under DPAPI, and localStorage is a plaintext file in the WebView profile. It is
  // deliberately not even in the protected store — it re-buys in one call and outlives
  // nothing worth persisting.
  /** Throws with `.tokenExchange` set, always, so the caller can tell WHICH call failed:
   *  "the API rejected the token" and "the token endpoint rejected the client secret"
   *  both arrive as status 401. */
  async function getBearer() {
    try { return await signIn(); }
    catch (e) { e.tokenExchange = true; throw e; }
  }

  async function signIn() {
    if (bearer && bearer.key === credKey()
      && bearer.expiresAt - Date.now() > freshnessMargin(bearer)) return bearer.token;
    // The identity this exchange is FOR, captured BEFORE awaiting anything. An exchange
    // the deadline gave up on keeps running, so without this it can return long after
    // the credentials changed and install the OLD client's token over the cleared cache.
    const forKey = credKey();
    // Proxy-first, and never natively. Token endpoints are server-to-server and send no
    // CORS headers — and a CORS block does not stop the request, it only stops the page
    // reading the reply. WW.fetch cannot tell that from a transport failure, so it would
    // replay the POST through the host and Blizzard would grant a SECOND token for one
    // sign-in. A request that must not be sent twice does not belong on a retrying ladder.
    const json = await ask('sign-in', 'https://oauth.battle.net/token', {
      method: 'POST',
      proxy: 'always',
      headers: {
        Authorization: 'Basic ' + b64(formEnc(cfg.clientId) + ':' + formEnc(cfg.clientSecret)),
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: 'grant_type=client_credentials',
    });
    if (!json || !json.access_token) throw new Error('no access token');
    // RFC 6749 §5.1: token_type states HOW the token must be presented, and Bearer is
    // the only scheme this widget can honour. An ABSENT type is treated as bearer,
    // because the field is required by the RFC and widely omitted.
    const kind = json.token_type == null ? '' : String(json.token_type).trim();
    if (kind && kind.toLowerCase() !== 'bearer') {
      throw new Error('sign-in returned a "' + kind + '" token, which this tile cannot use');
    }
    const ttl = Number(json.expires_in);
    const lifetimeMs = Number.isFinite(ttl) && ttl > 0 ? ttl * 1000 : 3600000;
    if (forKey !== credKey()) {
      // Retargeted at a different Battle.net client while this was in flight. Discard
      // rather than cache: this token belongs to an account no longer configured.
      throw new Error('credentials changed during sign-in');
    }
    bearer = { token: String(json.access_token), expiresAt: Date.now() + lifetimeMs, lifetimeMs, key: forKey };
    return bearer.token;
  }

  // ---- Payload shapes -------------------------------------------------------
  // A body is matched against a STATED shape and anything that does not match is
  // malformed rather than sparse. Validate first, read afterwards — the six review
  // rounds this widget's first life went through were one defect in different costumes.
  const isObj = (v) => v != null && typeof v === 'object' && !Array.isArray(v);
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const isText = (v) => typeof v === 'string' && v.trim() !== '';

  const NO_CREDS = 'no Battle.net credentials';
  const NO_CHARACTER = 'character not found';

  // Blizzard's realm slug: lowercase, spaces to hyphens, apostrophes dropped —
  // "Argent Dawn" and "argent-dawn" both reach the same realm.
  const slug = (s) => String(s == null ? '' : s).trim().toLowerCase()
    .replace(/['’]/g, '').replace(/\s+/g, '-');

  function charBase() {
    return 'https://' + cfg.region + '.api.blizzard.com/profile/wow/character/'
      + encodeURIComponent(slug(cfg.realm)) + '/' + encodeURIComponent(cfg.character.trim().toLowerCase());
  }
  const ns = () => '?namespace=profile-' + cfg.region + '&locale=en_US';

  async function authed(label, url) {
    const read = async () => ask(label, url, { headers: { Authorization: 'Bearer ' + await getBearer() } });
    try {
      return await read();
    } catch (e) {
      // A 401 means the token died before the expiry it advertised. Drop it and retry
      // EXACTLY once; `tokenExchange` keeps a wrong client secret (also a 401) from
      // buying a second sign-in on every tick.
      if (e.tokenExchange || e.status !== 401) throw e;
      bearer = null;
      return read();
    }
  }

  // ---- Readers: payload in, display model out -------------------------------

  function readWho(json) {
    if (!isObj(json) || !isText(json.name)) throw new Error('profile: unexpected response');
    const spec = isObj(json.active_spec) && isText(json.active_spec.name) ? json.active_spec.name : '';
    const cls = isObj(json.character_class) && isText(json.character_class.name) ? json.character_class.name : '';
    return {
      name: json.name,
      level: isNum(json.level) ? json.level : null,
      line: [spec, cls].filter(Boolean).join(' '),
      guild: isObj(json.guild) && isText(json.guild.name) ? json.guild.name : '',
    };
  }

  function readPortrait(json) {
    if (!isObj(json) || !Array.isArray(json.assets)) return '';
    // The avatar render is the card-sized asset; inset and main-raw are scene shots.
    for (const a of json.assets) {
      if (isObj(a) && a.key === 'avatar' && isText(a.value)) return a.value;
    }
    return '';
  }

  function readProfs(json) {
    if (!isObj(json)) return [];
    const out = [];
    const take = (list) => {
      if (!Array.isArray(list)) return;
      for (const p of list) {
        if (!isObj(p) || !isObj(p.profession) || !isText(p.profession.name) || !Array.isArray(p.tiers)) continue;
        // The tier being LEVELED now is the newest one the character has touched —
        // the highest tier id, not the array's order, which is not promised.
        let best = null;
        for (const t of p.tiers) {
          if (!isObj(t) || !isNum(t.skill_points) || !isNum(t.max_skill_points) || t.max_skill_points <= 0) continue;
          const id = isObj(t.tier) && isNum(t.tier.id) ? t.tier.id : 0;
          if (!best || id > best.id) best = { id, skill: t.skill_points, max: t.max_skill_points };
        }
        if (best) out.push({ name: p.profession.name, skill: best.skill, max: best.max });
      }
    };
    take(json.primaries);
    if (!out.length) take(json.secondaries);
    return out.slice(0, 3);
  }

  // Which reputations go on the card: the ones that MOVED most recently. The API has no
  // timestamps, so movement is self-recorded — each refresh diffs against the last seen
  // values in localStorage (public game data, not a credential) and stamps changers.
  // Before any movement has ever been seen, the closest-to-done in-progress ones stand in.
  function repStoreKey() {
    return 'wowrep:' + cfg.region + ':' + slug(cfg.realm) + ':' + cfg.character.trim().toLowerCase();
  }

  function readReps(json) {
    if (!isObj(json) || !Array.isArray(json.reputations)) return [];
    const all = [];
    for (const r of json.reputations) {
      if (!isObj(r) || !isObj(r.faction) || !isText(r.faction.name) || !isObj(r.standing)) continue;
      const s = r.standing;
      if (!isNum(s.value) || !isNum(s.max) || s.max <= 0) continue;
      const renown = isNum(s.renown_level) ? s.renown_level : null;
      const tier = isText(s.name) ? s.name : (renown != null ? 'Renown ' + renown : '');
      all.push({ name: r.faction.name, value: s.value, max: s.max, renown, tier });
    }
    let seen = {};
    try { seen = JSON.parse(localStorage.getItem(repStoreKey()) || '{}') || {}; } catch (e) { seen = {}; }
    const now = Date.now();
    const record = {};
    for (const rep of all) {
      const prev = seen[rep.name];
      const cur = rep.value + '/' + rep.max + '/' + (rep.renown == null ? '' : rep.renown);
      // Changed since last look — or first sighting of a faction while OTHERS are known,
      // which is movement too (a new campaign opened). A first-ever run stamps nothing.
      const moved = prev ? prev.cur !== cur : Object.keys(seen).length > 0;
      record[rep.name] = { cur, t: moved ? now : (prev ? prev.t : 0) };
      rep.t = record[rep.name].t;
    }
    try { localStorage.setItem(repStoreKey(), JSON.stringify(record)); } catch (e) { /* full or blocked — selection just stays fallback */ }
    const inProgress = (r) => r.renown != null || r.value < r.max;
    return all.filter(inProgress)
      .sort((a, b) => (b.t - a.t) || (b.value / b.max - a.value / a.max))
      .slice(0, 3);
  }

  const readCount = (json, key) =>
    isObj(json) && Array.isArray(json[key]) ? json[key].length : null;

  // The achievements summary carries every completed achievement with its timestamp and
  // every in-progress one with its criteria tree. One payload answers both questions.
  function readAchievements(json) {
    if (!isObj(json) || !Array.isArray(json.achievements)) return { latest: null, almost: [] };
    let latest = null;
    const almost = [];
    for (const a of json.achievements) {
      if (!isObj(a) || !isObj(a.achievement) || !isText(a.achievement.name)) continue;
      if (isNum(a.completed_timestamp)) {
        if (!latest || a.completed_timestamp > latest.when) latest = { name: a.achievement.name, when: a.completed_timestamp };
        continue;
      }
      if (!isObj(a.criteria)) continue;
      // Count the criteria LEAVES: children when there are children (recursively), the
      // top criterion itself otherwise. A single-leaf achievement carries no usable
      // fraction — "0/1" describes everything not started — so those are skipped.
      let done = 0, total = 0;
      const walk = (c) => {
        if (!isObj(c)) return;
        if (Array.isArray(c.child_criteria) && c.child_criteria.length) {
          for (const ch of c.child_criteria) walk(ch);
          return;
        }
        total++;
        if (c.is_completed === true) done++;
      };
      walk(a.criteria);
      if (total < 2 || !done || done >= total) continue;
      const left = total - done;
      // The owner's bar, verbatim: one or two steps out, or at a certain percent.
      if (left <= 2 || done / total >= 0.85) almost.push({ name: a.achievement.name, done, total, left });
    }
    almost.sort((a, b) => (a.left - b.left) || (b.done / b.total - a.done / a.total));
    return { latest, almost: almost.slice(0, 3) };
  }

  // ---- The refresh ----------------------------------------------------------

  async function tick() {
    if (paused() || inFlight) { schedule(GATED_RECHECK); return; }
    if (!started) return;
    const gen = generation;
    inFlight = true;
    const problems = [];
    try {
      if (!cfg.clientId || !cfg.clientSecret) throw new Error(NO_CREDS);
      // Identity is the spine: if the character itself cannot be read there is no card,
      // and a 404 here is a settings problem with its own advice.
      let who;
      try {
        who = readWho(await authed('profile', charBase() + ns()));
      } catch (e) {
        if (e.status === 404) throw new Error(NO_CHARACTER);
        throw e;
      }
      if (gen !== generation) return;
      const next = { who, portrait: '', profs: [], reps: [], mounts: null, pets: null, latest: null, almost: [] };
      // Everything else degrades per section: a failed collections call must not cost
      // the professions their rows. Each failure is named once for the footer.
      const part = async (label, run) => {
        try { await run(); }
        catch (e) { problems.push(label); WW.log('wow: ' + label + ': ' + e.message); }
      };
      await part('portrait', async () => { next.portrait = readPortrait(await authed('media', charBase() + '/character-media' + ns())); });
      if (gen !== generation) return;
      await part('professions', async () => { next.profs = readProfs(await authed('professions', charBase() + '/professions' + ns())); });
      if (gen !== generation) return;
      await part('reputation', async () => { next.reps = readReps(await authed('reputations', charBase() + '/reputations' + ns())); });
      if (gen !== generation) return;
      await part('mounts', async () => { next.mounts = readCount(await authed('mounts', charBase() + '/collections/mounts' + ns()), 'mounts'); });
      if (gen !== generation) return;
      await part('pets', async () => { next.pets = readCount(await authed('pets', charBase() + '/collections/pets' + ns()), 'pets'); });
      if (gen !== generation) return;
      await part('achievements', async () => {
        const a = readAchievements(await authed('achievements', charBase() + '/achievements' + ns()));
        next.latest = a.latest; next.almost = a.almost;
      });
      if (gen !== generation) return;
      data = next;
      lastOk = Date.now();
      lastProblems = problems;
      fails = 0;
      document.body.classList.remove('stale');
      render();
    } catch (e) {
      if (gen !== generation) return;
      fails++;
      if (data) {
        document.body.classList.add('stale');
        render();
      } else {
        showError(e);
      }
      WW.log('wow: ' + e.message);
    } finally {
      if (gen === generation) { inFlight = false; schedule(nextDelayMs()); }
    }
  }

  function nextDelayMs() {
    if (!fails) return Math.max(0, (lastOk || Date.now()) + cfg.refreshMs - Date.now());
    // Backoff on CONSECUTIVE failures, bounded, and never below the configured cadence.
    const grown = Math.min(cfg.refreshMs * Math.pow(2, Math.min(fails, 4)), cfg.refreshMs + MAX_WAIT);
    return Math.max(cfg.refreshMs, grown);
  }

  function schedule(ms) {
    clearTimeout(timer);
    const wait = Math.max(IDLE_FLOOR, ms);
    dueAt = Date.now() + wait;
    timer = setTimeout(tick, wait);
  }

  // ---- Rendering ------------------------------------------------------------

  function ageText(ms) {
    const days = Math.round((Date.now() - ms) / 86400000);
    if (days < 1) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 60) return days + 'd ago';
    return Math.round(days / 30) + 'mo ago';
  }

  function trow(label, fillPct, val) {
    const row = document.createElement('div');
    row.className = 'trow';
    const lbl = document.createElement('span');
    lbl.className = 'lbl';
    lbl.textContent = label;
    row.appendChild(lbl);
    if (fillPct != null) {
      const meter = document.createElement('div');
      meter.className = 'meter';
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.width = Math.max(0, Math.min(100, fillPct)) + '%';
      meter.appendChild(fill);
      row.appendChild(meter);
    }
    const v = document.createElement('span');
    v.className = 'val';
    v.textContent = val;
    row.appendChild(v);
    return row;
  }

  function fillSect(id, rows, emptyText) {
    const box = el(id);
    while (box.children.length > 1) box.removeChild(box.lastChild);
    if (!rows.length) {
      const none = document.createElement('div');
      none.className = 'none';
      none.textContent = emptyText;
      box.appendChild(none);
      return;
    }
    for (const r of rows) box.appendChild(r);
  }

  function render() {
    if (!data) return;
    const who = data.who;
    el('cname').textContent = who.name;
    el('cline').textContent = [who.level != null ? 'Level ' + who.level : '', who.line].filter(Boolean).join(' · ');
    el('guild').textContent = who.guild ? '<' + who.guild + '>' : '';
    const img = el('portrait');
    const init = el('initial');
    if (data.portrait) {
      img.hidden = false; init.hidden = true;
      // onerror BEFORE src: a cached failure can fire the moment src is assigned.
      img.onerror = () => { img.hidden = true; init.hidden = false; init.textContent = who.name[0] || '?'; };
      if (img.src !== data.portrait) img.src = data.portrait;
    } else {
      img.hidden = true; init.hidden = false;
      init.textContent = who.name[0] || '?';
    }

    fillSect('profs', data.profs.map((p) =>
      trow(p.name, p.skill / p.max * 100, p.skill + '/' + p.max)), 'No professions yet');
    fillSect('reps', data.reps.map((r) =>
      trow(r.name, r.value / r.max * 100, r.tier || Math.round(r.value / r.max * 100) + '%')), 'Nothing in progress');
    el('mounts').textContent = data.mounts == null ? '--' : String(data.mounts);
    el('pets').textContent = data.pets == null ? '--' : String(data.pets);
    fillSect('latest', data.latest
      ? [trow(data.latest.name, null, ageText(data.latest.when))] : [], 'Nothing yet');
    fillSect('almost', data.almost.map((a) =>
      trow(a.name, a.done / a.total * 100, a.done + '/' + a.total)), 'Nothing close right now');

    const stale = document.body.classList.contains('stale');
    const pill = el('pill');
    pill.hidden = false;
    if (stale) { pill.textContent = 'Stale'; pill.className = 'pill muted'; }
    else if (lastProblems.length) { pill.textContent = 'Partial'; pill.className = 'pill warn'; }
    else pill.hidden = true;   // healthy: the pill reports exceptions, not health

    const notes = [];
    if (lastProblems.length) notes.push('unavailable: ' + lastProblems.join(', '));
    if (lastOk) notes.push('updated ' + Math.max(0, Math.round((Date.now() - lastOk) / 60000)) + 'm ago');
    el('meta').textContent = notes.join(' · ');

    el('state').hidden = true;
    el('card').hidden = false;
  }

  // ---- States ---------------------------------------------------------------

  function stateCard(cls, icon, title, body, onRetry) {
    const pill = el('pill');
    pill.hidden = false;
    pill.textContent = cls === 'err' ? 'Error' : 'Setup';
    pill.className = 'pill ' + (cls === 'err' ? 'err' : 'muted');
    const s = el('state');
    s.className = 'state-card' + (cls ? ' ' + cls : '');
    s.textContent = '';
    const i = document.createElement('div');
    i.className = 'state-icon';
    i.textContent = icon;
    const t = document.createElement('div');
    t.className = 'state-title';
    t.textContent = title;
    const b = document.createElement('div');
    b.className = 'state-body';
    b.textContent = body;
    s.append(i, t, b);
    if (onRetry) {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Retry';
      btn.addEventListener('click', onRetry);
      s.append(btn);
    }
    s.hidden = false;
    el('card').hidden = true;
  }

  function showLoadingCard() {
    const s = el('state');
    s.className = 'state-card';
    s.textContent = '';
    const sp = document.createElement('div');
    sp.className = 'spinner';
    s.appendChild(sp);
    s.hidden = false;
    el('card').hidden = true;
    const pill = el('pill');
    pill.hidden = false;
    pill.textContent = 'Loading';
    pill.className = 'pill muted';
  }

  function showSetup() {
    const missing = [];
    if (!cfg.realm) missing.push('realm');
    if (!cfg.character) missing.push('character');
    if (!cfg.clientId || !cfg.clientSecret) missing.push('Battle.net client id and secret');
    stateCard('', '◎', 'Not configured yet',
      'Set ' + missing.join(', ') + ' in the widget settings. The client credentials come from develop.battle.net → API Access.');
  }

  function showError(e) {
    const msg = e.message === NO_CREDS
      ? 'Add the Battle.net client id and secret in the widget settings (develop.battle.net → API Access).'
      : e.message === NO_CHARACTER
      ? 'No character called "' + cfg.character + '" on that realm — check the realm and the spelling.'
      : e.tokenExchange && (e.status === 401 || e.status === 403)
      ? 'Battle.net rejected the client credentials — check the id and secret.'
      : 'Could not reach the Blizzard API. It may be down, or the network may be blocking it.';
    stateCard('err', '!', 'No character data', msg, () => {
      showLoadingCard();
      clearTimeout(timer);
      fails = 0;
      tick();
    });
  }

  // ---- Wiring ---------------------------------------------------------------

  WW.onInit((s0) => {
    const s = s0.settings;
    const hadQuery = queryKey();
    const hadCadence = cfg.refreshMs;
    cfg.region = ['us', 'eu', 'kr', 'tw'].includes(s.region) ? s.region : 'us';
    cfg.realm = String(s.realm == null ? '' : s.realm).trim();
    cfg.character = String(s.character == null ? '' : s.character).trim();
    cfg.clientId = String(s.clientId == null ? '' : s.clientId).trim();
    // An unset or unreadable secret arrives as "" — the setup state, never a spinner.
    cfg.clientSecret = String(s.clientSecret == null ? '' : s.clientSecret);
    cfg.refreshMs = Math.min(240, Math.max(20, Number(s.refreshMinutes) || 30)) * 60000;

    if (!cfg.realm || !cfg.character || !cfg.clientId || !cfg.clientSecret) {
      clearTimeout(timer);
      started = false;
      data = null;
      lastOk = 0;
      fails = 0;
      generation++;
      showSetup();
      return;
    }
    if (queryKey() !== hadQuery || !started) {
      // A different character (or credentials) — anything in flight answers for the old
      // one and discards itself against the bumped generation.
      generation++;
      data = null;
      lastOk = 0;
      fails = 0;
      lastProblems = [];
      document.body.classList.remove('stale');
      started = true;
      inFlight = false;
      showLoadingCard();
      clearTimeout(timer);
      tick();
    } else {
      // Same query — a theme push, a rename, a background change. Refetching here would
      // hit the API on every settings keystroke; repaint what is already held. The
      // cadence is not part of the query, so a changed interval re-arms from now.
      if (data) render();
      if (cfg.refreshMs !== hadCadence) schedule(Math.max(0, (lastOk || Date.now()) + nextDelayMs() - Date.now()));
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !started) return;
    if (Date.now() >= dueAt) { clearTimeout(timer); tick(); }
    else schedule(dueAt - Date.now());
  });
</script>
</body>
</html>
