<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GPU Monitor</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — colors, background, typography basics come from widget-base.css. */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6%;
  }
  .ring { position: relative; height: 72%; aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--control-bg); stroke-width: 9; }
  .ring .progress { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease); }
  .ring .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* Per-role custom properties (set from settings only when they differ from the
   * manifest defaults) fall through to the theme tokens. */
  .ring .center .big { font-size: calc(clamp(20px, 9vh, 44px) * var(--value-scale, 1)); color: var(--value-color, var(--text)); font-weight: 600; line-height: 1; }
  .ring .center .cap { font-size: calc(clamp(9px, 3vh, 13px) * var(--title-scale, 1)); color: var(--title-color, var(--text-muted)); letter-spacing: 0.14em; margin-top: 4px; }
  .stats { display: flex; flex-direction: column; gap: 8%; }
  .stat .label { font-size: calc(clamp(9px, 3vh, 13px) * var(--label-scale, 1)); color: var(--label-color, var(--text-muted)); letter-spacing: 0.1em; }
  .stat .val { font-size: calc(clamp(16px, 7vh, 34px) * var(--value-scale, 1)); color: var(--value-color, var(--text)); font-weight: 600; }
  .stat .val .unit { font-size: 55%; font-weight: 400; color: var(--label-color, var(--text-muted)); }
  .device { position: fixed; left: 12px; bottom: 8px; font-size: calc(clamp(8px, 2.4vh, 11px) * var(--hint-scale, 1)); color: var(--hint-color, var(--text-dim)); max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="44"></circle>
      <circle class="progress" id="ringValue" cx="50" cy="50" r="44"></circle>
    </svg>
    <div class="center">
      <div class="big value" id="load">--</div>
      <div class="cap kicker">GPU LOAD</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="label kicker">Temp</div>
      <div class="val value" id="temp">--<small class="unit"> °C</small></div>
    </div>
    <div class="stat">
      <div class="label kicker">Clock</div>
      <div class="val value" id="clock">--<small class="unit"> MHz</small></div>
    </div>
    <div class="stat">
      <div class="label kicker">VRAM</div>
      <div class="val value" id="vram">--<small class="unit"> %</small></div>
    </div>
  </div>
  <div class="device" id="device"></div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const GPU_TYPES = ['gpunvidia', 'gpuamd', 'gpuintel'];
  const CIRCUMFERENCE = 2 * Math.PI * 44;
  const ring = document.getElementById('ringValue');
  ring.style.strokeDasharray = String(CIRCUMFERENCE);
  ring.style.strokeDashoffset = String(CIRCUMFERENCE);

  WW.onInit((state) => {
    const s = state.settings;
    // bgStyle drives the widget-base panel-opacity classes (default = solid).
    document.body.classList.toggle('bg-solid', s.bgStyle !== 'transparent' && s.bgStyle !== 'glass');
    document.body.classList.toggle('bg-glass', s.bgStyle === 'glass');
    document.body.classList.toggle('bg-transparent', s.bgStyle === 'transparent');

    // Per-text-type customization (color + percent size scale). The host merges
    // manifest defaults into settings, so a color still at its default is left
    // unset and the CSS falls through to the theme tokens.
    const override = (prop, value, def) => {
      if (value && String(value).toLowerCase() !== def) document.body.style.setProperty(prop, value);
      else document.body.style.removeProperty(prop);
    };
    override('--accent', s.accentColor, '#76ff7a');
    override('--title-color', s.titleColor, '#7d8697');
    override('--value-color', s.valueColor, '#e8ecf2');
    override('--label-color', s.labelColor, '#7d8697');
    override('--hint-color', s.hintColor, '#545d6e');
    document.body.style.setProperty('--title-scale', String((Number(s.titleSize) || 100) / 100));
    document.body.style.setProperty('--value-scale', String((Number(s.valueSize) || 100) / 100));
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
    document.body.style.setProperty('--hint-scale', String((Number(s.hintSize) || 100) / 100));
  });

  function pick(settingId, opts) {
    return (settingId && WW.sensorById(settingId)) || WW.findSensor(opts);
  }

  WW.onSensors(() => {
    const s = WW.settings;
    const load = pick(s.loadSensorId, {
      type: 'Load', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core', 'D3D 3D'],
    });
    const temp = pick(s.tempSensorId, {
      type: 'Temperature', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core', 'GPU Hot Spot'],
    });
    const clock = WW.findSensor({
      type: 'Clock', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core'], nameIncludes: ['core'],
    });
    const vram = WW.findSensor({
      type: 'Load', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Memory'], nameIncludes: ['memory'],
    });

    const loadValue = load && load.value != null ? Math.min(100, load.value) : null;
    document.getElementById('load').textContent = loadValue == null ? '--' : Math.round(loadValue) + '%';
    ring.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - (loadValue || 0) / 100));

    setStat('temp', temp, 0, ' °C');
    setStat('clock', clock, 0, ' MHz');
    setStat('vram', vram, 0, ' %');

    const any = load || temp || clock;
    document.getElementById('device').textContent = any ? any.device : 'No GPU sensors found';
  });

  function setStat(id, sensor, decimals, unit) {
    const el = document.getElementById(id);
    const value = sensor && sensor.value != null ? sensor.value.toFixed(decimals) : '--';
    el.innerHTML = value + '<small class="unit">' + unit + '</small>';
  }
</script>
</body>
</html>
