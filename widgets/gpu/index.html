<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GPU Monitor</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, typography basics come from widget-base.css. */
  body {
    display: flex;
    flex-direction: column;
    padding: 12px 16px 10px;
  }
  #main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    /* Wrap, don't clip: a quarter slot at a 200% value scale cannot hold four
     * readouts in one row, so they reflow onto a second. */
    flex-wrap: wrap;
    align-content: center;
    align-items: center;
    justify-content: space-evenly;
    gap: 4% 6%;
    margin-top: 2%;
  }
  .stat .val {
    font-size: calc(clamp(18px, 9vh, 44px) * var(--value-scale, 1));
    color: var(--text);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat .val .unit { font-size: 45%; font-weight: 500; color: var(--text-muted); }
  .stat .label {
    margin-top: 4px;
    font-size: calc(clamp(8px, 2.6vh, 10px) * var(--label-scale, 1));
  }
  /* Secondary pair reads a step smaller than the load/temp pair. */
  #cols { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-evenly; gap: 4% 6%; flex: 1 1 auto; }
  .stat.minor .val { font-size: calc(clamp(14px, 6.5vh, 30px) * var(--value-scale, 1)); }
  #loadScale { margin-top: auto; }
</style>
</head>
<body>
  <header class="hd">
    <span class="kicker">GPU</span>
    <span class="st" id="device"></span>
  </header>
  <div id="main">
    <div class="stat">
      <div class="val value" id="load">--</div>
      <div class="label kicker">Load</div>
    </div>
    <div class="stat">
      <div class="val value" id="temp">--</div>
      <div class="label kicker">Temp</div>
    </div>
    <div id="cols">
      <div class="stat minor">
        <div class="val value" id="clock">--</div>
        <div class="label kicker">Clock</div>
      </div>
      <div class="stat minor">
        <div class="val value" id="vram">--</div>
        <div class="label kicker">VRAM</div>
      </div>
    </div>
  </div>
  <!-- Load is the tile's natural axis: 0-100, fill and cursor at now. -->
  <div class="scale" id="loadScale" style="--pitch: 4%">
    <div class="rail"></div><div class="mns"></div>
    <div class="mj e-l" style="left:0"><b>0</b></div>
    <div class="mj" style="left:25%"><b>25</b></div>
    <div class="mj" style="left:50%"><b>50</b></div>
    <div class="mj" style="left:75%"><b>75</b></div>
    <div class="mj e-r" style="left:100%"><b>100</b></div>
    <div class="fill" id="loadFill" style="width:0%"></div>
    <div class="cur" id="loadCur" style="left:0%"></div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const GPU_TYPES = ['gpunvidia', 'gpuamd', 'gpuintel'];

  WW.onInit((state) => {
    const s = state.settings;
    // Per-text-type size scales. Appearance comes from the theme tokens (global
    // theme or the per-slot style override) — legacy color keys in old layouts
    // are deliberately ignored.
    document.body.style.setProperty('--value-scale', String((Number(s.valueSize) || 100) / 100));
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
  });

  function pick(settingId, opts) {
    return (settingId && WW.sensorById(settingId)) || WW.findSensor(opts);
  }

  WW.onSensors(() => {
    const s = WW.settings;
    const load = pick(s.loadSensorId, {
      type: 'Load', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core', 'D3D 3D'],
    });
    const temp = pick(s.tempSensorId, {
      type: 'Temperature', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core', 'GPU Hot Spot'],
    });
    const clock = WW.findSensor({
      type: 'Clock', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core'], nameIncludes: ['core'],
    });
    const vram = WW.findSensor({
      type: 'Load', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Memory'], nameIncludes: ['memory'],
    });

    const loadValue = load && load.value != null ? Math.min(100, load.value) : null;
    setStat('load', loadValue == null ? null : { value: loadValue }, 0, '%');
    const pct = (loadValue || 0).toFixed(1) + '%';
    document.getElementById('loadFill').style.width = pct;
    document.getElementById('loadCur').style.left = pct;

    setStat('temp', temp, 0, '°C');
    setStat('clock', clock, 0, 'MHz');
    setStat('vram', vram, 0, '%');

    const any = load || temp || clock;
    document.getElementById('device').textContent = any ? any.device : 'No GPU sensors found';
  });

  function setStat(id, sensor, decimals, unit) {
    const el = document.getElementById(id);
    el.textContent = sensor && sensor.value != null ? sensor.value.toFixed(decimals) : '--';
    const small = document.createElement('small');
    small.className = 'unit';
    small.textContent = unit;
    el.appendChild(small);
  }
</script>
</body>
</html>
