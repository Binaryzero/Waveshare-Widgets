<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GPU Monitor</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — colors, background, typography basics come from widget-base.css.
   * Type is the size each role had at the smallest tile (a 320x200 band) times the
   * tile scale (--ts, widget-base.css), so a bigger tile reads bigger. */
  body {
    display: flex;
    flex-direction: column;
    padding: 12px 16px 10px;
  }
  #main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: calc(8px * var(--ts));
    /* The readouts are sized in this em: the tile's scale times the user's size, held
     * to 7.2vh so two rows of them fit a 200px band even at 200%. The container query
     * below counts the room for four in the same unit. */
    container-type: inline-size;
    font-size: min(calc(10px * var(--ts) * var(--value-scale, 1)), 7.2vh);
  }
  /* The four readouts: one line of four where they fit, otherwise two and two — load
   * and temp, then clock and VRAM — rather than a free wrap that strands one on a line
   * of its own. Four need about 22em with their gaps: a quarter tile has 19 to 22, a
   * half tile 31 to 41, so the break comes on a quarter tile, and on a half tile at a
   * 200% size. Wrap, don't clip: a pair too wide for its line still wraps. */
  #stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: calc(3px * var(--ts)) calc(12px * var(--ts));
  }
  #stats .brk { display: none; flex-basis: 100%; height: 0; }
  @container (max-width: 26em) { #stats .brk { display: block; } }
  .stat { min-width: 0; }
  .stat .val {
    font-size: 2.8em;
    color: var(--text);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stat .val .unit { font-size: 45%; font-weight: 500; color: var(--text-muted); }
  .stat .label {
    margin-top: calc(3px * var(--ts));
    font-size: calc(8px * var(--ts) * var(--label-scale, 1));
  }
  /* Secondary pair reads a step smaller than the load/temp pair. */
  .stat.minor .val { font-size: 2em; }
  /* Which GPU this is — the context the old header carried, kept because a machine can
   * have two (an iGPU beside the card) and a tile for each. */
  #device {
    font-size: calc(12px * var(--ts)); font-weight: 500; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #loadScale { margin-top: auto; }
  /* No GPU reported anything: the state card replaces the readouts and the ruler. */
  #state { position: fixed; inset: 0; }
</style>
</head>
<body>
  <div id="main">
    <div id="stats">
      <div class="stat">
        <div class="val value" id="load">--</div>
        <div class="label kicker">Load</div>
      </div>
      <div class="stat">
        <div class="val value" id="temp">--</div>
        <div class="label kicker">Temp</div>
      </div>
      <i class="brk"></i>
      <div class="stat minor">
        <div class="val value" id="clock">--</div>
        <div class="label kicker">Clock</div>
      </div>
      <div class="stat minor">
        <div class="val value" id="vram">--</div>
        <div class="label kicker">VRAM</div>
      </div>
    </div>
    <div id="device"></div>
  </div>
  <!-- Load is the tile's natural axis: 0-100, fill and cursor at now. -->
  <div class="scale" id="loadScale" style="--pitch: 4%">
    <div class="rail"></div><div class="mns"></div>
    <div class="mj e-l" style="left:0"><b>0</b></div>
    <div class="mj" style="left:25%"><b>25</b></div>
    <div class="mj" style="left:50%"><b>50</b></div>
    <div class="mj" style="left:75%"><b>75</b></div>
    <div class="mj e-r" style="left:100%"><b>100</b></div>
    <div class="fill" id="loadFill" style="width:0%"></div>
    <div class="cur" id="loadCur" style="left:0%"></div>
  </div>
  <div class="state-card" id="state" hidden>
    <div class="state-icon">?</div>
    <div class="state-title">No GPU sensors found</div>
    <div class="state-body">No NVIDIA, AMD or Intel graphics driver reported a load, temperature
      or clock. A sensor named differently can be picked in the widget's settings.</div>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const GPU_TYPES = ['gpunvidia', 'gpuamd', 'gpuintel'];

  WW.onInit((state) => {
    const s = state.settings;
    // Per-text-type size scales. Appearance comes from the theme tokens (global
    // theme or the per-slot style override) — legacy color keys in old layouts
    // are deliberately ignored.
    document.body.style.setProperty('--value-scale', String((Number(s.valueSize) || 100) / 100));
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
  });

  function pick(settingId, opts) {
    return (settingId && WW.sensorById(settingId)) || WW.findSensor(opts);
  }

  WW.onSensors(() => {
    const s = WW.settings;
    const load = pick(s.loadSensorId, {
      type: 'Load', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core', 'D3D 3D'],
    });
    const temp = pick(s.tempSensorId, {
      type: 'Temperature', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core', 'GPU Hot Spot'],
    });
    const clock = WW.findSensor({
      type: 'Clock', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Core'], nameIncludes: ['core'],
    });
    const vram = WW.findSensor({
      type: 'Load', deviceTypeIncludes: GPU_TYPES, preferredNames: ['GPU Memory'], nameIncludes: ['memory'],
    });

    const loadValue = load && load.value != null ? Math.min(100, load.value) : null;
    setStat('load', loadValue == null ? null : { value: loadValue }, 0, '%');
    const pct = (loadValue || 0).toFixed(1) + '%';
    document.getElementById('loadFill').style.width = pct;
    document.getElementById('loadCur').style.left = pct;

    setStat('temp', temp, 0, '°C');
    setStat('clock', clock, 0, 'MHz');
    setStat('vram', vram, 0, '%');

    // Nothing to show is a state, not a row of dashes under a corner note: the card
    // says so and the readouts come back with the first sensor.
    const any = load || temp || clock;
    document.getElementById('device').textContent = any ? any.device || '' : '';
    document.getElementById('state').hidden = !!any;
    document.getElementById('main').hidden = !any;
    document.getElementById('loadScale').hidden = !any;
  });

  function setStat(id, sensor, decimals, unit) {
    const el = document.getElementById(id);
    el.textContent = sensor && sensor.value != null ? sensor.value.toFixed(decimals) : '--';
    const small = document.createElement('small');
    small.className = 'unit';
    small.textContent = unit;
    el.appendChild(small);
  }
</script>
</body>
</html>
