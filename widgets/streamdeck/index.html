<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stream Deck</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — tokens, background/bgStyle handling and the typography base
   * come from widget-base.css. */
  #grid {
    display: grid;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
    place-content: center;
  }
  /* Physical Stream Deck key look: raised rounded face with a soft top light.
   * A key is an interactive control (like .btn), so its face uses the opaque
   * control/surface tokens; shadow + top-light strength derive from the panel
   * alpha formulas so keys soften on glass/transparent backgrounds. */
  .key {
    position: relative;
    border-radius: 14px;
    background: linear-gradient(165deg, var(--control-bg) 0%, var(--surface-alt) 55%, var(--surface) 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 3px 10px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.4)),
      inset 0 1px 0 rgba(255, 255, 255, calc(var(--panel-border-alpha) * 0.5));
    overflow: hidden;
    cursor: pointer;
    /* none, not manipulation: nothing here scrolls, and manipulation still PERMITS a
     * pan — so horizontal finger drift on a control chained out to the shell pager and
     * changed page instead of pressing it (#206). */
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    transition: transform 0.06s var(--ease), box-shadow 0.12s var(--ease);
  }
  .key:active {
    transform: scale(0.94);
    box-shadow:
      0 0 0 2px var(--accent) inset,
      0 1px 4px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.6));
  }
  /* Empty keys are unoccupied SOCKETS, not buttons: a barely-there outline that keeps
     the layout readable without inflating the apparent button count. */
  .key.empty {
    background: transparent;
    border: 1px dashed var(--line);
    box-shadow: none;
    cursor: default;
    opacity: 0.5;
  }
  /* When empty keys are hidden they still occupy the grid (so used-key positions and
     click coordinates stay correct) but render invisibly. */
  .key.empty.hidden { background: transparent; border-color: transparent; box-shadow: none; }
  #picker {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 6px; padding: 6px; justify-content: center;
    background: rgba(var(--surface-rgb), 0.85); flex-wrap: wrap;
  }
  #picker button {
    font: inherit; font-size: clamp(9px, 3vh, 13px);
    color: var(--text); background: var(--control-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  #picker button.active { border-color: var(--accent); color: var(--accent); }
  .key img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 13px; }
  .key .title {
    position: absolute; left: 0; right: 0; bottom: 0;
    color: var(--text);
    font-size: calc(clamp(8px, 2.6vh, 12px) * var(--title-scale, 1));
    text-align: center;
    padding: 2px 3px;
    /* Legibility scrim over the key image, in the theme's surface tone so the
     * default --text title stays readable on light themes too. */
    background: linear-gradient(transparent, rgba(var(--surface-rgb), 0.75));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .key .fallback {
    font-size: calc(clamp(9px, 3.2vh, 14px) * var(--fallback-scale, 1));
    color: var(--text-muted);
    text-align: center;
    padding: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 92%;
  }
  /* Live mirror: the VSD window's own pixels, letterboxed; taps map to key cells.
   * No background of its own — the body's panel paint shows through the letterbox,
   * so bgStyle behaves exactly as on the icon grid. */
  #live {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
  }
  #live img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    display: block;
  }
  #liveFlash {
    position: fixed;
    border: 2px solid var(--accent);
    border-radius: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--dur-mid) var(--ease);
  }
  #message {
    position: fixed; inset: 0;
    display: none; flex-direction: column; gap: 1.4vh;
    align-items: center; justify-content: center;
    text-align: center; padding: 18px;
    color: var(--text-muted);
    font-size: calc(clamp(12px, 4.5vh, 18px) * var(--message-scale, 1));
  }
  #message small { color: var(--text-dim); font-size: 80%; max-width: 90%; }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="live"><img id="liveImg" alt="" draggable="false" /></div>
  <div id="liveFlash"></div>
  <div id="picker" hidden></div>
  <div id="message"></div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { rows: 0, cols: 0, showEmpty: true, hideWindow: true, profileName: '', keyShape: 'fill', live: true, liveRefresh: 400 };
  let lastProfile = null;
  let pollTimer = null;
  let captureTimer = null;

  // The on-panel picker remembers its choice across reloads (per-widget localStorage);
  // an explicit profileName in the widget settings always wins.
  function rememberedProfile() {
    try { return localStorage.getItem('ww-sd-profile') || ''; } catch (e) { return ''; }
  }


  WW.onInit((state) => {
    const s = state.settings;
    cfg.rows = Number(s.rowsOverride) || 0;
    cfg.cols = Number(s.colsOverride) || 0;
    cfg.showEmpty = s.showEmpty !== 'off';
    cfg.hideWindow = s.hideWindow !== 'off';
    cfg.profileName = s.profileName || rememberedProfile();
    cfg.keyShape = s.keyShape === 'square' ? 'square' : 'fill';
    cfg.live = s.liveMode !== 'off';
    cfg.liveRefresh = Math.min(5000, Math.max(150, Number(s.liveRefresh) || 400));
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // pre-token behavior for unset AND out-of-spec values (no class = glass in base).
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy color keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--title-scale', (Number(s.titleSize) || 100) / 100);
    document.body.style.setProperty('--fallback-scale', (Number(s.fallbackSize) || 100) / 100);
    document.body.style.setProperty('--message-scale', (Number(s.messageSize) || 100) / 100);
    schedulePolling();
    poll();
  });

  // Fast capture-only loop: the host answers {unchanged:true} for identical frames, so
  // polling quickly is cheap while the deck is idle.
  WW.onStreamDeckCapture((data) => {
    if (!cfg.live) return;
    if (data.image) {
      if (lastProfile && lastProfile.available) {
        if (!lastProfile.capture) lastProfile.capture = {};
        lastProfile.capture.image = data.image;
        renderLive(lastProfile);
      }
    } else if (data.available === false) {
      // Window went away: remember it NOW so taps in the stale window fail-flash
      // instead of posting into the void, then refresh for the fallback/message.
      if (lastProfile) lastProfile.available = false;
      poll();
    }
  });

  WW.onStreamDeck(render);
  window.addEventListener('resize', () => { if (lastProfile) render(lastProfile); });

  function poll() {
    WW.requestStreamDeck({ profileName: cfg.profileName, hideWindow: cfg.hideWindow, live: cfg.live });
  }

  // The profile poll (buttons, picker, page switches) stays relaxed; in live mode a
  // separate capture-only loop carries the actual pixels at the configured rate.
  function schedulePolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 4000);
    clearInterval(captureTimer);
    if (cfg.live) captureTimer = setInterval(() => WW.requestStreamDeckCapture(), cfg.liveRefresh);
  }

  // Restartable state-theater flash (fail-flash from widget-base): remove, force
  // reflow, re-add — otherwise a second failure on the same key shows nothing.
  function flash(elm, cls) {
    elm.classList.remove(cls);
    void elm.offsetWidth;
    elm.classList.add(cls);
  }

  function showMessage(title, detail) {
    const grid = document.getElementById('grid');
    const msg = document.getElementById('message');
    grid.textContent = '';
    msg.style.display = 'flex';
    msg.innerHTML = '';
    const h = document.createElement('div');
    h.textContent = title;
    msg.appendChild(h);
    if (detail) {
      const s = document.createElement('small');
      s.textContent = detail;
      msg.appendChild(s);
    }
  }

  // ---- live mirror -------------------------------------------------------------

  function setLiveVisible(on) {
    document.getElementById('live').style.display = on ? 'flex' : 'none';
    document.getElementById('grid').style.display = on ? 'none' : 'grid';
  }

  function renderLive(profile) {
    document.getElementById('message').style.display = 'none';
    setLiveVisible(true);
    const img = document.getElementById('liveImg');
    img.src = profile.capture.image;
    img.dataset.rows = cfg.rows || profile.rows || 3;
    img.dataset.cols = cfg.cols || profile.cols || 5;
  }

  // Map a tap on the letterboxed capture back to a key cell and trigger it.
  document.getElementById('live').addEventListener('click', (ev) => {
    const live = document.getElementById('live');
    const img = document.getElementById('liveImg');
    // Deck gone (capture reported available:false and the refresh poll hasn't
    // repainted yet) or no frame to map the tap onto — refuse visibly, not silently.
    if (!lastProfile || lastProfile.available === false ||
        !img.naturalWidth || !img.naturalHeight) {
      flash(live, 'fail-flash');
      return;
    }
    const rows = Number(img.dataset.rows) || 3;
    const cols = Number(img.dataset.cols) || 5;
    const r = img.getBoundingClientRect();
    const x = ev.clientX - r.left;
    const y = ev.clientY - r.top;
    if (x < 0 || y < 0 || x >= r.width || y >= r.height) return;
    const col = Math.min(cols - 1, Math.floor(x / (r.width / cols)));
    const row = Math.min(rows - 1, Math.floor(y / (r.height / rows)));
    WW.streamDeckClick(row, col, rows, cols);
    WW.log('streamdeck: live click ' + row + ',' + col);

    // Brief highlight over the tapped cell. NOTE: named hl, not flash — a
    // `const flash` here would shadow the top-level flash() helper across the
    // WHOLE handler scope, turning the fail-flash call above into a TDZ
    // ReferenceError (the refused tap would throw instead of flashing).
    const hl = document.getElementById('liveFlash');
    hl.style.left = (r.left + col * (r.width / cols)) + 'px';
    hl.style.top = (r.top + row * (r.height / rows)) + 'px';
    hl.style.width = (r.width / cols) + 'px';
    hl.style.height = (r.height / rows) + 'px';
    hl.style.opacity = '1';
    setTimeout(() => { hl.style.opacity = '0'; }, 220);
  });

  function renderPicker(profiles) {
    const picker = document.getElementById('picker');
    if (!profiles || profiles.length <= 1) {
      picker.hidden = true;
      return;
    }
    picker.hidden = false;
    picker.textContent = '';
    for (const name of profiles) {
      const b = document.createElement('button');
      // Not a .btn (keeps the compact chip look) — .pressable supplies the
      // pressed physicality the bare chip lacked.
      b.className = 'pressable';
      b.textContent = name;
      if (name === cfg.profileName || (!cfg.profileName && name === profiles[0])) b.className = 'pressable active';
      b.addEventListener('click', () => {
        cfg.profileName = name;
        try { localStorage.setItem('ww-sd-profile', name); } catch (e) { /* private mode */ }
        poll();
      });
      picker.appendChild(b);
    }
  }

  function render(profile) {
    lastProfile = profile;
    if (!profile || !profile.available) {
      renderPicker(null);
      setLiveVisible(false);
      showMessage('No Virtual Stream Deck found',
        'Open Elgato Stream Deck and create a Virtual Stream Deck (turn OFF "Hide unused keys"). Its buttons — and their real plugin actions — appear here.');
      return;
    }
    renderPicker(profile.profiles);

    // Live mirror: render the VSD window's actual pixels (dynamic key faces included);
    // the icon grid below remains the fallback when no capture is available.
    if (cfg.live && profile.capture && profile.capture.image) {
      renderLive(profile);
      return;
    }
    setLiveVisible(false);

    const buttons = profile.buttons || [];
    if (buttons.length === 0) {
      showMessage('Virtual Stream Deck is empty', 'Add some buttons to it in Stream Deck.');
      return;
    }

    document.getElementById('message').style.display = 'none';
    const rows = cfg.rows || profile.rows || 3;
    const cols = cfg.cols || profile.cols || 5;

    const grid = document.getElementById('grid');
    if (cfg.keyShape === 'square') {
      // Real-device look: the largest square keys that fit, centered as a block.
      const pad = 8, gap = 8;
      const availW = window.innerWidth - pad * 2 - gap * (cols - 1);
      const availH = window.innerHeight - pad * 2 - gap * (rows - 1);
      const k = Math.max(24, Math.floor(Math.min(availW / cols, availH / rows)));
      grid.style.gridTemplateColumns = 'repeat(' + cols + ', ' + k + 'px)';
      grid.style.gridTemplateRows = 'repeat(' + rows + ', ' + k + 'px)';
    } else {
      // Fill: keys stretch so the grid uses every pixel of the slot.
      grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
      grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    }
    grid.textContent = '';

    // Index buttons by cell for O(1) placement.
    const byCell = new Map();
    for (const b of buttons) byCell.set(b.row + ',' + b.col, b);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const btn = byCell.get(r + ',' + c);
        const cell = document.createElement('div');
        if (!btn) {
          // Empty cells always occupy the grid (keeps positions and click coords right);
          // the showEmpty toggle only controls whether they're visible.
          cell.className = 'key empty' + (cfg.showEmpty ? '' : ' hidden');
          grid.appendChild(cell);
          continue;
        }
        cell.className = 'key';
        if (btn.image) {
          const img = document.createElement('img');
          img.src = btn.image;
          cell.appendChild(img);
          if (btn.title) {
            const t = document.createElement('div');
            t.className = 'title';
            t.textContent = btn.title;
            cell.appendChild(t);
          }
        } else {
          const f = document.createElement('div');
          f.className = 'fallback';
          f.textContent = btn.title || '●';
          cell.appendChild(f);
        }
        cell.addEventListener('click', () => {
          // The deck can vanish between polls (VSD window closed); the grid is
          // then stale for up to 4 s. ww-sd-click is fire-and-forget, so refuse
          // the tap visibly here instead of posting into the void.
          if (!lastProfile || lastProfile.available === false) {
            flash(cell, 'fail-flash');
            return;
          }
          WW.streamDeckClick(btn.row, btn.col, rows, cols);
          WW.log('streamdeck: click ' + btn.row + ',' + btn.col + ' (' + (btn.title || '') + ')');
        });
        grid.appendChild(cell);
      }
    }
  }
</script>
</body>
</html>
