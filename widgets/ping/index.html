<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ping Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b0e14;
    color: #e8ecf2;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body.bg-transparent { background: transparent; }
  body.bg-glass { background: rgba(11, 14, 20, 0.55); }
  #grid {
    display: grid;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
  }
  .host {
    position: relative;
    border-radius: 10px;
    background: rgba(23, 28, 40, 0.6);
    border: 1px solid #232a3a;
    padding: 6px 10px 4px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .host .top { display: flex; align-items: baseline; gap: 8px; }
  .host .dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex: none; align-self: center;
    background: #545d6e;
  }
  .host .dot.good { background: #3ddc84; box-shadow: 0 0 6px rgba(61,220,132,0.7); }
  .host .dot.warn { background: #ffc24b; box-shadow: 0 0 6px rgba(255,194,75,0.7); }
  .host .dot.bad  { background: #ff5577; box-shadow: 0 0 6px rgba(255,85,119,0.7); }
  .host .name {
    color: var(--label-color, #7d8697);
    font-size: calc(clamp(9px, 3vh, 13px) * var(--label-scale, 1));
    letter-spacing: 0.06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .host .rtt {
    font-size: calc(clamp(15px, 6.5vh, 30px) * var(--value-scale, 1));
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .host .rtt small { font-size: 55%; font-weight: 400; color: var(--label-color, #7d8697); }
  .host .rtt.good { color: var(--value-color, #3ddc84); }
  .host .rtt.warn { color: var(--value-color, #ffc24b); }
  .host .rtt.bad  { color: var(--value-color, #ff5577); }
  .host .rtt.down { color: var(--value-color, #545d6e); }
  .host .loss {
    color: var(--label-color, #7d8697);
    font-size: calc(clamp(8px, 2.4vh, 11px) * var(--label-scale, 1));
    white-space: nowrap;
  }
  .host canvas { position: absolute; inset: auto 0 0 0; width: 100%; height: 38%; opacity: 0.85; }
  #message {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    color: #7d8697; font-size: clamp(12px, 4.5vh, 17px);
  }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="message"></div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const HISTORY = 60;           // samples kept per host (sparkline + loss window)
  const cfg = { targets: [], interval: 3, goodMs: 50, badMs: 120 };
  const history = new Map();    // host -> [{ok, rtt}]
  let cards = new Map();        // host -> {dot, rtt, loss, canvas}
  let pollTimer = null;

  // "Label=host, Label=host" (commas or newlines); bare hosts get themselves as label.
  function parseTargets(text) {
    return String(text || '').split(/[,\n]/).map((part) => {
      const t = part.trim();
      if (!t) return null;
      const eq = t.indexOf('=');
      return eq > 0
        ? { label: t.slice(0, eq).trim(), host: t.slice(eq + 1).trim() }
        : { label: t, host: t };
    }).filter((x) => x && x.host).slice(0, 16);
  }

  WW.onInit((state) => {
    const s = state.settings;
    document.body.classList.toggle('bg-transparent', s.bgStyle === 'transparent');
    document.body.classList.toggle('bg-glass', s.bgStyle === 'glass');
    document.body.style.setProperty('--label-color', s.labelColor || '#7d8697');
    document.body.style.setProperty('--label-scale', (Number(s.labelSize) || 100) / 100);
    if (s.valueColor && s.valueColor !== '#e8ecf2')
      document.body.style.setProperty('--value-color', s.valueColor);
    document.body.style.setProperty('--value-scale', (Number(s.valueSize) || 100) / 100);

    cfg.targets = parseTargets(s.hosts);
    cfg.interval = Math.min(30, Math.max(1, Number(s.interval) || 3));
    cfg.goodMs = Number(s.goodMs) || 50;
    cfg.badMs = Math.max(Number(s.badMs) || 120, cfg.goodMs + 10);

    buildCards();
    clearInterval(pollTimer);
    if (cfg.targets.length) {
      poll();
      pollTimer = setInterval(poll, cfg.interval * 1000);
    }
  });

  function buildCards() {
    const grid = document.getElementById('grid');
    const msg = document.getElementById('message');
    grid.textContent = '';
    cards = new Map();
    if (!cfg.targets.length) {
      msg.style.display = 'flex';
      msg.textContent = 'Add hosts in the widget settings — e.g. "Router=192.168.1.1, Cloudflare=1.1.1.1"';
      return;
    }
    msg.style.display = 'none';

    // Column count that keeps cards usable at any slot size/aspect.
    const n = cfg.targets.length;
    const cols = n <= 2 ? n : n <= 4 ? 2 : n <= 9 ? 3 : 4;
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    for (const t of cfg.targets) {
      const card = document.createElement('div');
      card.className = 'host';
      const top = document.createElement('div');
      top.className = 'top';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = t.label;
      const rtt = document.createElement('span');
      rtt.className = 'rtt down';
      rtt.textContent = '--';
      top.append(dot, name, rtt);
      const loss = document.createElement('div');
      loss.className = 'loss';
      loss.textContent = ' ';
      const canvas = document.createElement('canvas');
      card.append(top, loss, canvas);
      document.getElementById('grid').appendChild(card);
      cards.set(t.host, { dot, rtt, loss, canvas });
      if (!history.has(t.host)) history.set(t.host, []);
    }
  }

  async function poll() {
    let results;
    try {
      results = await WW.ping(cfg.targets.map((t) => t.host));
    } catch (e) {
      WW.log('ping: ' + e.message);
      return;
    }
    for (const r of results) {
      const samples = history.get(r.host);
      if (!samples) continue;
      samples.push({ ok: !!r.ok, rtt: r.ok ? Number(r.rttMs) : null });
      if (samples.length > HISTORY) samples.shift();
      renderCard(r.host);
    }
  }

  function classify(rtt) {
    if (rtt == null) return 'down';
    if (rtt < cfg.goodMs) return 'good';
    if (rtt < cfg.badMs) return 'warn';
    return 'bad';
  }

  function renderCard(host) {
    const ui = cards.get(host);
    const samples = history.get(host);
    if (!ui || !samples || !samples.length) return;
    const last = samples[samples.length - 1];
    const cls = classify(last.ok ? last.rtt : null);

    ui.dot.className = 'dot ' + (cls === 'down' ? '' : cls);
    ui.rtt.className = 'rtt ' + cls;
    if (last.ok) {
      ui.rtt.innerHTML = '';
      ui.rtt.append(String(Math.round(last.rtt)));
      const unit = document.createElement('small');
      unit.textContent = ' ms';
      ui.rtt.append(unit);
    } else {
      ui.rtt.textContent = 'down';
    }

    const lost = samples.filter((sm) => !sm.ok).length;
    const okRtts = samples.filter((sm) => sm.ok).map((sm) => sm.rtt);
    const avg = okRtts.length ? Math.round(okRtts.reduce((a, b) => a + b, 0) / okRtts.length) : null;
    ui.loss.textContent = (avg != null ? 'avg ' + avg + ' ms' : 'no replies') +
      (lost ? '  ·  ' + Math.round(lost / samples.length * 100) + '% loss' : '');

    drawSpark(ui.canvas, samples);
  }

  function drawSpark(canvas, samples) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * 2) { canvas.width = w * 2; canvas.height = h * 2; }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const max = Math.max(cfg.badMs, ...samples.filter((s) => s.ok).map((s) => s.rtt), 1);
    const bw = canvas.width / HISTORY;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const x = canvas.width - (samples.length - i) * bw;
      if (!s.ok) {
        ctx.fillStyle = 'rgba(255,85,119,0.55)';
        ctx.fillRect(x, 0, Math.max(1, bw - 1), canvas.height);
        continue;
      }
      const cls = classify(s.rtt);
      ctx.fillStyle = cls === 'good' ? 'rgba(61,220,132,0.5)' : cls === 'warn' ? 'rgba(255,194,75,0.55)' : 'rgba(255,85,119,0.55)';
      const bh = Math.max(2, (s.rtt / max) * canvas.height);
      ctx.fillRect(x, canvas.height - bh, Math.max(1, bw - 1), bh);
    }
  }

  window.addEventListener('resize', () => { for (const host of cards.keys()) renderCard(host); });
</script>
</body>
</html>
