<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ping Monitor</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — colors, background, bgStyle and the typography base come from
   * widget-base.css. State hues map to the --ok/--warn/--err tokens. */
  #grid {
    display: grid;
    gap: 8px;
    padding: 8px;
    width: 100%;
    height: 100%;
  }
  .host {
    position: relative;
    border-radius: var(--radius-control);
    padding: 6px 10px 4px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .host .top { display: flex; align-items: baseline; gap: 8px; }
  .host .dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex: none; align-self: center;
    background: var(--text-dim);
  }
  .host .dot.good { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .host .dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .host .dot.bad  { background: var(--err); box-shadow: 0 0 6px var(--err); }
  .host .name {
    color: var(--text-muted);
    font-size: calc(clamp(9px, 3vh, 13px) * var(--label-scale, 1));
    letter-spacing: 0.06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .host .rtt {
    font-size: calc(clamp(15px, 6.5vh, 30px) * var(--value-scale, 1));
    font-weight: 600;
    line-height: normal;
  }
  .host .rtt small { font-size: 55%; font-weight: 400; color: var(--text-muted); }
  /* Status colors come straight from the theme's state tokens. */
  .host .rtt.good { color: var(--ok); }
  .host .rtt.warn { color: var(--warn); }
  .host .rtt.bad  { color: var(--err); }
  .host .rtt.down { color: var(--text-dim); }
  .host .loss {
    color: var(--text-muted);
    font-size: calc(clamp(8px, 2.4vh, 11px) * var(--label-scale, 1));
    white-space: nowrap;
  }
  .host canvas { position: absolute; inset: auto 0 0 0; width: 100%; height: 38%; opacity: 0.85; }
  #message { position: fixed; inset: 0; }
</style>
</head>
<body>
  <div id="grid"></div>
  <div class="state-card" id="message" hidden>
    <div class="state-icon">◎</div>
    <div class="state-title">No hosts configured</div>
    <div class="state-body">Add hosts in the widget settings — each entry needs a name and a host or IP, e.g. Router / 192.168.1.1.</div>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const HISTORY = 60;           // samples kept per host (sparkline + loss window)
  const cfg = { targets: [], interval: 3, goodMs: 50, badMs: 120 };
  const history = new Map();    // host -> [{ok, rtt}]
  let cards = new Map();        // host -> {dot, rtt, loss, canvas}
  let pollTimer = null;

  // Sparkline colors for the canvas — canvases can't resolve var(), so read the
  // state tokens off :root. Re-read on every init: theme edits arrive as a fresh
  // ww-init with new token values already applied to :root.
  const spark = { ok: '', warn: '', err: '' };
  function readSparkColors() {
    const cs = getComputedStyle(document.documentElement);
    const read = (name) => cs.getPropertyValue(name).trim();
    spark.ok = read('--ok');
    spark.warn = read('--warn');
    spark.err = read('--err');
  }

  // Accepts both shapes of the "hosts" setting:
  //  - new: an array of {label, host} objects (list property),
  //  - legacy: a "Label=host, Label=host" string (commas or newlines) from old
  //    saved layouts; bare hosts get themselves as label.
  function parseTargets(value) {
    let entries;
    if (Array.isArray(value)) {
      entries = value.map((item) => {
        if (!item) return null;
        if (typeof item === 'string') return { label: item.trim(), host: item.trim() };
        const host = String(item.host == null ? '' : item.host).trim();
        const label = String(item.label == null ? '' : item.label).trim() || host;
        return { label, host };
      });
    } else {
      entries = String(value || '').split(/[,\n]/).map((part) => {
        const t = part.trim();
        if (!t) return null;
        const eq = t.indexOf('=');
        return eq > 0
          ? { label: t.slice(0, eq).trim(), host: t.slice(eq + 1).trim() }
          : { label: t, host: t };
      });
    }
    return entries.filter((x) => x && x.host).slice(0, 16);
  }

  WW.onInit((state) => {
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // pre-token behavior for unset AND out-of-spec values.
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy color keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--label-scale', (Number(s.labelSize) || 100) / 100);
    document.body.style.setProperty('--value-scale', (Number(s.valueSize) || 100) / 100);
    readSparkColors();

    cfg.targets = parseTargets(s.hosts);
    cfg.interval = Math.min(30, Math.max(1, Number(s.interval) || 3));
    cfg.goodMs = Number(s.goodMs) || 50;
    cfg.badMs = Math.max(Number(s.badMs) || 120, cfg.goodMs + 10);

    buildCards();
    clearInterval(pollTimer);
    if (cfg.targets.length) {
      poll();
      pollTimer = setInterval(poll, cfg.interval * 1000);
    }
  });

  function buildCards() {
    const grid = document.getElementById('grid');
    const msg = document.getElementById('message');
    grid.textContent = '';
    cards = new Map();
    msg.hidden = !!cfg.targets.length;
    if (!cfg.targets.length) return;

    // Column count that keeps cards usable at any slot size/aspect.
    const n = cfg.targets.length;
    const cols = n <= 2 ? n : n <= 4 ? 2 : n <= 9 ? 3 : 4;
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    for (const t of cfg.targets) {
      const card = document.createElement('div');
      card.className = 'host card';
      const top = document.createElement('div');
      top.className = 'top';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = t.label;
      const rtt = document.createElement('span');
      rtt.className = 'rtt value down';
      rtt.textContent = '--';
      top.append(dot, name, rtt);
      const loss = document.createElement('div');
      loss.className = 'loss';
      loss.textContent = ' ';
      const canvas = document.createElement('canvas');
      card.append(top, loss, canvas);
      document.getElementById('grid').appendChild(card);
      cards.set(t.host, { dot, rtt, loss, canvas });
      if (!history.has(t.host)) history.set(t.host, []);
    }
  }

  async function poll() {
    let results;
    try {
      results = await WW.ping(cfg.targets.map((t) => t.host));
    } catch (e) {
      WW.log('ping: ' + e.message);
      return;
    }
    for (const r of results) {
      const samples = history.get(r.host);
      if (!samples) continue;
      samples.push({ ok: !!r.ok, rtt: r.ok ? Number(r.rttMs) : null });
      if (samples.length > HISTORY) samples.shift();
      renderCard(r.host);
    }
  }

  function classify(rtt) {
    if (rtt == null) return 'down';
    if (rtt < cfg.goodMs) return 'good';
    if (rtt < cfg.badMs) return 'warn';
    return 'bad';
  }

  function renderCard(host) {
    const ui = cards.get(host);
    const samples = history.get(host);
    if (!ui || !samples || !samples.length) return;
    const last = samples[samples.length - 1];
    const cls = classify(last.ok ? last.rtt : null);

    ui.dot.className = 'dot ' + (cls === 'down' ? '' : cls);
    ui.rtt.className = 'rtt value ' + cls;
    if (last.ok) {
      ui.rtt.innerHTML = '';
      ui.rtt.append(String(Math.round(last.rtt)));
      const unit = document.createElement('small');
      unit.className = 'unit';
      unit.textContent = ' ms';
      ui.rtt.append(unit);
    } else {
      ui.rtt.textContent = 'down';
    }

    const lost = samples.filter((sm) => !sm.ok).length;
    const okRtts = samples.filter((sm) => sm.ok).map((sm) => sm.rtt);
    const avg = okRtts.length ? Math.round(okRtts.reduce((a, b) => a + b, 0) / okRtts.length) : null;
    ui.loss.textContent = (avg != null ? 'avg ' + avg + ' ms' : 'no replies') +
      (lost ? '  ·  ' + Math.round(lost / samples.length * 100) + '% loss' : '');

    drawSpark(ui.canvas, samples);
  }

  function drawSpark(canvas, samples) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * 2) { canvas.width = w * 2; canvas.height = h * 2; }
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const max = Math.max(cfg.badMs, ...samples.filter((s) => s.ok).map((s) => s.rtt), 1);
    const bw = canvas.width / HISTORY;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const x = canvas.width - (samples.length - i) * bw;
      if (!s.ok) {
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = spark.err;
        ctx.fillRect(x, 0, Math.max(1, bw - 1), canvas.height);
        continue;
      }
      const cls = classify(s.rtt);
      ctx.globalAlpha = cls === 'good' ? 0.5 : 0.55;
      ctx.fillStyle = cls === 'good' ? spark.ok : cls === 'warn' ? spark.warn : spark.err;
      const bh = Math.max(2, (s.rtt / max) * canvas.height);
      ctx.fillRect(x, canvas.height - bh, Math.max(1, bw - 1), bh);
    }
    ctx.globalAlpha = 1;
  }

  window.addEventListener('resize', () => { for (const host of cards.keys()) renderCard(host); });
</script>
</body>
</html>
