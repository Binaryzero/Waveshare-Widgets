<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Control Deck</title>
<link rel="stylesheet" href="https://app.wsw/widget-base.css" />
<style>
  /* Layout only — tokens, background/bgStyle handling, typography base and the
   * .state-card anatomy come from widget-base.css. */
  #grid {
    display: grid;
    gap: var(--space-2);
    padding: var(--space-2);
    width: 100%;
    height: 100%;
  }
  /* Stream-deck-style key face (same recipe as the stock launcher): raised,
   * rounded, soft top light, presses in. The face is an interactive control, so
   * it uses the opaque control/surface tokens; shadow + top-light strength come
   * from the panel alpha formulas so keys soften on glass/transparent tiles. */
  .key {
    /* Native <button> resets (keys are real buttons: focus ring + :disabled free). */
    appearance: none;
    font: inherit;
    color: inherit;
    padding: 0;
    border-radius: 12px;
    background: linear-gradient(165deg, var(--control-bg) 0%, var(--surface-alt) 55%, var(--surface) 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 3px 10px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.4)),
      inset 0 1px 0 rgba(255, 255, 255, calc(var(--panel-border-alpha) * 0.5));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: var(--key-min, 44px);
    min-height: var(--key-min, 44px);
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  /* Press feedback: scale down + accent ring. The .pressed class mirrors :active
     from pointer events so touch presses always flash too. */
  .key:active, .key.pressed {
    transform: scale(0.94);
    box-shadow:
      0 0 0 2px var(--accent) inset,
      0 1px 4px rgba(0, 0, 0, calc(var(--panel-shadow-alpha) * 2.6));
  }
  .key .icon {
    font-family: "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Variable", system-ui, sans-serif;
    font-size: var(--icon-size, clamp(18px, 14vh, 64px));
    line-height: 1.15;
  }
  .key .label {
    color: var(--text);
    font-size: calc(clamp(9px, 3.2vh, 14px) * var(--label-scale, 1));
    max-width: 94%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Over-limit notice: key-face shaped but inert and muted. */
  .key.more { cursor: default; opacity: 0.6; }
  .key.more .label { color: var(--text-muted); }
  #message { position: fixed; inset: 0; }
  #message .state-body { font-size: clamp(11px, 3.6vh, 13px); }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="message" class="state-card" hidden>
    <div class="state-icon" id="messageIcon">🎛️</div>
    <div class="state-title" id="messageTitle"></div>
    <div class="state-body" id="messageBody"></div>
  </div>

<script src="https://app.wsw/widget-api.js"></script>
<script>
  'use strict';
  const cfg = { columns: 0 };
  let buttons = [];
  const norm = (v) => String(v == null ? '' : v).trim().toLowerCase();

  const MAX_BUTTONS = 32;

  // ---- target syntax ------------------------------------------------------------
  // Everything below mirrors what the host actually executes (DeckAction.cs /
  // MediaSessionProvider.cs). A button whose target can't work end-to-end gets
  // exec {type:'invalid'} and fail-flashes on tap instead of posting into the void.
  const MEDIA_VERBS = new Set(['toggle', 'next', 'prev']);
  const HOTKEY_MODIFIERS = new Set(['ctrl', 'control', 'alt', 'shift', 'win', 'meta', 'super']);
  const HOTKEY_NAMED = new Set(['space', 'enter', 'return', 'tab', 'esc', 'escape',
    'backspace', 'delete', 'del', 'up', 'down', 'left', 'right', 'home', 'end',
    'pageup', 'pagedown', 'printscreen', 'prtsc',
    'volumeup', 'volumedown', 'volumemute',
    'medianext', 'mediaprev', 'mediastop', 'mediaplaypause']);
  const isMainKey = (part) =>
    /^[a-z0-9]$/.test(part) || HOTKEY_NAMED.has(part) || /^f([1-9]|1[0-9]|2[0-4])$/.test(part);
  function hotkeyExec(combo) {
    combo = String(combo || '').trim();
    const parts = combo.toLowerCase().split('+').map((p) => p.trim()).filter(Boolean);
    // The host taps the last non-modifier part that maps to a virtual key; a combo
    // with none would be a silent no-op there, so refuse it here instead.
    const valid = parts.some((p) => !HOTKEY_MODIFIERS.has(p) && isMainKey(p));
    return valid ? { type: 'hotkey', arg: combo }
                 : { type: 'invalid', reason: 'hotkey "' + combo + '" has no known key' };
  }
  function mediaExec(verb) {
    verb = norm(verb);
    return MEDIA_VERBS.has(verb) ? { type: 'media', arg: verb }
      : { type: 'invalid', reason: 'media verb must be toggle, next or prev' };
  }
  function classify(kind, target) {
    // Explicit syntax in the Target field ALWAYS wins: the settings editor shows
    // only the unified target, so a migrated row edited to "hotkey:volumemute"
    // must act on what the user typed, not on a hidden legacy `kind` riding along
    // from the old JSON config. The legacy kind only interprets prefix-less,
    // scheme-less targets ("toggle", "volumemute") it was written for.
    const m = target.match(/^(hotkey|media):/i);
    if (m) {
      const rest = target.slice(m[1].length + 1).trim();
      return m[1].toLowerCase() === 'hotkey' ? hotkeyExec(rest) : mediaExec(rest);
    }
    if (/^https?:\/\//i.test(target)) return { type: 'url', arg: target };
    if (kind) {
      switch (norm(kind)) {
        case 'url': return { type: 'invalid', reason: 'url target must be http(s)' };
        case 'media': return mediaExec(target);
        case 'hotkey': return hotkeyExec(target);
        case 'launch': return { type: 'launch', arg: target };
        default: return { type: 'invalid', reason: 'unknown action kind "' + kind + '"' };
      }
    }
    return { type: 'launch', arg: target };
  }

  const TYPE_ICON = { launch: '🚀', url: '🌐', hotkey: '⌨️', invalid: '⚠️' };
  const MEDIA_ICON = { toggle: '⏯️', next: '⏭️', prev: '⏮️' };
  function deriveIcon(exec) {
    if (exec.type === 'media') return MEDIA_ICON[exec.arg] || '🎵';
    return TYPE_ICON[exec.type] || '🎛️';
  }
  function deriveLabel(exec, target) {
    if (exec.type === 'url') {
      try { return new URL(exec.arg).hostname.replace(/^www\./i, '') || exec.arg; } catch (e) { return exec.arg; }
    }
    if (exec.type === 'launch') {
      const seg = exec.arg.split(/[\\/]/).filter(Boolean).pop() || exec.arg;
      return seg.replace(/\.[^.]+$/, '') || exec.arg;
    }
    if (exec.type === 'hotkey' || exec.type === 'media') return exec.arg;
    return target;
  }

  // ---- settings shapes ------------------------------------------------------------
  // Shape A (current): an array of {icon, label, target} rows from the structured
  // "Buttons" list. Shape B (legacy saved layouts): the same data as a JSON STRING,
  // possibly with per-button {kind} — kind wins over target-prefix parsing.
  // Malformed legacy JSON must land in the inline error state, never a blank tile.
  function normalizeButtons(raw) {
    let arr = raw;
    if (typeof arr === 'string') {
      const text = arr.trim();
      if (!text) return { items: [] };
      try { arr = JSON.parse(text); } catch (e) { return { error: 'json' }; }
    }
    if (arr == null) return { items: [] };
    if (!Array.isArray(arr)) return { error: 'json' };
    const items = [];
    let hidden = 0;
    for (const entry of arr) {
      if (!entry || typeof entry !== 'object') continue;
      const target = String(entry.target == null ? '' : entry.target).trim();
      const kind = String(entry.kind == null ? '' : entry.kind).trim();
      if (!target && !kind) continue;             // blank editor row
      if (items.length >= MAX_BUTTONS) { hidden++; continue; } // counted, never silent
      const exec = classify(kind, target);
      const icon = String(entry.icon == null ? '' : entry.icon).trim() || deriveIcon(exec);
      const label = String(entry.label == null ? '' : entry.label).trim() || deriveLabel(exec, target);
      items.push({ icon, label, target, exec });
    }
    return { items, hidden };
  }

  WW.onInit((state) => {
    const s = state.settings;
    // Anything that isn't explicitly glass/transparent renders solid, matching the
    // stock default for unset AND out-of-spec values (no class = glass in base).
    const bg = (s.bgStyle === 'glass' || s.bgStyle === 'transparent') ? s.bgStyle : 'solid';
    document.body.classList.toggle('bg-solid', bg === 'solid');
    document.body.classList.toggle('bg-glass', bg === 'glass');
    document.body.classList.toggle('bg-transparent', bg === 'transparent');
    // Appearance comes from the theme tokens (global theme or the per-slot style
    // override) — legacy labelColor keys in old layouts are deliberately ignored.
    document.body.style.setProperty('--label-scale', String((Number(s.labelSize) || 100) / 100));
    cfg.columns = Math.max(0, Math.min(8, Math.round(Number(s.columns) || 0)));
    const parsed = normalizeButtons(s.buttons);
    buttons = parsed.items || [];
    lastBuild = { error: parsed.error, hidden: parsed.hidden || 0 };
    build(lastBuild.error, lastBuild.hidden);
  });

  // Restartable state-theater flash (from widget-base): remove, force reflow,
  // re-add — otherwise back-to-back taps on a key show nothing.
  function flash(elm, cls) {
    elm.classList.remove(cls);
    void elm.offsetWidth;
    elm.classList.add(cls);
  }

  function showMessage(err, icon, title, body) {
    const msg = document.getElementById('message');
    msg.classList.toggle('err', !!err);
    document.getElementById('messageIcon').textContent = icon;
    document.getElementById('messageTitle').textContent = title;
    document.getElementById('messageBody').textContent = body;
    msg.hidden = false;
  }

  // Viewport fit: keys keep the 44px touch minimum when they can, shrink to a
  // 36px dense floor when the slot is crowded (half-height bands), and past that
  // the tail rides the "+N hidden" chip — a clipped, untappable button is never
  // rendered. PAD/GAP mirror the CSS.
  const MIN_KEY = 44, MIN_KEY_DENSE = 36, PAD = 8, GAP = 8;
  let lastBuild = { error: null, hidden: 0 };
  let keyMin = MIN_KEY; // active minimum, set by build(), read by layout()

  function capacityFor(minKey) {
    const cols = Math.max(1, Math.floor((window.innerWidth - PAD * 2 + GAP) / (minKey + GAP)));
    const rows = Math.max(1, Math.floor((window.innerHeight - PAD * 2 + GAP) / (minKey + GAP)));
    return { cols, rows, count: cols * rows };
  }

  function build(error, hidden) {
    const grid = document.getElementById('grid');
    const msg = document.getElementById('message');
    grid.textContent = '';
    msg.hidden = true;
    if (error) {
      // A settings parse error is fixed in settings, not by retrying — no Retry.
      showMessage(true, '⚠️', 'Buttons could not be read',
        'The Buttons value saved by an older layout is not valid JSON. Open this ' +
        'widget\u2019s settings and re-add the buttons — they are edited as ' +
        'individual rows now.');
      return;
    }
    if (!buttons.length) {
      showMessage(false, '🎛️', 'No buttons yet',
        'Add buttons in the widget settings. Each one is an emoji icon, a name, and ' +
        'a target: a program path (C:\\...\\app.exe), a website (https://...), a ' +
        'keystroke (hotkey:ctrl+shift+m or hotkey:volumemute), or a media control ' +
        '(media:toggle, media:next, media:prev).');
      return;
    }

    // Fit pass: how many key faces (buttons + a possible chip) does this slot
    // hold at a tappable size?
    keyMin = MIN_KEY;
    let cap = capacityFor(keyMin);
    let shown = buttons;
    let trimmed = 0;
    if (buttons.length + (hidden > 0 ? 1 : 0) > cap.count) {
      keyMin = MIN_KEY_DENSE;
      cap = capacityFor(keyMin);
      if (buttons.length + (hidden > 0 ? 1 : 0) > cap.count) {
        shown = buttons.slice(0, Math.max(1, cap.count - 1));
        trimmed = buttons.length - shown.length;
      }
    }
    document.body.style.setProperty('--key-min', keyMin + 'px');
    const chipHidden = hidden + trimmed;

    for (const def of shown) {
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'key pressable';
      key.title = def.target;
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = def.icon;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = def.label;
      key.append(icon, label);
      key.addEventListener('pointerdown', () => key.classList.add('pressed'));
      const release = () => key.classList.remove('pressed');
      key.addEventListener('pointerup', release);
      key.addEventListener('pointercancel', release);
      key.addEventListener('pointerleave', release);
      key.addEventListener('click', () => {
        const exec = def.exec;
        if (exec.type === 'invalid') {
          // The host would drop this silently (unknown kind/verb/key) — refuse
          // visibly instead of posting into the void.
          WW.log('deck: refused ' + def.target + ' (' + exec.reason + ')');
          flash(key, 'fail-flash');
          return;
        }
        if (exec.type === 'url') WW.openUrl(exec.arg);
        else if (exec.type === 'media') WW.mediaControl(exec.arg);
        else WW.action(exec.type, exec.arg);      // launch | hotkey
        WW.log('deck: ' + exec.type + ' ' + exec.arg);
        // ww-action / ww-media-control / ww-open-url are fire-and-forget (no result
        // round-trip) and have no other visible effect here — confirm-flash the key.
        flash(key, 'confirm-flash');
      });
      grid.appendChild(key);
    }
    if (chipHidden > 0) {
      // Never truncate silently: the editor saved these rows, so say on the tile
      // exactly how many are beyond the ceiling — the 32-key maximum or, in a
      // small slot, the number of tappable key faces that actually fit.
      const more = document.createElement('div');
      more.className = 'key more';
      more.title = trimmed
        ? 'This slot has room for ' + shown.length + ' tappable buttons — resize the widget or remove some'
        : 'This deck shows at most ' + MAX_BUTTONS + ' buttons';
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = '⋯';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = '+' + chipHidden + ' hidden ' + (trimmed ? '(no room)' : '(max ' + MAX_BUTTONS + ')');
      more.append(icon, label);
      grid.appendChild(more);
    }
    layout();
  }

  // Auto columns: pick the column count (1..8) whose keys come out closest to
  // square for the current slot aspect; a non-zero "columns" setting wins.
  function autoCols(n) {
    let best = 1, bestScore = -Infinity;
    for (let c = 1; c <= Math.min(n, 8); c++) {
      const r = Math.ceil(n / c);
      const keyAspect = (window.innerWidth / c) / (window.innerHeight / r);
      const score = -Math.abs(Math.log(keyAspect));
      if (score > bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  function layout() {
    const n = document.querySelectorAll('#grid .key').length; // includes the over-limit notice
    if (!n) return;
    // Clamp the column choice to what the viewport fits at the active key
    // minimum: the user's columns setting (or the aspect heuristic) must never
    // force a grid wider or taller than the slot — build() sized the key count
    // to capacity, and this keeps the arrangement inside it too.
    const cap = capacityFor(keyMin);
    const desired = cfg.columns > 0 ? cfg.columns : autoCols(n);
    const cols = Math.max(1, Math.min(n,
      Math.max(Math.min(desired, cap.cols), Math.ceil(n / cap.rows))));
    const rows = Math.ceil(n / cols);
    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    // Emoji sized off the actual cell, so it stays big but never overflows.
    const cellW = (window.innerWidth - PAD * 2 - GAP * (cols - 1)) / cols;
    const cellH = (window.innerHeight - PAD * 2 - GAP * (rows - 1)) / rows;
    const icon = Math.max(14, Math.min(cellH * 0.44, cellW * 0.6, 96));
    document.body.style.setProperty('--icon-size', Math.round(icon) + 'px');
  }

  // A resize changes the fit capacity, not just the arrangement — rebuild.
  window.addEventListener('resize', () => build(lastBuild.error, lastBuild.hidden));
</script>
</body>
</html>
