<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Twitch Chat</title>
<link rel="stylesheet" href="https://app.plinth/widget-base.css" />
<style>
  /* Layout only — tokens, background/bgStyle handling, typography base and the
   * .state-card anatomy come from widget-base.css. The chat itself is Twitch's
   * embed; only the setup/invalid overlay renders locally. */
  #frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: transparent;
  }
  /* Empty/invalid setup state: .state-card anatomy, kept at the widget's fluid
   * sizes so it scales across quarter/half/full slots. */
  #overlay { position: fixed; inset: 0; gap: 1.6vh; }
  #glyph {
    width: clamp(26px, 12vh, 48px);
    height: clamp(26px, 12vh, 48px);
    color: var(--accent);
    opacity: 0.9;
  }
  #message {
    color: var(--text-muted);
    font-size: calc(clamp(13px, 5vh, 20px) * var(--msg-scale, 1));
  }
  #hint {
    color: var(--text-muted);
    opacity: 0.6;
    font-size: calc(clamp(10px, 3.4vh, 14px) * var(--msg-scale, 1));
  }
</style>
</head>
<body>
  <iframe id="frame" title="Twitch chat"></iframe>
  <div id="overlay" class="state-card" hidden>
    <svg id="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 4h16v11H10l-4 4v-4H4z" />
      <path d="M9 8v3.5" /><path d="M14.5 8v3.5" />
    </svg>
    <div id="message" class="state-title"></div>
    <small id="hint" class="state-body"></small>
  </div>

<script src="https://app.plinth/widget-api.js"></script>
<script>
  'use strict';
  const MSG_EMPTY = 'Set a Twitch channel in the widget settings';
  const MSG_INVALID = "That doesn't look like a Twitch channel";
  const HINT_EMPTY = 'e.g. "pokimane" or https://www.twitch.tv/pokimane';
  const HINT_INVALID = 'Use a channel name or a twitch.tv link';

  // Accepts a bare channel name or any twitch.tv URL (channel = first path
  // segment, lowercased). Returns { state: 'empty' | 'invalid' | 'ok', channel? }.
  function parseChannel(raw) {
    const text = String(raw == null ? '' : raw).trim();
    if (!text) return { state: 'empty' };
    let name = text;
    const hasScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(text);
    if (hasScheme || text.includes('/') || /twitch\.tv/i.test(text)) {
      let u;
      try { u = new URL(hasScheme ? text : 'https://' + text); }
      catch (e) { return { state: 'invalid' }; }
      if (!/(^|\.)twitch\.tv$/i.test(u.hostname)) return { state: 'invalid' };
      name = u.pathname.split('/').filter(Boolean)[0] || '';
    }
    name = name.toLowerCase();
    if (!/^[a-z0-9_]{2,25}$/.test(name)) return { state: 'invalid' };
    return { state: 'ok', channel: name };
  }


  WW.onInit((state) => {
    const s = state.settings;
    const theme = s.theme === 'light' ? 'light' : 'dark';
    // Message color comes from the theme tokens (global theme or the per-slot
    // style override) — legacy msgColor keys are ignored.
    document.body.style.setProperty('--msg-scale', (Number(s.msgSize) || 100) / 100);

    const frame = document.getElementById('frame');
    const overlay = document.getElementById('overlay');
    const parsed = parseChannel(s.channel);

    if (parsed.state !== 'ok') {
      document.getElementById('message').textContent = parsed.state === 'empty' ? MSG_EMPTY : MSG_INVALID;
      document.getElementById('hint').textContent = parsed.state === 'empty' ? HINT_EMPTY : HINT_INVALID;
      overlay.hidden = false;
      frame.style.display = 'none';
      if (frame.getAttribute('src')) frame.src = 'about:blank'; // stop a previously loaded chat
      return;
    }

    overlay.hidden = true;
    frame.style.display = 'block';
    // parent= must be the hostname this widget frame is actually served from,
    // or Twitch refuses to render the embed. Computed at runtime — never hardcoded.
    const src = 'https://www.twitch.tv/embed/' + parsed.channel +
      '/chat?parent=' + encodeURIComponent(location.hostname) +
      (theme === 'dark' ? '&darkpopout' : '');
    if (frame.getAttribute('src') !== src) frame.src = src;
  });
</script>
</body>
</html>
