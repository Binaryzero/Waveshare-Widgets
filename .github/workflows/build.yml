name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  widget-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Widget version bump guard
        run: node tools/check-widget-versions.js "origin/${{ github.base_ref }}"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Manifest round-trip guard
        run: dotnet run --project tools/ManifestRoundTrip

      # Credentials must never reach layout.json in the clear: this asserts the seal /
      # mask / reveal contract, the masked-save carry-over, and the no-DPAPI fail-safe.
      - name: Secret pipeline guard
        run: dotnet run --project tools/SecretRoundTrip

      # The credential-name rule exists twice — build time (Node) and install time (C#).
      # Both are checked against tools/credential-names.json, and BOTH steps have to run:
      # if only one did, the pair could drift into "the validator refuses this widget but
      # the host installs it anyway", which is the gap issue #57 was filed for.
      - name: Credential rule agrees with the fixture (C#)
        run: dotnet run --project tools/CredentialRule

      - name: Credential rule agrees with the fixture (validator)
        run: node tools/validate-widget.js --self-test

      # A widget's virtual host is its browser ORIGIN — its localStorage, its stored
      # credentials. Two inputs to that assignment were choosable by an untrusted
      # manifest: the VERSION that decided which of two same-id folders won (issue #94),
      # and the directory ENUMERATION ORDER that decided who got the clean host when the
      # persisted map was empty (issue #93). Either was enough to serve a hostile package
      # from the origin another widget's tokens live under. Reproducing it needs a widgets
      # folder, a WebView2 host map and a second installed widget, so the decisions are
      # pure functions of ids and folder names and this covers them.
      - name: Widget identity and host assignment
        run: dotnet run --project tools/WidgetIdentity

      # The proxy forwards widget-chosen headers to loopback and LAN targets, and its
      # browser-grade defaults only fill GAPS — so a forwarded name replaces the host's
      # honest value rather than adding to it. A local service that trusts fetch metadata
      # then sees exactly what the caller chose. The loop that decides this cannot be
      # exercised without WebView2 and a real network, so the decision is a pure
      # predicate and this covers it — including that the proxy and browser tiers cannot
      # drift apart on host-owned names, which is the shape the bug actually had.
      - name: Proxy header rules
        run: dotnet run --project tools/ProxyHeaders

      # A private ICS or webhook link IS the credential (WIDGET-SPEC), and app.log is
      # plaintext, outside the DPAPI work in #15, and the first file attached to a bug
      # report. This asserts both halves: that SafeUrl discloses nothing, and that the
      # exception messages logged beside it do not carry the URL either.
      - name: URLs are redacted in the log
        run: dotnet run --project tools/UrlRedaction

      # The web-message handlers act on what they receive — save-layout writes
      # layout.json, open-url launches a browser, action runs configured actions — so they
      # check WHO sent it. Getting that predicate wrong in the permissive direction lets
      # an installed widget drive them; getting it wrong in the strict direction drops
      # every message and leaves the app looking dead, with no way to notice here or on
      # the maintainer's device. Both directions are covered.
      - name: Web messages are accepted only from the shell
        run: dotnet run --project tools/MessageOrigin

      - name: Publish
        run: dotnet publish src/WaveshareWidgets/WaveshareWidgets.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveshareWidgets-win-x64
          path: publish/
          if-no-files-found: error
