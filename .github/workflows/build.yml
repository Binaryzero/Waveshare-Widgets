name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  widget-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Widget version bump guard
        run: node tools/check-widget-versions.js "origin/${{ github.base_ref }}"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Manifest round-trip guard
        run: dotnet run --project tools/ManifestRoundTrip

      # Credentials must never reach layout.json in the clear: this asserts the seal /
      # mask / reveal contract, the masked-save carry-over, and the no-DPAPI fail-safe.
      - name: Secret pipeline guard
        run: dotnet run --project tools/SecretRoundTrip

      # The credential-name rule exists twice — build time (Node) and install time (C#).
      # Both are checked against tools/credential-names.json, and BOTH steps have to run:
      # if only one did, the pair could drift into "the validator refuses this widget but
      # the host installs it anyway", which is the gap issue #57 was filed for.
      - name: Credential rule agrees with the fixture (C#)
        run: dotnet run --project tools/CredentialRule

      - name: Credential rule agrees with the fixture (validator)
        run: node tools/validate-widget.js --self-test

      # A widget's virtual host is its browser ORIGIN — its localStorage, its stored
      # credentials. Two inputs to that assignment were choosable by an untrusted
      # manifest: the VERSION that decided which of two same-id folders won (issue #94),
      # and the directory ENUMERATION ORDER that decided who got the clean host when the
      # persisted map was empty (issue #93). Either was enough to serve a hostile package
      # from the origin another widget's tokens live under. Reproducing it needs a widgets
      # folder, a WebView2 host map and a second installed widget, so the decisions are
      # pure functions of ids and folder names and this covers them.
      - name: Widget identity and host assignment
        run: dotnet run --project tools/WidgetIdentity

      # The fetch ladder advertises a 5 MiB body ceiling, and its browser fallback tier —
      # entered when the remote server answers 403 or 429, i.e. when the attacker chooses —
      # did not enforce it. The ceiling now lives in one place and reaches the page as the
      # same constant; this checks the two tiers cannot drift apart on the number, and that
      # the generated in-page script still parses, since it is JavaScript inside a C# string
      # that otherwise only ever runs on a Windows host.
      - name: Fetch body ceiling
        run: |
          dotnet run --project tools/FetchLimits -- browser-fetch.generated.js browser-fetch.lowered.js
          node --check browser-fetch.generated.js
          node --check browser-fetch.lowered.js

      # ...and that it BEHAVES: text cannot tell a budget checked before appending a chunk
      # from one checked after, and the second has already paid for the bytes. This runs the
      # real generated script against a paced local server and watches whether the transfer
      # is actually cut off. Plain Node, no browser — the other nine harnesses need
      # Playwright and run on the maintainer's machine, so a CI step that needed it too
      # would just be a step that never ran.
      - name: Fetch body ceiling holds against a real server
        run: node tests/harness/bodycap-run.js browser-fetch.generated.js browser-fetch.lowered.js

      # The Next Event widget bundles its own ICS reader, and it is the one widget whose
      # failure mode is a WRONG ANSWER rather than a blank tile: a recurrence expanded
      # incorrectly puts a meeting on screen at a time that does not exist. The reader is
      # dependency-free precisely so this can run here without Playwright.
      - name: ICS reader never reports a time it cannot derive
        run: node tests/harness/ics-run.js

      # A Stream Deck profile names its plugin and action UUIDs, and the icon resolver used
      # both to build filesystem paths — so a crafted or imported profile could point them at
      # any readable file, whose contents are then base64'd into the profile payload and sent
      # to a widget. Reproducing that needs Windows, an Elgato installation and a profile on
      # disk; the decision is two predicates over strings, and this drives them. Note the
      # separator rule is checked per character rather than left to Path.GetFullPath: this
      # runs on the Windows agent, but the same probe must not silently weaken if it is ever
      # run anywhere `\` is an ordinary filename character.
      - name: Stream Deck icon paths
        run: dotnet run --project tools/StreamDeckPaths

      # A profile is third-party data from software this app does not control, and
      # System.Text.Json's TryGetProperty THROWS on a non-object element. ReadProfile
      # catches everything, so `"Size": "5x3"` did not degrade to grid inference — it
      # reported the deck as unavailable. An empty Control Deck is this project's recurring
      # field failure, so a path that produces one silently is worth a probe of its own.
      - name: Deck manifest shapes
        run: dotnet run --project tools/DeckManifest

      # Live capture is a synchronous PrintWindow, a full-bitmap scan, a JPEG encode and a
      # base64, all on the UI thread — and the API invites polling, so "faster" had no floor
      # and the frame had no ceiling. The capture needs Windows and a running Stream Deck;
      # the two decisions are arithmetic, and this drives them.
      - name: Capture rate and size limits
        run: dotnet run --project tools/CaptureLimits

      # Host pushes carried no sequence, so a demand off/on inside one message-queue hop let
      # a payload made for the PREVIOUS demand interval be accepted as current. The shell
      # half is driven for real by routing-run.js — but that harness fakes the host, so it
      # exercises the checking while only imitating the stamping, and deleting the stamp from
      # PostToShell leaves every JS test passing. This covers that half, and unlike the
      # Playwright harnesses it runs here. Text assertions, and the file says so.
      - name: Host push generation
        run: dotnet run --project tools/PushGeneration

      # The proxy forwards widget-chosen headers to loopback and LAN targets, and its
      # browser-grade defaults only fill GAPS — so a forwarded name replaces the host's
      # honest value rather than adding to it. A local service that trusts fetch metadata
      # then sees exactly what the caller chose. The loop that decides this cannot be
      # exercised without WebView2 and a real network, so the decision is a pure
      # predicate and this covers it — including that the proxy and browser tiers cannot
      # drift apart on host-owned names, which is the shape the bug actually had.
      - name: Proxy header rules
        run: dotnet run --project tools/ProxyHeaders

      # A private ICS or webhook link IS the credential (WIDGET-SPEC), and app.log is
      # plaintext, outside the DPAPI work in #15, and the first file attached to a bug
      # report. This asserts both halves: that SafeUrl discloses nothing, and that the
      # exception messages logged beside it do not carry the URL either.
      - name: URLs are redacted in the log
        run: dotnet run --project tools/UrlRedaction

      # The web-message handlers act on what they receive — save-layout writes
      # layout.json, open-url launches a browser, action runs configured actions — so they
      # check WHO sent it. Getting that predicate wrong in the permissive direction lets
      # an installed widget drive them; getting it wrong in the strict direction drops
      # every message and leaves the app looking dead, with no way to notice here or on
      # the maintainer's device. Both directions are covered.
      - name: Web messages are accepted only from the shell
        run: dotnet run --project tools/MessageOrigin

      - name: Publish
        run: dotnet publish src/WaveshareWidgets/WaveshareWidgets.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveshareWidgets-win-x64
          path: publish/
          if-no-files-found: error
