name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  widget-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Widget version bump guard
        run: node tools/check-widget-versions.js "origin/${{ github.base_ref }}"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Manifest round-trip guard
        run: dotnet run --project tools/ManifestRoundTrip

      # Credentials must never reach layout.json in the clear: this asserts the seal /
      # mask / reveal contract, the masked-save carry-over, and the no-DPAPI fail-safe.
      - name: Secret pipeline guard
        run: dotnet run --project tools/SecretRoundTrip

      # The credential-name rule exists twice — build time (Node) and install time (C#).
      # Both are checked against tools/credential-names.json, and BOTH steps have to run:
      # if only one did, the pair could drift into "the validator refuses this widget but
      # the host installs it anyway", which is the gap issue #57 was filed for.
      - name: Credential rule agrees with the fixture (C#)
        run: dotnet run --project tools/CredentialRule

      - name: Credential rule agrees with the fixture (validator)
        run: node tools/validate-widget.js --self-test

      # A private ICS or webhook link IS the credential (WIDGET-SPEC), and app.log is
      # plaintext, outside the DPAPI work in #15, and the first file attached to a bug
      # report. This asserts both halves: that SafeUrl discloses nothing, and that the
      # exception messages logged beside it do not carry the URL either.
      - name: URLs are redacted in the log
        run: dotnet run --project tools/UrlRedaction

      - name: Publish
        run: dotnet publish src/WaveshareWidgets/WaveshareWidgets.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveshareWidgets-win-x64
          path: publish/
          if-no-files-found: error
