name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  widget-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Widget version bump guard
        run: node tools/check-widget-versions.js "origin/${{ github.base_ref }}"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Manifest round-trip guard
        run: dotnet run --project tools/ManifestRoundTrip

      # Credentials must never reach layout.json in the clear: this asserts the seal /
      # mask / reveal contract, the masked-save carry-over, and the no-DPAPI fail-safe.
      - name: Secret pipeline guard
        run: dotnet run --project tools/SecretRoundTrip

      # The credential-name rule exists twice — build time (Node) and install time (C#).
      # Both are checked against tools/credential-names.json, and BOTH steps have to run:
      # if only one did, the pair could drift into "the validator refuses this widget but
      # the host installs it anyway", which is the gap issue #57 was filed for.
      - name: Credential rule agrees with the fixture (C#)
        run: dotnet run --project tools/CredentialRule

      - name: Credential rule agrees with the fixture (validator)
        run: node tools/validate-widget.js --self-test

      # Next Event ships its own ICS reader, and every question it answers is "which
      # event is next" — which is meaningless without saying next FROM WHEN. The runner
      # pins both the clock and the timezone, so a case can assert "this weekly repeat
      # resolves to Tuesday the 11th" and keep meaning it, instead of encoding the day it
      # was written and failing on its own months later.
      - name: ICS reader agrees with its cases
        run: node tests/harness/ics-run.js

      # A widget's virtual host is its browser ORIGIN — its localStorage, its stored
      # credentials. Two inputs to that assignment were choosable by an untrusted
      # manifest: the VERSION that decided which of two same-id folders won (issue #94),
      # and the directory ENUMERATION ORDER that decided who got the clean host when the
      # persisted map was empty (issue #93). Either was enough to serve a hostile package
      # from the origin another widget's tokens live under. Reproducing it needs a widgets
      # folder, a WebView2 host map and a second installed widget, so the decisions are
      # pure functions of ids and folder names and this covers them.
      - name: Widget identity and host assignment
        run: dotnet run --project tools/WidgetIdentity

      # The fetch ladder advertises a 5 MiB body ceiling, and its browser fallback tier —
      # entered when the remote server answers 403 or 429, i.e. when the attacker chooses —
      # did not enforce it. The ceiling now lives in one place and reaches the page as the
      # same constant; this checks the two tiers cannot drift apart on the number, and that
      # the generated in-page script still parses, since it is JavaScript inside a C# string
      # that otherwise only ever runs on a Windows host.
      - name: Fetch body ceiling
        run: |
          dotnet run --project tools/FetchLimits -- browser-fetch.generated.js browser-fetch.lowered.js
          node --check browser-fetch.generated.js
          node --check browser-fetch.lowered.js

      # ...and that it BEHAVES: text cannot tell a budget checked before appending a chunk
      # from one checked after, and the second has already paid for the bytes. This runs the
      # real generated script against a paced local server and watches whether the transfer
      # is actually cut off. Plain Node, no browser — the other Playwright harnesses run on
      # the maintainer's machine, so a CI step that needed a browser would just be a step
      # that never ran. tests/harness/proxy-headers-run.js is one of those: it drives the
      # real shim in a real renderer to check the two fetch tiers show a widget the same
      # response headers, and the C# probe above covers the part that CI can run.
      - name: Fetch body ceiling holds against a real server
        run: node tests/harness/bodycap-run.js browser-fetch.generated.js browser-fetch.lowered.js

      # Removing a widget RETIRES it (#226) — its config, credential included, moves to the
      # attic so it can come back. That held for the two form ✕ buttons but not for the one
      # in the settings window's live preview, which discarded instead: the preview replica
      # is handed every secret blanked, so anything it retired arrived empty. The preview now
      # NAMES the slot and the settings side retires it on the one path that holds the
      # unscrubbed copy. Plain Node: the decision is a pure pair of functions, extracted from
      # the real settings.js between markers and executed — not transcribed, so a regression
      # in the shipped commit cannot leave this green. The browser half (the postMessage
      # relay) stays in the Playwright harnesses on the maintainer's machine, the same split
      # as the fetch ceiling above.
      - name: A preview removal retires on the one retire path
        run: node tests/harness/atticretire-run.js

      # A swipe that starts inside a widget pages the dashboard (#257), and a drift on the
      # way to a tap still does not (#206). touch-action cannot serve both, so the widget API
      # recognises a swipe by distance; this pins that rule — at a FIXED drift, so a retune
      # of the threshold cannot quietly reopen #206 — plus the detector's wiring and the
      # shell's gates. Plain Node against the real source. The real-touch half runs in
      # tests/harness/touchpan-run.js on the maintainer's machine.
      - name: Widget swipes page, drifts do not
        run: node tests/harness/widgetswipe-run.js

      # The WoW Panel's choices of what to show (#258): no three-row caps on a tile with room
      # for a dozen rows, and with no reputation movement seen yet, the newest factions lead
      # rather than decade-old ones a sliver short of their next tier. Plain Node against the
      # widget's own readers, extracted between markers, with a falsification pass. The
      # layout half runs in tests/harness/wow-card-run.js on the maintainer's machine.
      - name: WoW Panel shows the character's current data
        run: node tests/harness/wowreaders-run.js

      # Find (#210): a widget looks up its own setting values on the panel, where its
      # credential is, and the settings window gets only the list of choices. The widget
      # is the untrusted party, so what the shell keeps from its answer is bounded, and
      # every dead end has to leave the field typeable. Plain Node against the real source;
      # the browser round trip is tests/harness/discoverroute-run.js on the maintainer's
      # machine.
      - name: Find answers are bounded and routed to the asker
        run: node tests/harness/discover-run.js

      # Store apps have no file to launch (#219): the picker lists them by app id and the
      # launch action starts them through explorer.exe with that id as its argument. Which
      # AppsFolder entries count as an id, what can reach that argument, and that every
      # other target still starts exactly as before are string decisions; this drives them.
      # The COM enumeration needs Windows and a desktop session, and is not covered here.
      - name: Store app launch targets
        run: dotnet run --project tools/AppIds

      # ...and the picker side: a pick fills an empty Name and never a typed one, the
      # "no match" line stops blaming Store apps, and Deck and Launcher give an app-id
      # target a readable label. Plain Node against the real source, both picker copies.
      - name: App picker names Store apps
        run: node tests/harness/apppick-run.js

      # A Stream Deck profile names its plugin and action UUIDs, and the icon resolver used
      # both to build filesystem paths — so a crafted or imported profile could point them at
      # any readable file, whose contents are then base64'd into the profile payload and sent
      # to a widget. Reproducing that needs Windows, an Elgato installation and a profile on
      # disk; the decision is two predicates over strings, and this drives them. Note the
      # separator rule is checked per character rather than left to Path.GetFullPath: this
      # runs on the Windows agent, but the same probe must not silently weaken if it is ever
      # run anywhere `\` is an ordinary filename character.
      - name: Stream Deck icon paths
        run: dotnet run --project tools/StreamDeckPaths

      # A profile is third-party data from software this app does not control, and
      # System.Text.Json's TryGetProperty THROWS on a non-object element. ReadProfile
      # catches everything, so `"Size": "5x3"` did not degrade to grid inference — it
      # reported the deck as unavailable. An empty Control Deck is this project's recurring
      # field failure, so a path that produces one silently is worth a probe of its own.
      - name: Deck manifest shapes
        run: dotnet run --project tools/DeckManifest

      # Live capture is a synchronous PrintWindow, a full-bitmap scan, a JPEG encode and a
      # base64, all on the UI thread — and the API invites polling, so "faster" had no floor
      # and the frame had no ceiling. The capture needs Windows and a running Stream Deck;
      # the two decisions are arithmetic, and this drives them.
      - name: Capture rate and size limits
        run: dotnet run --project tools/CaptureLimits

      # Host pushes carried no sequence, so a demand off/on inside one message-queue hop let
      # a payload made for the PREVIOUS demand interval be accepted as current. The shell
      # half is driven for real by routing-run.js — but that harness fakes the host, so it
      # exercises the checking while only imitating the stamping, and deleting the stamp from
      # PostToShell leaves every JS test passing. This covers that half, and unlike the
      # Playwright harnesses it runs here. Text assertions, and the file says so.
      - name: Host push generation
        run: dotnet run --project tools/PushGeneration

      # The proxy forwards widget-chosen headers to loopback and LAN targets, and its
      # browser-grade defaults only fill GAPS — so a forwarded name replaces the host's
      # honest value rather than adding to it. A local service that trusts fetch metadata
      # then sees exactly what the caller chose. The loop that decides this cannot be
      # exercised without WebView2 and a real network, so the decision is a pure
      # predicate and this covers it — including that the proxy and browser tiers cannot
      # drift apart on host-owned names, which is the shape the bug actually had.
      #
      # It now covers the RESPONSE direction too (#169). The hop returned status, body and
      # content type and nothing else, so a widget that read any header lost it the moment
      # its request escalated — and the shim escalates every 403 and 429, which is exactly
      # where a rate limit lives. The forwarding is an allow-list, and the same shape of
      # failure applies: the danger is the two tiers disagreeing, so the probe derives its
      # parity checks from the exported list and from the generated page script rather
      # than restating either. It also asserts tools/proxy-response-headers.json — which
      # the Node harness reads, because it cannot read a C# HashSet — is that same set.
      - name: Proxy header rules
        run: dotnet run --project tools/ProxyHeaders

      # The proxy's LAN client accepts every certificate, which is safe only while the
      # peer is on the private network. Its handler checked that for the first URL and
      # then followed a device's redirect anywhere (#303). Redirects are now followed by
      # PrivateNetwork.SendAsync, which checks every hop; this drives it against a stub
      # network and asserts the handler itself no longer follows them.
      - name: LAN proxy redirects
        run: dotnet run --project tools/LanRedirects

      # Widgets update with the app, so an update cannot be held back per tile; the user
      # is told instead (#227). A widget new in an update is "New" until placed or two
      # weeks pass, and a placed tile whose widget changed its settings is "Updated" until
      # opened. This pins the state behind both, including that a fresh install announces
      # nothing and a relabel is not a settings change.
      - name: Update indicators
        run: dotnet run --project tools/WidgetCatalog

      # An in-app update never removed a file a release dropped, so the install drifted
      # from a clean copy (#240). The updater now keeps a list of each release's files
      # and retires what the next release lacks, inside the journaled swap. The risk is
      # retiring something that is not the release's to remove; this pins the list logic
      # and the wiring that puts retirements on the swap's rollback.
      - name: Update retirements
        run: dotnet run --project tools/InstallManifest

      # A power loss during an update's swap can leave the self-contained build unable to
      # start, so its own recovery never runs (#239). PlinthRecover.exe, built for the .NET
      # Framework in Windows and run from outside the install at the next sign-in, puts the
      # originals back. This drives its restore logic over real folders and checks the
      # updater arms it before the journal and disarms it only once no journal is left.
      - name: Update recovery helper
        run: dotnet run --project tools/SwapRecovery

      # A widget's long-lived credential is sealed at rest; the SHORT-lived one it buys
      # with that had nowhere to go but localStorage — a plaintext file in the same
      # WebView profile, which hands back exactly what the sealing withholds (#175). The
      # store that closes it is mostly pure decisions: which scopes and keys are
      # accepted, what the caps are, that one widget cannot reach another's bucket, and
      # above all that an unavailable cipher writes NOTHING rather than degrading to
      # plaintext. None of that needs Windows or DPAPI, and the last one is the case
      # worth a CI step of its own: silent degradation would leave the widget believing
      # it is protected with the credential on disk in the clear.
      - name: Widget protected store
        run: dotnet run --project tools/WidgetSecrets

      # A private ICS or webhook link IS the credential (WIDGET-SPEC), and app.log is
      # plaintext, outside the DPAPI work in #15, and the first file attached to a bug
      # report. This asserts both halves: that SafeUrl discloses nothing, and that the
      # exception messages logged beside it do not carry the URL either.
      - name: URLs are redacted in the log
        run: dotnet run --project tools/UrlRedaction

      # app.log kept every session in one file and deleted it past 1 MB (#256): old runs
      # mixed in with the current one, and the history a bug report needed was what got
      # thrown away. This drives the real RollingLog in a temp directory: a file per
      # session, a cap that rolls instead of deleting, four previous files kept, a
      # bounded total, a clipped runaway line, and no lost line when a roll cannot happen —
      # plus recovery from a blocked or interrupted roll (#298): a crash-stranded log is
      # filed, a blocked session roll is retried, an overgrown file is cut back to the cap.
      - name: app.log is rolled per session and bounded
        run: dotnet run --project tools/LogRotation

      # The web-message handlers act on what they receive — save-layout writes
      # layout.json, open-url launches a browser, action runs configured actions — so they
      # check WHO sent it. Getting that predicate wrong in the permissive direction lets
      # an installed widget drive them; getting it wrong in the strict direction drops
      # every message and leaves the app looking dead, with no way to notice here or on
      # the maintainer's device. Both directions are covered.
      - name: Web messages are accepted only from the shell
        run: dotnet run --project tools/MessageOrigin

      # Stamped BELOW every release on purpose: an unstamped artifact would carry the
      # csproj's fixed version, match the next release's number, and never be offered
      # that release by the updater. 0.0.0-ci.N ranks under everything and always
      # upgrades. run_number is workflow-controlled, not attacker-choosable text.
      - name: Publish
        run: dotnet publish src/Plinth/Plinth.csproj -c Release -r win-x64 --self-contained false -p:Version=0.0.0-ci.${{ github.run_number }} -o publish

      # The same script release.yml runs before packing (#240), here so it runs on every
      # change rather than first on release day: the list it writes must read back through
      # the updater's own parser as exactly the files in the folder.
      - name: Install manifest matches the published files
        shell: pwsh
        run: |
          ./tools/write-install-manifest.ps1 publish
          dotnet run --project tools/InstallManifest -- verify publish

      # The helper the updater relies on (#239) must be in the published folder, bind only to
      # the .NET Framework in Windows, and undo a cut-off swap when actually run, as the
      # updater runs it: a copy outside the install, given the journal and the stamp.
      - name: Recovery helper is published and restores a cut-off swap
        run: dotnet run --project tools/SwapRecovery -- verify publish

      # The self-contained build is the one the helper exists for, and only release.yml
      # published it before. A change that breaks the helper's build there, or leaves it
      # out, fails on the pull request instead of on release day.
      - name: Self-contained build carries the recovery helper
        run: |
          dotnet publish src/Plinth/Plinth.csproj -c Release -r win-x64 --self-contained true -o publish-scd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/SwapRecovery -- verify publish-scd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plinth-win-x64
          path: publish/
          if-no-files-found: error
