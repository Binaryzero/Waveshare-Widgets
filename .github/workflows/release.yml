name: release

on:
  push:
    tags: ["v*"]
  # With a version input, a dispatch PUBLISHES a real release from the dispatched
  # commit — the release creates the tag, so a release can be cut without pushing
  # one. With the input empty it stays a dry run: the zips upload as workflow
  # artifacts and nothing is created.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z, optional -pre/+meta, no leading v). Empty = dry run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A tag name is attacker-choosable text — and so is a dispatch input — and
      # `${{ }}` splices either value into the script SOURCE before any shell parses
      # it, so `v1.2.3;whoami` runs whoami on a runner holding `contents: write`.
      # Two rules keep that shut:
      #   1. the value must match SemVer exactly, or the job stops here;
      #   2. it reaches later steps through the environment, never through `${{ }}`
      #      inside a `run:` body, so even a future regex hole cannot become execution.
      # (TrimStart('v') also stripped EVERY leading v — `vvv1.0.0` published as 1.0.0.
      # The regex settles that too.)
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            # -match, not -notmatch: $Matches is only documented as populated on a
            # successful -match, and the capture is what the rest of the job runs on.
            if ($env:REF_NAME -match '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
              $version = $Matches[1]
              $publish = 'true'
            } else {
              Write-Error "tag '$($env:REF_NAME)' is not a SemVer release tag (expected vX.Y.Z)"
              exit 1
            }
          } elseif ($env:INPUT_VERSION) {
            # The input takes the version BARE — the leading v belongs to the TAG,
            # which the release step derives as v$version on both paths.
            if ($env:INPUT_VERSION -match '^(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
              $version = $Matches[1]
              $publish = 'true'
            } else {
              Write-Error "input '$($env:INPUT_VERSION)' is not a SemVer version (expected X.Y.Z)"
              exit 1
            }
          } else {
            $version = '0.0.0-dev'
            $publish = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          # Prerelease is decided by the CORE version only — a hyphen in build
          # metadata (v1.2.3+windows-x64) is not a prerelease marker, and marking
          # such a release would hide a stable build from /releases/latest.
          $core = $version.Split('+')[0]
          "prerelease=$($core.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Publish (framework-dependent)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/Plinth/Plinth.csproj -c Release -r win-x64 --self-contained false -p:Version=$env:VERSION -o publish/fdd

      - name: Publish (self-contained)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/Plinth/Plinth.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o publish/scd

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path publish/fdd/* -DestinationPath "dist/Plinth-v$($env:VERSION)-win-x64.zip"
          Compress-Archive -Path publish/scd/* -DestinationPath "dist/Plinth-v$($env:VERSION)-win-x64-self-contained.zip"

      - name: Upload artifacts (dry run)
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push v$version reconstructs the pushed tag exactly (the regex
          # guarantees it) and the commitish is ignored. On a dispatch the tag does
          # not exist yet, and creating the release creates it at the dispatched
          # commit — the workflow's own token, so no second run triggers.
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          # A suffixed tag (v1.3.0-beta.1) must be MARKED prerelease, or GitHub
          # classifies it as ordinary and serves it from /releases/latest — the
          # endpoint the in-app updater polls — advertising the beta to every
          # stable install. Marked, it stays off the stable channel; the next
          # final supersedes it for everyone by SemVer precedence.
          prerelease: ${{ steps.version.outputs.prerelease }}
